<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>23 字幕エディタ — Kikimimic</title>
<meta name="kkm-concept" content="録音詳細は横長のタイムライン。話者ごとの段に字幕ブロックが並び、境界をその場で分割・結合する">
<meta name="kkm-why" content="会議のあとで字幕（SRT / words.srt）を作る人向け。区切りの良し悪しは長さと間で決まるので、時間軸の上で見て直すのが一番分かる。上で読み、下で切る">
<meta name="kkm-tradeoff" content="長い会議ではタイムラインが横に長くなり、全体を読み通しにくい。議事録・統計・質問は右の「この会議」からシートで開く">
<link rel="stylesheet" href="shared/kit.css">
<style>
.topnav { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.pad { padding: 12px 16px; }
.hstack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vstack { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.bb { border-bottom: 1px solid var(--border); }
.bt { border-top: 1px solid var(--border); }
.fill { flex: 1; min-height: 0; }
.center { max-width: 680px; margin: 0 auto; width: 100%; }
.lane { font-size: 12px; font-weight: 600; width: 48px; flex: 0 0 auto; }
.live-line { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--bg-subtle); }
.playerbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); flex: 0 0 auto; }
.playerbar .bar { flex: 1; cursor: pointer; height: 8px; border-radius: 4px; }
.set-sec { padding: 14px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
table.q td { padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
pre.out { background: var(--bg-subtle); border-radius: var(--radius); padding: 10px; max-height: 280px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; margin: 0; }
.hl { background: var(--warn-soft); }
.drop { border: 1px dashed var(--border-hover); border-radius: var(--radius); padding: 18px; text-align: center; }
.cutin .hstack { margin-top: 10px; }
details > summary { cursor: pointer; }
.d-head { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.ed { flex: 1; min-height: 0; display: flex; }
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px 24px; text-align: center; }
.stage .big { font-size: 20px; line-height: 1.7; max-width: 640px; }
.insp { width: 270px; flex: 0 0 auto; border-left: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.tl { flex: 0 0 auto; display: flex; border-top: 1px solid var(--border); }
.tl-labels { width: 100px; flex: 0 0 auto; border-right: 1px solid var(--border); }
.tl-labels > div { height: 46px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--bg-subtle); overflow: hidden; white-space: nowrap; }
.tl-labels > .rl { height: 22px; font-weight: 400; color: var(--muted); }
.tl-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; }
.tl-inner { position: relative; }
.ruler { height: 22px; position: relative; border-bottom: 1px solid var(--border); cursor: pointer; }
.ruler span { position: absolute; top: 3px; height: 18px; font-size: 10.5px; color: var(--muted); border-left: 1px solid var(--border); padding-left: 3px; pointer-events: none; }
.track { position: relative; height: 46px; border-bottom: 1px solid var(--bg-subtle); }
.blk { position: absolute; top: 6px; height: 34px; border: 1px solid var(--border); border-top-width: 3px; border-radius: 4px; background: var(--bg-subtle);
  font-size: 11.5px; padding: 1px 5px; overflow: hidden; white-space: nowrap; cursor: pointer; }
.blk:hover { border-color: var(--border-hover); }
.blk.sel { border-color: var(--fg); background: var(--bg); }
.blk.done { color: var(--muted-2); }
.join { position: absolute; top: 10px; width: 10px; height: 26px; margin-left: -5px; cursor: pointer; z-index: 2; display: flex; justify-content: center; }
.join::before { content: ""; width: 2px; background: var(--danger); }
.join:hover::before { width: 4px; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); pointer-events: none; z-index: 3; }
.gap23 { display: inline-block; width: 10px; height: 1.2em; vertical-align: -4px; cursor: col-resize; border-radius: 2px; }
.gap23:hover { background: var(--danger-soft); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; align-items: center; }
.kv > span:nth-child(odd) { color: var(--muted); }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 23 字幕エディタ</div>
<div class="win" id="win">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="menubar" id="menubar"></div>
  <div class="topnav" id="nav"></div>
  <div class="main" id="main"></div>
</div>
<script src="shared/data.js"></script>
<script>
// ===== common: utilities =====
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = K.mmss;
const WIN = () => $("#win");
const ACT = {}, CHG = {}, INP = {};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && ACT[el.dataset.act]) { ACT[el.dataset.act](el, e); return; }
  if (!e.target.closest(".menu")) $$(".menu").forEach((m) => m.remove());
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-chg]"); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener("input", (e) => { const el = e.target.closest("[data-inp]"); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });

function toast(msg) {
  $$(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; WIN().appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function sheet(html, id = "") {
  closeSheet();
  const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet" ${id ? `id="${id}"` : ""}>${html}</div>`;
  s.addEventListener("click", (e) => { if (e.target === s) closeSheet(); });
  WIN().appendChild(s); return s.firstChild;
}
function closeSheet() { const s = $("#scrim"); if (s) s.remove(); }
ACT["close-sheet"] = closeSheet;
function menu(anchor, items) {
  $$(".menu").forEach((m) => m.remove());
  const m = document.createElement("div"); m.className = "menu";
  const w = WIN().getBoundingClientRect(), a = anchor.getBoundingClientRect();
  m.style.top = (a.bottom - w.top + 4) + "px";
  m.style.left = Math.min(a.left - w.left, w.width - 240) + "px";
  items.forEach(([label, fn]) => {
    const b = document.createElement("button");
    if (!fn) { b.disabled = true; b.className = "meta"; }
    b.textContent = label; b.onclick = (e) => { e.stopPropagation(); m.remove(); fn && fn(); };
    m.appendChild(b);
  });
  WIN().appendChild(m);
}
const sheetHead = (title) => `<div class="hstack" style="margin-bottom:10px"><h2 class="grow">${title}</h2><button class="btn sm ghost" data-act="close-sheet">閉じる</button></div>`;
const nowStr = () => { const d = new Date(); return `2026-11-17 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const recById = (id) => K.recordings.find((r) => r.id === id);
const modelName = (id) => (K.models.find((m) => m.id === id) || {}).name || "なし";

// "この案について"
ACT.about = () => {
  const m = (n) => esc(($(`meta[name="${n}"]`) || {}).content || "");
  sheet(sheetHead("この案について") + `<div class="vstack">
    <div><div class="meta">コンセプト</div>${m("kkm-concept")}</div>
    <div><div class="meta">仮説と理由</div>${m("kkm-why")}</div>
    <div><div class="meta">捨てるもの</div>${m("kkm-tradeoff")}</div></div>`);
};

// ===== common: state =====
const S = {
  tab: "session", recId: null,
  session: { status: "idle", mode: null, lines: [], handle: null, auto: false, cards: [], showAdvisor: false, advisorStopped: false, advisorMuted: false, question: null, deviceNotice: null, title: null },
  auto: { state: K.settings.autoRecord ? "waiting" : "off", manualStopped: false, countdown: 0, timer: null, error: null },
  cal: { signedIn: !!K.calendar.signedIn, signingIn: false },
  dirty: {}, cues: {}, identifying: {}, dl: {}, player: null, playerRec: null,
  ev: { rec: "r1", ref: "weekly.rttm", mode: "der", from: 0, to: 70, collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, ran: false },
  removedFolders: {},
};
const TABS = [["session", "セッション"], ["recordings", "録音"], ["search", "検索"], ["models", "モデル"], ["settings", "設定"]];

function render() {
  renderMenubar();
  $("#nav").innerHTML = TABS.map(([k, l]) => `<button class="btn ${S.tab === k ? "sel" : ""}" data-act="tab" data-tab="${k}">${l}</button>`).join("")
    + `<span class="grow"></span>` + sessionMini();
  const main = $("#main"); main.innerHTML = "";
  if (S.tab === "session") renderSession(main);
  else if (S.tab === "recordings") { const r = recById(S.recId); r ? VARIANT.detail(main, r) : renderList(main); }
  else if (S.tab === "search") renderSearch(main);
  else if (S.tab === "models") renderModels(main);
  else renderSettings(main);
  if (!$("#about-btn")) {
    const b = document.createElement("button"); b.id = "about-btn"; b.className = "btn sm ghost"; b.dataset.act = "about";
    b.textContent = "この案について"; b.style.cssText = "position:fixed;right:8px;bottom:4px;z-index:100"; document.body.appendChild(b);
  }
}
ACT.tab = (el) => { S.tab = el.dataset.tab; if (S.tab === "recordings" && el.dataset.list) S.recId = null; render(); };
// Small "now recording" indicator in the nav so the live session stays reachable from any tab.
function sessionMini() {
  const ss = S.session;
  if (ss.status === "listening") return `<span class="chip rec"><span class="dot-rec"></span>録音中 <span class="num" id="mini-t">${fmt(ss.handle.elapsed())}</span></span><button class="btn sm" data-act="stop">■ 停止</button>`;
  if (ss.status === "finishing") return `<span class="meta">翻訳を仕上げています…</span>`;
  return "";
}

// ===== common: menu bar status item (#18) =====
function autoLabel() {
  const a = S.auto, ss = S.session;
  if (ss.status === "listening") return a.countdown > 0 ? `● 録音中 · ${a.countdown} 秒後に自動停止` : `● 録音中${ss.auto ? "（自動）" : ""}`;
  if (a.state === "error") return "自動録音: エラー";
  if (a.state === "waiting") return a.manualStopped ? "自動録音: 待機中（この会議は再開しない）" : "自動録音: 待機中";
  return "待機中";
}
function renderMenubar() {
  $("#menubar").innerHTML = `<span data-act="mb-menu" style="cursor:pointer" class="${S.auto.state === "error" ? "err" : ""}">Kikimimic: ${esc(autoLabel())}</span><span class="meta">11:28</span>`;
}
ACT["mb-menu"] = (el) => {
  const live = S.session.status === "listening";
  menu(el, [
    [autoLabel(), null],
    live ? ["■ 停止", () => stopSession(true)] : ["● 会議を録音", () => startSession("meeting")],
    [`自動録音: ${K.settings.autoRecord ? "オン" : "オフ"}（切り替え）`, () => setAutoRecord(!K.settings.autoRecord)],
    ["（デモ）会議アプリが通話を開始", autoMeetingStarted],
    ["（デモ）会議が終了", autoMeetingEnded],
    ["（デモ）自動録音のエラー", () => { S.auto.state = "error"; S.auto.error = "システム音声を取得できません（画面とシステムオーディオ録音の権限）"; render(); }],
    ["（デモ）カレンダーのカード", showCutin],
    ["ウィンドウを開く", () => { S.tab = "session"; render(); }],
  ]);
};
function setAutoRecord(on) { K.settings.autoRecord = on; S.auto.state = on ? "waiting" : "off"; S.auto.error = null; render(); }
function autoMeetingStarted() {
  if (!K.settings.autoRecord) return toast("自動録音はオフです（設定 > 録音）");
  if (S.auto.state === "error") return toast("自動録音はエラーのため開始できません");
  if (S.auto.manualStopped) return toast("手動で停止した会議なので再開しません");
  if (S.session.status !== "idle") return;
  startSession("meeting", { auto: true, title: "Zoom 会議（自動録音）" });
}
function autoMeetingEnded() {
  if (S.session.status !== "listening" || !S.session.auto) { S.auto.manualStopped = false; render(); return toast("会議が終了しました"); }
  S.auto.countdown = 60; clearInterval(S.auto.timer);
  S.auto.timer = setInterval(() => { // demo runs 10x faster
    S.auto.countdown--; renderMenubar();
    if (S.auto.countdown <= 0) { clearInterval(S.auto.timer); stopSession(false); toast("会議が終わって 60 秒たったので自動停止しました"); }
  }, 100);
  renderMenubar();
}
// ===== common: live session (#1 #2 #3 #16 #17) =====
function startSession(mode, opts = {}) {
  const ss = S.session; if (ss.status !== "idle") return;
  if (K.settings.clearOnStart) ss.lines = [];
  Object.assign(ss, { status: "listening", mode, auto: !!opts.auto, title: opts.title || null, cards: [], showAdvisor: false, advisorStopped: false, advisorMuted: false, question: null, deviceNotice: null });
  ss.handle = K.live(K.settings.translateInto ? mode : "noTranslate", onLive);
  ss.tick = setInterval(() => { const t = $("#mini-t"); if (t && ss.handle) t.textContent = fmt(ss.handle.elapsed()); }, 1000);
  closeCutin(); S.tab = "session"; render();
}
function stopSession(manual) {
  const ss = S.session; if (ss.status !== "listening") return;
  ss.handle.stop(); clearInterval(ss.tick); clearInterval(S.auto.timer); S.auto.countdown = 0;
  if (ss.auto && manual) S.auto.manualStopped = true;
  ss.status = "finishing"; ss.question = null; render();
  setTimeout(() => {
    ss.status = "idle";
    const keep = ss.mode === "meeting" || (ss.mode === "face" && K.settings.saveFaceToFace);
    if (keep && ss.lines.some((l) => l.text)) { saveLive(); toast("録音一覧に保存しました"); }
    else if (ss.mode === "face") toast("対面の会話は保存しませんでした（設定で変更できます）");
    render();
  }, 1500);
}
function saveLive() {
  const ss = S.session, id = "n" + Date.now();
  const utts = ss.lines.filter((l) => l.text).map((l, i) => ({
    id: id + "u" + i, lane: l.lane, spk: null, start: l.at, end: l.at + 2600, text: l.text,
    units: l.text.split(/(?<=\s)|(?<=[、。])/), tr: l.tr, reviewed: false }));
  const last = utts[utts.length - 1];
  K.recordings.push({ id, title: ss.title || (ss.mode === "face" ? "対面の会話" : "会議の録音"), date: nowStr(), durationMs: last.end + 1000,
    source: ss.mode, lanes: ss.mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, utterances: utts, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null });
}
function onLive(ev) {
  const ss = S.session, line = ss.lines.find((l) => l.id === ev.id);
  if (!line && ["update", "commit", "translating", "translate"].includes(ev.type)) return; // line erased by クリア mid-session
  if (ev.type === "line") ss.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", text: "", tr: null, state: "open" });
  else if (ev.type === "update") Object.assign(line, { committed: ev.committed, volatile: ev.volatile });
  else if (ev.type === "commit") Object.assign(line, { committed: ev.text, volatile: "", text: ev.text, state: "committed" });
  else if (ev.type === "translating") line.state = "translating";
  else if (ev.type === "translate") Object.assign(line, { tr: ev.text, state: "done" });
  else if (ev.type === "advisor") { if (!ss.advisorStopped && !ss.advisorMuted) ss.cards.push(ev.card); }
  else if (ev.type === "question") { if (ss.mode === "meeting") ss.question = ev; }
  if (S.tab === "session") (ev.type === "line" || ev.type === "update" || ev.type === "commit" || ev.type === "translating" || ev.type === "translate") ? renderLines() : renderSession($("#main"));
}
const laneColor = (lane) => lane === "Me" ? "var(--lane-me)" : lane === "Them" ? "var(--lane-them)" : "var(--muted-2)";
function lineHTML(l) {
  const tr = l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.state === "translating" ? `<div class="meta">訳しています…</div>` : "";
  return `<div class="live-line" id="ll-${l.id}"><span class="lane" style="color:${laneColor(l.lane)}">${l.lane}</span>
    <div class="grow"><div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>${tr}</div></div>`;
}
function renderLines() {
  const box = $("#live-lines"); if (!box) return;
  const ss = S.session;
  box.innerHTML = ss.lines.length ? ss.lines.map(lineHTML).join("") : `<div class="meta">${ss.status === "idle" ? "「● 会議を録音」か「対面」で始めます。" : "聞き取り中…"}</div>`;
  box.scrollTop = box.scrollHeight;
}
function statusText() {
  const ss = S.session;
  if (ss.status === "listening") return `聞き取り中 · ${ss.mode === "face" ? "対面（マイクのみ）" : "会議（Me = マイク / Them = システム音声）"}`;
  if (ss.status === "finishing") return "翻訳を仕上げています…";
  return "待機中";
}
function renderSession(main) {
  const ss = S.session, live = ss.status === "listening", next = K.calendar.events[0];
  const face = `<span class="chip ${K.settings.saveFaceToFace ? "ok" : ""}" data-act="toggle-face-save" style="cursor:pointer" title="切り替え">対面: ${K.settings.saveFaceToFace ? "保存する" : "保存しない"}</span>`;
  const advisorBtn = !live ? "" : ss.advisorStopped
    ? `<button class="btn sm" data-act="advisor-resume">アドバイザー（停止中）</button>`
    : `<button class="btn sm" data-act="advisor-open">アドバイザー${ss.cards.length ? `（${ss.cards.length}）` : ""}</button>`;
  const notices = [];
  if (ss.question) notices.push(`<div class="notice"><span class="grow">出力が ${esc(ss.question.detected)} に変わりました（いまは ${esc(ss.question.capturing)} を録音中）。切り替えますか？</span><button class="btn sm" data-act="dev-follow">切り替える</button><button class="btn sm" data-act="dev-stay">そのまま</button></div>`);
  if (ss.deviceNotice) notices.push(`<div class="notice"><span class="grow">${esc(ss.deviceNotice)}</span><button class="btn sm ghost" data-act="dev-dismiss">閉じる</button></div>`);
  if (S.auto.state === "error") notices.push(`<div class="notice error"><span class="grow">自動録音: ${esc(S.auto.error)}</span><button class="btn sm" data-act="auto-retry">再試行</button></div>`);
  const cards = live && ss.showAdvisor && !ss.advisorStopped ? ss.cards.map((c) => `<div class="card vstack" style="gap:6px">
      <div class="hstack"><span class="chip info">${esc(c.kind)}</span><span class="grow"></span><button class="btn sm ghost" data-act="adv-close" data-id="${c.id}">閉じる</button></div>
      <div>${esc(c.text)} <span class="cite" data-act="live-cite" data-id="${c.ev[0]}">根拠</span></div>
      <div class="hstack"><button class="btn sm" data-act="adv-mute">この会議では出さない</button><button class="btn sm" data-act="adv-stop">停止</button></div></div>`).join("") : "";
  main.innerHTML = `<div class="pad hstack bb">
      ${live ? `<button class="btn" data-act="stop">■ 停止</button>` : `<button class="btn rec" data-act="start" data-mode="meeting" ${ss.status !== "idle" ? "disabled" : ""}>● 会議を録音</button><button class="btn" data-act="start" data-mode="face" ${ss.status !== "idle" ? "disabled" : ""}>対面</button>`}
      <span class="meta">${statusText()}</span>${face}<span class="grow"></span>${advisorBtn}
      <button class="btn sm ghost" data-act="clear-live">クリア</button></div>
    ${notices.length ? `<div class="pad vstack" style="padding-bottom:0">${notices.join("")}</div>` : ""}
    ${!live && S.cal.signedIn && next ? `<div class="pad hstack meta" style="padding-bottom:0">次の予定: ${esc(next.title)} ${next.start}（あと ${next.inMin} 分）<button class="btn sm" data-act="start-cal">この会議を録音</button></div>` : ""}
    ${cards ? `<div class="pad vstack" style="padding-bottom:0">${cards}</div>` : ""}
    <div class="pad scroll fill" id="live-lines"></div>`;
  renderLines();
}
ACT.start = (el) => startSession(el.dataset.mode);
ACT["start-cal"] = () => startSession("meeting", { title: K.calendar.events[0].title });
ACT.stop = () => stopSession(true);
ACT["clear-live"] = () => { S.session.lines = []; renderLines(); };
ACT["toggle-face-save"] = () => { K.settings.saveFaceToFace = !K.settings.saveFaceToFace; render(); };
ACT["dev-follow"] = () => { const q = S.session.question; S.session.deviceNotice = `${q.detected} を録音しています`; S.session.question = null; render(); };
ACT["dev-stay"] = () => { const q = S.session.question; S.session.deviceNotice = `${q.capturing} を録音しています`; S.session.question = null; render(); };
ACT["dev-dismiss"] = () => { S.session.deviceNotice = null; render(); };

    <div class="set-row"><span>ファイル名</span><input class="input mono" value="${esc(ob.fileName)}" data-chg="ob-fn" style="width:200px"></div>
    <div class="set-row"><span>自動で書き出す</span><select class="input" data-chg="ob-auto"><option value="minutes" ${ob.autoExport === "minutes" ? "selected" : ""}>議事録ができたら</option><option value="off" ${ob.autoExport !== "minutes" ? "selected" : ""}>しない（録音ごとに手動）</option></select></div>
    <div class="set-row"><span>文字起こしを含める</span>${tog(ob.includeTranscript, "ob-tr")}</div>
    <div class="set-row"><span>訳文を含める</span>${tog(ob.includeTranslation, "ob-tl")}</div>
    <div class="set-row"><span class="meta">frontmatter: ${ob.frontmatter.join(", ")}</span>${n ? `<button class="btn sm" data-act="ob-stale-all">古いノート ${n} 件を更新</button>` : `<span class="meta">古いノートはありません</span>`}</div></div>`;
}
CHG["ob-fn"] = (el) => { K.settings.obsidian.fileName = el.value; };
CHG["ob-auto"] = (el) => { K.settings.obsidian.autoExport = el.value; };
ACT["ob-tr"] = () => { K.settings.obsidian.includeTranscript = !K.settings.obsidian.includeTranscript; render(); };
ACT["ob-tl"] = () => { K.settings.obsidian.includeTranslation = !K.settings.obsidian.includeTranslation; render(); };

// ===== common: recordings list (~90 items: date groups + status filter) =====
S.listFilter = "all";
const WD = "日月火水木金土";
const dayLabel = (d) => { const x = new Date(d.slice(0, 10) + "T00:00:00"); return `${x.getMonth() + 1}月${x.getDate()}日（${WD[x.getDay()]}）`; };
const FILTERS = [["all", "すべて"], ["pending", "後処理待ち"], ["stale", "ノートが古い"]];
function listFiltered() {
  const f = S.listFilter;
  return K.recordings.filter((r) => f === "all" || (f === "pending" ? r.status !== "exported" : f === "stale" ? r.note && r.note.state === "stale" : r.status === f))
    .slice().sort((a, b) => b.date.localeCompare(a.date));
}
function listRowsHTML(rows, rowFn) {
  let day = "", out = "";
  rows.forEach((r) => { const d = r.date.slice(0, 10); if (d !== day) { day = d; out += `<div class="meta" style="padding:10px 8px 2px;font-weight:600">${dayLabel(r.date)}</div>`; } out += rowFn(r); });
  return out || `<div class="meta pad">該当する録音はありません。</div>`;
}
function defaultRow(r) {
  return `<div class="row hstack" data-act="open-rec" data-id="${r.id}"><span class="meta num" style="width:40px">${r.date.slice(11)}</span>
    <div class="grow"><div>${esc(r.title)}</div><div class="meta">${fmt(r.durationMs)} · ${SRC[r.source] || r.source}${participants(r) ? " · " + esc(participants(r)) : ""}</div></div>
    ${VARIANT.rowExtra ? VARIANT.rowExtra(r) : ""}${statusChip(r)}${r.status !== "exported" && !S.proc[r.id] ? `<button class="btn sm" data-act="proc-all" data-id="${r.id}">${r.status === "minutes" ? "書き出す" : "処理"}</button>` : ""}</div>`;
}
function listToolbarHTML() {
  const p = pendingRecs().length;
  return `<div class="hstack"><span class="seg">${FILTERS.map(([k, l]) => `<button class="${S.listFilter === k ? "sel" : ""}" data-act="lf" data-f="${k}">${l}${k === "pending" ? ` ${p}` : k === "stale" ? ` ${staleRecs().length}` : ""}</button>`).join("")}</span>
    <select class="input" data-chg="lf-status"><option value="">状態で絞る</option>${STEPS.map((s) => `<option value="${s}" ${S.listFilter === s ? "selected" : ""}>${K.STATUS[s]}</option>`).join("")}</select>
    <span class="grow"></span>${p ? `<button class="btn sm" data-act="proc-every">後処理待ちをすべて処理</button>` : ""}</div>`;
}
ACT.lf = (el) => { S.listFilter = el.dataset.f; render(); };
CHG["lf-status"] = (el) => { S.listFilter = el.value || "all"; render(); };
function renderList(main) {
  main.innerHTML = `<div class="pad vstack bb"><div class="hstack"><h2 class="grow">録音 <span class="meta">${K.recordings.length} 件</span></h2><button class="btn" data-act="import-open">音声を取り込む…</button></div>${listToolbarHTML()}</div>
    <div class="scroll fill pad" style="padding-top:0"><div class="center">${listRowsHTML(listFiltered(), VARIANT.listRow || defaultRow)}</div></div>`;
}
// ===== 23 subtitle-editor: cues laid out on a horizontal timeline, cut and joined in place =====
const V = { rec: null, cue: 0, pxs: 40, sheet: null };
const MAX_CHARS = 42, MIN_MS = 1000;
const px = (ms) => ms / 1000 * V.pxs;
const cueUtt = (rec, c) => rec.utterances.find((u) => u.id === c[0].u);
const cueStart = (c) => c[0].start, cueEnd = (c) => c[c.length - 1].end;
function tracksOf(rec) {
  const keys = Object.keys(rec.speakers);
  if (!keys.length || rec.utterances.some((u) => !u.spk)) keys.push("");
  return keys;
}
function cueWarn(c) {
  const t = cueText(c), d = cueEnd(c) - cueStart(c), out = [];
  if (t.length > MAX_CHARS) out.push(`<span class="chip warn">長い（${MAX_CHARS} 文字超）</span>`);
  if (d < MIN_MS) out.push(`<span class="chip warn">短い（1 秒未満）</span>`);
  return out.join("");
}
function timelineHTML(rec) {
  const cues = cuesOf(rec), tracks = tracksOf(rec);
  const extent = Math.max(60000, (cues.length ? cueEnd(cues[cues.length - 1]) : 0) + 5000), width = px(extent);
  const step = V.pxs >= 80 ? 2 : V.pxs >= 40 ? 5 : 10;
  let ruler = ""; for (let s = 0; s * 1000 <= extent; s += step) ruler += `<span style="left:${px(s * 1000)}px">${fmt(s * 1000)}</span>`;
  const rows = tracks.map((k) => {
    let blocks = "";
    cues.forEach((c, ci) => {
      const u = cueUtt(rec, c); if ((u.spk || "") !== k) return;
      const color = u.spk ? K.speakerColor(u.spk) : "var(--muted)";
      blocks += `<div class="blk ${ci === V.cue ? "sel" : ""} ${u.reviewed ? "done" : ""}" id="blk-${ci}" data-act="pick-cue" data-ci="${ci}"
        style="left:${px(cueStart(c))}px;width:${Math.max(6, px(cueEnd(c) - cueStart(c)) - 2)}px;border-top-color:${color}" title="${esc(cueText(c))}">${esc(cueText(c))}</div>`;
      const next = cues[ci + 1];
      if (next && next[0].u === c[0].u) blocks += `<div class="join" data-act="cue-merge" data-ci="${ci}" title="結合する" style="left:${px(cueEnd(c))}px"></div>`;
    });
    return `<div class="track">${blocks}</div>`;
  }).join("");
  return `<div class="tl-labels"><div class="rl">${V.pxs} px/秒</div>${tracks.map((k) => `<div style="color:${k ? K.speakerColor(k) : "var(--muted)"}">${esc(k ? K.speakerName(rec, k) : "未割り当て")}</div>`).join("")}</div>
    <div class="tl-scroll" id="tl-scroll"><div class="tl-inner" style="width:${width}px"><div class="ruler" data-act="tl-seek">${ruler}</div>${rows}
      <div class="playhead" id="playhead" style="left:${px(S.player ? S.player.pos : 0)}px"></div></div></div>`;
}
function stageHTML(rec) {
  const cues = cuesOf(rec), c = cues[V.cue];
  if (!c) return `<div class="meta">${rec.utterances.length ? "字幕を選んでください" : "まだ文字起こしされていません。"}</div>`;
  const u = cueUtt(rec, c), d = cueEnd(c) - cueStart(c);
  const words = c.map((w, k) => (k ? `<span class="gap23" data-act="cue-split" data-ci="${V.cue}" data-k="${k}" title="ここで分割"></span>` : "")
    + `<span class="w" data-act="w-seek" data-s="${w.start}" data-e="${w.end}">${esc(w.w.trim())}</span>`).join("");
  return `<div class="hstack meta num" style="justify-content:center">#${V.cue + 1} / ${cues.length} · ${fmt(cueStart(c))} – ${fmt(cueEnd(c))} · ${(d / 1000).toFixed(1)} 秒 · ${cueText(c).length} 文字 ${cueWarn(c)}</div>
    <div class="spk" style="color:${u.spk ? K.speakerColor(u.spk) : "var(--muted)"}">${esc(K.speakerName(rec, u.spk) || u.lane)}</div>
    <div class="big">${words}</div>
    ${u.tr ? `<div class="tr" style="max-width:640px">${esc(u.tr)} <span class="meta">（訳文は発話単位）</span></div>` : ""}
    <div class="hstack" style="justify-content:center;margin-top:6px">
      <button class="btn sm" data-act="cue-step" data-d="-1" ${V.cue ? "" : "disabled"}>← 前の字幕</button>
      <button class="btn sm" data-act="cue-merge" data-ci="${V.cue - 1}" ${V.cue ? "" : "disabled"}>前と結合</button>
      <button class="btn sm primary" data-act="split-here">再生位置で分割</button>
      <button class="btn sm" data-act="cue-merge" data-ci="${V.cue}" ${V.cue < cues.length - 1 ? "" : "disabled"}>次と結合</button>
      <button class="btn sm" data-act="cue-step" data-d="1" ${V.cue < cues.length - 1 ? "" : "disabled"}>次の字幕 →</button></div>`;
}
function inspHTML(rec) {
  const cues = cuesOf(rec), c = cues[V.cue], u = c ? cueUtt(rec, c) : null;
  const long = cues.filter((x) => cueText(x).length > MAX_CHARS || cueEnd(x) - cueStart(x) < MIN_MS).length;
  return `${u ? `<h3>この字幕の発話</h3><div class="kv"><span>時刻</span><span><span class="ts cite num" data-act="play-at" data-at="${u.start}">${fmt(u.start)}</span></span>
      <span>話者</span><span>${speakerSelect(rec, u)}</span><span>レーン</span><span>${u.lane}</span></div>
      <label class="check"><input type="checkbox" data-chg="rev" data-u="${u.id}" ${u.reviewed ? "checked" : ""}><span>校閲済み</span></label>
      <div class="hstack"><button class="btn sm" data-act="next-unrev">次の未校閲へ</button><button class="btn sm ghost" data-act="v-sheet" data-k="names">話者名…</button></div><div class="sep"></div>` : ""}
    <h3>区切り</h3><div class="meta num">字幕 ${cues.length} 個${long ? ` · 長すぎ・短すぎ ${long} 個` : ""}</div>
    ${long ? `<div><button class="btn sm" data-act="next-bad">次の要確認へ</button></div>` : ""}
    <div class="hstack"><button class="btn sm" data-act="cue-srt">SRT を書き出す</button><button class="btn sm ghost" data-act="cue-words">words.srt</button></div>
    <div class="meta">単語の時刻は推定です</div><div class="sep"></div>
    <h3>この会議</h3><div class="hstack">${[["min", "議事録"], ["stats", "統計"], ["qa", "質問"], ["all", "全文"]].map(([k, l]) => `<button class="btn sm" data-act="v-sheet" data-k="${k}">${l}</button>`).join("")}</div>`;
}
function sheetBody(rec) {
  const k = V.sheet;
  if (k === "names") return sheetHead("話者名") + `<div class="vstack">${Object.keys(rec.speakers).map((s) => `<div class="hstack"><span class="spk" style="width:100px;color:${K.speakerColor(s)}">${esc(rec.speakers[s].auto)}</span><input class="input grow" value="${esc(rec.speakers[s].name)}" placeholder="名前" data-chg="spk-name" data-k="${s}"></div>`).join("") || `<div class="meta">話者がまだ分かれていません。</div>`}
    <div class="hstack"><span class="grow"></span>${identifyHTML(rec)}</div></div>`;
  if (k === "all") return sheetHead("全文") + rec.utterances.map((u) => `<div class="utt"><div class="head"><span class="ts num" data-act="sheet-jump" data-u="${u.id}">${fmt(u.start)}</span><span class="spk" style="color:${u.spk ? K.speakerColor(u.spk) : "var(--muted)"}">${esc(K.speakerName(rec, u.spk) || u.lane)}</span></div><div>${esc(u.text)}</div>${u.tr ? `<div class="tr">${esc(u.tr)}</div>` : ""}</div>`).join("");
  return sheetHead({ min: "議事録", stats: "会話の統計", qa: "会議への質問" }[k]) + (k === "min" ? minutesHTML(rec) : k === "stats" ? statsHTML(rec) : qaHTML(rec));
}
function refreshParts(rec) {
  const st = $("#stage"), ins = $("#insp"); if (st) st.innerHTML = stageHTML(rec); if (ins) ins.innerHTML = inspHTML(rec);
  $$(".blk").forEach((b) => b.classList.toggle("sel", +b.dataset.ci === V.cue));
}
function pickCue(rec, ci, seek = true) {
  const cues = cuesOf(rec); V.cue = Math.max(0, Math.min(cues.length - 1, ci)); refreshParts(rec);
  if (seek && cues[V.cue]) S.player.seek(cueStart(cues[V.cue]));
  const b = $("#blk-" + V.cue), sc = $("#tl-scroll");
  if (b && sc && (b.offsetLeft < sc.scrollLeft || b.offsetLeft > sc.scrollLeft + sc.clientWidth - 80)) sc.scrollLeft = b.offsetLeft - 120;
}
var VARIANT = {
  detail(main, rec) {
    if (V.rec !== rec.id) Object.assign(V, { rec: rec.id, cue: 0 });
    ensurePlayer(rec);
    const sc = $("#tl-scroll"), keep = sc ? sc.scrollLeft : 0;
    main.innerHTML = `<div class="d-head"><div class="hstack"><button class="btn sm ghost" data-act="back">← 録音一覧</button>
        <h2>${esc(rec.title)}</h2><span class="meta">${rec.date} · ${fmt(rec.durationMs)}</span><span class="grow"></span>
        <span class="seg">${[20, 40, 80].map((z) => `<button class="${V.pxs === z ? "sel" : ""}" data-act="zoom" data-z="${z}">${z === 20 ? "縮小" : z === 40 ? "標準" : "拡大"}</button>`).join("")}</span>
        <span id="dirty" class="hstack">${dirtyHTML(rec)}</span><button class="btn sm" data-act="export">書き出し</button></div>${pipelineHTML(rec)}</div>
      <div class="ed"><div class="stage" id="stage">${stageHTML(rec)}</div><aside class="insp" id="insp">${inspHTML(rec)}</aside></div>
      ${playerBarHTML(rec)}<div class="tl">${timelineHTML(rec)}</div>`;
    const sc2 = $("#tl-scroll"); if (sc2) sc2.scrollLeft = keep;
    const sh = $("#v-sheet"); if (sh && V.sheet) sh.innerHTML = sheetBody(rec);
  },
  focus(rec, uttId, ms) {
    V.sheet = null; const cues = cuesOf(rec);
    const ci = uttId ? cues.findIndex((c) => c[0].u === uttId) : cues.findIndex((c) => cueEnd(c) > ms);
    pickCue(rec, ci < 0 ? 0 : ci, false); const b = $("#blk-" + V.cue); if (b) flash(b);
  },
  onTick(pos, playing) {
    const ph = $("#playhead"), sc = $("#tl-scroll"), rec = recById(S.recId); if (!ph || !rec) return;
    const x = px(pos); ph.style.left = x + "px";
    if (playing && sc && (x < sc.scrollLeft || x > sc.scrollLeft + sc.clientWidth - 40)) sc.scrollLeft = x - 80;
    const cues = cuesOf(rec), ci = cues.findIndex((c) => cueStart(c) <= pos && pos < cueEnd(c));
    if (playing && ci >= 0 && ci !== V.cue) { V.cue = ci; refreshParts(rec); }
    $$("#stage .w[data-s]").forEach((w) => w.classList.toggle("now", +w.dataset.s <= pos && pos < +w.dataset.e));
  },
};
ACT["pick-cue"] = (el) => pickCue(recById(S.recId), +el.dataset.ci);
ACT["cue-step"] = (el) => pickCue(recById(S.recId), V.cue + +el.dataset.d);
ACT["cue-split"] = (el) => { splitCue(recById(S.recId), +el.dataset.ci, +el.dataset.k); render(); };
ACT["cue-merge"] = (el) => { const ci = +el.dataset.ci, r = recById(S.recId); if (ci < 0) return; mergeCue(r, ci); V.cue = ci; render(); };
ACT["split-here"] = () => {
  const r = recById(S.recId), c = cuesOf(r)[V.cue], pos = S.player.pos;
  const k = c ? c.findIndex((w) => w.start >= pos) : -1;
  if (!c || pos <= cueStart(c) || pos >= cueEnd(c) || k <= 0) return toast("再生位置がこの字幕の中にありません（単語を押して位置を決めます）");
  splitCue(r, V.cue, k); V.cue++; render();
};
ACT["tl-seek"] = (el, e) => { S.player.seek((e.clientX - el.getBoundingClientRect().left) / V.pxs * 1000); };
ACT.zoom = (el) => { V.pxs = +el.dataset.z; render(); };
ACT["w-seek"] = (el) => playAt(+el.dataset.s);
CHG.rev = (el) => { const r = recById(S.recId); r.utterances.find((x) => x.id === el.dataset.u).reviewed = el.checked; markDirty(r); render(); };
CHG["spk-name"] = (el) => { const r = recById(S.recId); r.speakers[el.dataset.k].name = el.value.trim(); markDirty(r); render(); };
ACT["next-unrev"] = () => {
  const r = recById(S.recId), c = cuesOf(r)[V.cue], n = nextUnreviewed(r, c ? c[0].u : null);
  if (!n) return toast("未校閲の発話はありません");
  VARIANT.focus(r, n.id);
};
ACT["next-bad"] = () => {
  const r = recById(S.recId), cues = cuesOf(r), bad = (x) => cueText(x).length > MAX_CHARS || cueEnd(x) - cueStart(x) < MIN_MS;
  const i = cues.findIndex((x, i2) => i2 > V.cue && bad(x)), j = i >= 0 ? i : cues.findIndex(bad);
  if (j >= 0) pickCue(r, j);
};
ACT["cue-srt"] = () => { const r = recById(S.recId); exportSheet(r, "srt", cuesSRT(r)); };
ACT["cue-words"] = () => exportSheet(recById(S.recId), "words");
ACT["v-sheet"] = (el) => { V.sheet = el.dataset.k; sheet("", "v-sheet").innerHTML = sheetBody(recById(S.recId)); };
ACT["sheet-jump"] = (el) => { closeSheet(); VARIANT.focus(recById(S.recId), el.dataset.u); };

// Opens straight into the editor for the latest meeting.
S.tab = "recordings"; S.recId = "r1";
setTimeout(() => { if (S.cal.signedIn) showCutin(); }, 1500);
render();
</script>
