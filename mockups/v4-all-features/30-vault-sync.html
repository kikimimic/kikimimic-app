<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>30 保管庫と同期 — Kikimimic</title>
<meta name="kkm-concept" content="録音一覧が Obsidian 保管庫のフォルダツリーと同じ形。各会議にノートの状態（未書き出し / 最新 / 古い）とノートのプレビュー">
<meta name="kkm-why" content="文字起こしと議事録を Obsidian の Markdown で管理している主ユーザーが、会議の直後と後日に使う。最終的な置き場は Obsidian なので、Kikimimic は「保管庫に良いノートを置く装置」と割り切り、保管庫と同じ形で並べてノートの状態を見せれば、何を書き出し・更新すべきかが迷わず分かる">
<meta name="kkm-tradeoff" content="アプリ内で読む・直す体験は簡素（本文の編集は「アプリで開く」の奥）。保管庫の外にある録音は「保管庫にまだ無い」の 1 か所にまとまる">
<link rel="stylesheet" href="shared/kit.css">
<style>
.tabs { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; flex: 0 0 auto; }
.tabs .sp, .grow { flex: 1; }
.body { flex: 1; display: flex; min-height: 0; }
#main { flex: 1; padding: 16px 20px; }
.stack > * + * { margin-top: 12px; }
.stack-s > * + * { margin-top: 6px; }
.hrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t td, table.t th { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
table.t th { font-weight: 600; font-size: 12px; color: var(--muted-2); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--bg-subtle); }
pre.out { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
  background: var(--bg-subtle); max-height: 300px; overflow: auto; white-space: pre-wrap; margin: 0; }
.lane-Me { color: var(--lane-me); } .lane-Them { color: var(--lane-them); }
.player { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
.player .bar { flex: 1; cursor: pointer; }
.sec-title { font-size: 12px; color: var(--muted-2); font-weight: 600; margin-bottom: 6px; }
.field { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.field > label:first-child { width: 170px; flex: 0 0 auto; color: var(--muted-2); font-size: 13px; }
.live-line { padding: 6px 0; border-bottom: 1px solid var(--bg-subtle); }
.drop { border: 1px dashed var(--border-hover); border-radius: var(--radius); padding: 18px; text-align: center; }
.statbar { height: 6px; border-radius: 3px; background: var(--bg-subtle); overflow: hidden; display: flex; }
.statbar > i { display: block; height: 100%; }
details > summary { cursor: pointer; color: var(--muted-2); font-size: 13px; }
.about { position: absolute; right: 10px; bottom: 8px; z-index: 40; }
/* 30: vault tree (left) mirrors the Obsidian folder; note preview (right) */
#main.vaultmain { padding: 0; overflow: hidden; }
.vault { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
.tree { border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 6px 40px; font-size: 13px; }
.tree .row { padding: 3px 8px; display: flex; gap: 6px; align-items: center; }
.tree .f { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tree .ind1 { padding-left: 22px; } .tree .ind2 { padding-left: 38px; }
.note { overflow-y: auto; padding: 16px 20px 40px; }
.fm { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; background: var(--bg-subtle); }
.md h1 { font-size: 18px; margin: 10px 0 4px; } .md h2 { font-size: 14px; margin: 12px 0 4px; }
.md ul { margin: 0; padding-left: 20px; } .md li { margin: 2px 0; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 30 保管庫と同期</div>
<div class="win" id="win">
  <div class="menubar" id="menubar"></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="tabs" id="nav"></div>
  <div class="body"><main id="main" class="scroll"></main></div>
  <div id="overlay"></div>
  <button class="btn sm ghost about" data-act="about">この案について</button>
</div>
<script src="shared/data.js"></script>
<script>
"use strict";
/* ---- core: state, helpers ---- */
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ST = K.settings;
const S = {
  view: "session", rec: null, tab: "text", tmode: "review",
  session: "idle", mode: null, engine: null, lines: [], t0: 0,
  notice: null, captureDev: "MacBook Pro のスピーカー",
  advisorPending: [], advisorShown: [], advisorMuted: false, advisorStopped: false,
  auto: { state: ST.autoRecord ? "waiting" : "off", countdown: 0, manualStopped: false, timer: 0, error: "" },
  dirty: false, player: null, pos: 0, playing: false, cuts: {}, qa: {},
  queue: K.importQueue.map((q) => ({ ...q })), join: true,
  diarBusy: null, dl: {}, cal: { signing: false }, cutin: false,
  ev: { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, from: K.evaluation.range[0], to: K.evaluation.range[1],
    collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, running: false, result: null, sel: -1, runs: [] },
  sentLog: [],
};
const HOOK = {}; // variant hooks: nav(), top(), aside(), after(), confirmOut(kind, detail, onOk)
const V = {}, A = {}, C = {}, I = {};
const recById = (id) => K.recordings.find((r) => r.id === id);
const laneLabel = (l) => ({ Me: "Me（マイク）", Them: "Them（システム音声）", Imported: "取り込み" }[l] || l);
const srcLabel = (s) => ({ meeting: "会議", face: "対面", import: "取り込み" }[s] || s);
const pct = (x) => (x * 100).toFixed(1) + "%";

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("#win").appendChild(t); setTimeout(() => t.remove(), 2400);
}
function sheet(html) { $("#overlay").innerHTML = `<div class="scrim"><div class="sheet stack">${html}</div></div>`; }
function closeSheet() { $("#overlay").innerHTML = ""; }
A.closeSheet = closeSheet;
function closeMenus() { $$(".menu").forEach((m) => m.remove()); }
function menu(anchor, items) {
  closeMenus();
  const win = $("#win").getBoundingClientRect(), r = anchor.getBoundingClientRect();
  const m = document.createElement("div"); m.className = "menu";
  m.style.left = Math.max(4, Math.min(r.left - win.left, win.width - 240)) + "px"; m.style.top = (r.bottom - win.top + 4) + "px";
  m.innerHTML = items.map((it) => it === "-" ? `<div class="sep"></div>` : `<button data-act="${it.act}" ${Object.entries(it.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(it.label)}</button>`).join("");
  $("#win").appendChild(m);
}

function render() {
  if (HOOK.nav) $("#nav").innerHTML = HOOK.nav();
  if ($("#menubar")) $("#menubar").innerHTML = menubar();
  $("#main").innerHTML = (HOOK.top ? HOOK.top() : "") + (V[S.view] ? V[S.view]() : "");
  if (HOOK.aside) $("#aside").innerHTML = HOOK.aside();
  renderCutin();
  if (HOOK.after) HOOK.after();
  if (S.view === "detail") paintPlayhead();
}
function go(view) { S.view = view; if (view !== "detail" && S.player) S.player.pause(); render(); $("#main").scrollTop = 0; }
A.go = (d) => go(d.v);

document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu")) closeMenus();
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el, e); }
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-chg]"); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
document.addEventListener("input", (e) => { const el = e.target.closest("[data-inp]"); if (el && I[el.dataset.inp]) I[el.dataset.inp](el); });
document.addEventListener("keydown", (e) => { const el = e.target.closest("[data-enter]"); if (el && e.key === "Enter" && A[el.dataset.enter]) A[el.dataset.enter](el.dataset, el, e); });

/* outward data: variants may wrap this to show the boundary (#19, privacy) */
function confirmOut(kind, detail, onOk) { if (HOOK.confirmOut) return HOOK.confirmOut(kind, detail, onOk); onOk(); }
function logOut(kind, what) { S.sentLog.unshift({ kind, what, at: new Date().toTimeString().slice(0, 5) }); }

/* ---- about this variant ---- */
A.about = () => {
  const m = (n) => esc(document.querySelector(`meta[name="${n}"]`).content);
  sheet(`<h2>この案について</h2><div class="stack-s"><div class="meta">コンセプト</div><div>${m("kkm-concept")}</div>
    <div class="meta">仮説と理由</div><div>${m("kkm-why")}</div><div class="meta">捨てるもの</div><div>${m("kkm-tradeoff")}</div></div>
    <div class="hrow"><span class="grow"></span><button class="btn" data-act="closeSheet">閉じる</button></div>`);
};

/* ---- menu bar status (#18 auto record) ---- */
function sessionLabel() {
  if (S.session === "listening") return S.mode === "face" ? "対面で聞き取り中" : "聞き取り中";
  if (S.session === "finishing") return "翻訳を仕上げています…";
  return "待機中";
}
function autoLabel() {
  return { off: "自動録音: オフ", waiting: "自動録音: 待機中", recording: "自動録音: 録音中", ending: `自動録音: ${S.auto.countdown} 秒後に停止`, error: "自動録音: エラー" }[S.auto.state];
}
function menubar() {
  const rec = S.session === "listening";
  return `<span class="${S.auto.state === "error" ? "err" : "muted"}">${esc(autoLabel())}</span>
    <button class="btn sm ghost" data-act="mbMenu">${rec ? '<span class="dot-rec"></span> 録音中' : "Kikimimic"}</button>`;
}
A.mbMenu = (d, el) => menu(el, [
  { label: sessionLabel() + (S.session === "listening" ? " · " + K.mmss(Date.now() - S.t0) : ""), act: "noop" },
  ...(S.session === "listening" ? [{ label: "■ 停止", act: "stop" }] : [{ label: "● 会議を録音", act: "startMeeting" }]),
  "-", { label: autoLabel(), act: "noop" },
  ...(S.auto.state === "off" ? [{ label: "自動録音を設定…", act: "go", data: { v: "settings" } }]
    : S.auto.state === "error" ? [{ label: "自動録音を再試行", act: "autoRetry" }]
    : [{ label: "（デモ）会議アプリを検知", act: "autoDetect" }, { label: "（デモ）会議が終わる", act: "autoEnd" }, { label: "（デモ）エラーを起こす", act: "autoError" }]),
  "-", { label: "（デモ）出力デバイスを変える", act: "devChange" },
  { label: "（デモ）カレンダーのカットイン", act: "showCutin" },
]);
A.noop = () => {};
A.autoDetect = () => {
  if (S.auto.manualStopped) return toast("手動で停止した会議のため、自動では再開しません");
  if (S.session !== "idle") return toast("すでに録音中です");
  S.auto.state = "recording"; start("meeting");
};
A.autoEnd = () => {
  if (S.auto.state !== "recording") return toast("自動録音中ではありません");
  S.auto.state = "ending"; S.auto.countdown = 60;
  S.auto.timer = setInterval(() => {
    S.auto.countdown -= 5;
    if (S.auto.countdown <= 0) { clearInterval(S.auto.timer); S.auto.state = "waiting"; stop(false); toast("会議の終了から 60 秒たったので自動停止しました"); }
    else if ($("#menubar")) $("#menubar").innerHTML = menubar();
  }, 250);
  render();
};
A.autoError = () => { S.auto.state = "error"; S.auto.error = "システム音声を取得できません（画面とシステムオーディオ録音の許可がありません）"; render(); };
A.autoRetry = () => { S.auto.state = "waiting"; S.auto.error = ""; render(); };
/* ---- session (#1 #2 #3 #16 #17) ---- */
function start(mode) {
  if (S.session !== "idle") return;
  if (ST.clearOnStart) S.lines = [];
  Object.assign(S, { session: "listening", mode, t0: Date.now(), notice: null, advisorPending: [], advisorShown: [], advisorMuted: false, advisorStopped: false });
  S.engine = K.live(mode, onLive);
  S.clock = setInterval(() => $$("[data-elapsed]").forEach((e) => (e.textContent = K.mmss(Date.now() - S.t0))), 1000);
  if (S.view !== "session") S.view = "session";
  render();
}
function stop(manual = true) {
  if (S.session !== "listening") return;
  S.engine.stop(); clearInterval(S.clock);
  if (manual && (S.auto.state === "recording" || S.auto.state === "ending")) { clearInterval(S.auto.timer); S.auto.state = "waiting"; S.auto.manualStopped = true; }
  S.session = "finishing"; render();
  setTimeout(() => {
    const kept = !(S.mode === "face" && !ST.saveFaceToFace);
    if (kept) K.recordings.unshift(recFromLive(S.lines, S.mode));
    S.session = "idle"; S.mode = null; render();
    toast(kept ? "録音一覧に保存しました" : "対面モードは保存しない設定のため、保存していません");
  }, 1600);
}
A.startMeeting = () => start("meeting");
A.startFace = () => start("face");
A.stop = () => stop(true);
A.clearLive = () => { S.lines = []; render(); };

function onLive(ev) {
  const l = S.lines.find((x) => x.id === ev.id);
  const noTr = ST.translateInto === "none";
  switch (ev.type) {
    case "line": if (!(S.mode === "face" && ev.lane === "Them")) S.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "" }); break;
    case "update": if (l) Object.assign(l, { committed: ev.committed, volatile: ev.volatile }); break;
    case "commit": if (l) Object.assign(l, { committed: ev.text, volatile: "", done: true }); break;
    case "translating": if (l && !noTr) l.translating = true; break;
    case "translate": if (l && !noTr) { l.translating = false; l.tr = ev.text; } break;
    case "advisor": if (!S.advisorMuted && !S.advisorStopped) S.advisorPending.push(ev.card); break;
    case "question": S.notice = { kind: "question", detected: ev.detected, capturing: ev.capturing }; break;
  }
  if (S.view === "session") { const m = $("#main"); const atEnd = m.scrollHeight - m.scrollTop - m.clientHeight < 60; render(); if (atEnd) m.scrollTop = m.scrollHeight; }
}
A.devChange = () => { S.notice = { kind: "question", detected: "AirPods Pro", capturing: S.captureDev }; if (S.view !== "session") go("session"); else render(); };
A.devFollow = () => { S.captureDev = S.notice.detected; S.notice = { kind: "info", text: `${S.captureDev} を録音しています` }; render(); };
A.devStay = () => { S.notice = null; render(); toast(`${S.captureDev} のまま録音します`); };
A.noticeClose = () => { S.notice = null; render(); };

function noticeHtml() {
  if (!S.notice) return "";
  if (S.notice.kind === "question") return `<div class="notice"><span class="grow">出力が ${esc(S.notice.detected)} に変わりました（いまは ${esc(S.notice.capturing)} を録音中）。切り替えますか？</span>
    <button class="btn sm primary" data-act="devFollow">切り替える</button><button class="btn sm" data-act="devStay">そのまま</button></div>`;
  return `<div class="notice"><span class="grow">${esc(S.notice.text)}</span><button class="btn sm ghost" data-act="noticeClose">閉じる</button></div>`;
}
function faceSaveHtml() {
  return `<label class="check" style="align-items:center"><button class="toggle ${ST.saveFaceToFace ? "on" : ""}" data-act="toggleFaceSave"></button>
    <span>対面の録音を保存する</span><span class="chip ${ST.saveFaceToFace ? "ok" : ""}">${ST.saveFaceToFace ? "保存する" : "保存しない"}</span></label>`;
}
A.toggleFaceSave = () => { ST.saveFaceToFace = !ST.saveFaceToFace; render(); };

function liveLinesHtml() {
  if (!S.lines.length) return `<div class="muted" style="padding:24px 0">${S.session === "listening" ? "話し始めると、ここに文字起こしが出ます。" : "待機中です。"}</div>`;
  return S.lines.map((l) => `<div class="live-line"><div class="meta"><span class="lane-${l.lane}">${l.lane === "Me" ? "Me" : "Them"}</span> · ${K.mmss(l.at)}</div>
    <div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`).join("");
}
function sessionControls() {
  if (S.session === "listening") return `<span class="chip rec"><span class="dot-rec"></span>${S.mode === "face" ? "対面" : "会議"} · <span data-elapsed class="num">${K.mmss(Date.now() - S.t0)}</span></span>
    ${S.mode === "face" ? `<span class="chip ${ST.saveFaceToFace ? "ok" : ""}">${ST.saveFaceToFace ? "保存する" : "保存しない"}</span>` : `<span class="chip">Me + Them</span>`}
    <span class="grow"></span><button class="btn" data-act="advisorAsk">アドバイザー</button><button class="btn" data-act="stop">■ 停止</button>`;
  if (S.session === "finishing") return `<span class="chip warn">翻訳を仕上げています…</span><span class="grow"></span><button class="btn" disabled>■ 停止</button>`;
  return `<span class="chip">待機中</span><span class="grow"></span><button class="btn rec" data-act="startMeeting">● 会議を録音</button><button class="btn" data-act="startFace">対面</button>`;
}
V.session = () => `<div class="stack">
  <div class="hrow">${sessionControls()}</div>
  ${S.session === "idle" ? `<div class="hrow meta">会議 = Me（マイク）と Them（システム音声）の 2 レーン · 対面 = マイクのみ</div>${faceSaveHtml()}` : ""}
  ${S.auto.state === "error" ? `<div class="notice error"><span class="grow">${esc(S.auto.error)}</span><button class="btn sm" data-act="autoRetry">再試行</button></div>` : ""}
  ${S.auto.manualStopped ? `<div class="meta">自動録音: 手動で停止したため、この会議では再開しません</div>` : ""}
  ${noticeHtml()}
  ${advisorHtml()}
  <div>${liveLinesHtml()}</div></div>`;

/* ---- advisor (#16 manual only) ---- */
A.advisorAsk = () => {
  if (S.advisorStopped) return toast("この会議ではアドバイザーを止めています");
  if (!S.advisorPending.length) return toast("いまは提案がありません");
  S.advisorShown.push(...S.advisorPending); S.advisorPending = []; render();
};
A.advisorClose = (d) => { S.advisorShown = S.advisorShown.filter((c) => c.id !== d.id); render(); };
A.advisorMute = () => { S.advisorMuted = true; S.advisorShown = []; S.advisorPending = []; render(); toast("この会議ではアドバイザーを出しません"); };
A.advisorStop = () => { S.advisorStopped = true; S.advisorShown = []; render(); toast("アドバイザーを停止しました"); };
function advisorCard(c, live = true) {
  const ev = c.ev.map((id) => { const l = S.lines.find((x) => x.id === id); const f = K.findUtt(id); return l ? `「${esc(l.committed)}」` : f ? `<span class="cite" data-act="jump" data-rec="${f.rec.id}" data-u="${id}">${K.mmss(f.utt.start)}</span>` : ""; }).join(" ");
  return `<div class="card stack-s"><div class="hrow"><span class="chip info">${esc(c.kind)}</span><span class="grow">${esc(c.text)}</span></div>
    <div class="meta">根拠: ${ev}</div>
    <div class="hrow"><button class="btn sm" data-act="advisorClose" data-id="${c.id}">閉じる</button>${live ? `<button class="btn sm" data-act="advisorMute">この会議では出さない</button><button class="btn sm danger" data-act="advisorStop">停止</button>` : ""}</div></div>`;
}
function advisorHtml() { return S.advisorShown.map((c) => advisorCard(c)).join(""); }

/* ---- calendar cut-in (#7) ---- */
A.showCutin = () => { if (!K.calendar.signedIn) return toast("Google カレンダーにサインインすると、会議の直前にカードが出ます"); S.cutin = true; renderCutin(); };
function renderCutin() {
  let el = $("#cutin");
  if (!S.cutin || !K.calendar.signedIn) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "cutin"; el.className = "cutin"; $("#win").appendChild(el); }
  const e = K.calendar.events.find((x) => x.inMin >= 0);
  el.innerHTML = `<div class="stack-s"><div class="meta">Google カレンダー · ${esc(e.start)} · あと ${e.inMin} 分</div><h2>${esc(e.title || "（タイトルなし）")}</h2>
    <div class="hrow">${e.url ? `<button class="btn primary" data-act="cutJoin">参加して録音</button>` : ""}<button class="btn" data-act="cutRec">録音を開始</button><span class="grow"></span><button class="btn" data-act="cutClose">閉じる</button></div></div>`;
}
const nextEvent = () => K.calendar.events.find((x) => x.inMin >= 0);
A.cutJoin = () => { S.cutin = false; S.fromEvent = nextEvent(); start("meeting"); toast("会議の URL を開きました"); };
A.cutRec = () => { S.cutin = false; S.fromEvent = nextEvent(); start("meeting"); };
A.cutClose = () => { S.cutin = false; renderCutin(); };
A.calSignIn = () => {
  confirmOut("calendar", "Google にサインインし、カレンダーの予定（タイトル・時刻・会議 URL）を読みます。音声と文字起こしは送りません。", () => {
    S.cal.signing = true; render();
    S.cal.t = setTimeout(() => { S.cal.signing = false; K.calendar.signedIn = "you@example.com"; logOut("カレンダー", "予定を読み込み（3 件）"); render(); toast("サインインしました"); }, 1500);

setInterval(() => {
  let cur = S.queue.find((q) => q.state === "running");
  if (!cur) { cur = S.queue.find((q) => q.state === "pending"); if (!cur) return; cur.state = "running"; }
  cur.progress = Math.min(1, cur.progress + 0.04);
  if (cur.progress >= 1) {
    cur.state = "done";
    const grp = cur.joinGroup && S.queue.filter((q) => q.joinGroup === cur.joinGroup);

/* ---- post-processing pipeline + Obsidian (persona: ~90 meetings/month) ---- */

function mkUtt(id, lane, spk, start, end, text, tr) { const units = text.split("|"); return { id, lane, spk, start, end, text: units.join(""), units, tr, reviewed: false }; }
function nowStamp() { const d = new Date(); return `2026-11-17 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function notePath(rec) { return `${OB.folder}/${OB.fileName.replace("{date}", rec.date.slice(0, 10)).replace("{title}", rec.title).replace("{month}", rec.date.slice(0, 7))}`; }
function noteState(rec) { return !rec.note ? "none" : rec.note.state; }
const NOTE_LABEL = { none: "未書き出し", fresh: "最新", stale: "古い" };
const NOTE_CHIP = { none: "", fresh: "ok", stale: "warn" };
function noteChip(rec) { return `<span class="chip ${NOTE_CHIP[noteState(rec)]}">ノート: ${NOTE_LABEL[noteState(rec)]}</span>`; }
function writeNote(rec) { rec.note = { path: rec.note ? rec.note.path : notePath(rec), state: "fresh" }; rec.status = "exported"; }
function markEdited(rec) { if (rec.note && rec.note.state === "fresh") rec.note.state = "stale"; }

function minutesFor(rec) {
  const u = rec.utterances;
  return { summary: [{ text: u[0] ? u[0].text : rec.title, ev: u[0] ? [u[0].id] : [] }], decisions: [], actions: [], open: u[1] ? [{ text: u[1].text, ev: [u[1].id] }] : [],
    revision: 1, generated: nowStamp(), model: K.models.find((m) => m.id === ST.mt).name };
}
/* one stage forward; done() after it lands */
function stepRec(rec, done) {
  const st = rec.status;
  if (S.busy[rec.id] != null) { if (done) setTimeout(() => stepRec(rec, done), 300); return; }
  if (st === "exported") { if (done) done(); return; }
  S.busy[rec.id] = 0; render();
  const t = setInterval(() => {
    S.busy[rec.id] = Math.min(1, S.busy[rec.id] + 0.25);
    if (S.busy[rec.id] >= 1) {
      clearInterval(t); delete S.busy[rec.id];
      if (st === "recorded") { rec.utterances = [mkUtt(rec.id + "a", rec.lanes[0], null, 1000, 5000, "では|始めます。", "Let's begin."), mkUtt(rec.id + "b", rec.lanes[1] || rec.lanes[0], null, 5500, 9000, "よろしく|お願いします。", "Nice to meet you.")]; rec.status = "transcribed"; }
      else if (st === "transcribed") { diarizeRec(rec); }
      else if (st === "diarized") { rec.minutes = rec.minutes || minutesFor(rec); rec.status = "minutes"; if (OB.autoExport === "minutes") writeNote(rec); }
      else if (st === "minutes") writeNote(rec);
      render(); if (done) done();
    }
    else render();
  }, 220);
}
function diarizeRec(rec) {
  rec.diarized = true;
  if (!Object.keys(rec.speakers).length) rec.speakers = { S1: { name: "自分", auto: "SPEAKER_00" }, S2: { name: "", auto: "SPEAKER_01" } };
  rec.utterances.forEach((u, i) => { if (!u.spk) u.spk = u.lane === "Me" && i % 2 === 0 ? "S1" : "S2"; });
  if (rec.status === "transcribed" || rec.status === "recorded") rec.status = "diarized";
}
/* run every remaining stage for one meeting, or all unfinished meetings in order */
function finishRec(rec, done) { if (rec.status === "exported") return done && done(); stepRec(rec, () => finishRec(rec, done)); }
function finishAll(list, done) {
  const q = list.filter((r) => r.status !== "exported");
  S.bulk = q.length; render();
  const next = () => { const r = q.shift(); if (!r) { S.bulk = 0; render(); toast("残りの処理が終わりました"); if (done) done(); return; } finishRec(r, next); };
  next();
}
A.step = (d) => stepRec(recById(d.id));
A.finish = (d) => finishRec(recById(d.id));
A.finishAll = () => finishAll(K.recordings.filter((r) => r.status !== "exported"));
A.writeNote = (d) => { const r = recById(d.id || S.rec.id); writeNote(r); render(); toast(`${r.note.path} に書き出しました`); };
A.staleAll = () => { const xs = K.recordings.filter((r) => noteState(r) === "stale"); xs.forEach(writeNote); render(); toast(`古いノート ${xs.length} 件を書き出し直しました`); };
A.openNote = (d) => { const r = recById(d.id || S.rec.id); toast(`Obsidian で ${r.note.path} を開きます`); };

/* status row used by the detail screen of every variant */
function pipelineHtml(rec) {
  const i = STAGES.indexOf(rec.status);
  return `<div class="hrow">${STAGES.map((s, k) => `<span class="${k <= i ? "" : "muted"}">${k <= i ? "✓ " : ""}${K.STATUS[s]}</span>${k < 4 ? `<span class="meta">→</span>` : ""}`).join("")}
    <span class="grow"></span>${S.busy[rec.id] != null ? `<span class="meta">${BUSY[rec.status]} ${Math.round(S.busy[rec.id] * 100)}%</span>`
      : rec.status === "exported" ? noteChip(rec) + (noteState(rec) === "stale" ? `<button class="btn sm" data-act="writeNote" data-id="${rec.id}">書き出し直す</button>` : "")
      : `<button class="btn sm" data-act="step" data-id="${rec.id}">${NEXT[rec.status]}</button><button class="btn sm ghost" data-act="finish" data-id="${rec.id}">最後まで</button>`}</div>`;
}

/* a 90-a-month library: grouped by day, filter by status, rendered in pages */
S.lib = { filter: "all", limit: 6 };
function dayOf(r) { return r.date.slice(0, 10); }
function groupByDay(list) { const g = []; list.forEach((r) => { const d = dayOf(r); if (!g.length || g[g.length - 1][0] !== d) g.push([d, []]); g[g.length - 1][1].push(r); }); return g; }
function sortedRecs() { return K.recordings.slice().sort((a, b) => b.date.localeCompare(a.date)); }
function filteredRecs() {
  const f = S.lib.filter;
  return sortedRecs().filter((r) => f === "all" || (f === "open" ? r.status !== "exported" || noteState(r) === "stale" : r.status === f));
}
function libFilterHtml() {
  const open = K.recordings.filter((r) => r.status !== "exported" || noteState(r) === "stale").length;
  return `<div class="seg"><button class="${S.lib.filter === "all" ? "sel" : ""}" data-act="libFilter" data-f="all">すべて ${K.recordings.length}</button><button class="${S.lib.filter === "open" ? "sel" : ""}" data-act="libFilter" data-f="open">未完了 ${open}</button></div>
    <select class="input" data-chg="libStatus"><option value="">状態で絞り込み</option>${STAGES.map((s) => `<option value="${s}" ${S.lib.filter === s ? "selected" : ""}>${K.STATUS[s]}</option>`).join("")}</select>`;
}
A.libFilter = (d) => { S.lib.filter = d.f; S.lib.limit = 6; render(); };
C.libStatus = (el) => { S.lib.filter = el.value || "all"; S.lib.limit = 6; render(); };
A.libMore = () => { S.lib.limit += 8; render(); };
function libRow(r) {
  return `<div class="row hrow" data-act="openRec" data-id="${r.id}"><span class="num meta" style="width:40px">${r.date.slice(11)}</span><span class="grow">${esc(r.title)} <span class="meta">· ${K.mmss(r.durationMs)} · ${srcLabel(r.source)}</span></span>
    ${S.busy[r.id] != null ? `<span class="meta">${BUSY[r.status]}</span>` : `<span class="chip ${r.status === "exported" ? NOTE_CHIP[noteState(r)] : ""}">${r.status === "exported" ? "ノート: " + NOTE_LABEL[noteState(r)] : K.STATUS[r.status]}</span>`}</div>`;
}
V.recs = () => {
  const groups = groupByDay(filteredRecs()), shown = groups.slice(0, S.lib.limit);
  return `<div class="stack"><div class="hrow"><h1 class="grow">録音</h1>${libFilterHtml()}<button class="btn" data-act="go" data-v="import">音声を取り込む…</button></div>
  ${shown.length ? shown.map(([d, rs]) => `<div><div class="sec-title">${d} <span class="meta">${rs.length} 件</span></div>${rs.map(libRow).join("")}</div>`).join("") : `<div class="muted">まだ録音はありません。</div>`}
  ${groups.length > shown.length ? `<button class="btn" data-act="libMore">さらに表示（残り ${groups.length - shown.length} 日）</button>` : ""}</div>`;
};

/* Obsidian settings card */
function obsidianHtml() {
  return `<div class="field"><label>保管庫</label><span class="mono">${esc(OB.vault)}</span><button class="btn sm" data-act="obVault">変更…</button></div>
  <div class="field"><label>フォルダ / ファイル名</label><input class="input" style="width:110px" value="${esc(OB.folder)}" data-chg="ob" data-k="folder"><input class="input grow" value="${esc(OB.fileName)}" data-chg="ob" data-k="fileName"></div>
  <div class="field"><label>自動で書き出す</label><select class="input" data-chg="ob" data-k="autoExport"><option value="minutes" ${OB.autoExport === "minutes" ? "selected" : ""}>議事録ができたら</option><option value="off" ${OB.autoExport === "off" ? "selected" : ""}>しない（手動のみ）</option></select></div>
  ${toggle(OB.includeTranscript, "obTr", "文字起こしを含める")}${toggle(OB.includeTranslation, "obTl", "訳文を含める")}
  <div class="field"><label>frontmatter</label><span class="meta">${OB.frontmatter.join(", ")} · tags: ${OB.tags.join(", ")}</span></div>`;
}
C.ob = (el) => { OB[el.dataset.k] = el.value; render(); };
A.obTr = () => { OB.includeTranscript = !OB.includeTranscript; render(); };
A.obTl = () => { OB.includeTranslation = !OB.includeTranslation; render(); };
A.obVault = () => { OB.vault = OB.vault === "~/Obsidian/Work" ? "~/Obsidian/Personal" : "~/Obsidian/Work"; render(); toast(`保管庫: ${OB.vault}`); };

/* live session → a new recording that enters the pipeline */
function recFromLive(lines, mode) {
  const ev = S.fromEvent, n = K.recordings.length + 1;
  const rec = { id: "n" + n, title: ev ? ev.title : (mode === "face" ? "対面の会議" : "会議") + " " + nowStamp().slice(11), date: nowStamp(), durationMs: Math.max(60000, Date.now() - S.t0), source: mode === "face" ? "face" : "meeting",
    lanes: mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null,
    utterances: lines.filter((l) => l.done).map((l, i) => mkUtt(`n${n}-${i}`, l.lane, null, l.at, l.at + 4000, l.committed.split(/(?<=\s)/).join("|"), l.tr)) };
  if (!rec.utterances.length) rec.utterances = [mkUtt(`n${n}-0`, "Me", null, 1000, 4000, "（無音）", "")];
  S.fromEvent = null; return rec;
}
/* ===== 30 vault-sync: the library is the Obsidian vault's folder tree; each meeting is a note with a state ===== */
OB.fileName = "{month}/{date} {title}.md";
K.recordings.forEach((r) => { if (r.note) r.note.path = notePath(r); });
S.back = "vault"; S.backLabel = "保管庫";
S.sel = "r1"; S.open = { unexp: true, root: true, meet: true, "2026-11": true }; S.tf = "all";
const vaultName = () => OB.vault.split("/").pop();

HOOK.nav = () => {
  const rs = K.recordings, fresh = rs.filter((r) => noteState(r) === "fresh").length, stale = rs.filter((r) => noteState(r) === "stale").length, none = rs.filter((r) => !r.note).length;
  const b = (v, l) => `<button class="btn ${S.view === v || (v === "settings" && S.view === "eval") ? "sel" : ""}" data-act="go" data-v="${v}">${l}</button>`;
  return `${b("vault", "保管庫")}<button class="btn sm ghost mono" data-act="obVault">${esc(OB.vault)}</button>
    <span class="meta"><span class="okc">●</span> 最新 ${fresh} · <span class="warn">●</span> 古い ${stale} · ○ 未書き出し ${none}</span>
    <span class="sp"></span>
    ${S.session === "idle" ? `<button class="btn rec" data-act="startMeeting">● 会議を録音</button><button class="btn" data-act="startFace">対面</button>`
      : `<button class="btn ${S.view === "session" ? "sel" : ""}" data-act="go" data-v="session"><span class="dot-rec"></span> ${sessionLabel()}</button>`}
    ${b("search", "検索")}${b("import", "取り込み")}${b("settings", "設定")}`;
};
HOOK.after = () => $("#main").classList.toggle("vaultmain", S.view === "vault");

/* ---- tree ---- */
const mark = (r) => r.note ? (r.note.state === "fresh" ? `<span class="okc">●</span>` : `<span class="warn">●</span>`) : `<span class="muted">○</span>`;
function fileRow(r, cls) {
  const name = r.note ? r.note.path.split("/").pop() : `${r.date.slice(0, 10)} ${r.title}`;
  return `<div class="row ${cls} ${S.sel === r.id ? "sel" : ""}" data-act="pick" data-id="${r.id}" title="${esc(name)}">${mark(r)}<span class="f ${r.note ? "" : "muted"}">${esc(name)}</span>
    ${S.busy[r.id] != null ? `<span class="meta">${Math.round(S.busy[r.id] * 100)}%</span>` : r.note ? "" : `<span class="meta">${K.STATUS[r.status]}</span>`}</div>`;
}
function folderRow(key, label, n, cls) { return `<div class="row ${cls}" data-act="fold" data-k="${key}"><span class="meta">${S.open[key] ? "▾" : "▸"}</span><span class="f">${esc(label)}</span><span class="meta num">${n}</span></div>`; }
A.fold = (d) => { S.open[d.k] = !S.open[d.k]; render(); };
A.pick = (d) => { S.sel = d.id; render(); };
A.tf = (d) => { S.tf = d.f; render(); };
function treeHtml() {
  const recs = sortedRecs().filter((r) => S.tf === "all" || !r.note || r.note.state === "stale");
  const unexp = recs.filter((r) => !r.note), months = {};
  recs.filter((r) => r.note).forEach((r) => { const m = r.note.path.split("/")[1]; (months[m] = months[m] || []).push(r); });
  const mkeys = Object.keys(months).sort().reverse();
  return `<div class="hrow" style="padding:4px 8px 8px"><div class="seg"><button class="${S.tf === "all" ? "sel" : ""}" data-act="tf" data-f="all">すべて</button><button class="${S.tf === "todo" ? "sel" : ""}" data-act="tf" data-f="todo">要対応</button></div>
      <span class="grow"></span>${unexp.length ? `<button class="btn sm" data-act="finishAll">未書き出しを処理</button>` : ""}</div>
    ${folderRow("unexp", "保管庫にまだ無い", unexp.length, "")}${S.open.unexp ? unexp.map((r) => fileRow(r, "ind1")).join("") : ""}
    <div class="sep"></div>
    ${folderRow("root", vaultName(), recs.filter((r) => r.note).length, "")}
    ${S.open.root ? folderRow("meet", OB.folder, recs.filter((r) => r.note).length, "ind1") : ""}
    ${S.open.root && S.open.meet ? mkeys.map((m) => folderRow(m, m, months[m].length, "ind1") + (S.open[m] ? months[m].map((r) => fileRow(r, "ind2")).join("") : "")).join("") : ""}`;
}

/* ---- note preview ---- */
function mdHtml(md) {
  const parts = md.split("\n"), fm = [], body = []; let i = 0;
  if (parts[0] === "---") { i = 1; while (i < parts.length && parts[i] !== "---") fm.push(parts[i++]); i++; }
  let inList = false;
  for (; i < parts.length; i++) {
    const l = parts[i];
    if (/^\s*- /.test(l)) { if (!inList) { body.push("<ul>"); inList = true; } body.push(`<li>${esc(l.replace(/^\s*- /, "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`); continue; }
    if (inList) { body.push("</ul>"); inList = false; }
    if (l.startsWith("## ")) body.push(`<h2>${esc(l.slice(3))}</h2>`); else if (l.startsWith("# ")) body.push(`<h1>${esc(l.slice(2))}</h1>`); else if (l.trim()) body.push(`<div>${esc(l)}</div>`);
  }
  if (inList) body.push("</ul>");
  return `<div class="fm">${fm.map((l) => { const k = l.indexOf(":"); return `<span class="muted">${esc(l.slice(0, k))}</span><span class="mono">${esc(l.slice(k + 1).trim())}</span>`; }).join("")}</div><div class="md">${body.join("")}</div>`;
}
function noteHtml() {
  const r = recById(S.sel); if (!r) return `<div class="muted">左のツリーから会議を選んでください。</div>`;
  const st = noteState(r), path = `${vaultName()}/${r.note ? r.note.path : notePath(r)}`;
  const head = `<div class="hrow"><span class="mono meta grow">${esc(path)}</span>${noteChip(r)}</div>
    <div class="hrow"><h1 class="grow">${esc(r.title)}</h1>
      ${r.note ? `<button class="btn" data-act="openNote" data-id="${r.id}">Obsidian で開く</button>` : ""}
      <button class="btn" data-act="openRec" data-id="${r.id}">アプリで開く</button><button class="btn" data-act="vaultExport">ほかの形式…</button></div>
    <div class="meta">${esc(r.date)} · ${K.mmss(r.durationMs)} · ${srcLabel(r.source)}${r.importedFrom ? " · " + esc(r.importedFrom) : ""}</div>`;
  if (!r.utterances.length || r.status !== "exported" && !r.note) {
    const pending = !r.utterances.length;
    return `<div class="stack">${head}${pipelineHtml(r)}
      ${pending ? `<div class="notice info"><span class="grow">まだ文字起こししていないため、ノートを作れません。</span><button class="btn sm primary" data-act="finish" data-id="${r.id}">ノートまで仕上げる</button></div>`
        : `<div class="notice info"><span class="grow">まだ保管庫にありません。書き出すと ${esc(path)} に作成します。</span><button class="btn sm primary" data-act="writeNote" data-id="${r.id}">書き出す</button></div>`}
      ${pending ? "" : `<div class="meta">書き出したときのノート</div>${mdHtml(K.exportText(r, "obsidian"))}`}</div>`;
  }
  return `<div class="stack">${head}
    ${st === "stale" ? `<div class="notice"><span class="grow">アプリ側で変更があります（話者名・校閲・議事録の版）。書き出し直すと保管庫のノートを上書きします。</span><button class="btn sm primary" data-act="writeNote" data-id="${r.id}">書き出し直す</button></div>`
      : `<div class="meta">保管庫のノートと一致しています${OB.autoExport === "minutes" ? " · 議事録ができたら自動で書き出し" : ""}</div>`}
    ${mdHtml(K.exportText(r, "obsidian"))}</div>`;
}
A.vaultExport = () => { S.rec = recById(S.sel); S.player = K.player(S.rec, onTick); S.exp = "md"; drawExport(); };

V.vault = () => `<div class="vault"><div class="tree">${treeHtml()}</div><div class="note">${noteHtml()}</div></div>`;
S.view = "vault";
render();
</script>
</body>
</html>
