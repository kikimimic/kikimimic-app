"why": "設定を詰める人向け（使い始めと、モデル・連携・Obsidian の運用を見直す後日）。設定は言語・モデル・辞書・自動録音・カレンダー・Obsidian・Web・評価と増え続けるので、1 列に並べると探せない。分類して左に並べ、名前で絞り込めれば、目当ての設定に 1〜2 クリックで届く",
"tradeoff": "設定以外は従来どおりで、録音・ライブの画面には新しい工夫が無い。設定の項目を見渡すには左のセクションを順に開く必要がある。評価（開発者向け）は「詳細」の奥にあり、通常は見えない"
},
"27-import-first": {
"concept": "ライブラリの上にドロップ領域と取り込みキュー表。取り込み中のファイルも録音と同じ一覧に並び、落とせば議事録・Obsidian まで仕上がる",
"why": "対面やオフラインの会議を IC レコーダー・ボイスメモで録り、あとで持ち込む人向け（会議の直後〜その日の終わり）。外部の音声を自分の録音と同じ場所で扱い、ドロップ 1 回で文字起こし→話者→議事録→Obsidian まで進めば、後処理がどこで止まっているかも一覧で分かる",
"tradeoff": "ライブ録音の入口は右上の小さな「● 録音 ▾」に退く。タブが無いので、モデルと設定はシートで開く。取り込みが少ない日は上の領域が場所を取る（キュー表は折りたためる）"
},
"28-pipeline-board": {
"concept": "起動画面が「録音済み → 文字起こし → 話者 → 議事録 → Obsidian 済み」の段階列を持つボード。会議カードが右へ進む",
"why": "月 90 件（1 日 4〜5 件）の会議をさばく主ユーザーが、会議の直後や夕方にまとめて後処理するとき。件数が多いと一番の関心事は「どれがまだ終わっていないか」なので、段階ごとに並べれば取りこぼさず、残りは 1 クリックでまとめて流せる",
"tradeoff": "会議の中身（本文・議事録）を読むにはカードを開く必要がある。終わった会議は右端の列に件数だけ畳まれ、過去を眺める用途は一覧へ回る"
},
"29-privacy-first": {
"concept": "どの画面でも上端に「ローカルのみ / カレンダー / Web」の境界が出て、外に出る操作は必ず中身を見せて確認する",
"why": "機密の会議（人事・顧客・未公開情報）を扱う人が、会議の前後どの場面でも「いま何が外に出るか」を一目で確かめたい。境界が常に見え、外に出る瞬間だけ確認が挟まれば、安心して録音・質問・検索を使える",
"tradeoff": "全画面で表示が 1 行増え、本文の縦幅が減る。カレンダー接続や Web 調べものは毎回の確認で 1 手間増える"
},
"30-vault-sync": {
"concept": "録音一覧が Obsidian 保管庫のフォルダツリーと同じ形。各会議にノートの状態（未書き出し / 最新 / 古い）とノートのプレビュー",
"why": "文字起こしと議事録を Obsidian の Markdown で管理している主ユーザーが、会議の直後と後日に使う。最終的な置き場は Obsidian なので、Kikimimic は「保管庫に良いノートを置く装置」と割り切り、保管庫と同じ形で並べてノートの状態を見せれば、何を書き出し・更新すべきかが迷わず分かる",
"tradeoff": "アプリ内で読む・直す体験は簡素（本文の編集は「アプリで開く」の奥）。保管庫の外にある録音は「保管庫にまだ無い」の 1 か所にまとまる"
}

const groups = [
  ["統合案（30 案へのフィードバックから）", ["31-synthesis"]],
  ["上タブ（現行の延長）", ["01-tabs-classic", "02-tabs-inspector", "03-tabs-modes", "04-tabs-three", "05-tabs-toolbar"]],
  ["サイドバー・パレット", ["06-sidebar-mail", "07-sidebar-sections", "08-sidebar-dated", "09-sidebar-rail", "10-palette"]],
  ["入口から設計", ["11-home-today", "12-home-search", "13-calendar-first", "14-document", "15-ask-first"]],
  ["ライブ中", ["16-live-columns", "17-live-stream", "18-live-overlay", "19-menubar-first", "20-live-statusbar"]],
  ["振り返り・校閲", ["21-review-queue", "22-speaker-centric", "23-subtitle-editor", "24-word-reader", "25-export-preview"]],
  ["設定・取り込み・後処理", ["26-settings-sidebar", "27-import-first", "28-pipeline-board", "29-privacy-first", "30-vault-sync"]],
];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const root = document.getElementById("groups");
for (const [title, slugs] of groups) {
  root.insertAdjacentHTML("beforeend", `<h2>${title}</h2><div class="grid">${slugs.map((slug) => { const m = META[slug] || {};
    return `<a href="${slug}.html"><div class="card"><div class="no">${slug.slice(0, 2)} · ${slug.slice(3)}</div><h3>${esc(m.concept)}</h3>
      <div class="meta"><b>理由</b> ${esc(m.why)}</div><div class="meta"><b>捨てるもの</b> ${esc(m.tradeoff)}</div></div></a>`; }).join("")}</div>`);
}
</script>
