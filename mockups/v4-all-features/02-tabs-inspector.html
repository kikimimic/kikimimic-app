<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>02 上タブ＋右インスペクタ — Kikimimic v4</title>
<meta name="kkm-concept" content="上タブ。録音詳細は本文＋右インスペクタ（要点・話者・統計・質問・字幕と書き出しをアコーディオンで）">
<meta name="kkm-why" content="会議の直後に内容を確かめる人向け。本文を読みながら横で要点・話者・質問を見たいので、詳細を2カラムにし、停止したらそのまま録音詳細を開く。">
<meta name="kkm-tradeoff" content="横幅が狭いと本文が詰まる。インスペクタの項目は開閉が必要で、同時にすべては見られない。">
<link rel="stylesheet" href="shared/kit.css">
<style>
/* layout only — colors come from kit.css */
.tabs { display: flex; gap: 6px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }
.hstack { display: flex; gap: 8px; align-items: center; }
.hstack.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 10px; } .mt2 { margin-top: 24px; } .foot { margin-top: 16px; }
.narrow { max-width: 760px; margin: 0 auto; }
.mb-l { margin-right: auto; }
[data-act] { cursor: pointer; }
.lane-Me { color: var(--lane-me); } .lane-Them { color: var(--lane-them); } .lane-Imported { color: var(--muted-2); }
.bar > i.lane-bg-Me { background: var(--lane-me); } .bar > i.lane-bg-Them { background: var(--lane-them); }
.w40 { width: 40px; text-align: right; } .w60 { width: 60px; } .w120 { width: 120px; }
.pbar { padding: 8px 14px; border-top: 1px solid var(--border); flex: 0 0 auto; }
.seek { height: 8px; }
.pre { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; max-height: 320px; overflow: auto; white-space: pre-wrap; margin: 10px 0 0; }
.sheet.wide { max-width: 760px; }
.tbl { border-collapse: collapse; width: 100%; }
.tbl td { padding: 4px 8px; border-bottom: 1px solid var(--border); } .tbl td.r { text-align: right; }
.field { display: flex; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.field .ctrl { flex: 0 1 auto; max-width: 62%; }
.sub { padding: 6px 0 10px; }
.mrow { padding: 8px 0; border-bottom: 1px solid var(--border); }
.list { margin: 6px 0 0; padding-left: 20px; } .list li { margin: 4px 0; }
.quote { font-size: 13px; color: var(--muted-2); }
.qa-q { font-weight: 600; }
.bound { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.evgrid { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; align-items: center; }
.cut-title { margin: 6px 0 12px; }
.lic { max-height: 200px; overflow: auto; }
.qrow { padding: 8px 10px; }
.diar { min-width: 280px; }
.adv-d { margin-top: 24px; } .adv-d summary { padding: 8px 0; cursor: pointer; }
.utt.focus { background: var(--bg-subtle); }
.about { position: fixed; right: 10px; bottom: 8px; z-index: 100; }
.srch { width: 100%; min-height: 34px; }
.dayh { position: sticky; top: -16px; background: var(--bg); padding: 10px 8px 4px; z-index: 1; }
.lrow { padding: 5px 8px; } .lrow .st { min-width: 210px; justify-content: flex-end; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe { gap: 6px; }
.pipe.col { align-items: flex-start; }

/* 02 */
.dhead { padding: 10px 14px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.split { flex: 1; min-height: 0; display: flex; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.body .pbar { border-top: 0; border-bottom: 1px solid var(--border); }
.insp { width: 340px; flex: 0 0 340px; border-left: 1px solid var(--border); overflow-y: auto; padding: 0 14px 14px; }
.insp details { border-bottom: 1px solid var(--border); padding: 10px 0; }
.insp summary { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; list-style: none; }
.insp summary::before { content: "›"; color: var(--muted); width: 10px; } .insp details[open] > summary::before { content: "⌄"; }
.acc-b { padding-top: 8px; } .spk-row { margin: 4px 0; } .insp .bound { grid-template-columns: 1fr; } .insp .adv .hstack { flex-wrap: wrap; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 02 上タブ＋右インスペクタ</div>
<button class="btn sm ghost about" data-act="about">この案について</button>
<div class="win" id="win">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="menubar" id="menubar"></div>
  <div class="tabs" id="tabs"></div>
  <div class="main" id="main"></div>
  <div id="cutin"></div>
  <div id="overlay"></div>
</div>
<script src="shared/data.js"></script>
<script>
"use strict";
/* ===== Common: helpers, state, overlays ===== */
const K = window.KKM, S = K.settings;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const win = $("#win");
const SRC = { meeting: "会議", face: "対面", import: "取り込み" };
const KIND = { asr: "文字起こしモデル", mt: "翻訳モデル", diar: "話者分離モデル" };
const SPLIT = /(?<=\s)|(?<=[、。])/;
const p2 = (n) => String(n).padStart(2, "0");
const TODAY = "2026-11-17"; // the mock's "today" (matches data.js)
const nowStr = () => { const d = new Date(); return `${TODAY} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const recById = (id) => K.recordings.find((r) => r.id === id);
const sec1 = (ms) => (ms / 1000).toFixed(1) + " 秒";
const pct = (x) => Math.round(x * 100) + "%";
const toggleHtml = (on, act, extra = "") => `<button class="toggle ${on ? "on" : ""}" data-act="${act}" ${extra}></button>`;

const ui = { tab: "session", recId: null, focusU: null, q: "", qa: {}, dirty: {}, cues: {}, diar: {}, join: true, sheetFn: null, proc: {}, lf: "all" };
const ses = { n: 0, mode: null, phase: "idle", lines: [], engine: null, notice: null, saveFace: S.saveFaceToFace, adv: null, lastRec: null };
const cal = { signedIn: K.calendar.signedIn, signing: false, cutin: null, left: 0 };
const auto = { state: S.autoRecord ? "waiting" : "off", left: 0 };
let player = null, playerRec = null, wordEls = [];

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; win.appendChild(t); setTimeout(() => t.remove(), 2400); }
function openSheet(fn, wide) { ui.sheetFn = fn; $("#overlay").innerHTML = `<div class="scrim" id="scrim"><div class="sheet${wide ? " wide" : ""}" id="sheet"></div></div>`; refreshSheet(); }
function refreshSheet() { const s = $("#sheet"); if (s && ui.sheetFn) s.innerHTML = ui.sheetFn(); }
function closeSheet() { ui.sheetFn = null; $("#overlay").innerHTML = ""; }
const sheetFoot = (inner) => `<div class="hstack foot"><span class="grow"></span>${inner}</div>`;
function openMenu(anchor, items) {
  closeMenu();
  const wr = win.getBoundingClientRect(), r = anchor.getBoundingClientRect();
  const m = document.createElement("div"); m.className = "menu"; m.id = "menu";
  m.innerHTML = items.map((it) => it.sep ? '<div class="sep"></div>'
    : `<button ${it.disabled ? "disabled" : ""} data-act="${it.act || ""}" ${Object.entries(it.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(it.label)}</button>`).join("");
  m.style.top = (r.bottom - wr.top + 4) + "px";
  m.style.left = Math.max(4, Math.min(r.left - wr.left, wr.width - 230)) + "px";
  win.appendChild(m);
}
function closeMenu() { $("#menu")?.remove(); }

const ACT = {}, CHG = {};
document.addEventListener("click", (e) => {
  if (e.target.id === "scrim") { closeSheet(); return; }
  const t = e.target.closest("[data-act]");
  const m = $("#menu"); if (m && (!m.contains(e.target) || t)) m.remove();
  if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener("change", (e) => { const c = e.target.dataset.change; if (c && CHG[c]) CHG[c](e.target); });
document.addEventListener("input", (e) => { if (e.target.id === "q") { ui.q = e.target.value; const r = $("#results"); if (r) r.innerHTML = resultsHtml(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.enter && !e.isComposing) ACT[e.target.dataset.enter]?.(e.target, e); });

/* ===== Render loop ===== */
function render() {
  renderMenubar();
  const keep = {}; $$("#main [id].keep").forEach((el) => { keep[el.id] = el.scrollTop; });
  $("#tabs").innerHTML = tabsHtml();
  $("#main").innerHTML = VIEWS[ui.tab]();
  Object.entries(keep).forEach(([id, top]) => { const el = document.getElementById(id); if (el) el.scrollTop = top; });
  afterRender();
}
function afterRender() {
  const rec = ui.tab === "recordings" && ui.recId ? recById(ui.recId) : null;
  if (rec) { ensurePlayer(rec); wordEls = $$("#main .w[data-s]").map((el) => ({ el, s: +el.dataset.s, e: +el.dataset.e })); paintPlayer(player.pos, player.playing); }
  else if (player && player.playing) player.pause();
}
function statusText() { return ses.phase === "rec" ? "聞き取り中" : ses.phase === "finishing" ? "翻訳を仕上げています…" : "待機中"; }
function elapsedText() { return ses.phase === "rec" && ses.engine ? K.mmss(ses.engine.elapsed()) : ""; }

/* ===== Menu bar status item (#18) ===== */
function menubarLabel() {
  if (ses.phase === "rec") return `● ${auto.state === "recording" ? "自動録音中" : "録音中"} ${elapsedText()}`;
  if (auto.state === "ending") return `● 自動停止まで ${auto.left} 秒`;
  if (ses.phase === "finishing") return "仕上げ中…";
  return { waiting: "自動録音: 待機中", error: "自動録音: エラー", suppressed: "自動録音: この会議は停止済み" }[auto.state] || "Kikimimic";
}
function renderMenubar() {
  $("#menubar").innerHTML = `<span class="meta mb-l">メニューバー</span><button class="btn sm ghost ${ses.phase === "rec" ? "err" : ""}" data-act="mb-menu">${esc(menubarLabel())}</button><span class="num">11:28</span>`;
}
ACT["mb-menu"] = (t) => openMenu(t, [
  { label: `状態: ${statusText()}`, disabled: true },
  { label: `自動録音: ${autoLabel()}`, disabled: true },
  { sep: true },
  ses.phase === "rec" ? { label: "■ 停止", act: "stop" } : { label: "● 会議を録音", act: "start", data: { mode: "meeting" } },
  { label: S.autoRecord ? "自動録音をオフにする" : "自動録音をオンにする", act: "auto-toggle" },
  { label: "ウィンドウを開く", act: "tab", data: { k: "session" } },
]);

/* ===== Session (#1 #2 #3 #16 #17) ===== */
function startSession(mode, opts = {}) {
  if (ses.phase !== "idle") return;
  if (S.clearOnStart) ses.lines = [];
  ses.n++; ses.mode = mode; ses.phase = "rec"; ses.notice = null; ses.lastRec = null;
  ses.adv = { pending: [], shown: [], seen: new Set(), muted: new Set(), stopped: false };
  if (!opts.auto && auto.state === "suppressed") auto.state = S.autoRecord ? "waiting" : "off";
  ses.engine = K.live(mode === "face" ? "face" : "meeting", onLive);
  cal.cutin = null; renderCutin();
  ui.tab = "session"; render();
}
function stopSession(reason) {
  if (ses.phase !== "rec") return;
  ses.engine.stop(); ses.phase = "finishing";
  if (reason === "manual" && (auto.state === "recording" || auto.state === "ending")) auto.state = "suppressed";
  render();
  setTimeout(() => {
    const mode = ses.mode;
    ses.lines.forEach((l) => { l.translating = false; });
    ses.phase = "idle"; ses.mode = null;
    keepSession(mode);
    if (auto.state === "recording" || auto.state === "ending") auto.state = "waiting";
    afterStop();
    render();
  }, 1600);
}
function keepSession(mode) {
  if (mode === "face" && !ses.saveFace) { toast("対面モードは「保存しない」設定のため、録音を残していません"); return; }
  const done = ses.lines.filter((l) => l.done && l.n === ses.n);
  if (!done.length) return;
  const id = "n" + Date.now();
  const rec = { id, title: "（タイトルなし）", date: nowStr(), durationMs: done[done.length - 1].at + 5000, source: mode, lanes: mode === "face" ? ["Me"] : ["Me", "Them"],
    speakers: {}, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null,
    utterances: done.map((l, i) => ({ id: id + "-" + l.id, lane: l.lane, spk: null, start: l.at, end: done[i + 1] ? done[i + 1].at - 200 : l.at + 4000, text: l.committed, units: l.committed.split(SPLIT), tr: l.tr || null, reviewed: false })) };
  K.recordings.unshift(rec); ses.lastRec = id;
  toast("録音一覧に保存しました");
}
function onLive(ev) {
  const key = (id) => ses.n + "-" + id;
  if (ev.type === "advisor") { advOffer(ev.card, key(ev.card.ev[0])); return; }
  if (ev.type === "question") { if (ses.mode === "meeting" && !ses.notice) { ses.notice = { kind: "ask", detected: ev.detected, capturing: ev.capturing }; if (ui.tab === "session") render(); } return; }
  if (ev.type === "line") ses.lines.push({ id: key(ev.id), n: ses.n, lane: ev.lane, at: ev.at, committed: "", volatile: "", tr: "", translating: false });
  const l = ses.lines.find((x) => x.id === key(ev.id)); if (!l) return;
  const translates = S.translateInto !== "none" && (l.lane !== "Me" || S.mutual);
  if (ev.type === "update") { l.committed = ev.committed; l.volatile = ev.volatile; }
  if (ev.type === "commit") { l.committed = ev.text; l.volatile = ""; l.done = true; }
  if (ev.type === "translating" && translates) l.translating = true;
  if (ev.type === "translate" && translates) { l.translating = false; l.tr = ev.text; }
  paintLine(l);
}
function paintLine(l) {
  if (ui.tab !== "session") return;
  const box = $("#live"); if (!box) return;
  const el = document.getElementById("ln-" + l.id);
  if (el) el.outerHTML = lineHtml(l);
  else { $("#live .idle")?.remove(); box.insertAdjacentHTML("beforeend", lineHtml(l)); }
  const pane = $("#sesPane"); if (pane) pane.scrollTop = pane.scrollHeight;
}
function lineHtml(l) {
  return `<div class="utt" id="ln-${l.id}"><div class="head"><span class="num">${K.mmss(l.at)}</span><span class="spk lane-${l.lane}">${l.lane}</span></div>
    <div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`;
}
function noticeHtml() {
  const n = ses.notice; if (!n) return "";
  if (n.kind === "ask") return `<div class="notice"><span class="grow">出力が ${esc(n.detected)} に変わりました（いまは ${esc(n.capturing)} を録音中）。切り替えますか？</span><button class="btn sm" data-act="dev-switch">切り替える</button><button class="btn sm" data-act="dev-keep">そのまま</button></div>`;
  return `<div class="notice"><span class="grow">${esc(n.text)}</span><button class="btn sm ghost" data-act="notice-close">閉じる</button></div>`;
}
ACT["dev-switch"] = () => { ses.notice = { kind: "info", text: "システム音声の録音を AirPods Pro に切り替えました。" }; render(); };
ACT["dev-keep"] = () => { ses.notice = { kind: "info", text: "MacBook Pro のスピーカーのまま録音を続けます。AirPods Pro の音声は録音されません。" }; render(); };
ACT["notice-close"] = () => { ses.notice = null; render(); };
ACT.start = (t) => startSession(t.dataset.mode);
ACT.stop = () => stopSession("manual");
ACT.clear = () => { ses.lines = []; render(); };
ACT["face-save"] = () => { ses.saveFace = !ses.saveFace; render(); };
const faceSaveBtn = () => `<button class="btn sm" data-act="face-save" title="対面モードの録音を保存するか">対面: ${ses.saveFace ? "保存する" : "保存しない"}</button>`;

/* Advisor: manual only (#16) */
function advOffer(card, evKey) {
  const a = ses.adv; if (!a || a.stopped || a.seen.has(card.id) || a.muted.has(card.kind)) return;
  a.seen.add(card.id); a.pending.push({ ...card, evKey });
}
ACT["adv-check"] = () => {
  const a = ses.adv; if (!a) return;
  if (a.stopped) { a.stopped = false; toast("アドバイザーを再開しました"); render(); return; }
  if (!a.pending.length) { toast("いまは指摘はありません"); return; }
  a.shown.push(...a.pending); a.pending = []; render();
};
ACT["adv-close"] = (t) => { ses.adv.shown = ses.adv.shown.filter((c) => c.id !== t.dataset.id); render(); };
ACT["adv-mute"] = (t) => { const c = ses.adv.shown.find((x) => x.id === t.dataset.id); ses.adv.muted.add(c.kind); ses.adv.shown = ses.adv.shown.filter((x) => x.kind !== c.kind); toast(`この会議では「${c.kind}」を出しません`); render(); };
ACT["adv-stop"] = () => { ses.adv.stopped = true; ses.adv.shown = []; ses.adv.pending = []; toast("アドバイザーを停止しました"); render(); };
ACT["adv-ev"] = (t) => { const el = document.getElementById("ln-" + t.dataset.k); if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } };
const advBtn = () => ses.phase === "rec" && ses.adv ? `<button class="btn sm" data-act="adv-check">${ses.adv.stopped ? "アドバイザーを再開" : "アドバイザーに聞く"}</button>` : "";
function advCards() {
  const a = ses.adv; if (!a || !a.shown.length) return "";
  return a.shown.map((c) => {
    const l = ses.lines.find((x) => x.id === c.evKey);
    return `<div class="card col adv"><div class="hstack"><span class="chip info">${esc(c.kind)}</span><span class="meta">アドバイザー（手動）</span><span class="grow"></span><button class="btn sm ghost" data-act="adv-close" data-id="${c.id}">閉じる</button></div>
      <div>${esc(c.text)}</div>
      <div class="hstack"><span class="meta">根拠</span>${l ? `<span class="cite" data-act="adv-ev" data-k="${l.id}">${K.mmss(l.at)} ${esc(l.committed)}</span>` : ""}<span class="grow"></span>
      <button class="btn sm" data-act="adv-mute" data-id="${c.id}">この会議では出さない</button><button class="btn sm" data-act="adv-stop">停止</button></div></div>`;
  }).join("");
}

/* ===== Auto record (#18) ===== */
function autoLabel() {
  return { off: "オフ", waiting: "待機中", recording: "録音中", ending: `会議終了 · ${auto.left} 秒後に自動停止`, error: "エラー: マイクを使えません", suppressed: "手動で停止（この会議では再開しない）" }[auto.state];
}
ACT["auto-toggle"] = () => { S.autoRecord = !S.autoRecord; auto.state = S.autoRecord ? "waiting" : "off"; if (!S.autoRecord && ses.phase === "rec" && ses.mode === "meeting") toast("録音中の会議はそのまま続けます"); render(); };
ACT["auto-detect"] = () => {
  if (auto.state === "waiting") { auto.state = "recording"; startSession("meeting", { auto: true }); toast("会議を検出したので録音を始めました"); }
  else if (auto.state === "suppressed") toast("手動で停止した会議なので、自動では再開しません");
  else if (auto.state === "off") toast("自動録音はオフです");
  else toast("すでに録音中です");
};
ACT["auto-end"] = () => {
  if (auto.state === "recording") { auto.state = "ending"; auto.left = 60; render(); }
  else if (auto.state === "suppressed") { auto.state = "waiting"; toast("会議が終わりました。次の会議を待ちます"); render(); }
};
ACT["auto-error"] = () => { if (auto.state === "waiting") { auto.state = "error"; render(); } else toast("待機中のときに試せます"); };
ACT["auto-retry"] = () => { auto.state = "waiting"; render(); };
function autoSection() {
  const err = auto.state === "error";
  return `${field("自動録音", toggleHtml(S.autoRecord, "auto-toggle"), "会議アプリの通話を検出したら録音を始め、会議が終わって 60 秒で止めます。手動で止めた会議は再開しません。")}
   <div class="hstack sub"><span class="meta">状態</span><span class="chip ${err ? "warn" : auto.state === "recording" || auto.state === "ending" ? "rec" : ""}">${esc(autoLabel())}</span>
   ${err ? `<button class="btn sm" data-act="auto-retry">再試行</button>` : ""}<span class="grow"></span>
   <span class="meta">デモ:</span><button class="btn sm ghost" data-act="auto-detect">会議を検出</button><button class="btn sm ghost" data-act="auto-end">会議が終了</button><button class="btn sm ghost" data-act="auto-error">エラー</button></div>`;
}
setInterval(() => {
  if (auto.state === "ending") { auto.left--; if (auto.left <= 0) { auto.state = "waiting"; stopSession("auto"); toast("会議が終わって 60 秒たったので自動停止しました"); } else { renderMenubar(); const el = $("#auto-left"); if (el) el.textContent = autoLabel(); } }
}, 100); // demo: 10x speed
setInterval(() => { if (ses.phase === "rec") { renderMenubar(); const el = $("#elapsed"); if (el) el.textContent = elapsedText(); } }, 500);

/* ===== Calendar (#7) ===== */
function showCutin(id) { const e = K.calendar.events.find((x) => x.id === id); if (!e || !cal.signedIn) return; cal.cutin = e; cal.left = e.inMin * 60; renderCutin(); }
function renderCutin() {
  const e = cal.cutin;

/* Stats (#12) */
function statsOf(rec) {
  if (rec.stats) return rec.stats;
  const out = { headphones: false }, total = rec.utterances.reduce((n, u) => n + u.end - u.start, 0) || 1;
  for (const lane of rec.lanes) {
    const us = rec.utterances.filter((u) => u.lane === lane), d = us.reduce((n, u) => n + u.end - u.start, 0);
    out[lane] = { share: d / total, longestMs: Math.max(0, ...us.map((u) => u.end - u.start)), cpm: d ? Math.round(us.reduce((n, u) => n + u.text.length, 0) / (d / 60000)) : 0, questions: us.filter((u) => /[?？]/.test(u.text)).length, overlaps: 0 };
  }
  return out;
}
function statsHtml(rec) {
  const st = statsOf(rec), lanes = rec.lanes.filter((l) => st[l]);
  const share = lanes.map((l) => `<div class="hstack"><span class="spk lane-${l} w60">${l}</span><div class="bar grow"><i class="lane-bg-${l}" style="width:${st[l].share * 100}%"></i></div><span class="num w40">${pct(st[l].share)}</span></div>`).join("");
  const row = (h, f) => `<tr><td class="meta">${h}</td>${lanes.map((l) => `<td class="num">${f(st[l])}</td>`).join("")}</tr>`;
  return `<h3>発話の割合</h3><div class="col mt">${share}</div>

}

const ORDER = ["recorded", "transcribed", "diarized", "minutes", "exported"];
const STEP_LABEL = { transcribed: "文字起こし", diarized: "話者", minutes: "議事録", exported: "Obsidian" };
const stOf = (r) => r.status || "exported";
const isPending = (r) => ORDER.indexOf(stOf(r)) < 3;
const needsNote = (r) => stOf(r) === "minutes" || !!(r.note && r.note.state === "stale");
const noteRel = (r) => `${S.obsidian.folder}/${S.obsidian.fileName.replace("{date}", r.date.slice(0, 10)).replace("{title}", r.title)}`;
const mkU = (id, lane, start, end, text, tr) => ({ id, lane, spk: null, start, end, text: text.replaceAll("|", ""), units: text.split("|"), tr, reviewed: false });
function genUtts(rec) {
  if (rec.utterances.length) return;
  rec.utterances = [mkU(rec.id + "-g1", rec.lanes[0], 1000, 5000, "では|始めます。", "Let's begin."), mkU(rec.id + "-g2", rec.lanes[1] || rec.lanes[0], 5500, 9000, "よろしく|お願いします。", "Nice to meet you.")];
}
function markStale(rec) { if (rec.note) rec.note.state = "stale"; }
function writeNote(rec) { rec.note = { path: noteRel(rec), state: "fresh" }; if (stOf(rec) === "minutes") rec.status = "exported"; }
function applyStep(rec, s) {
  if (s === "transcribed") { genUtts(rec); rec.status = s; }
  if (s === "diarized") { if (!Object.keys(rec.speakers).length) rec.speakers = { S1: { name: "", auto: "SPEAKER_00" }, S2: { name: "", auto: "SPEAKER_01" } }; rec.utterances.forEach((u, i) => { if (!u.spk) u.spk = i % 2 ? "S2" : "S1"; }); rec.diarized = true; rec.status = s; }
  if (s === "minutes") { if (!rec.minutes) makeMinutes(rec); rec.status = s; }
  if (s === "exported") writeNote(rec);

// One click runs every remaining step; stops at 議事録 unless auto-export is on.
function processRec(rec) {
  if (ui.proc[rec.id]) return;
  const target = S.obsidian.autoExport === "minutes" ? "exported" : "minutes";
  const step = () => {
    const next = ORDER[ORDER.indexOf(stOf(rec)) + 1];
    if (!next || ORDER.indexOf(next) > ORDER.indexOf(target)) { delete ui.proc[rec.id]; procChanged(); return; }
    ui.proc[rec.id] = { step: next, p: 0 }; procChanged();
    const tm = setInterval(() => {
      const st = ui.proc[rec.id]; st.p = Math.min(1, st.p + 0.1);
      $$(`[data-pp="${rec.id}"]`).forEach((el) => { el.textContent = `${STEP_LABEL[st.step]} ${pct(st.p)}`; });
      if (st.p >= 1) { clearInterval(tm); applyStep(rec, next); step(); }
    }, 80);

  step();
}

    <div class="bound mt"><div class="card"><h3>送るもの</h3><div class="meta mt">あなたが確認した検索語だけ。送るたびに確認します。</div></div>
    <div class="card"><h3>送らないもの</h3><div class="meta mt">音声 · 文字起こし · 訳文 · 議事録 · 話者名 · カレンダーの予定</div></div></div>
    ${sheetFoot('<button class="btn" data-act="sheet-close">オフのまま</button><button class="btn primary" data-act="web-agree">同意してオンにする</button>')}`);
};
ACT["web-agree"] = () => { S.webResearch = true; closeSheet(); render(); };
function advancedHtml() {
  return `<details class="adv-d"><summary class="meta">詳細（開発者向け）</summary>
    ${field("話者分離の評価", '<button class="btn sm" data-act="eval-open">開く…</button>', "録音と参照 RTTM で DER を測る / モデル間の不一致を見る")}
    ${field("文字起こしの評価", '<span class="meta">CLI: kikimimic-eval</span>', "WER・遅延の評価は開発者向けのコマンドで行います。")}</details>`;
}

/* Evaluation (#11) */
const EV = { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, from: K.mmss(K.evaluation.range[0]), to: K.mmss(K.evaluation.range[1]), ran: false, json: false };
function evalSheet() {
  const E = K.evaluation, nem = modelById("nemotron"), noNem = EV.mode === "disagreement" && nem.state !== "ready";
  const sel = (key, opts) => `<select class="input" data-change="ev" data-k="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(EV[key]) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const res = !EV.ran ? "" : `<div class="sep"></div>
    <div class="hstack"><h3>${EV.mode === "der" ? `DER ${pct(E.result.der)}` : "不一致率 9.8%"}</h3><span class="meta">${EV.mode === "der" ? `見逃し ${pct(E.result.miss)} · 誤検出 ${pct(E.result.fa)} · 取り違え ${pct(E.result.confusion)} · 評価対象 ${sec1(E.result.scored)}` : "pyannote と Nemotron（暫定）の比較"}</span></div>
    <div class="col mt">${E.mismatches.map((m) => `<div class="row hstack" data-act="ev-play" data-ms="${m.start}"><span class="num">${K.mmss(m.start)}–${K.mmss(m.end)}</span><span class="grow">${m.kind}</span><span class="meta">参照 ${m.ref} → 推定 ${m.hyp}</span><span class="meta">再生</span></div>`).join("")}</div>
    ${EV.json ? `<pre class="pre mono">${esc(JSON.stringify({ recording: EV.rec, reference: EV.mode === "der" ? EV.ref : null, mode: EV.mode, range: [EV.from, EV.to], collar_ms: +EV.collar, overlap: EV.overlap, result: EV.mode === "der" ? E.result : { disagreement: 0.098 }, mismatches: E.mismatches, input_hashes: E.hashes }, null, 2))}</pre>` : ""}`;
  return `<div class="hstack"><h2>話者分離の評価</h2><span class="grow"></span><span class="meta">設定 › 詳細</span></div>
    <div class="evgrid mt">
      <span class="meta">録音</span>${sel("rec", K.recordings.map((r) => [r.id, r.title]))}
      <span class="meta">比較</span><div class="seg"><button class="${EV.mode === "der" ? "sel" : ""}" data-act="ev-mode" data-m="der">人手参照の DER</button><button class="${EV.mode === "disagreement" ? "sel" : ""}" data-act="ev-mode" data-m="disagreement">モデル間の不一致</button></div>
      ${EV.mode === "der" ? `<span class="meta">参照 RTTM</span>${sel("ref", [["weekly.rttm", "weekly.rttm"], ["interview.rttm", "interview.rttm"]])}` : `<span class="meta">モデル</span><span>pyannote ⇄ Nemotron（暫定）${noNem ? ' <span class="warn">未ダウンロード</span>' : ""}</span>`}
      <span class="meta">範囲</span><div class="hstack"><input class="input w60 num" data-change="ev" data-k="from" value="${EV.from}"><span class="meta">〜</span><input class="input w60 num" data-change="ev" data-k="to" value="${EV.to}"></div>
      <span class="meta">カラー</span>${sel("collar", [[0, "0 ms"], [250, "250 ms"], [500, "500 ms"]])}
      <span class="meta">重なり</span>${sel("overlap", [["include", "含める"], ["exclude", "除外する"]])}
    </div>
    ${res}
    ${sheetFoot(`<button class="btn" data-act="sheet-close">閉じる</button>${EV.ran ? '<button class="btn" data-act="ev-json">JSON を保存</button>' : ""}<button class="btn primary" data-act="ev-run" ${noNem ? "disabled" : ""}>評価する</button>`)}`;
}
ACT["eval-open"] = () => openSheet(evalSheet, true);
CHG.ev = (el) => { EV[el.dataset.k] = el.value; EV.ran = false; EV.json = false; refreshSheet(); };
ACT["ev-mode"] = (t) => { EV.mode = t.dataset.m; EV.ran = false; EV.json = false; refreshSheet(); };
ACT["ev-run"] = () => { EV.ran = true; refreshSheet(); };
ACT["ev-json"] = () => { EV.json = true; refreshSheet(); toast(`eval-${EV.rec}-${EV.mode}.json を保存しました（入力ハッシュ付き）`); };
ACT["ev-play"] = (t) => { const rid = EV.rec === "r1" ? "r1" : EV.rec, uid = jumpTime(rid, +t.dataset.ms); closeSheet(); openRec(rid, uid, +t.dataset.ms, true); };

/* ===== About this variant ===== */
ACT.about = () => {
  const m = (n) => document.querySelector(`meta[name="${n}"]`).content;
  openSheet(() => `<h2>この案について</h2><div class="col mt"><div><div class="meta">コンセプト</div><div>${esc(m("kkm-concept"))}</div></div>
    <div><div class="meta">仮説と理由</div><div>${esc(m("kkm-why"))}</div></div><div><div class="meta">捨てるもの</div><div>${esc(m("kkm-tradeoff"))}</div></div></div>
    ${sheetFoot('<button class="btn" data-act="sheet-close">閉じる</button>')}`);
};
ACT.tab = (t) => { ui.tab = t.dataset.k; render(); };


/* ===== Top-tab shell ===== */
const TABS = [["session", "セッション"], ["recordings", "録音"], ["search", "検索"], ["models", "モデル"], ["settings", "設定"]];
function tabsHtml() {
  return TABS.map(([k, l]) => `<button class="btn ${ui.tab === k ? "sel" : ""}" data-act="tab" data-k="${k}">${k === "session" && ses.phase === "rec" ? '<span class="dot-rec"></span>' : ""}${l}</button>`).join("")
    + `<span class="grow"></span><span class="meta">${statusText()}</span>`;
}
function viewSession() {
  const rec = ses.phase === "rec", fin = ses.phase === "finishing", idle = !rec && !fin;
  const controls = idle
    ? `<button class="btn rec" data-act="start" data-mode="meeting">● 会議を録音</button><button class="btn" data-act="start" data-mode="face">対面</button>`
    : `<button class="btn" data-act="stop" ${fin ? "disabled" : ""}>■ 停止</button>`;
  const state = rec ? `<span class="dot-rec"></span> ${ses.mode === "face" ? "対面 · マイク" : "Me = マイク / Them = システム音声"}` : statusText();
  return `<div class="pane keep" id="sesPane">
    <div class="hstack">${controls}<span class="${rec ? "" : "muted"}">${state}</span><span class="meta num" id="elapsed">${elapsedText()}</span><span class="grow"></span>
      ${idle || ses.mode === "face" ? faceSaveBtn() : ""}${advBtn()}${idle && ses.lines.length ? '<button class="btn sm ghost" data-act="clear">クリア</button>' : ""}</div>
    <div class="col mt">${noticeHtml()}${advCards()}</div>
    <div id="live" class="col mt">${ses.lines.length ? ses.lines.map(lineHtml).join("")
      : `<div class="idle col">${upcomingHtml()}<div class="hstack mt"><span class="meta">自動録音</span><span class="chip" id="auto-left">${esc(autoLabel())}</span></div>${sessionIdleExtra()}</div>`}</div></div>`;
}
function viewSearch() {
  return `<div class="pane keep" id="qPane"><div class="narrow">
    <input class="input srch" id="q" value="${esc(ui.q)}" placeholder="録音とフォルダを検索（原文・訳文・タイトル・日付）">
    <div class="mt">${foldersHtml()}</div><div id="results" class="mt">${resultsHtml()}</div></div></div>`;
}
function viewModels() { return `<div class="pane keep" id="mPane"><div class="narrow"><h1>モデル</h1>${modelsHtml()}</div></div>`; }
function viewSettings() {
  return `<div class="pane keep" id="sPane"><div class="narrow">
    <h2>言語と翻訳</h2>${langHtml()}
    <h2 class="mt2">モデル</h2>${field("文字起こしモデル", modelSelect("asr"))}${field("翻訳モデル", modelSelect("mt"))}${field("話者分離モデル", modelSelect("diar"), "Nemotron（暫定）はモデルタブでダウンロードすると選べます。")}
    <h2 class="mt2">辞書</h2>${glossaryHtml()}
    <h2 class="mt2">Obsidian</h2>${obsidianHtml()}
    <h2 class="mt2">録音</h2>${field("録音開始時に画面をクリアする", toggleHtml(S.clearOnStart, "set", 'data-k="clearOnStart"'), "オフのときはセッション画面の「クリア」で消せます。")}
    ${field("対面モードの録音を保存する", toggleHtml(S.saveFaceToFace, "set", 'data-k="saveFaceToFace"'), "既定は保存しない。")}${autoSection()}
    <h2 class="mt2">Google カレンダー</h2>${calendarHtml()}
    <h2 class="mt2">アドバイザーと Web</h2>${field("アドバイザー", '<span class="meta">手動のみ</span>', "録音中に「アドバイザーに聞く」を押したときだけ、根拠付きで指摘します。")}${webHtml()}
    ${advancedHtml()}</div></div>`;
}
const VIEWS = { session: viewSession, recordings: () => (ui.recId && recById(ui.recId) ? viewDetail(recById(ui.recId)) : viewList()), search: viewSearch, models: viewModels, settings: viewSettings };
function refreshList() { if (ui.tab === "recordings" && !ui.recId) render(); }
ACT.back = () => { ui.recId = null; render(); };
ACT["open-rec"] = (t) => openRec(t.dataset.id);
ACT.jump = (t) => { closeSheet(); openRec(t.dataset.r, t.dataset.u); };
function openRec(recId, uttId, ms, play) {
  if (ui.recId !== recId) onOpenRec();
  ui.tab = "recordings"; ui.recId = recId; ui.focusU = uttId || null;
  beforeJump(uttId);
  render();
  if (uttId) focusUtt(uttId);
  if (ms != null) player.seek(ms); else if (uttId) player.seek(K.findUtt(uttId).utt.start);
  if (play) player.play();
}


/* ===== 02: inspector — body + right inspector (accordions) ===== */
ui.acc = { pipe: true, minutes: true, speakers: true, stats: false, qa: false, cues: false, lInfo: true, lAdv: true, lCal: true };
ui.cueMode = false; ui.spkFilter = null;
document.addEventListener("toggle", (e) => { const k = e.target.dataset && e.target.dataset.acc; if (k) ui.acc[k] = e.target.open; }, true);
function onOpenRec() { ui.cueMode = false; ui.spkFilter = null; }
function beforeJump(uttId) { if (uttId) ui.spkFilter = null; }
// Right after a meeting ends, go straight to the recording to check it.
function afterStop() { if (ses.lastRec) { onOpenRec(); ui.tab = "recordings"; ui.recId = ses.lastRec; } }
function viewList() {
  return `<div class="pane keep" id="listPane"><div class="hstack"><h1>録音</h1><span class="meta">${K.recordings.length} 件</span><span class="grow"></span>${importBadge()}<button class="btn" data-act="import-open">音声を取り込む…</button></div>
    <div class="hstack mt">${listFilterHtml()}</div>
    <div class="col mt">${listRows()}</div></div>`;
}
function viewDetail(rec) {
  return `<div class="dhead hstack"><button class="btn sm ghost" data-act="back">← 録音一覧</button><h2>${esc(rec.title)}</h2>
      <span class="meta">${esc(rec.date)} · ${K.mmss(rec.durationMs)} · ${SRC[rec.source]}</span><span class="grow"></span>${saveHtml(rec)}</div>
    <div class="split"><div class="body">${playerHtml(rec)}<div class="pane keep" id="bodyPane">${bodyHtml(rec)}</div></div>
      <aside class="insp keep" id="insp">${inspectorHtml(rec)}</aside></div>`;
}
function bodyHtml(rec) {
  const empty = emptyBody(rec); if (empty) return empty;
  const us = rec.utterances.filter((u) => !ui.spkFilter || u.spk === ui.spkFilter), n = rec.utterances.filter((u) => u.reviewed).length;
  return `<div class="hstack"><button class="btn sm" data-act="next-unrev">次の未校閲へ</button><span class="meta">校閲済み ${n} / ${rec.utterances.length}</span><span class="grow"></span>
      ${ui.spkFilter ? `<span class="chip">${esc(K.speakerName(rec, ui.spkFilter))} の発話だけ <span data-act="spk-filter" data-k="">×</span></span>` : ""}
      ${ui.cueMode ? '<span class="chip warn">字幕の区切りを編集中</span>' : ""}</div>
    <div class="col mt">${us.map((u) => `<div class="utt ${ui.focusU === u.id ? "focus" : ""}" id="u-${u.id}">
      <div class="head"><span class="ts num" data-act="ts" data-ms="${u.start}">${K.mmss(u.start)}</span>${spkLabel(rec, u)}<span class="grow"></span>
        <button class="btn sm ghost ${u.reviewed ? "okc" : ""}" data-act="review" data-u="${u.id}">${u.reviewed ? "✓ 校閲済み" : "校閲済みにする"}</button></div>
      <div>${wordsHtml(u, ui.cueMode)}</div>${u.tr ? `<div class="tr">${esc(u.tr)}</div>` : ""}</div>`).join("")}</div>`;
}
function acc(key, title, sub, inner) { return `<details data-acc="${key}" ${ui.acc[key] ? "open" : ""}><summary><span class="grow">${title}</span><span class="meta">${sub}</span></summary><div class="acc-b">${inner}</div></details>`; }
function inspectorHtml(rec) {
  const spk = Object.keys(rec.speakers), total = rec.utterances.reduce((n, u) => n + u.end - u.start, 0) || 1;
  const share = (k) => rec.utterances.filter((u) => u.spk === k).reduce((n, u) => n + u.end - u.start, 0) / total;
  const speakers = `${diarHtml(rec)}${spk.map((k) => `<div class="hstack spk-row"><span class="spk" style="color:${K.speakerColor(k)}">●</span>
      <input class="input grow" data-change="spk-name" data-k="${k}" value="${esc(rec.speakers[k].name)}" placeholder="${rec.speakers[k].auto}">
      <span class="meta num w40">${pct(share(k))}</span><button class="btn sm ghost ${ui.spkFilter === k ? "sel" : ""}" data-act="spk-filter" data-k="${ui.spkFilter === k ? "" : k}">絞る</button></div>`).join("")}
    ${spk.length ? '<div class="meta mt">名前は「保存」で録音に保存され、書き出しに使われます。</div>' : ""}`;
  const cues = `<label class="check">${toggleHtml(ui.cueMode, "cue-mode")}<span>字幕の区切りを編集<div class="meta">本文の単語をクリックで分割、赤い区切りで結合。単語の時刻は推定です。</div></span></label>
    <div class="hstack wrap mt">${Object.entries(EXP).map(([k, [l]]) => `<button class="btn sm" data-act="export" data-k="${k}">${l}</button>`).join("")}<button class="btn sm" data-act="ob-export" data-id="${rec.id}">Obsidian…</button></div>`;
  const pipe = `${pipeHtml(rec, true)}${rec.note ? `<div class="meta mono mt">${esc(rec.note.path)}</div>` : ""}`;
  return acc("pipe", "処理と Obsidian", K.STATUS[stOf(rec)], pipe)
    + acc("minutes", "要点", rec.minutes ? "" : "未作成", minutesHtml(rec, true))
    + acc("speakers", "話者", spk.length ? `${spk.length} 人` : "未判別", speakers)
    + acc("stats", "統計", "", statsHtml(rec))
    + acc("qa", "質問", (ui.qa[rec.id] || []).length ? `${ui.qa[rec.id].length} 件` : "", qaHtml(rec))
    + acc("cues", "字幕と書き出し", "MD / SRT / Obsidian", cues);
}
CHG["spk-name"] = (el) => { recById(ui.recId).speakers[el.dataset.k].name = el.value.trim(); markDirty(); render(); };
ACT["spk-filter"] = (t) => { ui.spkFilter = t.dataset.k || null; render(); };
ACT["cue-mode"] = () => { ui.cueMode = !ui.cueMode; render(); };
ACT.names = () => { ui.acc.speakers = true; render(); };
ACT.word = (t) => { if (ui.cueMode) cutToggle(t.dataset.u, +t.dataset.i); else { player.seek(+t.dataset.s); player.play(); } };
const _ask = ACT.ask; ACT.ask = (t) => { ui.acc.qa = true; _ask(t); };

function sessionIdleExtra() { return ""; }
/* Live uses the same body + inspector split, so "during" and "right after" look alike */
function viewSession() {
  const rec = ses.phase === "rec", fin = ses.phase === "finishing", idle = !rec && !fin;
  const controls = idle
    ? `<button class="btn rec" data-act="start" data-mode="meeting">● 会議を録音</button><button class="btn" data-act="start" data-mode="face">対面</button>`
    : `<button class="btn" data-act="stop" ${fin ? "disabled" : ""}>■ 停止</button>`;
  const info = `<div class="col"><div class="hstack"><span class="meta grow">レーン</span><span>${rec ? (ses.mode === "face" ? "Me（マイク）" : "Me（マイク） / Them（システム音声）") : "—"}</span></div>
    <div class="hstack"><span class="meta grow">対面モードの保存</span>${faceSaveBtn()}</div>
    <div class="hstack"><span class="meta grow">自動録音</span><span class="chip" id="auto-left">${esc(autoLabel())}</span></div>
    ${idle && ses.lines.length ? '<div class="hstack"><span class="meta grow">前の文字起こし</span><button class="btn sm ghost" data-act="clear">クリア</button></div>' : ""}</div>`;
  const adv = rec ? `<div class="col">${advBtn()}${advCards()}</div>` : '<span class="meta">録音中に使えます（手動のみ）</span>';
  return `<div class="split"><div class="body"><div class="dhead hstack">${controls}<span class="${rec ? "" : "muted"}">${rec ? '<span class="dot-rec"></span> 聞き取り中' : statusText()}</span><span class="meta num" id="elapsed">${elapsedText()}</span></div>
      <div class="pane keep" id="sesPane">${noticeHtml()}<div id="live" class="col mt">${ses.lines.length ? ses.lines.map(lineHtml).join("") : '<div class="idle muted">まだ発話はありません。</div>'}</div></div></div>
    <aside class="insp keep" id="sesInsp">${acc("lInfo", "この会議", rec ? elapsedText() : "", info)}${acc("lAdv", "アドバイザー", ses.adv && ses.adv.stopped ? "停止中" : "", adv)}${acc("lCal", "今日の予定", "", upcomingHtml(true))}</aside></div>`;
}

/* ===== start ===== */
render();
setTimeout(() => { if (cal.signedIn && ses.phase === "idle") showCutin("e1"); }, 2500);
</script>
</body>
</html>
