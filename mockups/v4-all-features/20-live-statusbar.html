<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>20 ステータスバー常設 — Kikimimic</title>
<meta name="kkm-concept" content="どの画面でも下端に同じステータスバー（状態・Me/Them の入力レベル・保存の有無・経過時間・自動録音・未保存・再生位置）。録音前は入力チェックが起動画面">
<meta name="kkm-why" content="録音の確実さを気にする人が会議の最中と直前に使う。「いま録れているか」が画面を移っても常に同じ場所に見えていれば、振り返りや検索をしながらでも安心して会議に集中できる。無音や保存しない設定もそこで気づける">
<meta name="kkm-tradeoff" content="下端の 1 行を常に使うので本文の縦の領域が減る。プレイヤーもステータスバーに入るため、録音詳細に専用の再生バーは無い">
<link rel="stylesheet" href="shared/kit.css">
<style>
/* ---- shared layout (core) ---- */
.stack { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 8px; }
.hrow.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sheet-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.sheet-h h2 { flex: 1; }
.sec { padding: 12px 0; border-bottom: 1px solid var(--border); }
.sec:last-child { border-bottom: 0; }
.sec > h3 { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 190px 1fr; gap: 6px 12px; align-items: center; }
.pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--bg-subtle); border-radius: var(--radius); padding: 8px; max-height: 280px; overflow: auto; margin: 0; }
.utt.rv .txt { color: var(--muted-2); }
.utt .txt { margin-top: 2px; }
.gap { display: inline-block; width: 6px; height: 1em; cursor: col-resize; vertical-align: -2px; border-radius: 2px; }
.gap:hover { background: var(--border-hover); }
.lvl { width: 40px; display: inline-block; vertical-align: middle; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td, .tbl th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
.tbl th { font-weight: 600; font-size: 12px; color: var(--muted-2); }
#notices { display: flex; flex-direction: column; gap: 6px; }
#notices:empty { display: none; }
.ans { border-left: 2px solid var(--border); padding-left: 10px; }

/* ---- 20: top tabs + a status bar shared by every screen ---- */
.tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); align-items: center; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#notices { padding: 8px 14px 0; }
.view { flex: 1; min-height: 0; }
.pad { padding: 12px 16px; }
.sb { flex: 0 0 auto; height: 32px; display: flex; align-items: stretch; border-top: 1px solid var(--border); background: var(--bg-subtle); font-size: 12px; padding-right: 110px; }
.sb > .seg-i { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-right: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
.sb > .seg-i:hover { background: var(--bg); }
.sb > .seg-i.static { cursor: default; } .sb > .seg-i.static:hover { background: none; }
.sb .lvl { width: 46px; background: var(--border); }
.sb .lvl > i { transition: width .12s; }
.sb .spacer { flex: 1; border-right: 0; cursor: default; }
.sb .spacer:hover { background: none; }
.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 760px; }
.check-grid .lvl { width: 100%; }
.livecol { max-width: 760px; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 20 ステータスバー常設</div>
<div class="win">
  <div class="menubar"><button class="btn sm ghost" id="mb">Kikimimic</button></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <div id="notices"></div>
    <div class="view" id="view"></div>
  </div>
  <div class="sb" id="sb"></div>
</div>
<script src="shared/data.js"></script>
<script>
/* ===== core: utilities, overlays ===== */
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const recById = (id) => K.recordings.find((r) => r.id === id);
const WIN = () => $(".win");
const laneLabel = (l) => ({ Me: "Me（マイク）", Them: "Them（システム音声）", Imported: "取り込み" })[l] || l;
const laneColor = (l) => (l === "Me" ? "var(--lane-me)" : l === "Them" ? "var(--lane-them)" : "var(--muted-2)");

const S = {
  phase: "idle", mode: null, eng: null, lines: [], startAt: 0, timer: 0, lastDuration: 0,
  pendingAdvice: [], shownAdvice: [], advisorStopped: false, mutedRecs: new Set(),
  dirty: new Set(), cues: {}, player: null, playerRec: null, pos: 0, playing: false,
  auto: { state: K.settings.autoRecord ? "待機中" : "オフ", manualStopped: false, countdown: 0, timer: 0 },
  signedIn: !!K.calendar.signedIn, capturing: "MacBook Pro のスピーカー",
};
const V = window.V || (window.V = {});
const call = (name, ...a) => (typeof V[name] === "function" ? V[name](...a) : undefined);

function toast(msg) {
  $$(".toast").forEach((x) => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  WIN().appendChild(t); setTimeout(() => t.remove(), 2400);
}
function sheet(title, body, mount) {
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="sheet"><div class="sheet-h"><h2>${esc(title)}</h2><button class="btn sm" data-close>閉じる</button></div><div class="sheet-b">${body}</div></div>`;
  const close = () => sc.remove();
  sc.addEventListener("click", (e) => { if (e.target === sc || e.target.closest("[data-close]")) close(); });
  WIN().appendChild(sc);
  if (mount) mount($(".sheet-b", sc), close);
  return { el: $(".sheet-b", sc), close };
}
function popMenu(anchor, items) {
  $$(".menu.pop").forEach((m) => m.remove());
  const m = document.createElement("div"); m.className = "menu pop";
  items.forEach(([label, fn]) => { const b = document.createElement("button"); b.textContent = label; b.onclick = (e) => { e.stopPropagation(); m.remove(); fn(); }; m.appendChild(b); });
  const wr = WIN().getBoundingClientRect(), ar = anchor.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(ar.left - wr.left, wr.width - 220)) + "px";
  const below = ar.bottom - wr.top + 4, h = 10 + 30 * items.length;
  m.style.top = (below + h > wr.height ? ar.top - wr.top - 4 - h : below) + "px";
  WIN().appendChild(m);
  setTimeout(() => document.addEventListener("click", function off() { m.remove(); document.removeEventListener("click", off); }), 0);
}
function notice(html, kind = "", ms = 0) {
  const box = $("#notices"); if (!box) return null;
  const n = document.createElement("div"); n.className = "notice " + kind; n.innerHTML = html;
  box.appendChild(n); if (ms) setTimeout(() => n.remove(), ms);
  return n;
}
function aboutButton() {
  const b = document.createElement("button"); b.className = "btn sm ghost"; b.textContent = "この案について";
  b.style.cssText = "position:absolute;right:8px;bottom:6px;z-index:40";
  const m = (n) => esc($(`meta[name="${n}"]`).content);
  b.onclick = () => sheet("この案について", `<div class="kv"><span class="meta">コンセプト</span><span>${m("kkm-concept")}</span><span class="meta">仮説と理由</span><span>${m("kkm-why")}</span><span class="meta">捨てるもの</span><span>${m("kkm-tradeoff")}</span></div>`);
  WIN().appendChild(b);
  return b;
}

/* ===== core: live session (#1 #2 #3 #16 #17) ===== */
const elapsed = () => (S.phase === "rec" ? Date.now() - S.startAt : S.lastDuration);
const faceSaves = () => K.settings.saveFaceToFace;
function startSession(mode, opts = {}) {
  if (S.phase !== "idle") return;
  if (K.settings.clearOnStart) S.lines = [];
  Object.assign(S, { phase: "rec", mode, startAt: Date.now(), pendingAdvice: [], shownAdvice: [], advisorStopped: false });
  S.mutedRecs.delete("live");
  const engMode = mode === "face" ? "face" : K.settings.translateInto ? "meeting" : "noTranslate";
  S.eng = K.live(engMode, onLiveEvent);
  S.timer = setInterval(() => call("onTick"), 500);
  if (opts.auto) { S.auto.state = "録音中"; S.auto.manualStopped = false; }
  call("onPhase"); call("onAuto");
}
function stopSession(manual = true) {
  if (S.phase !== "rec") return;
  S.eng.stop(); clearInterval(S.timer); clearInterval(S.auto.timer);
  S.lastDuration = Date.now() - S.startAt; S.phase = "finishing";
  if (S.auto.state === "録音中" || S.auto.state.startsWith("停止まで")) { S.auto.state = "待機中"; S.auto.manualStopped = manual; }
  call("onPhase"); call("onAuto");
  setTimeout(() => {
    S.lines.forEach((l) => { if (!l.text) l.text = l.committed + l.volatile; l.translating = false; });
    S.phase = "idle"; const mode = S.mode; S.mode = null;
    if (mode === "face" && !faceSaves()) toast("対面モードは「保存しない」設定のため、録音を残しませんでした");
    else if (S.lines.some((l) => l.text)) { const r = saveLiveAsRecording(mode); toast("「" + r.title + "」を録音一覧に追加しました"); }
    call("onPhase"); call("onRecChange");
  }, 1600);
}
function saveLiveAsRecording(mode) {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  const r = { id: "n" + Date.now(), title: mode === "face" ? "対面の会話" : "（タイトルなし）",
    date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,
    durationMs: Math.max(S.lastDuration, 5000), source: mode === "face" ? "face" : "meeting", lanes: mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {},
    utterances: S.lines.filter((l) => l.text).map((l, i, a) => {
      const units = l.text.split(/(?<=\s)|(?<=[、。])/), end = a[i + 1] ? a[i + 1].at - 200 : l.at + 3000;
      return { id: l.id, lane: l.lane, spk: null, start: l.at, end: Math.max(end, l.at + 800), text: l.text, units, tr: l.tr, reviewed: false };
    }),
    minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };
  K.recordings.push(r); return r;
}
function onLiveEvent(ev) {
  const L = (id) => S.lines.find((l) => l.id === id);
  if (ev.type === "line") S.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", text: null, tr: null, translating: false });
  else if (ev.type === "update") Object.assign(L(ev.id), { committed: ev.committed, volatile: ev.volatile });
  else if (ev.type === "commit") Object.assign(L(ev.id), { text: ev.text, volatile: "" });
  else if (ev.type === "translating") L(ev.id).translating = true;
  else if (ev.type === "translate") Object.assign(L(ev.id), { tr: ev.text, translating: false });
  else if (ev.type === "advisor") { if (!S.advisorStopped && !S.mutedRecs.has("live")) S.pendingAdvice.push(ev.card); }
  else if (ev.type === "question") return askDevice(ev);
  call("onLive", ev);
}
function liveLineHTML(l, opts = {}) {
  const body = l.text ? esc(l.text) : esc(l.committed) + `<span class="vol">${esc(l.volatile)}</span>`;
  const tr = l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : "";
  const head = opts.noHead ? "" : `<div class="head"><span class="num">${K.mmss(l.at)}</span><span class="spk" style="color:${laneColor(l.lane)}">${esc(l.lane)}</span></div>`;
  return `<div class="utt" data-live="${l.id}">${head}<div class="txt">${body}</div>${tr}</div>`;
}
function askDevice(ev) {
  const n = notice(`<span class="grow">出力が ${esc(ev.detected)} に変わりました（いまは ${esc(ev.capturing)} を録音中）。切り替えますか？</span><button class="btn sm primary" data-a="sw">切り替える</button><button class="btn sm" data-a="keep">そのまま</button>`);
  if (!n) return;
  n.onclick = (e) => {
    const a = e.target.dataset.a; if (!a) return; n.remove();
    if (a === "sw") { S.capturing = ev.detected; notice(`${esc(ev.detected)} の録音に切り替えました。`, "", 4000); call("onDevice"); }
  };
}
/* advisor (#16): manual only — cards wait until the user asks */
function revealAdvice() {
  if (S.advisorStopped) return toast("アドバイザーは停止中です");
  if (!S.pendingAdvice.length) return toast("いま出せるアドバイスはありません");
  S.shownAdvice.push(...S.pendingAdvice); S.pendingAdvice = []; call("onLive");
}
function adviceCardHTML(c, recId) {
  const ev = (c.ev || []).map((id) => `<span class="cite" data-jump="${recId || "live"}:${id}">根拠</span>`).join(" ");
  return `<div class="card stack" data-card="${c.id}" style="padding:8px 10px"><div class="hrow"><span class="chip warn">${esc(c.kind)}</span><span class="grow">${esc(c.text)}</span></div>
    <div class="hrow">${ev}<span class="grow"></span><button class="btn sm ghost" data-adv="close">閉じる</button><button class="btn sm ghost" data-adv="mute">この会議では出さない</button><button class="btn sm ghost" data-adv="stop">停止</button></div></div>`;
}
function adviceAction(btn, list, recKey) {
  const id = btn.closest("[data-card]").dataset.card, i = list.findIndex((c) => c.id === id);
  if (btn.dataset.adv === "close" && i >= 0) list.splice(i, 1);
  if (btn.dataset.adv === "mute") { list.splice(0); S.mutedRecs.add(recKey); toast("この会議ではアドバイスを出しません"); }
  if (btn.dataset.adv === "stop") { list.splice(0); S.advisorStopped = true; toast("アドバイザーを停止しました"); }
}
function flashEl(el) { if (!el) return; $$(".flash").forEach((x) => x.classList.remove("flash")); el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
/* global delegation: citations and advice buttons anywhere */
document.addEventListener("click", (e) => {
  const j = e.target.closest("[data-jump]");
  if (j) {
    const [rec, utt] = j.dataset.jump.split(":");
    if (rec === "live") flashEl($(`[data-live="${utt}"]`)); else call("openUtt", rec, utt);
    return;
  }
  const a = e.target.closest("[data-adv]");
  if (a) {
    if (a.closest("[data-advlive]")) { adviceAction(a, S.shownAdvice, "live"); call("onLive"); }
    else { const recId = a.closest("[data-advrec]")?.dataset.advrec; if (recId) { adviceAction(a, recById(recId).advisor, recId); call("onRecChange"); } }
  }
});

/* ---- calendar cut-in (#7) and auto-record (#18) ---- */
function showCutin(evt) {
  $$(".cutin").forEach((c) => c.remove());
  const c = document.createElement("div"); c.className = "cutin stack";
  let left = evt.inMin * 60;
  const draw = () => {
    c.innerHTML = `<div class="meta">Google カレンダー · ${left > 0 ? "あと " + K.mmss(left * 1000) : K.mmss(-left * 1000) + " 前に開始"}</div><h2>${esc(evt.title)}</h2>
      <div class="hrow">${evt.url ? `<button class="btn primary" data-c="join">参加して録音</button>` : ""}<button class="btn" data-c="rec">録音を開始</button><span class="grow"></span><button class="btn" data-c="close">閉じる</button></div>`;
  };
  draw(); const t = setInterval(() => { left--; draw(); }, 1000);
  c.onclick = (e) => {
    const a = e.target.dataset.c; if (!a) return; clearInterval(t); c.remove();
    if (a === "join") toast("会議の URL を開きました: " + evt.url);
    if (a !== "close") startSession("meeting");
  };
  WIN().appendChild(c);
}
function setAutoRecord(on) {
  K.settings.autoRecord = on; S.auto.manualStopped = false;
  if (!on && S.auto.state === "録音中") stopSession(false);
  S.auto.state = on ? "待機中" : "オフ"; call("onAuto");
}
/* demo hooks: a meeting begins / ends (in the app these come from the calendar + audio activity) */
function autoMeetingBegins() {
  if (!K.settings.autoRecord) return toast("自動録音はオフです");
  if (S.auto.manualStopped) return toast("手動で停止したため、この会議では再開しません");
  if (S.phase !== "idle") return toast("すでに録音中です");
  startSession("meeting", { auto: true });
}
function autoMeetingEnds() {
  if (S.auto.state !== "録音中") return toast("自動録音中ではありません");
  S.auto.countdown = 60; S.auto.state = "停止まで 60 秒";
  S.auto.timer = setInterval(() => {
    S.auto.countdown -= 5; S.auto.state = "停止まで " + S.auto.countdown + " 秒";
    if (S.auto.countdown <= 0) { clearInterval(S.auto.timer); stopSession(false); toast("会議が終わって 60 秒たったので自動停止しました"); }
    call("onAuto");
  }, 500);
  call("onAuto");
}
function autoError() {
  if (!K.settings.autoRecord) return toast("自動録音はオフです");
  S.auto.state = "エラー"; call("onAuto");
  notice(`<span class="grow">自動録音を開始できませんでした: システム音声が無音です。</span><button class="btn sm" data-x>閉じる</button>`, "error").onclick = (e) => {
    if (e.target.dataset.x !== undefined) { e.currentTarget.remove(); S.auto.state = "待機中"; call("onAuto"); }
  };
}
const autoChipClass = () => ({ "録音中": "rec", "エラー": "", "オフ": "" })[S.auto.state] ?? (S.auto.state.startsWith("停止まで") ? "warn" : "ok");
function autoChip() {
  const err = S.auto.state === "エラー" ? ' style="color:var(--danger)"' : "";
  return `<span class="chip ${autoChipClass()}"${err}>自動録音: ${esc(S.auto.state)}</span>`;
}

/* ===== core: transcript, player, review, speakers, export (#4 #8 #9 #20) ===== */
const spkName = (rec, spk) => K.speakerName(rec, spk);
const isDirty = (rec) => S.dirty.has(rec.id);
function markDirty(rec) { S.dirty.add(rec.id); call("onRecChange"); }
function saveRec(rec) { S.dirty.delete(rec.id); if (rec.note) rec.note.state = "stale"; toast(rec.note ? "保存しました（Obsidian のノートは古くなりました）" : "保存しました"); call("onRecChange"); }
function cuts(rec, u) { const k = rec.id + ":" + u.id; return S.cues[k] || (S.cues[k] = new Set()); }
function cueCount(rec) { return rec.utterances.reduce((n, u) => n + 1 + cuts(rec, u).size, 0); }

/* words with estimated times; cue cuts shown as a thin red bar; gaps clickable when editing cues */
function wordsHTML(rec, u, opts = {}) {
  const c = cuts(rec, u);
  return K.unitsWithTimes(u).map((w, i) => {
    const gap = i > 0 && opts.cueEdit ? `<span class="gap" data-gap="${i}" title="ここで字幕を分割 / 結合"></span>` : "";
    const cut = i > 0 && c.has(i) ? `<span class="cue-cut"></span>` : "";
    return gap + cut + `<span class="w" data-s="${w.start}" data-e="${w.end}">${esc(w.w)}</span>`;
  }).join("");
}
function spkLabelHTML(rec, u) {
  const n = spkName(rec, u.spk);
  return `<span class="spk" data-spkmenu="${u.id}" style="color:${K.speakerColor(u.spk)};cursor:pointer">${esc(n || "話者なし")} ▾</span>`;
}
function uttHTML(rec, u, opts = {}) {
  return `<div class="utt${u.reviewed ? " rv" : ""}" data-u="${u.id}">
    <div class="head"><span class="ts num" data-ts="${u.start}">${K.mmss(u.start)}</span>${spkLabelHTML(rec, u)}<span>${esc(laneLabel(u.lane))}</span>
      <span class="grow"></span><button class="btn sm ${u.reviewed ? "" : "ghost"}" data-rev="${u.id}">${u.reviewed ? "校閲済み" : "未校閲"}</button></div>
    <div class="txt">${wordsHTML(rec, u, opts)}</div>${u.tr ? `<div class="tr">${esc(u.tr)}</div>` : ""}</div>`;
}
/* one delegated handler for any transcript container */
function wireTranscript(el, getRec, rerender) {
  el.addEventListener("click", (e) => {
    const rec = getRec(); if (!rec) return;
    const t = e.target;
    if (t.dataset.ts) return playAt(rec, +t.dataset.ts);
    if (t.classList.contains("w")) return playAt(rec, +t.dataset.s);
    if (t.dataset.gap) { const u = rec.utterances.find((x) => x.id === t.closest("[data-u]").dataset.u), c = cuts(rec, u), i = +t.dataset.gap;
      c.has(i) ? c.delete(i) : c.add(i); toast(c.has(i) ? "字幕を分割しました" : "字幕を結合しました"); markDirty(rec); return rerender(); }
    if (t.dataset.rev) { const u = rec.utterances.find((x) => x.id === t.dataset.rev); u.reviewed = !u.reviewed; markDirty(rec); return rerender(); }
    const sm = t.closest("[data-spkmenu]");
    if (sm) { const u = rec.utterances.find((x) => x.id === sm.dataset.spkmenu); speakerMenu(sm, rec, u, rerender); }
  });
}
function speakerMenu(anchor, rec, u, after) {
  const items = Object.keys(rec.speakers).map((k) => [(k === u.spk ? "✓ " : "") + spkName(rec, k), () => { u.spk = k; markDirty(rec); after(); }]);
  items.push(["新しい話者を追加", () => { const k = "S" + (Object.keys(rec.speakers).length + 1); rec.speakers[k] = { name: "", auto: "SPEAKER_0" + (Object.keys(rec.speakers).length) }; u.spk = k; markDirty(rec); after(); }]);
  items.push(["話者名を編集…", () => openSpeakerNames(rec, after)]);
  popMenu(anchor, items);
}
function openSpeakerNames(rec, after) {
  const keys = Object.keys(rec.speakers);

function nextUnreviewed(rec, fromId) {
  const us = rec.utterances, i = us.findIndex((u) => u.id === fromId);

function diarize(rec, onProgress, onDone) {
  let p = 0; const t = setInterval(() => {
    p += 10; onProgress(p);
    if (p >= 100) {
      clearInterval(t);
      if (!Object.keys(rec.speakers).length) rec.speakers = { S1: { name: "", auto: "SPEAKER_00" }, S2: { name: "", auto: "SPEAKER_01" } };
      rec.utterances.forEach((u, i) => { if (!u.spk) u.spk = u.lane === "Me" ? "S1" : u.lane === "Them" ? "S2" : i % 2 ? "S2" : "S1"; });
      rec.diarized = true; if (rec.status === "transcribed") rec.status = "diarized"; markDirty(rec); toast("話者を判別しました（" + modelName(K.settings.diar) + "）"); onDone();
    }

}

/* player: one shared clock; highlights the word under the playhead inside [data-words-root] */
function playAt(rec, ms) {
  if (S.playerRec !== rec.id) { if (S.player) S.player.pause(); S.player = K.player(rec, onPlayerTick); S.playerRec = rec.id; }
  S.player.seek(ms); S.player.play();
}
function togglePlay(rec) { if (S.playerRec !== rec.id) return playAt(rec, 0); S.player.toggle(); }
function onPlayerTick(pos, playing) {
  S.pos = pos; S.playing = playing;
  $$(".w.now").forEach((w) => w.classList.remove("now"));
  if (playing || pos > 0) {
    const hit = $$("[data-words-root] .w").find((w) => +w.dataset.s <= pos && pos < +w.dataset.e);
    if (hit) hit.classList.add("now");
  }
  call("onPlayer", pos, playing);
}

const citeHTML = (rec, ids) => ids.map((id) => { const f = K.findUtt(id); return `<span class="cite" data-jump="${rec.id}:${id}">${f ? K.mmss(f.utt.start) : id}</span>`; }).join(" ");

    ${sec("要約", m.summary, (x) => esc(x.text))}${sec("決定事項", m.decisions, (x) => esc(x.text))}

function fakeMinutes(rec) {
  const u = rec.utterances;
  return { summary: u.slice(0, 1).map((x) => ({ text: x.text, ev: [x.id] })), decisions: [], actions: [],
    open: u.filter((x) => /[?？]/.test(x.text)).map((x) => ({ text: x.text, ev: [x.id] })), revision: 1,
    generated: new Date().toTimeString().slice(0, 5), model: modelName(K.settings.mt) };
}
function computeStats(rec) {
  const out = {}; const total = rec.utterances.reduce((n, u) => n + (u.end - u.start), 0) || 1;
  rec.lanes.forEach((l) => {
    const us = rec.utterances.filter((u) => u.lane === l), dur = us.reduce((n, u) => n + (u.end - u.start), 0);
    out[l] = { share: dur / total, longestMs: Math.max(0, ...us.map((u) => u.end - u.start)), cpm: Math.round(us.reduce((n, u) => n + u.text.length, 0) / Math.max(dur / 60000, 0.01)),
      questions: us.filter((u) => /[?？]/.test(u.text)).length, overlaps: 0 };
  });
  out.headphones = rec.source === "meeting"; return out;
}
function renderStats(el, rec) {

    ${lanes.map((l) => `<tr><td><span class="spk" style="color:${laneColor(l)}">${esc(l)}</span></td><td><div class="hrow"><div class="bar grow"><i style="width:${Math.round(st[l].share * 100)}%;background:${laneColor(l)}"></i></div><span class="num">${Math.round(st[l].share * 100)}%</span></div></td>
      <td class="num">${(st[l].longestMs / 1000).toFixed(1)} 秒</td><td class="num">${st[l].cpm}</td><td class="num">${st[l].questions}</td><td class="num">${st[l].overlaps}</td></tr>`).join("")}</table>
    <p class="meta">${st.headphones ? "重なった発話はヘッドホン使用時のみ数えます（スピーカーだと相手の声がマイクに入るため）。" : "重なった発話: ヘッドホン必須のため、この録音では数えていません。"}${rec.stats ? "" : " この録音の統計はその場で計算しました。"}</p>`;
}

  };

/* ===== core: import queue (#10) and diarization evaluation (#11) ===== */
const IMPORT_STATE = { done: ["完了", "ok"], running: ["取り込み中", "info"], pending: ["待機中", ""], failed: ["失敗", ""], skipped: ["スキップ", ""] };
let importJoin = true, importTimer = 0;
function importTick() {
  const q = K.importQueue;
  let run = q.find((j) => j.state === "running");
  if (!run) { run = q.find((j) => j.state === "pending"); if (!run) { clearInterval(importTimer); importTimer = 0; return; } run.state = "running"; }
  run.progress = Math.min(1, run.progress + 0.08);
  if (run.progress >= 1) {
    run.state = "done";
    const grp = run.joinGroup && q.filter((j) => j.joinGroup === run.joinGroup);
    if (grp && importJoin) { if (grp.every((j) => j.state === "done")) { addImported(run.joinGroup + "（" + grp.length + " ファイルを結合）"); toast(grp.length + " つの WAV を 1 つの会議に結合しました"); } }
    else { addImported(run.file); toast(run.file + " を取り込みました"); }
  }
  call("onImport");
}
function addImported(title) {
  K.recordings.push({ id: "i" + Date.now(), title, date: "2026-11-17 —", durationMs: 600000, source: "import", lanes: ["Imported"], speakers: {},
    utterances: [{ id: "i" + Date.now() + "u", lane: "Imported", spk: null, start: 1000, end: 5000, text: "（取り込んだ音声の文字起こし）", units: ["（取り込んだ", "音声の", "文字起こし）"], tr: null, reviewed: false }],
    minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null });
  call("onRecChange");
}
function ensureImportRunning() { if (!importTimer) importTimer = setInterval(importTick, 300); }
function renderImport(el) {

    ${grp.length ? `<label class="check" style="margin:8px 0"><input type="checkbox" data-join ${importJoin ? "checked" : ""}> <span>分割された WAV（${grp.map((j) => esc(j.file)).join(" + ")}）を 1 つの会議に結合する</span></label>` : ""}
    <table class="tbl"><tr><th>ファイル</th><th>サイズ</th><th style="width:220px">状態</th><th></th></tr>${q.map((j) => {
      const [label, cls] = IMPORT_STATE[j.state];
      const st = j.state === "running" ? `<div class="hrow"><div class="bar grow"><i style="width:${Math.round(j.progress * 100)}%"></i></div><span class="num meta">${Math.round(j.progress * 100)}%</span></div>`
        : `<span class="chip ${cls}">${label}</span> ${j.error ? `<div class="err meta">${esc(j.error)}</div>` : ""}${j.note ? `<span class="meta">${esc(j.note)}</span>` : ""}`;
      return `<tr><td>${esc(j.file)}${j.joinGroup && importJoin ? ' <span class="chip">結合</span>' : ""}</td><td class="meta">${esc(j.size)}</td><td>${st}</td><td style="text-align:right">${j.state === "failed" ? `<button class="btn sm" data-retry="${j.id}">再試行</button>` : ""}</td></tr>`; }).join("")}</table>`;

/* ===== core: ~90 meetings/month — list, post-processing pipeline, Obsidian ===== */
const STEPS = ["recorded", "transcribed", "diarized", "minutes", "exported"];

const pending = (r) => r.status !== "exported";
const stale = (r) => r.note && r.note.state === "stale";
const notePath = (r) => { const o = K.settings.obsidian; return `${o.vault}/${o.folder}/${o.fileName.replace("{date}", r.date.slice(0, 10)).replace("{title}", r.title)}`; };
function statusChip(r) {
  if (stale(r)) return `<span class="chip warn">ノートが古い</span>`;
  if (r.status === "exported") return `<span class="chip ok">${K.STATUS.exported}</span>`;
  if (r._busy) return `<span class="chip info">${esc(r._busy)}</span>`;
  return `<span class="chip">${K.STATUS[r.status]}</span>`;
}
/* step dots: done = filled, current = outlined; text says where it stopped */
function pipelineHTML(r) {
  const i = STEPS.indexOf(r.status);
  const dots = STEPS.map((s, k) => `<span title="${K.STATUS[s]}" style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--fg);background:${k <= i ? "var(--fg)" : "transparent"}"></span>`).join("");
  return `<span class="hrow" style="gap:3px">${dots}</span>`;
}
function groupLabel(date) {
  const d = date.slice(0, 10);
  if (d === TODAY) return "今日";
  const diff = Math.round((new Date(TODAY) - new Date(d)) / 864e5);
  if (diff === 1) return "昨日";
  if (diff < 7) return "今週";
  if (diff < 14) return "先週";
  return d.slice(0, 7).replace("-", " 年 ") + " 月";
}
/* the one list used everywhere: date groups (older groups folded), status filter, row renderer injectable */
const LIST = { filter: "all", open: new Set(["今日", "昨日", "今週"]) };
const FILTERS = [["all", "すべて"], ["pending", "後処理待ち"], ["stale", "ノートが古い"]];
function listFiltered() {
  return byDateDesc().filter((r) => LIST.filter === "all" || (LIST.filter === "pending" ? pending(r) : stale(r)));
}
function renderRecList(el, onOpen, opts = {}) {
  const rows = listFiltered(), groups = [];
  rows.forEach((r) => { const g = groupLabel(r.date); if (!groups.length || groups[groups.length - 1][0] !== g) groups.push([g, []]); groups[groups.length - 1][1].push(r); });
  const nPend = K.recordings.filter(pending).length, nStale = K.recordings.filter(stale).length;
  const row = opts.row || ((r) => `<div class="row hrow" data-open-rec="${r.id}" style="padding:5px 8px"><span class="num meta">${r.date.slice(11)}</span><span class="grow">${esc(r.title)}</span>${pipelineHTML(r)}${statusChip(r)}${isDirty(r) ? '<span class="chip warn">未保存</span>' : ""}</div>`);
  el.innerHTML = `<div class="hrow" style="margin-bottom:6px"><div class="seg">${FILTERS.map(([k, v]) => `<button data-lf="${k}" class="${LIST.filter === k ? "sel" : ""}">${v}${k === "pending" ? " " + nPend : k === "stale" ? " " + nStale : ""}</button>`).join("")}</div><span class="grow"></span>
    ${LIST.filter === "pending" && nPend ? `<button class="btn sm" data-lall>後処理をすべて進める</button>` : ""}${LIST.filter === "stale" && nStale ? `<button class="btn sm" data-lstale>ノートをすべて更新</button>` : ""}<span class="meta">${rows.length} 件</span></div>
    ${groups.map(([g, rs]) => { const open = LIST.open.has(g) || LIST.filter !== "all";
      return `<div class="hrow" data-lg="${esc(g)}" style="cursor:pointer;padding:6px 0 2px"><h3 class="grow">${open ? "▾" : "▸"} ${esc(g)}</h3><span class="meta">${rs.length} 件${rs.some(pending) ? " · 後処理待ち " + rs.filter(pending).length : ""}</span></div>${open ? rs.map(row).join("") : ""}`; }).join("") || `<p class="muted">該当する会議はありません。</p>`}`;
  el.onclick = (e) => {
    const t = e.target;
    if (t.dataset.lf) { LIST.filter = t.dataset.lf; return renderRecList(el, onOpen, opts); }
    const g = t.closest("[data-lg]"); if (g) { const k = g.dataset.lg; LIST.open.has(k) ? LIST.open.delete(k) : LIST.open.add(k); return renderRecList(el, onOpen, opts); }

    if (t.dataset.lstale !== undefined) { K.recordings.filter(stale).forEach((r) => writeNote(r, true)); toast("古いノートをすべて更新しました"); call("onRecChange"); return; }

    const o = t.closest("[data-open-rec]"); if (o) onOpen(o.dataset.openRec);
  };
}

      { id: p + "b", lane: r.lanes[r.lanes.length - 1], spk: null, start: 5600, end: 9800, text: "今日の議題は次の四半期の計画です。", units: ["今日の", "議題は", "次の", "四半期の", "計画です。"], tr: "Today's topic is next quarter's plan.", reviewed: false }];
  }
  if (r.status === "transcribed") { if (!Object.keys(r.speakers).length) r.speakers = { S1: { name: "", auto: "SPEAKER_00" }, S2: { name: "", auto: "SPEAKER_01" } }; r.utterances.forEach((u, i) => { if (!u.spk) u.spk = i % 2 ? "S2" : "S1"; }); r.diarized = true; }
  if (r.status === "diarized" && !r.minutes) r.minutes = fakeMinutes(r);
  if (r.status === "minutes") { writeNote(r, true); return; }
  r.status = STEPS[STEPS.indexOf(r.status) + 1];
}
function finishPipeline(r, quiet) {
  if (!pending(r) || r._busy) return;
  const auto = K.settings.obsidian.autoExport === "minutes";
  const tick = () => {
    const stopAt = auto ? "exported" : "minutes";
    if (r.status === stopAt || r.status === "exported") { r._busy = null; if (!quiet) toast("「" + r.title + "」の後処理が終わりました" + (r.status === "exported" ? "（Obsidian に書き出し済み）" : "")); call("onRecChange"); return; }
    r._busy = STEP_ACTION[r.status] + "中…"; call("onRecChange");
    setTimeout(() => { stepOnce(r); tick(); }, 450);
  };
  tick();
}
function writeNote(r, quiet) {
  r.note = { path: K.settings.obsidian.folder + "/" + notePath(r).split("/").pop(), state: "fresh" };
  r.status = "exported";
  if (!quiet) toast(notePath(r) + " に書き出しました");
}
function openObsidian(r) {
  sheet("Obsidian に書き出す", `<div class="meta mono">${esc(notePath(r))}</div>${r.note ? `<div class="meta" style="margin-top:4px">${stale(r) ? "保管庫のノートは、この会議の最新の内容より古くなっています" : "保管庫のノートは最新です"}</div>` : ""}
    <pre class="pre" style="margin-top:8px">${esc(K.exportText(r, "obsidian"))}</pre><div class="hrow" style="margin-top:12px"><span class="grow meta">議事録ができたら自動で書き出す: ${K.settings.obsidian.autoExport === "minutes" ? "オン" : "オフ"}</span><button class="btn primary" data-ok>${r.note ? "ノートを更新" : "書き出す"}</button></div>`, (el, close) => {
    $("[data-ok]", el).onclick = () => { writeNote(r); close(); call("onRecChange"); };
  });
}
function obsidianSettingsHTML() {
  const o = K.settings.obsidian;
  return `<div class="sec"><h3>Obsidian</h3><div class="kv">
    <span>保管庫</span><input class="input mono" data-ob="vault" value="${esc(o.vault)}">
    <span>フォルダ</span><input class="input mono" data-ob="folder" value="${esc(o.folder)}">
    <span>ファイル名</span><input class="input mono" data-ob="fileName" value="${esc(o.fileName)}">
    <span>自動で書き出す</span><select class="input" data-ob="autoExport" style="width:220px"><option value="minutes" ${o.autoExport === "minutes" ? "selected" : ""}>議事録ができたら</option><option value="off" ${o.autoExport !== "minutes" ? "selected" : ""}>しない（手動のみ）</option></select>
    <span>文字起こしを含める</span>${tog("ob-includeTranscript", o.includeTranscript)}
    <span>訳文を含める</span>${tog("ob-includeTranslation", o.includeTranslation)}
    <span>frontmatter</span><span class="meta mono">${o.frontmatter.join(", ")}</span></div></div>`;
}

/* ===== 20 live-statusbar ===== */
const T = { tab: "session", rec: null, st: {}, q: "" };
const LV = { me: 0, them: 0 };
const TABS = [["session", "セッション"], ["recs", "録音"], ["search", "検索"], ["import", "取り込み"], ["models", "モデル"], ["settings", "設定"]];
const themSilent = () => S.phase === "rec" && S.mode !== "face" && elapsed() > 14000 && elapsed() < 21000;

/* ---------- the status bar: same on every screen ---------- */
function lvlHTML(k) { return `<div class="bar lvl"><i data-lv="${k}" style="width:${Math.round(LV[k] * 100)}%"></i></div>`; }
function renderSB() {
  const st = S.phase === "rec" ? `<span class="dot-rec"></span><b>録音中</b><span class="meta">${S.mode === "face" ? "対面" : "会議"}</span>`
    : S.phase === "finishing" ? `<span class="warn">翻訳を仕上げています…</span>` : `<span class="muted">待機中</span>`;
  const face = S.phase === "rec" ? S.mode === "face" : false;
  const them = face ? `<span class="meta">Them なし（対面）</span>`
    : `<span class="spk" style="color:var(--lane-them)">Them</span>${lvlHTML("them")}<span class="meta" data-themnote>${themSilent() ? "" : esc(S.capturing)}</span>${themSilent() ? '<span class="chip warn">無音</span>' : ""}`;
  const save = S.phase === "rec" ? (face ? (faceSaves() ? "保存する" : '<span class="warn">保存しない</span>') : "保存する") : "対面は" + (faceSaves() ? "保存する" : "保存しない");
  const dirty = K.recordings.filter(isDirty);
  const pr = S.playerRec && recById(S.playerRec);
  $("#sb").innerHTML = `
    <div class="seg-i" data-sb="state">${st}</div>
    <div class="seg-i" data-sb="me"><span class="spk" style="color:var(--lane-me)">Me</span>${lvlHTML("me")}</div>
    <div class="seg-i" data-sb="them">${them}</div>
    <div class="seg-i" data-sb="save"><span class="meta">保存</span>${save}</div>
    <div class="seg-i static"><span class="meta">経過</span><span class="num" data-elapsed>${K.mmss(elapsed())}</span></div>
    <div class="seg-i" data-sb="auto"><span class="meta">自動録音</span><span class="${S.auto.state === "エラー" ? "err" : S.auto.state === "録音中" ? "" : ""}">${esc(S.auto.state)}</span></div>
    <div class="seg-i spacer"></div>
    ${dirty.length ? `<div class="seg-i" data-sb="dirty"><span class="chip warn">未保存 ${dirty.length}</span></div>` : ""}
    ${pr ? `<div class="seg-i" data-sb="play"><span data-playicon>${S.playing ? "一時停止" : "▶"}</span><span class="meta">${esc(pr.title)}</span><span class="num" data-sbpos>${K.mmss(S.pos)} / ${K.mmss(pr.durationMs)}</span></div>` : ""}
    ${S.phase === "rec" ? `<div class="seg-i" style="border-right:0"><button class="btn sm" data-sb="stop">■ 停止</button></div>` : ""}`;
}
function updateSB() {
  $$("[data-lv]").forEach((i) => (i.style.width = Math.round(LV[i.dataset.lv] * 100) + "%"));
  $$("[data-elapsed]").forEach((x) => (x.textContent = K.mmss(elapsed())));
}
/* fake input meters: live while recording, low "monitor" level while the pre-flight check is visible */
setInterval(() => {
  const r = Math.random;
  if (S.phase === "rec") {
    const last = S.lines[S.lines.length - 1], speaking = last && !last.text ? last.lane : null;
    LV.me = speaking === "Me" ? 0.45 + r() * 0.45 : 0.04 + r() * 0.08;
    LV.them = S.mode === "face" || themSilent() ? 0 : speaking === "Them" ? 0.4 + r() * 0.5 : 0.03 + r() * 0.06;
  } else if (T.tab === "session") { LV.me = 0.05 + r() * 0.3; LV.them = 0.02 + r() * 0.1; }
  else { LV.me = 0; LV.them = 0; }
  updateSB();
}, 140);
let wasSilent = false;
setInterval(() => { const s = themSilent(); if (s !== wasSilent) { wasSilent = s; renderSB(); if (s) notice("Them（システム音声）が無音です。相手の声が録れていない可能性があります。", "", 6000); } }, 500);

$("#sb").addEventListener("click", (e) => {
  const seg = e.target.closest("[data-sb]"); if (!seg) return;
  const k = seg.dataset.sb;
  if (k === "stop") stopSession(true);
  if (k === "state") go("session");
  if (k === "me") popMenu(seg, [["入力: MacBook Pro のマイク", () => go("session")], ["入力を確認", () => go("session")]]);
  if (k === "them") popMenu(seg, [["録音中の出力: " + S.capturing, () => go("session")], ["出力を切り替える…", () => askDevice({ detected: "AirPods Pro", capturing: S.capturing })]]);
  if (k === "save") { K.settings.saveFaceToFace = !faceSaves(); toast("対面モードの録音を" + (faceSaves() ? "保存します" : "保存しません")); renderSB(); if (T.tab === "session") renderView(); }
  if (k === "auto") autoMenu(seg);
  if (k === "dirty") { const r = K.recordings.find(isDirty); openRec(r.id); }
  if (k === "play") togglePlay(recById(S.playerRec));
});
function autoMenu(anchor) {
  const on = K.settings.autoRecord;
  popMenu(anchor, on ? [["自動録音をオフにする", () => setAutoRecord(false)], ["再現: 会議が始まる", autoMeetingBegins], ["再現: 会議が終わる（60 秒で停止）", autoMeetingEnds], ["再現: エラー", autoError]]
    : [["自動録音をオンにする", () => setAutoRecord(true)]]);
}
/* macOS menu bar status item (#18) */
function renderMB() {
  $("#mb").innerHTML = S.phase === "rec" ? `<span class="dot-rec"></span> <span class="num" data-elapsed>${K.mmss(elapsed())}</span>` : S.auto.state === "エラー" ? `<span class="err">Kikimimic</span>` : "Kikimimic";
}
$("#mb").onclick = (e) => {
  e.stopPropagation();
  popMenu(e.currentTarget, S.phase === "rec" ? [["■ 停止", () => stopSession(true)], ["自動録音: " + S.auto.state, () => {}]]
    : [["● 会議を録音", () => startSession("meeting")], ["対面", () => startSession("face")], ["自動録音: " + S.auto.state, () => go("settings")]]);
};

/* ---------- tabs and views ---------- */
function go(tab) { T.tab = tab; renderTabs(); renderView(); }
function openRec(id, uttId) { T.tab = "recs"; if (T.rec !== id) T.st = {}; T.rec = id; if (uttId) T.st.tab = "text"; renderTabs(); renderView(); if (uttId) focusUtt($("#view"), uttId); }
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, v]) => `<button class="btn ${T.tab === k ? "sel" : ""}" data-tab="${k}">${v}</button>`).join("");
}
$("#tabs").onclick = (e) => { const k = e.target.dataset.tab; if (!k) return; if (k === "recs" && T.tab === "recs") T.rec = null; go(k); };
function renderView() {
  const el = $("#view"); el.onclick = null; el.onchange = null; el.className = "view";
  if (T.tab === "recs" && T.rec) return renderDetail(el, recById(T.rec), T.st, { back: true, player: false });
  el.className = "view scroll pad";
  if (T.tab === "session") return S.phase === "idle" ? renderCheck(el) : renderLive(el);
  if (T.tab === "recs") { const y = el.scrollTop; renderRecList(el, (id) => openRec(id)); el.scrollTop = y; return; }
  if (T.tab === "search") {
    el.innerHTML = `<input class="input" style="width:100%" data-sq placeholder="録音とフォルダを検索" value="${esc(T.q)}"><div data-res style="margin-top:8px"></div><details class="sec"><summary class="meta" style="cursor:pointer">検索するフォルダ</summary><div data-fbox style="margin-top:6px"></div></details>`;
    const draw = () => renderSearchResults($("[data-res]", el), T.q), fb = $("[data-fbox]", el), drawF = () => { fb.innerHTML = foldersHTML(); draw(); };
    drawF(); wireFolders(fb, drawF);
    $("[data-sq]", el).oninput = (e) => { T.q = e.target.value; draw(); }; $("[data-sq]", el).focus();
    return;
  }
  if (T.tab === "import") return renderImport(el);
  if (T.tab === "models") return renderModels(el);
  if (T.tab === "settings") return renderSettings(el);
}
/* pre-flight: what the status bar will show, large, before the meeting */
function renderCheck(el) {
  const m = (id) => K.models.find((x) => x.id === K.settings[id]);
  const next = K.calendar.events.find((e) => e.inMin > 0);
  const nP = K.recordings.filter(pending).length;
  el.innerHTML = `<div class="check-grid">
    <div class="card stack"><div class="hrow"><span class="spk grow" style="color:var(--lane-me)">Me（マイク）</span><span class="chip ok">入力あり</span></div><div class="meta">MacBook Pro のマイク</div>${lvlHTML("me")}</div>
    <div class="card stack"><div class="hrow"><span class="spk grow" style="color:var(--lane-them)">Them（システム音声）</span><span class="chip ok">許可済み</span></div><div class="meta" data-cap>${esc(S.capturing)}</div>${lvlHTML("them")}</div>
    <div class="card stack"><div class="hrow"><h3 class="grow">モデル</h3><button class="btn sm ghost" data-c="models">変更</button></div>
      <div class="hrow"><span class="grow">${esc(m("asr").name)}</span><span class="chip ok">使用中</span></div>
      <div class="hrow"><span class="grow">${K.settings.translateInto ? esc(m("mt").name) + " → " + K.langs[K.settings.translateInto] : "翻訳しない"}</span>${K.settings.translateInto ? '<span class="chip ok">使用中</span>' : ""}</div></div>
    <div class="card stack"><h3>保存</h3><div class="hrow"><span class="grow">会議</span><span>保存する</span></div>
      <div class="hrow"><span class="grow">対面</span><div class="seg"><button data-c="face-on" class="${faceSaves() ? "sel" : ""}">保存する</button><button data-c="face-off" class="${faceSaves() ? "" : "sel"}">保存しない</button></div></div>
      <div class="meta mono">${esc(K.settings.recordDir)}</div></div></div>
  <div class="hrow" style="margin:16px 0;max-width:760px"><button class="btn rec" data-c="meeting">● 会議を録音</button><button class="btn" data-c="face">対面</button><span class="grow"></span>
    ${next && S.signedIn ? `<span class="meta">次: ${esc(next.start)} ${esc(next.title)}（あと ${next.inMin} 分）</span><button class="btn sm" data-c="cutin">カードを表示</button>` : ""}</div>
  ${nP ? `<div class="hrow" style="max-width:760px"><span class="meta grow">後処理が止まっている会議 ${nP} 件</span><button class="btn sm" data-c="pending">見る</button></div>` : ""}
  ${S.lines.length ? `<div class="sep" style="max-width:760px"></div><div class="hrow" style="max-width:760px"><h3 class="grow">前回のセッション</h3><button class="btn sm" data-c="clear">クリア</button></div><div class="livecol">${S.lines.map((l) => liveLineHTML(l)).join("")}</div>` : ""}`;
  el.onclick = (e) => {
    const c = e.target.closest("[data-c]")?.dataset.c; if (!c) return;
    if (c === "meeting" || c === "face") startSession(c);
    if (c === "face-on" || c === "face-off") { K.settings.saveFaceToFace = c === "face-on"; renderSB(); renderView(); }
    if (c === "models") go("settings");
    if (c === "cutin") showCutin(next);
    if (c === "pending") { LIST.filter = "pending"; T.rec = null; go("recs"); }
    if (c === "clear") { S.lines = []; renderView(); }
  };
}
function renderLive(el) {
  el.innerHTML = `<div class="livecol"><div class="hrow" style="margin-bottom:8px"><h2 class="grow">${S.phase === "finishing" ? "翻訳を仕上げています…" : S.mode === "face" ? "対面" : "会議"}</h2>
    ${S.phase === "rec" ? `<button class="btn sm" data-l="advise" data-advn>アドバイス${S.pendingAdvice.length ? " " + S.pendingAdvice.length : ""}</button><button class="btn sm" data-l="stop">■ 停止</button>` : ""}</div>
    <div class="stack" data-advlive>${S.shownAdvice.map((c) => adviceCardHTML(c)).join("")}</div><div data-lines>${S.lines.map((l) => liveLineHTML(l)).join("") || '<span class="meta">聞き取り中…</span>'}</div></div>`;
  el.onclick = (e) => { const a = e.target.dataset.l; if (a === "stop") stopSession(true); if (a === "advise") revealAdvice(); };
  el.scrollTop = el.scrollHeight;
}

/* ---------- hooks from the shared core ---------- */
Object.assign(V, {
  onTick() { updateSB(); },
  onLive() {
    if (T.tab !== "session" || S.phase === "idle") return;
    const el = $("#view"), box = $("[data-lines]", el), adv = $("[data-advlive]", el);
    if (box && adv && adv.children.length === S.shownAdvice.length) {
      box.innerHTML = S.lines.map((l) => liveLineHTML(l)).join(""); const b = $("[data-advn]", el);
      if (b) b.textContent = "アドバイス" + (S.pendingAdvice.length ? " " + S.pendingAdvice.length : ""); el.scrollTop = el.scrollHeight;
    } else renderLive(el);
  },
  onPhase() { if (S.phase === "rec") T.tab = "session"; renderTabs(); renderView(); renderSB(); renderMB(); },
  onAuto() { renderSB(); renderMB(); },
  onSettings() { renderSB(); },
  onDevice() { renderSB(); const c = $("[data-cap]"); if (c) c.textContent = S.capturing; },
  onRecChange() { renderSB(); if (T.tab === "recs") { const b = $("#view [data-body]"), y = b ? b.scrollTop : 0; renderView(); const b2 = $("#view [data-body]"); if (b2) b2.scrollTop = y; } },
  onImport() { if (T.tab === "import") renderImport($("#view")); },
  onPlayer(pos, playing) {
    const p = $("[data-sbpos]"), i = $("[data-playicon]");
    if (!p) return renderSB();
    p.textContent = K.mmss(pos) + " / " + K.mmss(recById(S.playerRec).durationMs); i.textContent = playing ? "一時停止" : "▶";
  },
  openUtt(recId, uttId) { openRec(recId, uttId); },
  closeDetail() { T.rec = null; T.st = {}; renderView(); },
});
renderTabs(); renderView(); renderSB(); renderMB(); aboutButton();

</script>
</body>
</html>
