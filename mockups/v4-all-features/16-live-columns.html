<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kikimimic v4 — 16 ライブ2カラム</title>
<meta name="kkm-concept" content="ライブは Me / Them の2カラム並列。左が自分、右が相手、それぞれの原文の下に訳文">
<meta name="kkm-why" content="通訳的に使う人が会議の最中に使う。自分と相手を左右に分けると「誰の言葉か」を読まずに位置で分かるので、相手の訳文だけを右側で追い続けられる。">
<meta name="kkm-tradeoff" content="発話の前後関係が見えにくい（左右をまたぐ順序は時刻を見て判断する）。録音一覧・検索・モデル・設定は上タブの奥。">
<link rel="stylesheet" href="shared/kit.css">
<style>
/* layout only — colors come from kit.css */
.grow { flex: 1; min-width: 0; }
.hstack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hstack.end { justify-content: flex-end; }
.page { padding: 16px 20px; overflow-y: auto; min-height: 0; flex: 1; }
.page.narrow > * { max-width: 760px; }
.wide { width: 100%; }
.srow { padding: 8px 0; border-bottom: 1px solid var(--border); }
.qrow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.dhead { padding: 10px 20px; border-bottom: 1px solid var(--border); }
.dbody { flex: 1; padding: 10px 20px; }
.dbody .utt { max-width: 820px; }
.tools { position: sticky; top: -10px; background: var(--bg); padding: 6px 0; z-index: 1; }
.player { display: flex; gap: 10px; align-items: center; padding: 8px 120px 8px 20px; border-top: 1px solid var(--border); }
.pbar { flex: 1; cursor: pointer; height: 8px; }
.tbl { border-collapse: collapse; margin: 6px 0; } .tbl th, .tbl td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--border); }
.tbl th { font-weight: 400; font-size: 12px; color: var(--muted); }
.pre { white-space: pre-wrap; max-height: 320px; overflow: auto; margin: 10px 0; }
.quote { margin-top: 6px; font-size: 13px; }
.mrow { padding: 3px 0; }
.adv .hstack { flex-wrap: nowrap; }
.about { position: absolute; right: 8px; bottom: 6px; z-index: 40; }
#main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.dayh { margin: 14px 0 2px; font-size: 12px; color: var(--muted-2); font-weight: 600; }
.lrow { display: flex; gap: 10px; align-items: center; padding: 5px 8px; }
.pipe { font-size: 12.5px; }
.nav { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
/* 16: live = two lanes side by side */
.sbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ctx { display: flex; gap: 16px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--border); }
#snotice:not(:empty) { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 6px; }
.cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.cols.one { grid-template-columns: 1fr; }
.col { display: flex; flex-direction: column; min-height: 0; }
.col + .col { border-left: 1px solid var(--border); }
.colhead { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.lanemark { width: 3px; height: 16px; border-radius: 2px; }
.colhead .bar { width: 56px; } .colhead .bar > i { transition: width .3s; }
.colbody { flex: 1; overflow-y: auto; padding: 10px 14px; }
.colbody .utt { padding: 6px 0; }
.colbody .txt { font-size: 15px; }
.colbody .tr { font-size: 15px; }
.empty { margin-top: 40%; text-align: center; }
.advtray { border-top: 1px solid var(--border); padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 16 ライブ2カラム</div>
<div class="win">
  <div class="menubar" id="menubar"></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="nav" id="nav"></div>
  <div id="main"></div>
  <button class="btn sm ghost about" data-act="about">この案について</button>
  <div id="lyCutin"></div><div id="lySheet"></div><div id="lyMenu"></div><div id="lyToast"></div>
</div>

<script src="shared/data.js"></script>
<script>
"use strict";
// ---------- core: utilities, state, dispatcher, layers ----------
const K = window.KKM, S = K.settings, mm = K.mmss;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const laneColor = (l) => (l === "Them" ? "var(--lane-them)" : "var(--lane-me)");
const LANE_LABEL = { Me: "Me · マイク", Them: "Them · システム音声", Imported: "取り込み" };
const SRC_LABEL = { meeting: "会議", face: "対面", import: "取り込み" };
const isJa = (t) => /[぀-ヿ一-鿿]/.test(t);
const splitUnits = (t) => t.split(/(?<=\s)|(?<=[、。])/);
const nowStr = () => { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

const st = {
  tab: "session",
  // session
  phase: "idle", mode: null, eng: null, lines: [], sessIdx: 0, faceSave: S.saveFaceToFace, themDevice: "MacBook Pro のスピーカー",
  devQ: null, devInfo: null, lastSaved: null,
  advisorPool: [], advisorCards: [], advisorMuted: false, advisorThinking: null, advisorDismissed: new Set(),
  // auto record (#35)
  auto: false, autoState: S.autoRecord ? "waiting" : "off", autoSuppressed: false, autoEnd: null, autoErr: null,
  // recordings
  recId: null, detailTab: "transcript", dirty: false, identifying: null, cutMode: false, cuts: new Set(), merges: new Set(),
  player: null, cursorUtt: null, qa: {}, joinWav: true, names: {},
  // other
  dl: {}, cal: K.calendar.signedIn ? "in" : "out", advOpen: false, q: "",
  ev: { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, from: K.evaluation.range[0] / 1000, to: K.evaluation.range[1] / 1000,
    collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, ran: false, playing: -1 },
  sheet: null, sheetKind: null, menu: null, cutin: null,
};
const ACT = {}, INP = {};

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  const inMenu = e.target.closest(".menu");
  if (st.menu && !inMenu) { st.menu = null; renderMenu(); }
  if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset.arg, t, e);
  if (inMenu && st.menu && st.menu.el === inMenu.dataset.mid) { st.menu = null; renderMenu(); }
});
document.addEventListener("input", (e) => { const k = e.target.dataset && e.target.dataset.in; if (k && INP[k]) INP[k](e.target.value, e.target, e); });
document.addEventListener("change", (e) => { const k = e.target.dataset && e.target.dataset.ch; if (k && INP[k]) INP[k](e.target.value, e.target, e); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter) { const f = ACT[e.target.dataset.enter]; if (f) f(e.target.dataset.arg, e.target, e); }
  if (e.key === "Escape") { if (st.menu) { st.menu = null; renderMenu(); } else if (st.sheet) closeSheet(); }
});

// layers: each in its own container so re-rendering one never resets another
function openSheet(kind, fn) { st.sheetKind = kind; st.sheet = fn; renderSheet(); }
function closeSheet() { st.sheet = null; st.sheetKind = null; renderSheet(); }
function renderSheet() { $("lySheet").innerHTML = st.sheet ? `<div class="scrim" data-act="scrim"><div class="sheet">${st.sheet()}</div></div>` : ""; }
ACT.scrim = (a, el, e) => { if (e.target === el) closeSheet(); };
ACT.closeSheet = () => closeSheet();
let menuSeq = 0;
function placeMenu(x, y, html) { const w = document.querySelector(".win").getBoundingClientRect(); st.menu = { el: "m" + ++menuSeq, x: Math.max(4, Math.min(x - w.left, w.width - 240)), y: y - w.top, html }; renderMenu(); }
// deferred so the click that opens a menu is not also the click that closes it
function openMenu(anchor, html) { const r = anchor.getBoundingClientRect(); setTimeout(() => placeMenu(r.left, r.bottom + 4, html)); }
function openMenuAt(x, y, html) { placeMenu(x, y, html); }
function renderMenu() { $("lyMenu").innerHTML = st.menu ? `<div class="menu" data-mid="${st.menu.el}" style="left:${st.menu.x}px;top:${st.menu.y}px">${st.menu.html}</div>` : ""; }
let toastT = 0;
function toast(msg) { $("lyToast").innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => { $("lyToast").innerHTML = ""; }, 2600); }

// ---------- menubar status item (#18) ----------
function autoLabel() { if (!S.autoRecord) return "off"; if (st.autoState === "error") return "error"; return st.phase === "listening" && st.auto ? "recording" : "waiting"; }
const nextEvent = () => K.calendar.events.find((e) => e.inMin >= 0);
const AUTO_JA = { off: "オフ", waiting: "待機中", recording: "録音中", error: "エラー" };
function statusText() {
  if (st.phase === "listening") return `<span class="dot-rec"></span> <span class="num" data-elapsed>${mm(st.eng.elapsed())}</span>${st.auto ? " 自動" : ""}`;
  if (st.phase === "finishing") return "翻訳を仕上げています…";
  if (autoLabel() === "error") return `<span class="err">自動録音: エラー</span>`;
  if (autoLabel() === "waiting") return "自動録音: 待機中";
  return "待機中";
}
function renderMenubar() {
  const e = st.cal === "in" ? nextEvent() : null;
  $("menubar").innerHTML = `<span class="meta">${e ? esc(e.start + " " + e.title) : ""}</span><button class="btn ghost sm" data-act="mbMenu">Kikimimic · ${statusText()}</button>`;
}
ACT.mbMenu = (a, el) => {
  const rec = st.phase === "listening";
  let h = `<div class="meta" style="padding:4px 10px">${rec ? (st.mode === "face" ? "対面" : "会議") + "を録音中" : st.phase === "finishing" ? "翻訳を仕上げています…" : "待機中"} · 自動録音: ${AUTO_JA[autoLabel()]}</div>`;
  h += rec ? `<button data-act="stop">■ 停止</button>` : `<button data-act="start" data-arg="meeting">● 会議を録音</button>`;
  h += `<button data-act="showWindow">ウィンドウを表示</button><div class="sep"></div>`;
  if (S.autoRecord) {
    h += `<button data-act="demoDetect">（デモ）会議の開始を検出</button>`;
    if (rec && st.auto) h += `<button data-act="demoEnd">（デモ）会議の終了を検出</button>`;
    h += `<button data-act="demoErr">（デモ）自動録音のエラー</button>`;
  } else h += `<button data-act="tab" data-arg="settings">自動録音を設定…</button>`;
  openMenu(el, h);
};
ACT.showWindow = () => ACT.tab(st.tab);

const TABS = [["session", "セッション"], ["recordings", "録音"], ["search", "検索"], ["models", "モデル"], ["settings", "設定"]];
const liveChip = () => st.phase === "listening" ? `<button class="chip rec" data-act="tab" data-arg="session"><span class="dot-rec"></span> 録音中 <span class="num" data-elapsed>${mm(st.eng.elapsed())}</span></button>` : st.phase === "finishing" ? `<span class="meta">翻訳を仕上げています…</span>` : "";
// "この案について": shows the three meta tags; no explanatory prose in the UI itself
ACT.about = () => openSheet("about", () => { const m = (n) => esc(document.querySelector(`meta[name=${n}]`).content);
  return `<h2>この案について</h2><div class="sep"></div><h3>コンセプト</h3><p>${m("kkm-concept")}</p><h3>仮説と理由</h3><p>${m("kkm-why")}</p><h3>捨てるもの</h3><p>${m("kkm-tradeoff")}</p><div class="hstack end"><button class="btn" data-act="closeSheet">閉じる</button></div>`; });
ACT.tab = (k) => { st.tab = k; render(); };
function render() { renderMenubar(); renderNav(); renderMain(); renderSheet(); renderMenu(); renderCutin(); }
function renderMain() {
  const m = $("main");
  if (st.tab === "session") { m.innerHTML = sessionHtml(); updateLive(); }
  else if (st.tab === "recordings") { m.innerHTML = st.recId ? detailHtml() : listHtml(); if (st.recId) afterDetail(); }
  else if (st.tab === "search") { m.innerHTML = searchHtml(); renderResults(); }
  else if (st.tab === "models") m.innerHTML = modelsHtml();
  else m.innerHTML = settingsHtml();
}
// ---------- session engine (#1 #2 #3 #16 #17 #18) ----------
function liveMode() { return st.mode === "face" ? "face" : S.translateInto === "none" ? "noTranslate" : "meeting"; }
function startSession(mode, auto) {
  if (st.phase !== "idle") return;
  if (S.clearOnStart) st.lines = [];
  Object.assign(st, { mode, auto: !!auto, phase: "listening", sessIdx: st.lines.length, devQ: null, devInfo: null, lastSaved: null,
    advisorPool: [], advisorCards: [], advisorMuted: false, advisorThinking: null, autoEnd: null, themDevice: "MacBook Pro のスピーカー", advisorDismissed: new Set() });
  st.eng = K.live(liveMode(), onLive);
  if (typeof onSessionStart === "function") onSessionStart();
  render();
}
ACT.start = (mode) => startSession(mode, false);
ACT.stop = () => stopSession(true);
ACT.toggleFaceSave = () => { st.faceSave = !st.faceSave; toast(st.faceSave ? "この対面の録音は保存します" : "この対面の録音は保存しません"); render(); };
function stopSession(manual) {
  if (st.phase !== "listening") return;
  if (st.auto && manual) { st.autoSuppressed = true; toast("手動で停止しました。この会議では自動録音を再開しません"); }
  st.phase = "finishing"; st.autoEnd = null; clearTimeout(st.advisorThinking); st.advisorThinking = null; clearInterval(autoEndT); render();
  const t0 = Date.now();
  const check = () => {
    const pending = st.lines.slice(st.sessIdx).some((l) => !l.done || l.translating);
    if (pending && Date.now() - t0 < 5000) return setTimeout(check, 200);
    finishSession();
  };
  setTimeout(check, 400);
}
function finishSession() {
  const elapsed = st.eng.elapsed(); st.eng.stop();
  const lines = st.lines.slice(st.sessIdx).filter((l) => l.done);
  const save = st.mode === "meeting" || st.faceSave;
  if (save && lines.length) {
    const id = "n" + Date.now().toString(36);
    K.recordings.push({ id, status: "transcribed", note: null, title: (st.mode === "face" ? "対面 " : "会議 ") + nowStr().slice(11), date: nowStr(), durationMs: elapsed, source: st.mode,
      lanes: st.mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, minutes: null, stats: null, advisor: [], diarized: false,
      utterances: lines.map((l, i) => ({ id: id + "_" + i, lane: l.lane, spk: null, start: l.at, end: Math.max(l.at + 1000, (lines[i + 1] ? lines[i + 1].at : l.at + 3000) - 200),
        text: l.text, units: splitUnits(l.text), tr: l.tr || null, reviewed: false })) });
    st.lastSaved = { id, saved: true };
  } else st.lastSaved = { saved: false, face: st.mode === "face" };
  st.phase = "idle"; st.auto = false; st.mode = null;
  if (typeof onSessionEnd === "function") onSessionEnd();
  render();
}
function onLive(ev) {
  const l = ev.id && st.lines.find((x) => x.id === ev.id);
  switch (ev.type) {
    case "line": if (st.phase !== "listening") return;
      st.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", text: "", tr: null, translating: false, done: false }); break;
    case "update": if (!l) return; l.committed = ev.committed; l.volatile = ev.volatile; break;
    case "commit": if (!l) return; l.committed = l.text = ev.text; l.volatile = ""; l.done = true; break;
    case "translating": if (!l || !wantTr(l)) return; l.translating = true; break;
    case "translate": if (!l || !wantTr(l)) return; l.translating = false; l.tr = ev.text; break;
    case "advisor": if (!st.advisorPool.some((c) => c.id === ev.card.id)) st.advisorPool.push(ev.card); return;
    case "question": if (st.mode === "face" || st.phase !== "listening") return; st.devQ = { detected: ev.detected, capturing: ev.capturing }; break;
    default: return;
  }
  updateLive();
}
// "⇄" off: only lines that are not already in the target language get translated
function wantTr(l) { if (S.translateInto === "none") return false; if (S.mutual) return true; return isJa(l.text) !== (S.translateInto === "ja"); }
const later = (fn, ms) => setTimeout(() => { fn(); updateLive(); }, ms);
ACT.devFollow = () => { st.themDevice = st.devQ.detected; st.devInfo = `${st.devQ.detected} を録音しています`; st.devQ = null; updateLive(); later(() => (st.devInfo = null), 4000); };
ACT.devStay = () => { st.devInfo = `${st.devQ.capturing} の録音を続けます`; st.devQ = null; updateLive(); later(() => (st.devInfo = null), 4000); };
ACT.clearLines = () => { st.lines = []; st.sessIdx = 0; updateLive(); };
document.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-ctx=clear]")) { e.preventDefault(); openMenuAt(e.clientX, e.clientY, `<button data-act="clearLines">クリア</button>`); } });
function noticesHtml() {
  let h = "";
  if (st.devQ) h += `<div class="notice">出力が ${esc(st.devQ.detected)} に変わりました（いまは ${esc(st.devQ.capturing)} を録音中）。切り替えますか？<span class="grow"></span><button class="btn sm" data-act="devFollow">切り替える</button><button class="btn sm" data-act="devStay">そのまま</button></div>`;
  if (st.devInfo) h += `<div class="notice">${esc(st.devInfo)}</div>`;
  if (st.autoEnd != null) h += `<div class="notice">会議が終わりました。あと <span class="num">${st.autoEnd}</span> 秒で自動停止します <span class="meta">（デモは 10 倍速）</span><span class="grow"></span><button class="btn sm" data-act="stop">今すぐ停止</button><button class="btn sm" data-act="autoKeep">録音を続ける</button></div>`;
  if (autoLabel() === "error" && st.phase === "idle") h += `<div class="notice error">自動録音: ${esc(st.autoErr)}<span class="grow"></span><button class="btn sm" data-act="autoRetry">再試行</button></div>`;
  return h;
}

// ---------- auto record (#35): waiting / recording / error, 60 s grace, no resume after manual stop ----------
let autoEndT = 0;
ACT.demoDetect = () => {
  if (!S.autoRecord) return;
  if (st.autoState === "error") return toast("自動録音はエラー中です。再試行してください");
  if (st.autoSuppressed) return toast("手動で停止した会議なので、自動録音は再開しません");
  if (st.phase !== "idle") return toast("すでに録音中です");
  toast("会議を検出しました。自動で録音を始めます"); startSession("meeting", true);
};
ACT.demoEnd = () => {
  if (!st.auto || st.phase !== "listening") return;
  st.autoEnd = S.autoStopGraceSec; clearInterval(autoEndT);
  autoEndT = setInterval(() => { st.autoEnd--; if (st.autoEnd <= 0) { clearInterval(autoEndT); st.autoEnd = null; stopSession(false); toast(`会議が終わって ${S.autoStopGraceSec} 秒たったので自動停止しました`); } else updateLive(); }, 100);
  updateLive();
};
ACT.autoKeep = () => { clearInterval(autoEndT); st.autoEnd = null; updateLive(); };
ACT.demoErr = () => { st.autoState = "error"; st.autoErr = "システム音声を取得できません。画面とシステムオーディオ録音の許可を確認してください。"; render(); };
ACT.autoRetry = () => { st.autoState = "waiting"; st.autoErr = null; toast("自動録音: 待機中"); render(); };

// ---------- advisor (#40, manual only) + web research (#41, opt-in) ----------
const liveLine = (id) => st.lines.find((l) => l.id === id);
ACT.advAsk = () => {
  if (st.advisorMuted || st.phase !== "listening") return;
  st.advisorThinking = setTimeout(() => {
    st.advisorThinking = null;
    const fresh = st.advisorPool.filter((c) => !st.advisorDismissed.has(c.id) && !st.advisorCards.some((x) => x.id === c.id));
    if (!fresh.length) toast("いまは助言はありません");
    fresh.forEach((c) => st.advisorCards.push({ ...c, after: c.ev[0] }));
    updateLive();
  }, 1200);
  updateLive();
};
ACT.advStop = () => { clearTimeout(st.advisorThinking); st.advisorThinking = null; updateLive(); };
ACT.advClose = (id) => { st.advisorDismissed.add(id); st.advisorCards = st.advisorCards.filter((c) => c.id !== id); updateLive(); };
ACT.advMute = () => { st.advisorMuted = true; st.advisorCards = []; toast("この会議ではアドバイザーを出しません"); updateLive(); };
ACT.advUnmute = () => { st.advisorMuted = false; updateLive(); };
ACT.liveJump = (id) => { const el = $("l-" + id); if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } };
const WEB_QUERY = "取り込み機能 担当者 決め方";
ACT.webAsk = (id) => openSheet("web", () => `<h2>Web で調べる</h2><p class="meta">次の検索語だけを送ります。音声・文字起こし・訳文は送りません。</p>
  <div class="card mono">${WEB_QUERY}</div>
  <div class="hstack end" style="margin-top:12px"><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn primary" data-act="webSend" data-arg="${id}">送信する</button></div>`);
ACT.webSend = (id) => { const c = st.advisorCards.find((x) => x.id === id); if (c) c.web = "「次の会議までに候補を出す人」を先に決める、という記事が多数。"; closeSheet(); updateLive(); };
function advisorCardHtml(c) {
  return `<div class="card adv"><div class="hstack"><span class="chip warn">${esc(c.kind)}</span><span class="grow">${esc(c.text)}</span>

function transcriptHtml(r, done) {
  if (!r.utterances.length) return `<p class="meta">まだ文字起こししていません。</p><button class="btn primary" data-act="step" data-arg="${r.id}">文字起こしする</button>`;

}
function uttHtml(r, u, last) {
  const name = K.speakerName(r, u.spk);
  const words = K.unitsWithTimes(u).map((w, i) => `${st.cutMode && st.cuts.has(u.id + ":" + i) ? `<span class="cue-cut"></span>` : ""}<span class="w" data-act="word" data-arg="${u.id}:${i}" data-s="${w.start}" data-e="${w.end}">${esc(w.w)}</span>`).join("");
  return `<div class="utt" id="u-${u.id}"><div class="head"><span class="ts num" data-act="seekUtt" data-arg="${u.id}">${mm(u.start)}</span>
    <span style="color:${laneColor(u.lane)}">${esc(u.lane)}</span>

    <button class="btn sm ${u.reviewed ? "sel" : "ghost"}" data-act="review" data-arg="${u.id}">${u.reviewed ? "✓ 校閲済み" : "校閲済みにする"}</button></div>
    <div>${words}</div>${u.tr ? `<div class="tr">${esc(u.tr)}</div>` : ""}
    ${st.cutMode && !last ? `<button class="btn ghost sm" data-act="merge" data-arg="${u.id}">${st.merges.has(u.id) ? "次の字幕との結合を解除" : "次の字幕と結合"}</button>` : ""}</div>`;
}
// subtitle cues = utterances, split at cuts, joined at merges (#9)
function cues(r) {
  const out = []; let carry = null;
  r.utterances.forEach((u) => {
    const ws = K.unitsWithTimes(u); let cur = carry || { start: ws[0].start, words: [], spk: u.spk }; carry = null;
    ws.forEach((w, i) => { if (i > 0 && st.cuts.has(u.id + ":" + i)) { cur.end = ws[i - 1].end; out.push(cur); cur = { start: w.start, words: [], spk: u.spk }; } cur.words.push(w.w); });
    cur.end = ws[ws.length - 1].end;
    if (st.merges.has(u.id)) carry = cur; else out.push(cur);
  });
  if (carry) out.push(carry);
  return out;
}
const srtT = (ms) => { const p = (n, l = 2) => String(n).padStart(l, "0"); return `${p(Math.floor(ms / 3.6e6))}:${p(Math.floor(ms / 6e4) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`; };
function srtWithCues(r) { return cues(r).map((c, i) => `${i + 1}\n${srtT(c.start)} --> ${srtT(c.end)}\n${K.speakerName(r, c.spk) ? "[" + K.speakerName(r, c.spk) + "] " : ""}${c.words.join("")}`).join("\n\n"); }

  st.player.seek(K.unitsWithTimes(u)[+i].start); st.player.play();
};

// stats (#12)
function statsOf(r) {
  if (r.stats) return r.stats;
  const total = r.utterances.reduce((n, u) => n + u.end - u.start, 0) || 1, out = { headphones: false };
  r.lanes.forEach((l) => { const us = r.utterances.filter((u) => u.lane === l), d = us.reduce((n, u) => n + u.end - u.start, 0);
    out[l] = { share: d / total, longestMs: Math.max(0, ...us.map((u) => u.end - u.start)), cpm: Math.round(us.reduce((n, u) => n + u.text.length, 0) / Math.max(d / 6e4, 0.01)),
      questions: us.filter((u) => /[?？]/.test(u.text)).length, overlaps: us.filter((u) => r.utterances.some((o) => o.lane !== l && o.start < u.start && o.end > u.start)).length }; });
  return out;
}
function statsHtml(r) {
  const s = statsOf(r);
  return `<table class="tbl"><tr><th></th><th>発話の割合</th><th>最長の連続発話</th><th>文字数/分</th><th>質問</th><th>重なった発話</th></tr>
    ${r.lanes.filter((l) => s[l]).map((l) => `<tr><td style="color:${laneColor(l)}">${esc(LANE_LABEL[l] || l)}</td><td><div class="hstack"><div class="bar" style="width:120px"><i style="width:${s[l].share * 100}%"></i></div><span class="num">${Math.round(s[l].share * 100)}%</span></div></td>
    <td class="num">${(s[l].longestMs / 1000).toFixed(1)} 秒</td><td class="num">${s[l].cpm}</td><td class="num">${s[l].questions}</td><td class="num">${s[l].overlaps}</td></tr>`).join("")}</table>
    <p class="meta">重なった発話はヘッドホンで録音したときだけ正しく数えられます（スピーカーだとマイクが相手の声を拾います）。この録音: ${s.headphones ? "ヘッドホンあり" : "ヘッドホン不明"}</p>`;
}

}

const stale = (r) => r.note && r.note.state === "stale";
const bump = (r, s) => { if (ORDER.indexOf(r.status) < ORDER.indexOf(s)) r.status = s; };
st.proc = {}; st.filter = "all"; st.listN = 25; st.batch = null;
const FILTERS = [["all", "すべて"], ["pending", "処理待ち"], ["recorded", "未処理"], ["stale", "ノートが古い"]];
const statusChip = (r) => `<span class="chip ${r.status === "recorded" ? "warn" : r.status === "exported" ? "ok" : ""}">${st.proc[r.id] ? esc(st.proc[r.id]) + "…" : K.STATUS[r.status]}</span>${stale(r) ? `<span class="chip warn">ノートが古い</span>` : ""}`;
const WD = "日月火水木金土";
function dayLabel(d) { const t = new Date(d.slice(0, 10) + "T00:00:00"), today = nowStr().slice(0, 10); return `${t.getMonth() + 1}/${t.getDate()}（${WD[t.getDay()]}）${d.slice(0, 10) === today ? " 今日" : ""}`; }
function listHtml() {
  const all = K.recordings.slice().sort((a, b) => b.date.localeCompare(a.date));
  const f = st.filter, rows = all.filter((r) => f === "all" || (f === "pending" ? pending(r) : f === "stale" ? stale(r) : r.status === f));
  const pend = all.filter(pending), counts = ORDER.slice(0, 4).map((s) => [s, pend.filter((r) => r.status === s).length]).filter(([, n]) => n);
  let h = `<div class="page"><div class="hstack"><h1>録音</h1><span class="meta">${all.length} 件</span><span class="grow"></span><button class="btn" data-act="importOpen">取り込み…</button></div>`;
  if (pend.length) h += `<div class="notice info" style="margin-top:10px"><span>後処理が止まっている会議 <b class="num">${pend.length}</b> 件</span><span class="meta">${counts.map(([s, n]) => `${K.STATUS[s]} ${n}`).join(" · ")}</span><span class="grow"></span>
    ${st.batch ? `<span class="meta num">仕上げています… ${st.batch.done}/${st.batch.total}</span>` : `<button class="btn sm primary" data-act="finishAll">まとめて仕上げる</button>`}</div>`;
  h += `<div class="hstack" style="margin:10px 0 4px"><div class="seg">${FILTERS.map(([k, l]) => `<button class="${f === k ? "sel" : ""}" data-act="filter" data-arg="${k}">${l}</button>`).join("")}</div><span class="meta">${rows.length} 件</span></div>`;
  let day = "";
  rows.slice(0, st.listN).forEach((r) => {
    if (r.date.slice(0, 10) !== day) { day = r.date.slice(0, 10); h += `<h3 class="dayh">${dayLabel(r.date)}</h3>`; }
    h += `<div class="row lrow" data-act="openRec" data-arg="${r.id}"><span class="num meta">${esc(r.date.slice(11))}</span><span class="grow">${esc(r.title)}</span>
      <span class="meta">${SRC_LABEL[r.source] || ""} · ${mm(r.durationMs)}</span>${statusChip(r)}</div>`;
  });
  if (!rows.length) h += `<p class="meta">該当する録音はありません。</p>`;
  if (rows.length > st.listN) h += `<button class="btn sm" style="margin-top:8px" data-act="more">さらに表示（残り ${rows.length - st.listN} 件）</button>`;
  return h + `</div>`;
}
ACT.filter = (k) => { st.filter = k; st.listN = 25; renderMain(); };
ACT.more = () => { st.listN += 25; renderMain(); };

// one step of the offline pipeline: 取り込み → 文字起こし → 話者 → 議事録 → Obsidian
function stepOnce(r) {
  return new Promise((done) => {
    st.proc[r.id] = NEXT[r.status] + "中"; refreshRec();
    setTimeout(() => {
      delete st.proc[r.id];
      if (r.status === "recorded") {
        if (!r.utterances.length) r.utterances = [{ id: r.id + "_t0", lane: r.lanes[0], spk: null, start: 1000, end: 5000, text: "（文字起こしの結果）", units: ["（文字起こしの結果）"], tr: null, reviewed: false }];
        r.status = "transcribed";
      } else if (r.status === "transcribed") {
        r.utterances.forEach((u) => { if (!u.spk) u.spk = u.lane === "Them" ? "S2" : "S1"; });
        ["S1", "S2"].forEach((k, i) => { if (!r.speakers[k]) r.speakers[k] = { name: "", auto: "SPEAKER_0" + i }; });
        r.diarized = true; r.status = "diarized";
      } else if (r.status === "diarized") {
        const u = r.utterances[0];
        if (!r.minutes) r.minutes = { summary: u ? [{ text: u.text.slice(0, 50), ev: [u.id] }] : [], decisions: [], actions: [], open: [], revision: 1, generated: nowStr(), model: "Qwen3 4B Instruct 2507" };
        r.status = "minutes";
      } else if (r.status === "minutes") writeNote(r);
      refreshRec(); done();
    }, 700);
  });
}
async function finish(r) { while (pending(r)) await stepOnce(r); }
function refreshRec() { if (st.tab === "recordings") renderMain(); }
ACT.step = (id) => { const r = K.recordings.find((x) => x.id === id); if (!st.proc[id] && pending(r)) stepOnce(r); };
ACT.finish = (id) => { const r = K.recordings.find((x) => x.id === id); if (!st.proc[id]) finish(r).then(() => toast("「" + r.title + "」を仕上げました")); };
ACT.finishAll = async () => {
  const list = K.recordings.filter(pending); st.batch = { done: 0, total: list.length }; renderMain();
  for (const r of list) { await finish(r); st.batch.done++; refreshRec(); }
  st.batch = null; toast(`${list.length} 件を Obsidian まで仕上げました`); refreshRec();
};
function afterMinutes(r) { bump(r, "minutes"); if (S.obsidian.autoExport === "minutes") { writeNote(r); toast("議事録ができたので Obsidian に書き出しました"); } else if (r.note) r.note.state = "stale"; }
function notePath(r) { return `${S.obsidian.folder}/${S.obsidian.fileName.replace("{date}", r.date.slice(0, 10)).replace("{title}", r.title)}`; }
function writeNote(r) { r.note = { path: notePath(r), state: "fresh" }; r.status = "exported"; }
ACT.obsidian = (id) => {
  const r = K.recordings.find((x) => x.id === id);
  openSheet("obsidian", () => `<h2>Obsidian に${r.note ? "書き出し直す" : "書き出す"}</h2><p class="meta mono">${esc(S.obsidian.vault)}/${esc(r.note ? r.note.path : notePath(r))}</p>
    <pre class="card mono pre">${esc(K.exportText(r, "obsidian"))}</pre>
    <div class="hstack end"><button class="btn" data-act="closeSheet">キャンセル</button><button class="btn primary" data-act="obWrite" data-arg="${r.id}">${r.note ? "ノートを更新" : "書き出す"}</button></div>`);
};
ACT.obWrite = (id) => { const r = K.recordings.find((x) => x.id === id); writeNote(r); closeSheet(); toast("Obsidian に書き出しました"); render(); };
function pipeHtml(r) {
  const i = ORDER.indexOf(r.status), labels = ["録音", "文字起こし", "話者", "議事録", "Obsidian"];
  return `<div class="hstack pipe" style="margin-top:6px">${labels.map((l, k) => `<span class="${k <= i ? "" : "meta"}">${k <= i ? "✓ " : ""}${l}</span>`).join(`<span class="meta">→</span>`)}
    <span class="grow"></span>${st.proc[r.id] ? `<span class="meta">${esc(st.proc[r.id])}…</span>`
      : pending(r) ? `<button class="btn sm" data-act="step" data-arg="${r.id}">次へ: ${NEXT[r.status]}</button><button class="btn sm primary" data-act="finish" data-arg="${r.id}">最後まで仕上げる</button>`
      : stale(r) ? `<span class="chip warn">ノートが古い</span><button class="btn sm" data-act="obsidian" data-arg="${r.id}">ノートを更新…</button>`
      : `<span class="meta mono">${esc(r.note.path)}</span>`}</div>`;
}
// ---------- 16: live columns (Me | Them) ----------
function renderNav() { $("nav").innerHTML = `<div class="seg">${TABS.map(([k, l]) => `<button class="${st.tab === k ? "sel" : ""}" data-act="tab" data-arg="${k}">${l}</button>`).join("")}</div><span class="grow"></span>${st.tab !== "session" ? liveChip() : ""}`; }
function sessionHtml() {
  return `<div class="sbar" id="ctrl"></div><div id="ctx"></div><div id="snotice"></div>
    <div class="cols ${st.mode === "face" ? "one" : ""}" data-ctx="clear">${colHtml("Me")}${st.mode === "face" ? "" : colHtml("Them")}</div>
    <div class="advtray" id="advisor"></div>`;
}
function colHtml(lane) {
  const label = st.mode === "face" ? "マイク（対面: 全員の声）" : lane === "Me" ? "Me · マイク" : "Them · システム音声";
  return `<div class="col"><div class="colhead"><span class="lanemark" style="background:${laneColor(lane)}"></span><b>${label}</b>
    <span class="meta" id="dev-${lane}"></span><span class="grow"></span><div class="bar"><i data-level="${lane}" style="width:0"></i></div></div>
    <div class="colbody" id="col-${lane}"></div></div>`;
}
function ctrlHtml() {
  if (st.phase === "idle") return `<button class="btn rec" data-act="start" data-arg="meeting">● 会議を録音</button><button class="btn" data-act="start" data-arg="face">対面</button>
    <button class="chip" data-act="toggleFaceSave">対面の保存: ${st.faceSave ? "する" : "しない"}</button><span class="grow"></span><span class="meta">待機中</span>`;
  return `<button class="btn" data-act="stop" ${st.phase === "finishing" ? "disabled" : ""}>■ 停止</button>
    <span class="chip">${st.mode === "face" ? "対面 · マイクのみ" : "会議 · 2 レーン"}${st.auto ? " · 自動録音" : ""}</span>
    ${st.mode === "face" ? `<button class="chip ${st.faceSave ? "ok" : ""}" data-act="toggleFaceSave">${st.faceSave ? "保存する" : "保存しない"}</button>` : ""}
    <span class="grow"></span><span class="meta">${st.phase === "finishing" ? "翻訳を仕上げています…" : "聞き取り中"}</span>
    <span class="num" data-elapsed>${mm(st.eng.elapsed())}</span>`;
}
// before / after the meeting: one quiet line, only when idle
function ctxHtml() {
  if (st.phase !== "idle") return "";
  const e = st.cal === "in" ? nextEvent() : null, parts = [];
  if (e) parts.push(`<span class="meta">次の予定</span> ${esc(e.start)} ${esc(e.title)} <span class="meta">あと ${e.inMin} 分</span> <button class="btn sm ghost" data-act="showCutin">カードを表示</button>`);
  parts.push(`<span class="meta">自動録音: ${{ off: "オフ", waiting: "待機中", recording: "録音中", error: "エラー" }[autoLabel()]}</span>`);
  if (st.lastSaved) parts.push(st.lastSaved.saved ? `<span class="okc">保存しました</span> <button class="btn sm ghost" data-act="openRec" data-arg="${st.lastSaved.id}">録音を開く →</button>` : `<span class="meta">対面の録音は保存していません</span>`);
  return `<div class="ctx">${parts.map((p) => `<span class="hstack">${p}</span>`).join("")}</div>`;
}
function lineHtml(l) {
  return `<div class="utt" id="l-${l.id}"><div class="head num">${mm(l.at)}</div>
    <div class="txt">${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`;
}
function updateLive() {
  renderMenubar(); if (st.tab !== "session") return renderNav();
  $("ctrl").innerHTML = ctrlHtml(); $("ctx").innerHTML = ctxHtml(); $("snotice").innerHTML = noticesHtml();
  ["Me", "Them"].forEach((lane) => {
    const el = $("col-" + lane); if (!el) return;
    const dev = $("dev-" + lane); if (dev) dev.textContent = lane === "Them" ? st.themDevice : "内蔵マイク";
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    const ls = st.lines.filter((l) => l.lane === lane);
    el.innerHTML = ls.length ? ls.map(lineHtml).join("") : `<div class="empty meta">${st.phase === "idle" ? (lane === "Me" ? "自分の発言" : "相手の発言") : "聞き取り中…"}</div>`;
    if (atBottom) el.scrollTop = el.scrollHeight;
  });
  const adv = $("advisor");
  adv.innerHTML = st.advisorCards.map((c) => advisorCardHtml(c)).join("") + (st.phase === "listening" ? `<div class="hstack"><span class="meta">アドバイザー（手動）</span>${advisorButtonHtml()}</div>` : "");
  adv.classList.toggle("hidden", !adv.innerHTML);
}

render();
setTimeout(() => { if (st.cal === "in" && st.phase === "idle") ACT.showCutin(); }, 1500);
</script>
</body>
