<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>07 サイドバー: 機能別の6項目 — Kikimimic v4</title>
<meta name="kkm-concept" content="左サイドバーに 今 / 予定 / ライブラリ / 取り込み / 検索 / 設定 の6項目。機能ごとに決まった居場所があり、各項目の横に件数と状態が出る">
<meta name="kkm-why" content="機能を全部使う人（月90件の会議を録り、オフライン分は取り込んで後処理し、Obsidian に置く作者本人）が、会議の直前は「予定」、最中は「今」、直後と後日は「ライブラリ（処理待ち・古いノートで絞る）」、持ち込みは「取り込み」と、作業ごとに決まった場所で探さずに使える。サイドバーの件数で、後処理がどこに溜まっているかが常に見える。">
<meta name="kkm-tradeoff" content="項目が多く、毎回の操作には遠回り（録音を直すには ライブラリ → 一覧 → 詳細の3段）。詳細を開くと一覧は消える。モデル・Obsidian・評価は 設定 の中、検索フォルダは 検索 の下。">
<link rel="stylesheet" href="shared/kit.css">
<style>
.body { flex: 1; display: flex; min-height: 0; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.pane { flex: 1; overflow-y: auto; min-height: 0; padding: 20px 28px; }
.phead { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; min-height: 28px; }
.hstack { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hstack.top { align-items: flex-start; flex-wrap: nowrap; }
.hstack.end { justify-content: flex-end; margin-top: 14px; }
.vstack { display: flex; flex-direction: column; gap: 14px; }
.vstack.tight { gap: 6px; }
.sp { flex: 1; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 12px; }
.line { padding: 6px 0; border-bottom: 1px solid var(--border); }
.field { display: flex; gap: 16px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.field .lbl { width: 170px; flex: 0 0 auto; padding-top: 4px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.right { text-align: right; }
.w120 { width: 120px; } .w60 { width: 64px; }
.pbar { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.pbar .seek { flex: 1; cursor: pointer; height: 8px; }
.drop { border: 1px dashed var(--border-hover); border-radius: var(--radius); padding: 24px; text-align: center; }
pre.out { white-space: pre-wrap; max-height: 340px; overflow: auto; background: var(--bg-subtle); padding: 10px; border-radius: var(--radius); margin: 10px 0 0; }
.spkgrid { display: grid; grid-template-columns: auto 200px 1fr; gap: 6px 8px; align-items: center; }
.utt { padding: 6px 0; }
.utt .head .btn.spk { padding: 0 4px; min-height: 18px; }
.utt .head label.check { align-items: center; gap: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.colhead { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.clickable { cursor: pointer; }
.live { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 28px 0; min-height: 0; }
#live-lines { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 16px; }
.menu .pad { padding: 4px 10px; }
.about { position: fixed; right: 10px; bottom: 8px; z-index: 100; }
.rline { display: flex; align-items: center; gap: 10px; padding: 5px 8px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayh { font-size: 12px; color: var(--muted-2); font-weight: 600; padding: 12px 8px 4px; }
.pipe { padding: 6px 0; }

#nav { width: 196px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--bg-subtle); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.navi { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; }
.navi.sel { background: var(--bg); }
.dhead { display: flex; align-items: center; gap: 10px; padding: 16px 28px 8px; }
.dtabs { padding: 0 28px 10px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 07 サイドバー: 機能別の6項目</div>
<div class="win" id="win">
  <div class="menubar" id="menubar"></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="body">
    <aside id="nav"></aside>
    <div id="main"></div>
  </div>
  <div id="cutin"></div>
  <div id="menu" class="menu hidden"></div>
  <div id="scrim" class="scrim hidden" data-a="scrim"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<button class="btn sm ghost about" data-a="about">この案について</button>
<script src="shared/data.js"></script>
<script>
// ===== core: state, engines wiring, shared feature renderers =====
const K = window.KKM, ST = K.settings, mm = K.mmss;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const recOf = (id) => K.recordings.find((r) => r.id === id);
const modelOf = (id) => K.models.find((m) => m.id === id);
const LANE_COLOR = { Me: "var(--lane-me)", Them: "var(--lane-them)" };
const SRC = { meeting: "会議", face: "対面", import: "取り込み" };
const PLAY = "▶︎", PAUSE = "❚❚";
const hm = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const tenth = (ms) => mm(ms) + "." + Math.floor((ms % 1000) / 100);
const pct = (x) => Math.round(x * 100) + "%";
const TODAY = new Date(2026, 10, 17), WD = "日月火水木金土";
const byDate = () => [...K.recordings].sort((a, b) => b.date.localeCompare(a.date));
const nextEvent = () => K.calendar.events.find((e) => e.inMin > 0);
function dayDiff(date) { return Math.round((TODAY - new Date(date.slice(0, 10) + "T00:00")) / 864e5); }
function dayGroup(date) { const diff = dayDiff(date), dow = (TODAY.getDay() + 6) % 7; return diff <= 0 ? "今日" : diff === 1 ? "昨日" : diff <= dow ? "今週" : diff <= dow + 7 ? "先週" : "それ以前"; }
function dayName(date) { const d = new Date(date.slice(0, 10) + "T00:00"), diff = dayDiff(date); return (diff <= 0 ? "今日 " : diff === 1 ? "昨日 " : "") + `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; }

const S = {
  view: "", recId: null, tab: "tx", txMode: "read", spkOpen: false,
  phase: "idle", sess: null, lines: [], device: null, notice: null, last: null,
  adv: { busy: false, cards: [], muted: false, pending: null, timer: 0 },
  dirty: new Set(), diar: null, pipe: {}, cues: {}, qa: {}, qaBusy: false, focusUtt: null,
  setTab: "general", sign: K.calendar.signedIn ? "in" : "out", cutin: null, cutinDone: false,
  auto: { state: ST.autoRecord ? "waiting" : "off", grace: 0, timer: 0 },
  ev: { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, from: 0, to: K.evaluation.range[1] / 1000, collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, state: "idle" },
  player: null, playerRec: null, pos: 0, playing: false, stopAt: null,
  q: "", libFilter: "all", join: {}, demoImport: 0, dl: {},
};

// ---- small UI services ----
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("hidden"), 2400); }
function sheet(html) { $("#sheet").innerHTML = html; $("#scrim").classList.remove("hidden"); }
function closeSheet() { $("#scrim").classList.add("hidden"); }
function openMenu(anchor, html) {
  const m = $("#menu"), w = $("#win").getBoundingClientRect(), a = anchor.getBoundingClientRect();
  m.innerHTML = html; m.classList.remove("hidden");
  m.style.top = (a.bottom - w.top + 4) + "px";
  m.style.left = Math.min(a.left - w.left, w.width - m.offsetWidth - 8) + "px";
}
function closeMenu() { $("#menu").classList.add("hidden"); }
function flashEl(el) { if (!el) return; el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function typing() { const a = document.activeElement; return !!a && !!$("#main") && $("#main").contains(a) && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox")); }
function about() {
  const m = (n) => esc($(`meta[name="${n}"]`).content);
  sheet(`<h2>この案について</h2><div class="sep"></div><div class="vstack"><div><h3>コンセプト</h3><div>${m("kkm-concept")}</div></div><div><h3>仮説と理由</h3><div>${m("kkm-why")}</div></div><div><h3>捨てるもの</h3><div>${m("kkm-tradeoff")}</div></div></div><div class="hstack end"><button class="btn" data-a="closeSheet">閉じる</button></div>`);
}

// ---- render plumbing (SHELL is defined by each variant) ----
let lastKey = "";
function render() {
  renderChrome();
  const p = $("#pane"), st = p ? p.scrollTop : 0, key = SHELL.key();
  $("#main").innerHTML = SHELL.main();
  const p2 = $("#pane"); if (p2 && key === lastKey) p2.scrollTop = st;
  lastKey = key;
  paintLines(); paintPlayer();
}
function renderChrome() { $("#menubar").innerHTML = menubarHTML(); SHELL.chrome(); }
function bg(onlyIf = true) { renderChrome(); if (onlyIf && !typing()) render(); }
setInterval(() => { $$("[data-clock]").forEach((e) => (e.textContent = mm(elapsed()))); }, 1000);
const elapsed = () => (S.sess ? Date.now() - S.sess.t0 : 0);

// ---- menu bar status item (#35) ----
function autoLabel() {
  return { off: "待機中", waiting: "自動録音: 待機中", grace: `会議終了 · ${S.auto.grace} 秒後に停止`, stopped: "自動録音: 手動で停止", error: `<span class="err">自動録音: エラー</span>` }[S.auto.state] || "待機中";
}
function menubarHTML() {
  const st = S.phase === "rec" ? `<span class="dot-rec"></span> 録音中 <span class="num" data-clock>${mm(elapsed())}</span>` : S.phase === "finishing" ? "翻訳を仕上げています…" : autoLabel();
  return `<span class="sp"></span><button class="btn ghost sm" data-a="mbMenu">Kikimimic · ${st}</button><span class="num">11月17日(火) ${hm()}</span>`;
}

// ---- live session (#1 #2 #3 #16 #17) ----
function startSession(mode, opt = {}) {
  if (S.phase !== "idle") return toast("すでに録音中です");
  if (ST.clearOnStart) S.lines = [];
  S.phase = "rec"; S.device = null; S.notice = null; S.last = null;
  S.sess = { mode, save: mode === "meeting" ? true : ST.saveFaceToFace, auto: !!opt.auto, title: opt.title || (mode === "face" ? "対面" : "会議"), t0: Date.now() };
  S.adv = { busy: false, cards: [], muted: false, pending: null, timer: 0 };
  S.sess.ctl = K.live(mode, onLive);
  if (opt.auto) S.auto.state = "recording";
  SHELL.showLive(); render();
}
function onLive(ev) {
  const L = S.lines.find((l) => l.id === ev.id);
  const noTr = ST.translateInto === "none";
  if (ev.type === "line") S.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", tr: null, translating: false });
  else if (ev.type === "advisor") { S.adv.pending = ev.card; return; }
  else if (ev.type === "question") { if (S.sess.mode === "meeting" && !S.device) { S.device = { detected: ev.detected, capturing: ev.capturing }; bg(SHELL.liveVisible()); } return; }
  else if (!L) return;
  else if (ev.type === "update") { L.committed = ev.committed; L.volatile = ev.volatile; }
  else if (ev.type === "commit") { L.committed = ev.text; L.volatile = ""; L.done = true; }
  else if (ev.type === "translating" && !noTr) L.translating = true;
  else if (ev.type === "translate" && !noTr) { L.translating = false; L.tr = ev.text; }
  paintLines();
}
function linesHTML() {
  if (!S.lines.length) return `<div class="meta">聞き取り中</div>`;
  return S.lines.map((l) => {
    const orig = `<div><span>${esc(l.committed)}</span><span class="vol">${esc(l.volatile)}</span></div>`, tr = l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : "<div></div>";
    return `<div class="utt" data-line="${l.id}"><div class="head"><span class="spk" style="color:${LANE_COLOR[l.lane]}">${l.lane}</span><span class="num">${mm(l.at)}</span></div>${SHELL.twoCol ? `<div class="cols">${orig}${tr}</div>` : orig + tr}</div>`;
  }).join("");
}
function paintLines() { const box = $("#live-lines"); if (!box) return; box.innerHTML = linesHTML(); box.scrollTop = box.scrollHeight; }
function stopSession(why) {
  if (S.phase !== "rec") return;
  S.sess.ctl.stop(); clearTimeout(S.adv.timer); clearInterval(S.auto.timer);
  if (S.sess.auto) S.auto.state = why === "auto" ? "waiting" : "stopped";
  S.phase = "finishing"; bg();
  setTimeout(() => {
    const r = saveSession(); S.phase = "idle";
    S.last = r ? { recId: r.id } : { notSaved: true };
    toast(why === "auto" ? "会議が終わって 60 秒たったので自動で停止しました" : r ? "録音を保存しました" : "対面の録音は保存していません");
    bg();
  }, 1500);
}
function saveSession() {
  const s = S.sess; if (s.mode === "face" && !s.save) return null;
  const id = "n" + Date.now();
  const utterances = S.lines.filter((l) => l.done).map((l, i) => ({ id: id + "u" + i, lane: l.lane, spk: null, start: l.at, end: l.at + 2500, text: l.committed, units: l.committed.split(/(?<=\s)|(?<=[、。])/), tr: l.tr, reviewed: false }));
  const r = { id, title: s.title, date: "2026-11-17 " + hm(), durationMs: Math.max(elapsed(), 1000), source: s.mode, lanes: s.mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, utterances, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };
  K.recordings.push(r); return r;
}
function startButtonsHTML() {
  return `<div class="hstack"><button class="btn rec" data-a="start" data-m="meeting">● 会議を録音</button><button class="btn" data-a="start" data-m="face">対面</button>
    <span class="meta">対面の録音:</span><button class="toggle ${ST.saveFaceToFace ? "on" : ""}" data-a="tog" data-k="saveFaceToFace" title="対面の録音を保存する"></button><span class="meta">${ST.saveFaceToFace ? "保存する" : "保存しない"}</span></div>`;
}
function liveHeadHTML() {
  const s = S.sess, face = s.mode === "face";
  return `<div class="hstack">
    ${S.phase === "rec" ? `<span class="chip rec"><span class="dot-rec"></span>録音中</span><span class="num" data-clock>${mm(elapsed())}</span>` : `<span class="chip">翻訳を仕上げています…</span>`}
    <span class="meta">${esc(s.title)} · ${face ? "対面（マイクのみ）" : "Me = マイク / Them = システム音声"}</span>
    ${s.auto ? `<span class="chip info">自動録音${S.auto.state === "grace" ? ` · <span class="grace">${S.auto.grace}</span> 秒後に停止` : ""}</span>` : ""}
    ${face ? `<button class="chip ${s.save ? "ok" : ""} clickable" data-a="faceSave" title="クリックで切り替え">${s.save ? "保存する" : "保存しない"}</button>` : ""}
    <span class="sp"></span>${S.phase === "rec" ? advisorButtonHTML() + `<button class="btn" data-a="stop">■ 停止</button>` : ""}</div>`;
}
function liveBannersHTML() {
  let h = S.sess && S.sess.auto && S.phase === "rec" ? autoHTML() : "";
  if (S.device) h += `<div class="notice">出力が ${esc(S.device.detected)} に変わりました（いまは ${esc(S.device.capturing)} を録音中）。切り替えますか？<span class="sp"></span><button class="btn sm" data-a="devSwitch">切り替える</button><button class="btn sm" data-a="devKeep">そのまま</button></div>`;
  else if (S.notice) h += `<div class="notice">${esc(S.notice)}<span class="sp"></span><button class="btn sm ghost" data-a="noticeClose">閉じる</button></div>`;
  return h + advisorCardsHTML();
}

// ---- advisor, manual only (#40) ----
function advisorButtonHTML() {
  if (S.adv.muted) return `<span class="meta">この会議ではアドバイザーを出しません</span>`;
  if (S.adv.busy) return `<span class="meta">アドバイザーが考えています…</span><button class="btn sm" data-a="advStop">停止</button>`;
  return `<button class="btn" data-a="advAsk">助言を求める</button>`;
}
function advisorCardsHTML() {
  return S.adv.cards.map((c) => `<div class="card vstack tight"><div class="hstack"><span class="chip info">${esc(c.kind)}</span><span class="meta">アドバイザー（手動）</span><span class="sp"></span><button class="btn ghost sm" data-a="advMute">この会議では出さない</button><button class="btn ghost sm" data-a="advClose" data-id="${c.id}">閉じる</button></div>
    <div>${esc(c.text)}</div><div class="hstack meta">根拠: ${c.ev.length ? c.ev.map((id) => { const l = S.lines.find((x) => x.id === id); return l ? `<span class="cite" data-a="liveFlash" data-id="${id}">${mm(l.at)}「${esc(l.committed.slice(0, 24))}」</span>` : ""; }).join(" ") : "なし"}</div></div>`).join("");
}

function lastHTML() {
  if (!S.last) return "";
  if (S.last.notSaved) return `<div class="card meta">直前の対面セッションは保存していません（対面の録音を保存しない設定）。</div>`;
  const r = recOf(S.last.recId);
  return `<div class="card hstack"><div class="grow"><div class="meta">いま保存しました</div><h2>${esc(r.title)}</h2><div class="meta">${mm(r.durationMs)} · ${r.utterances.length} 発話</div></div><button class="btn" data-a="genOpen" data-r="${r.id}">議事録を作る</button><button class="btn primary" data-a="open" data-r="${r.id}">開く</button></div>`;
}
function recChipsHTML(r) { return `${r.source !== "meeting" ? `<span class="meta">${SRC[r.source]}</span>` : ""}${S.dirty.has(r.id) ? `<span class="chip warn">未保存</span>` : ""}${statusChipHTML(r)}`; }
function recRowHTML(r, sel) { return `<div class="row ${sel ? "sel" : ""}" data-a="open" data-r="${r.id}"><div class="hstack"><span class="grow">${esc(r.title)}</span>${recChipsHTML(r)}</div><div class="meta">${recMetaHTML(r)}</div></div>`; }

// ---- offline post-processing pipeline + Obsidian (primary user) ----
const ORDER = ["recorded", "transcribed", "diarized", "minutes", "exported"];
const STEPS = [["transcribed", "文字起こし"], ["diarized", "話者"], ["minutes", "議事録"], ["exported", "Obsidian"]];
const stepOf = (r) => ORDER.indexOf(r.status);
const pending = () => K.recordings.filter((r) => r.status !== "exported");
const staleNotes = () => K.recordings.filter((r) => r.note && r.note.state === "stale");
function genericUtts(id, lanes) { return [["では|始めます。", "Let's begin."], ["よろしく|お願いします。", "Nice to meet you."]].map(([t, tr], i) => ({ id: id + "g" + i, lane: lanes[i % lanes.length], spk: null, start: 1000 + i * 4500, end: 5000 + i * 4500, text: t.replace("|", ""), units: t.split("|"), tr, reviewed: false })); }
function setStatus(r, st) { if (ORDER.indexOf(st) > stepOf(r)) r.status = st; }
function statusChipHTML(r) {
  const run = S.pipe[r.id];
  if (run) return `<span class="chip info">${STEPS.find((x) => x[0] === run.step)[1]} ${run.pct}%</span>`;
  if (r.status === "exported") return r.note && r.note.state === "stale" ? `<span class="chip warn">ノートが古い</span>` : "";
  return `<span class="chip ${r.status === "recorded" ? "warn" : ""}">${K.STATUS[r.status]}</span>`;
}
function pipeHTML(r) {
  const run = S.pipe[r.id], cur = stepOf(r), stale = r.note && r.note.state === "stale";
  const steps = STEPS.map(([st, l], i) => { const done = ORDER.indexOf(st) <= cur, now = run && run.step === st; return `<span class="chip ${done ? "ok" : now ? "info" : ""}">${i + 1}. ${l}${now ? " " + run.pct + "%" : done ? " 済み" : ""}</span>`; }).join(`<span class="meta">›</span>`);
  const act = run ? `<span class="meta">処理しています…</span>` : r.status !== "exported" ? `<button class="btn sm primary" data-a="pipeRun" data-r="${r.id}">残り ${4 - cur} 手順をまとめて進める</button>` : stale ? `<button class="btn sm" data-a="obsWrite" data-r="${r.id}">Obsidian のノートを更新</button>` : `<span class="meta mono">${esc(ST.obsidian.vault)}/${esc(r.note ? r.note.path : "")}</span>`;
  return `<div class="hstack pipe">${steps}<span class="sp"></span>${stale ? `<span class="chip warn">ノートが古い</span>` : ""}${act}</div>`;
}
function runPipe(ids) {
  const queue = ids.filter((id) => !S.pipe[id] && recOf(id).status !== "exported");
  const nextRec = () => {
    const id = queue.shift(); if (!id) return bg();
    const r = recOf(id);
    const step = () => {
      const st = ORDER[stepOf(r) + 1];
      if (!st || (st === "exported" && ST.obsidian.autoExport === "off")) { delete S.pipe[id]; bg(); return nextRec(); }
      S.pipe[id] = { step: st, pct: 0 }; bg();
      const t = setInterval(() => {
        S.pipe[id].pct = Math.min(100, S.pipe[id].pct + 34);
        if (S.pipe[id].pct >= 100) { clearInterval(t); finishStep(r, st); step(); } else bg();
      }, 100);
    };

    ${groups.map((g) => { const items = q.filter((x) => x.joinGroup === g), on = S.join[g] !== false; return `<div class="card vstack tight"><div class="hstack"><button class="toggle ${on ? "on" : ""}" data-a="joinTog" data-g="${g}"></button><span>WAV の分割ファイルを 1 つの会議に結合</span><span class="meta">${esc(g)} · ${items.length} ファイル</span><span class="sp"></span>${items.every((x) => x.state === "done") && items[0].recId ? `<button class="btn sm ghost" data-a="open" data-r="${items[0].recId}">録音を開く</button>` : ""}</div>${items.map(importRowHTML).join("")}</div>`; }).join("")}</div>`;

function dropHTML() { return `<div class="drop" id="drop"><div>音声ファイルをここにドロップ</div><div class="meta">WAV / M4A / MP3 · 複数可 · 同じ入力・設定で完了済みのものはスキップ</div><div class="mt"><button class="btn" data-a="imAdd">ファイルを選ぶ…</button></div></div>`; }
const DEMO_FILES = [["planning.m4a", "21 MB", 1_500_000], ["retro-part1.wav", "64 MB", 420_000, "retro"], ["retro-part2.wav", "58 MB", 380_000, "retro"], ["all-hands.mp3", "48 MB", 3_600_000]];
function addImport(file, size, durMs, group) {
  const id = "q" + Date.now() + Math.random().toString(36).slice(2, 5);
  const dup = K.importQueue.find((x) => x.file === file && x.state === "done");
  K.importQueue.push(dup ? { id, file, size, durMs, state: "skipped", progress: 1, note: "同じ入力・設定で完了済み" } : { id, file, size, durMs, state: "pending", progress: 0, joinGroup: group });
}
setInterval(() => {
  const q = K.importQueue; let run = q.find((x) => x.state === "running");
  if (!run) { run = q.find((x) => x.state === "pending"); if (run) run.state = "running"; }
  if (!run) return;
  run.progress = Math.min(1, run.progress + 0.04);
  if (run.progress >= 1) {
    run.state = "done";
    const grp = run.joinGroup ? q.filter((x) => x.joinGroup === run.joinGroup) : null;
    if (grp && S.join[run.joinGroup] === false) { run.recId = importedRec(run.file, run.durMs).id; if (grp.every((x) => x.state === "done")) toast(`${run.joinGroup} を別々の録音として取り込みました`); }
    else if (grp && grp.every((x) => x.state === "done")) { const r = importedRec(run.joinGroup + "（" + grp.length + " ファイルを結合）", grp.reduce((n, x) => n + x.durMs, 0)); grp.forEach((x) => (x.recId = r.id)); toast(`${run.joinGroup} を 1 つの会議に結合して取り込みました`); }
    else if (!grp) { run.recId = importedRec(run.file, run.durMs).id; toast(`${run.file} を取り込みました（文字起こし済み）`); }
  }
  bg(SHELL.importVisible());
}, 300);
function importedRec(file, durMs) {
  const id = "i" + Date.now() + Math.random().toString(36).slice(2, 5), title = file.replace(/\.(wav|m4a|mp3)$/i, "");
  const r = { id, title, date: "2026-11-17 " + hm(), durationMs: durMs || 600_000, source: "import", importedFrom: file, lanes: ["Imported"], speakers: {}, utterances: genericUtts(id, ["Imported"]), minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };

}

}

  advClose: (d) => { S.adv.cards = S.adv.cards.filter((c) => c.id !== d.id); render(); },
  advMute: () => { S.adv.muted = true; S.adv.cards = []; clearTimeout(S.adv.timer); S.adv.busy = false; render(); },
  liveFlash: (d) => flashEl($(`[data-line="${d.id}"]`)),
  open: (d) => { SHELL.openRec(d.r); S.tab = "tx"; render(); },
  tab: (d) => { S.tab = d.t; render(); },
  txMode: (d) => { S.txMode = d.m; render(); },
  spkOpen: () => { S.spkOpen = !S.spkOpen; render(); },
  nextUnrev: (d) => {
    const r = recOf(d.r), us = r.utterances, from = Math.max(0, us.findIndex((u) => u.id === S.focusUtt) + 1);
    const u = [...us.slice(from), ...us.slice(0, from)].find((x) => !x.reviewed);
    if (!u) return toast("未校閲の発話はありません");
    if (S.txMode !== "read") { S.txMode = "read"; render(); }
    S.focusUtt = u.id; flashEl($("#u-" + u.id));
  },
  spkMenu: (d, el) => {
    const r = recOf(d.r);
    openMenu(el, Object.keys(r.speakers).map((k) => `<button data-a="setSpk" data-r="${r.id}" data-u="${d.u}" data-k="${k}"><span style="color:${K.speakerColor(k)}">●</span> ${esc(K.speakerName(r, k))}</button>`).join("") + `<div class="sep"></div><button data-a="setSpk" data-r="${r.id}" data-u="${d.u}" data-k="">新しい話者</button>`);
  },
  setSpk: (d) => {
    const r = recOf(d.r), u = r.utterances.find((x) => x.id === d.u); let k = d.k;
    if (!k) { const n = Object.keys(r.speakers).length + 1; k = "S" + n; r.speakers[k] = { name: "", auto: "SPEAKER_0" + (n - 1) }; }
    u.spk = k; S.dirty.add(r.id); S.focusUtt = u.id; render();
  },
  save: (d) => { const r = recOf(d.r); S.dirty.delete(d.r); if (r.note) r.note.state = "stale"; render(); toast(r.note ? "保存しました。Obsidian のノートは古くなりました" : "保存しました"); },
  pipeRun: (d) => runPipe([d.r]),
  libFilter: (d) => { S.libFilter = d.f; render(); },
  pipeAll: () => { toast(`${pending().length} 件の後処理を順に進めます`); runPipe(pending().map((r) => r.id)); },
  obsidian: (d) => obsidianSheet(recOf(d.r)),
  obsWrite: (d) => { const r = recOf(d.r); writeNote(r); closeSheet(); render(); toast(`Obsidian に書き出しました: ${r.note.path}`); },
  obsAll: () => { const n = staleNotes().length; staleNotes().forEach(writeNote); render(); toast(`${n} 件のノートを更新しました`); },
  obsTog: (d) => { ST.obsidian[d.k] = !ST.obsidian[d.k]; render(); },
  exportMenu: (d, el) => openMenu(el, `<button data-a="export" data-r="${d.r}" data-k="md">Markdown（話者名つき）</button><button data-a="export" data-r="${d.r}" data-k="srt">SRT（話者名つき）</button><button data-a="export" data-r="${d.r}" data-k="words">words.srt <span class="meta">単語時刻・推定</span></button><div class="sep"></div><button data-a="obsidian" data-r="${d.r}">Obsidian に書き出す…</button>`),
  export: (d) => exportSheet(recOf(d.r), d.k),
  exportSave: (d) => { closeSheet(); toast(`${ST.recordDir}/${d.f} に書き出しました`); },
  pp: (d) => { ensurePlayer(recOf(d.r)).toggle(); },
  seekBar: (d, el, e) => { const r = recOf(d.r), b = el.getBoundingClientRect(); ensurePlayer(r).seek(((e.clientX - b.left) / b.width) * r.durationMs); },
  playAt: (d) => playAt(d.r, +d.ms),
  seekWord: (d) => playAt(d.r, +d.ms),
  cueSplit: (d) => { if (+d.idx === 0) return toast("先頭では分割できません"); S.cues[d.u].add(+d.idx); S.dirty.add(d.r); render(); },
  cueMerge: (d) => { S.cues[d.u].delete(+d.idx); S.dirty.add(d.r); render(); },
  diarize: (d) => {
    S.diar = { recId: d.r, pct: 0 }; render();
    const t = setInterval(() => {
      S.diar.pct = Math.min(100, S.diar.pct + 9);
      if (S.diar.pct >= 100) {
        clearInterval(t); const r = recOf(d.r); diarizeRec(r); S.diar = null; S.dirty.add(r.id); toast("話者を判別しました。名前を付けて保存してください");
      }
      bg();
    }, 160);
  },
  genMinutes: (d) => { genMinutes(recOf(d.r)); render(); },
  genOpen: (d) => { genMinutes(recOf(d.r)); SHELL.openRec(d.r); S.tab = "min"; render(); },
  jump: (d) => jump(d.r, d.u),
  ask: (d) => { const q = $("#qa-in").value.trim(); if (q) A.askChip({ r: d.r, q }); },
  askChip: (d) => { S.qaBusy = true; render(); setTimeout(() => { S.qaBusy = false; (S.qa[d.r] ||= []).push({ q: d.q, res: K.ask(d.r, d.q) }); render(); }, 600); },
  webAsk: (d) => { const x = S.qa[d.r][+d.idx]; sheet(`<h2>Web で調べる</h2><div class="meta">次の検索語だけを送ります。音声・文字起こし・録音のタイトルは送りません。</div><div class="card mono">${esc(x.q)}</div><div class="hstack end"><button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="webGo" data-r="${d.r}" data-idx="${d.idx}">この内容で送る</button></div>`); },
  webGo: (d) => { closeSheet(); S.qa[d.r][+d.idx].web = "Web の一般的な情報です。録音の内容ではないため、会議の決定としては扱えません。"; render(); },
  mLicense: (d) => { const m = modelOf(d.id); sheet(`<h2>${esc(m.name)}</h2><div class="meta">ライセンス: ${esc(m.license)} · ${m.size}</div><pre class="out">${esc(m.license)} License\n\nこのモデルを使うには、配布元のライセンス条件に同意する必要があります。\n商用利用・再配布の条件は配布元の文書を確認してください。</pre><div class="hstack end"><button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="mAgree" data-id="${m.id}">ライセンスに同意</button></div>`); },
  mAgree: (d) => { modelOf(d.id).state = "none"; closeSheet(); render(); toast("同意しました。ダウンロードできます"); },
  mDownload: (d) => {
    S.dl[d.id] = 0; render();
    const t = setInterval(() => { S.dl[d.id] = Math.min(100, S.dl[d.id] + 7); if (S.dl[d.id] >= 100) { clearInterval(t); delete S.dl[d.id]; modelOf(d.id).state = "ready"; toast(modelOf(d.id).name + " は使用可能です"); } bg(); }, 150);
  },
  mUse: (d) => { useModel(d.id); render(); },
  setTab: (d) => { S.setTab = d.t; render(); },
  lang: (d) => { const i = ST.spoken.indexOf(d.k); if (i >= 0) { if (ST.spoken.length > 1) ST.spoken.splice(i, 1); else return toast("少なくとも 1 つ選んでください"); } else if (ST.spoken.length < 2) ST.spoken.push(d.k); render(); },
  tog: (d) => {
    if (d.k === "webResearch" && !ST.webResearch) return sheet(`<h2>Web 調べものを有効にしますか？</h2><div class="vstack"><div>質問の答えが録音の中に見つからないとき、Web で調べられるようにします。</div><table class="tbl"><tr><td>送るもの</td><td>送る前に確認画面で見せる検索語だけ</td></tr><tr><td>送らないもの</td><td>音声、文字起こし、訳文、録音のタイトル、参加者</td></tr></table></div><div class="hstack end"><button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="webAgree">同意して有効にする</button></div>`);
    ST[d.k] = !ST[d.k];
    if (d.k === "autoRecord") { S.auto.state = ST.autoRecord ? "waiting" : "off"; clearInterval(S.auto.timer); }
    render();
  },
  webAgree: () => { ST.webResearch = true; closeSheet(); render(); },
  glAdd: () => { const a = $("#gl-a").value.trim(), b = $("#gl-b").value.trim(); if (!a || !b) return toast("両方の表記を入れてください"); ST.glossary.push([a, b]); render(); },
  glDel: (d) => { ST.glossary.splice(+d.idx, 1); render(); },
  signIn: () => { S.sign = "pending"; render(); S.signT = setTimeout(() => { S.sign = "in"; K.calendar.signedIn = "you@example.com"; toast("Google カレンダーにサインインしました"); bg(); }, 1500); },
  signCancel: () => { clearTimeout(S.signT); S.sign = "out"; render(); },
  signOut: () => { S.sign = "out"; K.calendar.signedIn = null; S.cutin = null; paintCutin(); render(); },
  cutShow: () => { S.cutin = nextEvent(); paintCutin(); },
  cutJoin: () => { const e = S.cutin; S.cutin = null; paintCutin(); toast(e.url.replace("https://", "") + " を開きました"); startSession("meeting", { title: e.title }); },
  cutRec: () => { const e = S.cutin; S.cutin = null; paintCutin(); startSession("meeting", { title: e.title }); },
  cutClose: () => { S.cutin = null; paintCutin(); },
  evRec: (d) => { const e = K.calendar.events.find((x) => x.id === d.id); startSession(e.offline ? "face" : "meeting", { title: e.title }); },
  autoStart: () => { if (S.auto.state === "stopped") return toast("手動で停止した会議なので、自動では再開しません"); startSession("meeting", { auto: true, title: "1on1 with Alex" }); },
  autoEnd: () => { S.auto.state = "grace"; S.auto.grace = 60; bg(); S.auto.timer = setInterval(() => { S.auto.grace--; if (S.auto.grace <= 0) { clearInterval(S.auto.timer); stopSession("auto"); } else { renderChrome(); $$(".grace").forEach((e) => (e.textContent = S.auto.grace)); } }, 100); bg(); },
  autoErr: () => { S.auto.state = "error"; bg(); },
  autoReset: () => { S.auto.state = "waiting"; bg(); },
  mbMenu: (d, el) => openMenu(el, `<div class="meta pad">${S.phase === "rec" ? "録音中 · " + esc(S.sess.title) : autoLabel()}</div>${S.phase === "rec" ? `<button data-a="stop">■ 停止</button>` : `<button data-a="start" data-m="meeting">● 会議を録音</button>`}<button data-a="tog" data-k="autoRecord">自動録音を${ST.autoRecord ? "オフ" : "オン"}にする</button><button data-a="mbShow">ウィンドウを表示</button>`),
  mbShow: () => { SHELL.showLive(); render(); },
  imAdd: () => { const f = DEMO_FILES[S.demoImport++ % DEMO_FILES.length]; addImport(...f); if (f[3]) { const g = DEMO_FILES.find((x) => x[3] === f[3] && x !== f); addImport(...g); S.demoImport++; } render(); },
  imRetry: (d) => { const x = K.importQueue.find((y) => y.id === d.id); x.state = "pending"; x.progress = 0; x.error = null; render(); },
  joinTog: (d) => { S.join[d.g] = S.join[d.g] === false; render(); },
  fileOpen: (d) => toast(`${d.f} の ${d.l} 行目を開きます`),
  folderDel: (d) => { const f = K.folders.splice(+d.idx, 1)[0]; ST.searchFolders = ST.searchFolders.filter((p) => p !== f.path); render(); },
  folderAdd: () => { const p = $("#folder-in").value.trim(); if (!p) return; K.folders.push({ path: p, files: [{ name: "memo.md", lines: ["# " + p, "SRT の形式について追加のメモ"] }] }); ST.searchFolders.push(p); render(); },
  evMode: (d) => { S.ev.mode = d.m; S.ev.state = "idle"; render(); },
  evRun: () => { S.ev.state = "running"; render(); setTimeout(() => { S.ev.state = "done"; render(); }, 900); },
  evPlay: (d) => playAt(S.ev.rec, Math.max(0, +d.s - 500), +d.e + 500),
  evSave: () => { const e = S.ev, r = evalResult(); sheet(`<h2>評価結果を JSON で保存</h2><pre class="out mono">${esc(JSON.stringify({ recording: e.rec, mode: e.mode, reference: e.mode === "der" ? e.ref : null, models: e.mode === "der" ? [ST.diar] : ["pyannote", "nemotron"], range_ms: [e.from * 1000, e.to * 1000], collar_ms: +e.collar, overlap: e.overlap, result: { [r.main[0]]: +r.main[1].toFixed(3) }, mismatches: K.evaluation.mismatches, input_hashes: K.evaluation.hashes }, null, 2))}</pre><div class="hstack end"><button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="exportSave" data-f="eval-${e.rec}.json">保存</button></div>`); },
};
const C = {
  obs: (el) => { ST.obsidian[el.dataset.k] = el.value; render(); },
  reviewed: (el) => { const r = recOf(el.dataset.r), u = r.utterances.find((x) => x.id === el.dataset.u); u.reviewed = el.checked; S.focusUtt = u.id; S.dirty.add(r.id); render(); },
  spkName: (el) => { recOf(el.dataset.r).speakers[el.dataset.k].name = el.value.trim(); S.dirty.add(el.dataset.r); render(); },
  set: (el) => { const k = el.dataset.k; if (["asr", "mt", "diar"].includes(k)) useModel(el.value); else ST[k] = el.value; render(); },
  ev: (el) => { const k = el.dataset.k; if (k === "ref" && el.value === "pick") { toast("デモでは weekly.rttm だけを選べます"); } else S.ev[k] = el.value; S.ev.state = "idle"; render(); },
};
const IN = { search: (el) => { S.q = el.value; const box = $("#sr"); if (box) box.innerHTML = searchResultsHTML(S.q); } };

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"), inMenu = e.target.closest("#menu");
  if (!inMenu) closeMenu();
  if (el && !el.disabled && A[el.dataset.a]) A[el.dataset.a](el.dataset, el, e);
  if (inMenu && el) closeMenu();
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-c]"); if (el) C[el.dataset.c](el); });
document.addEventListener("input", (e) => { const el = e.target.closest("[data-input]"); if (el) IN[el.dataset.input](el); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); closeSheet(); }
  const el = e.target.closest("[data-enter]");
  if (e.key === "Enter" && el && !e.isComposing) { e.preventDefault(); A[el.dataset.enter](el.dataset, el, e); }
});
document.addEventListener("dragover", (e) => { if (e.target.closest("#drop")) e.preventDefault(); });
document.addEventListener("drop", (e) => {
  if (!e.target.closest("#drop")) return; e.preventDefault();
  const ok = [...e.dataTransfer.files].filter((f) => /\.(wav|m4a|mp3)$/i.test(f.name));
  ok.forEach((f) => addImport(f.name, (f.size / 1e6).toFixed(1) + " MB", 0));
  toast(ok.length ? `${ok.length} 件をキューに追加しました` : "WAV / M4A / MP3 のみ取り込めます"); render();
});
// The cut-in appears on its own shortly before the next meeting (once per meeting, while idle).
setInterval(() => { const e = nextEvent(); if (S.sign === "in" && S.phase === "idle" && e && e.inMin <= 5 && S.cutinDone !== e.id && !S.cutin) { S.cutinDone = e.id; A.cutShow(); } }, 3000);
// ===== end core =====

// ===== 07 shell: six-section sidebar — every feature has its own place =====
const NAV = [["now", "今"], ["cal", "予定"], ["lib", "ライブラリ"], ["import", "取り込み"], ["search", "検索"], ["settings", "設定"]];
const TABS07 = [["general", "一般"], ["dict", "辞書"], ["models", "モデル"], ["obsidian", "Obsidian"], ["privacy", "プライバシー"], ["adv", "詳細"]];
S.view = "now";
function navMeta(k) {
  if (k === "now") return S.phase === "rec" ? `<span class="dot-rec"></span><span class="num" data-clock>${mm(elapsed())}</span>` : S.phase === "finishing" ? "仕上げ中" : "";
  if (k === "cal") { const e = nextEvent(); return S.sign !== "in" ? "未接続" : e ? `あと ${e.inMin} 分` : ""; }
  if (k === "lib") return pending().length ? `処理待ち <span class="num">${pending().length}</span>` : `<span class="num">${K.recordings.length}</span>`;
  if (k === "import") return importActive() ? `<span class="num">${importActive()}</span> 件` : "";
  if (k === "settings") return staleNotes().length ? "古いノート " + staleNotes().length : "";
  return "";
}
const page = (title, right, body) => `<div class="pane" id="pane"><div class="phead"><h1>${title}</h1><span class="sp"></span>${right}</div>${body}</div>`;
function nowPage() {
  if (S.phase !== "idle") return `<div class="live">${liveHeadHTML()}${liveBannersHTML()}<div id="live-lines"></div></div>`;
  const e = S.sign === "in" ? nextEvent() : null, p = pending();
  return page("今", "", `<div class="vstack">
    ${e ? `<div class="card hstack"><div class="grow"><div class="meta">次の予定 · ${e.start} · あと ${e.inMin} 分</div><h2>${esc(e.title)}</h2></div><button class="btn" data-a="evRec" data-id="${e.id}">${e.offline ? "対面で録音" : "録音を開始"}</button><button class="btn ghost sm" data-a="go" data-v="cal">予定へ</button></div>` : `<div class="hstack"><span class="meta">${S.sign === "in" ? "今日の予定はもうありません" : "カレンダー未接続"}</span><button class="btn sm ghost" data-a="go" data-v="cal">予定へ</button></div>`}
    ${startButtonsHTML()}${autoHTML()}${lastHTML()}
    ${p.length ? `<div class="card hstack"><div class="grow"><div class="meta">後処理待ち（取り込み・対面の録音など）</div><div>${p.length} 件 · ${p.filter((r) => r.status === "recorded").length} 件はまだ文字起こし前</div></div><button class="btn sm" data-a="libPending">一覧で見る</button><button class="btn sm primary" data-a="pipeAll">まとめて進める</button></div>` : ""}
    <div class="vstack tight"><div class="hstack"><h3>最近の録音</h3><span class="sp"></span><button class="btn sm ghost" data-a="go" data-v="lib">ライブラリへ</button></div>${byDate().slice(0, 4).map((r) => recLineHTML(r)).join("")}</div></div>`);
}
function libPage() {
  const list = filtered();
  return page("ライブラリ", filterSegHTML(), `<div class="vstack tight">${bulkHTML()}<div>${dayGroupsHTML(list, (r) => recLineHTML(r)) || `<div class="meta">該当する録音はありません。</div>`}</div></div>`);
}
function detailPage(r) {
  return `<div class="dhead"><button class="btn ghost sm" data-a="back">← 録音一覧</button><div class="grow"><h1>${esc(r.title)}</h1><div class="meta">${recMetaHTML(r)}</div></div>${saveBarHTML(r)}</div>
    <div class="dtabs">${detailPipeHTML(r)}${detailTabsHTML()}</div><div class="pane" id="pane">${detailBodyHTML(r, false)}</div>${playerHTML(r)}`;
}
const SHELL = {
  twoCol: false,
  key: () => [S.view, S.recId, S.tab, S.setTab, S.libFilter].join("|"),
  chrome() {
    $("#nav").innerHTML = NAV.map(([k, l]) => `<div class="row navi ${S.view === k ? "sel" : ""}" data-a="go" data-v="${k}"><span>${l}</span><span class="meta hstack">${navMeta(k)}</span></div>`).join("");
  },
  main() {
    switch (S.view) {
      case "now": return nowPage();
      case "cal": return page("予定", "", `<div class="vstack">${calendarAccountHTML()}<div>${eventsHTML()}</div>${autoHTML()}</div>`);
      case "lib": return S.recId && recOf(S.recId) ? detailPage(recOf(S.recId)) : libPage();
      case "import": return page("取り込み", "", `<div class="vstack">${dropHTML()}${importQueueHTML()}<div class="meta">取り込みが終わった録音は ライブラリ の「処理待ち」に並びます。</div></div>`);
      case "search": return page("検索", "", `<div class="vstack"><input class="input" id="q" placeholder="録音とフォルダを検索" value="${esc(S.q)}" data-input="search"><div id="sr" class="vstack tight">${searchResultsHTML(S.q)}</div><div class="sep"></div><h3>検索するフォルダ</h3>${foldersHTML()}</div>`);
      default: return page("設定", "", `<div class="vstack">${settingsTabsHTML(TABS07)}${settingsBodyHTML()}</div>`);
    }
  },
  openRec(id) { if (S.recId !== id) S.tab = "tx"; S.view = "lib"; S.recId = id; },
  showLive() { S.view = "now"; },
  liveVisible: () => S.view === "now",
  importVisible: () => S.view === "import" || (S.view === "lib" && !S.recId),
};
A.go = (d) => { if (d.v === "lib") S.recId = null; S.view = d.v; render(); if (d.v === "search") $("#q")?.focus(); };
A.back = () => { S.recId = null; render(); };
A.libPending = () => { S.view = "lib"; S.recId = null; S.libFilter = "pending"; render(); };
render();
</script>
</body>
</html>
