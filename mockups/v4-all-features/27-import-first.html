<meta name="kkm-concept" content="ライブラリの上にドロップ領域と取り込みキュー表。取り込み中のファイルも録音と同じ一覧に並び、落とせば議事録・Obsidian まで仕上がる">
<meta name="kkm-why" content="対面やオフラインの会議を IC レコーダー・ボイスメモで録り、あとで持ち込む人向け（会議の直後〜その日の終わり）。外部の音声を自分の録音と同じ場所で扱い、ドロップ 1 回で文字起こし→話者→議事録→Obsidian まで進めば、後処理がどこで止まっているかも一覧で分かる">
<meta name="kkm-tradeoff" content="ライブ録音の入口は右上の小さな「● 録音 ▾」に退く。タブが無いので、モデルと設定はシートで開く。取り込みが少ない日は上の領域が場所を取る（キュー表は折りたためる）">

<style>

<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 27 取り込み中心</div>
<div class="win">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="menubar" id="mb"></div>
  <div id="app"></div>
</div>
<script src="shared/data.js"></script>
<script>
// ===== Core: helpers, session, live, device, advisor, auto-record, calendar =====
const K = window.KKM, ST = K.settings;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const S = {
  phase: "idle", session: null, liveLines: [], devQ: null, notice: null,
  advPending: [], advShown: [], advOff: false, advStopped: false,
  autoState: "待機中", autoNote: "", autoCount: 0, autoManualStop: false,
  cal: { signedIn: !!K.calendar.signedIn, pending: false }, cutin: null,
  recId: null, dirty: false, cuts: {}, cutMode: false, pos: 0, playing: false, player: null, playerRec: null,
  diar: null, qa: [], web: [], focusIdx: -1,
  ev: { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, from: "00:00", to: "01:10", ran: false, json: null, playing: null },
};
const ON = {}; // variant hooks: openRec(id), showLive()
const ACT = {};
document.addEventListener("click", (e) => { const t = e.target.closest("[data-act]"); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); } });
document.addEventListener("change", (e) => { const t = e.target.closest("[data-chg]"); if (t && ACT[t.dataset.chg]) ACT[t.dataset.chg](t, e); });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "qaIn") ACT.ask(); if (e.key === "Escape") { closeSheet(); closeMenu(); } });

let toastT;
function toast(msg) { let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; $(".win").appendChild(el); } el.textContent = msg; el.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("hidden"), 2600); }
function sheet(html) { closeSheet(); if (typeof html === "function") { S.sheetFn = html; html = html(); } const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim"; s.innerHTML = `<div class="sheet">${html}</div>`; s.addEventListener("click", (e) => { if (e.target === s) closeSheet(); }); $(".win").appendChild(s); }
function closeSheet() { const s = $("#scrim"); if (s) s.remove(); S.sheetFn = null; }
ACT.closeSheet = closeSheet;
function menu(anchor, items) {
  closeMenu(); const m = document.createElement("div"); m.className = "menu"; m.id = "menu";
  const w = $(".win").getBoundingClientRect(), r = anchor.getBoundingClientRect();
  m.style.left = Math.min(r.left - w.left, w.width - 240) + "px"; m.style.top = (r.bottom - w.top + 4) + "px";
  items.forEach(([label, fn]) => { const b = document.createElement("button"); b.textContent = label; if (!fn) { b.disabled = true; b.className = "meta"; } else b.onclick = () => { closeMenu(); fn(); }; m.appendChild(b); });
  $(".win").appendChild(m); setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { const m = $("#menu"); if (m) m.remove(); }
const tog = (act, on, extra = "") => `<button class="toggle ${on ? "on" : ""}" data-act="${act}" ${extra}></button>`;
const fld = (label, control, help = "") => `<div class="fld"><div class="fld-l">${label}${help ? `<div class="meta">${help}</div>` : ""}</div><div class="fld-c">${control}</div></div>`;
const laneColor = (lane) => lane === "Me" ? "var(--lane-me)" : lane === "Them" ? "var(--lane-them)" : "var(--muted-2)";
const curRec = () => K.recordings.find((r) => r.id === S.recId) || null;
const parseMs = (s) => { const [m, x] = String(s).split(":").map(Number); return ((m || 0) * 60 + (x || 0)) * 1000; };

function render() {
  const keep = $$("[data-keep]").map((e) => [e.dataset.keep, e.scrollTop]);
  VIEW();
  keep.forEach(([k, t]) => { const e = $(`[data-keep="${k}"]`); if (e) e.scrollTop = t; });
  const sh = $("#scrim .sheet"); if (S.sheetFn && sh) { const t = sh.scrollTop; sh.innerHTML = S.sheetFn(); sh.scrollTop = t; }
  const mb = $("#mb"); if (mb) mb.innerHTML = menubarHTML();
  let ov = $("#overlay"); if (!ov) { ov = document.createElement("div"); ov.id = "overlay"; $(".win").appendChild(ov); }
  ov.innerHTML = cutinHTML();
  paintPlayer(); liveTick(true);
}

// ---- Session (1, 2, 17) ----
function startSession(mode, opts = {}) {
  if (S.phase !== "idle") return toast("いまは録音中です");
  if (ST.clearOnStart) S.liveLines = [];
  Object.assign(S, { phase: "rec", devQ: null, notice: null, advPending: [], advShown: [], advOff: false, advStopped: false, cutin: null });
  S.session = { mode, auto: !!opts.auto, title: opts.title || (mode === "face" ? "対面" : "会議"), save: mode === "face" ? ST.saveFaceToFace : true, t0: Date.now() };
  const engineMode = mode === "face" ? "face" : ST.translateInto === "none" ? "noTranslate" : "meeting";
  S.session.ctl = K.live(engineMode, onLive);
  if (opts.auto) { S.autoState = "録音中"; S.autoNote = ""; }
  clearInterval(S.clock); S.clock = setInterval(() => liveTick(), 1000);
  if (ON.showLive) ON.showLive();
  render();
}
function onLive(ev) {
  const L = S.liveLines, find = (id) => L.find((l) => l.id === id);
  const noTr = ST.translateInto === "none";
  if (ev.type === "line") L.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", vol: "", tr: null, trState: null });
  else if (ev.type === "update") { const l = find(ev.id); if (l) { l.committed = ev.committed; l.vol = ev.volatile; } }
  else if (ev.type === "commit") { const l = find(ev.id); if (l) { l.committed = ev.text; l.vol = ""; l.done = true; } }
  else if (ev.type === "translating" && !noTr) { const l = find(ev.id); if (l) l.trState = "busy"; }
  else if (ev.type === "translate" && !noTr) { const l = find(ev.id); if (l) { l.tr = ev.text; l.trState = "done"; } }
  else if (ev.type === "advisor") { if (!S.advOff && !S.advStopped && !S.advPending.concat(S.advShown).some((c) => c.id === ev.card.id)) { S.advPending.push(ev.card); } }
  else if (ev.type === "question") { if (S.session && S.session.mode !== "face") { S.devQ = ev; render(); return; } }
  liveTick();
}
function liveHTML() {
  if (!S.liveLines.length) return `<div class="muted empty">${S.phase === "rec" ? "聞き取り中…" : "「● 会議を録音」か「対面」で始めます。"}</div>`;
  return S.liveLines.map((l) => `<div class="utt" id="${l.id}"><div class="head"><span class="spk" style="color:${laneColor(l.lane)}">${l.lane}</span><span class="num">${K.mmss(l.at)}</span></div>`
    + `<div>${esc(l.committed)}<span class="vol">${esc(l.vol)}</span></div>`
    + (l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.trState === "busy" ? `<div class="meta">訳しています…</div>` : "") + `</div>`).join("");
}
function liveTick(noScroll) {
  $$("[data-live]").forEach((el) => { const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 60; el.innerHTML = liveHTML(); if (atEnd && !noScroll) el.scrollTop = el.scrollHeight; });
  const t = S.session ? K.mmss(Date.now() - S.session.t0) : "00:00";
  $$("[data-elapsed]").forEach((e) => (e.textContent = t));
  $$("[data-advn]").forEach((e) => (e.textContent = S.advPending.length ? `（${S.advPending.length}）` : ""));
}
function stopSession(reason) {
  if (S.phase !== "rec") return;
  const s = S.session; s.ctl.stop(); clearInterval(S.clock); clearInterval(S.autoTimer); S.autoCount = 0;
  S.phase = "finishing"; S.devQ = null;
  if (s.auto) { S.autoState = "待機中"; if (reason === "auto") S.autoNote = "会議が終わって 60 秒たったので自動停止しました。"; else { S.autoManualStop = true; S.autoNote = "手動で停止しました。この会議では自動録音を再開しません。"; } }
  render();
  setTimeout(() => {
    S.phase = "idle"; const rec = s.mode !== "face" || s.save ? saveLive(s) : null; S.session = null; render();
    toast(rec ? `「${rec.title}」を録音一覧に保存しました` : s.mode === "face" ? "対面の記録は保存しませんでした" : "停止しました");
  }, 1600);
}
function saveLive(s) {
  const lines = S.liveLines.filter((l) => l.done); if (!lines.length) return null;
  const hm = new Date().toTimeString().slice(0, 5), id = "n" + Date.now();
  const utterances = lines.map((l, i) => ({ id: id + "_" + i, lane: l.lane, spk: null, start: l.at, end: l.at + Math.max(1500, l.committed.length * 110), text: l.committed, units: l.committed.split(/(?<=\s)|(?<=[、。])/), tr: l.tr, reviewed: false }));
  const rec = { id, title: `${s.title}（${hm}）`, date: "2026-11-17 " + hm, durationMs: Date.now() - s.t0, source: s.mode === "face" ? "face" : "meeting", lanes: s.mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, utterances, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };
  K.recordings.push(rec); return rec;
}
ACT.startMeeting = () => startSession("meeting");
ACT.startFace = () => startSession("face");
ACT.stop = () => stopSession("manual");
ACT.faceSaveToggle = () => { if (S.session && S.session.mode === "face") S.session.save = !S.session.save; else ST.saveFaceToFace = !ST.saveFaceToFace; render(); };
function faceSaveChip() {
  const on = S.session && S.session.mode === "face" ? S.session.save : ST.saveFaceToFace;
  return `<button class="chip ${on ? "ok" : ""}" data-act="faceSaveToggle" title="対面モードの記録を保存するか（既定は保存しない）">対面: ${on ? "保存する" : "保存しない"}</button>`;
}
function sessionBar() {
  if (S.phase === "finishing") return `<div class="bar-row"><span class="meta">翻訳を仕上げています…</span></div>`;
  if (S.phase === "rec") return `<div class="bar-row"><span class="dot-rec"></span><span>${S.session.mode === "face" ? "対面（マイクのみ）" : "会議（Me = マイク / Them = システム音声）"}</span><span class="num meta" data-elapsed>00:00</span>${S.session.auto ? `<span class="chip rec">自動録音</span>` : ""}${S.session.mode === "face" ? faceSaveChip() : ""}<span class="grow"></span><button class="btn" data-act="stop">■ 停止</button></div>`;
  return `<div class="bar-row"><button class="btn rec" data-act="startMeeting">● 会議を録音</button><button class="btn" data-act="startFace">対面</button>${faceSaveChip()}<span class="grow"></span><span class="meta">待機中</span></div>`;
}

// ---- Output device question + notice (3) ----
function devHTML() {
  if (S.devQ) return `<div class="notice">出力が ${esc(S.devQ.detected)} に変わりました（いまは ${esc(S.devQ.capturing)} を録音中）。切り替えますか？<span class="grow"></span><button class="btn sm" data-act="devSwitch">切り替える</button><button class="btn sm" data-act="devKeep">そのまま</button></div>`;
  if (S.notice) return `<div class="notice">${esc(S.notice)}<span class="grow"></span><button class="btn sm ghost" data-act="noticeClose">閉じる</button></div>`;
  return "";
}
ACT.devSwitch = () => { S.notice = S.devQ.detected + " を録音しています"; S.devQ = null; render(); };
ACT.devKeep = () => { S.devQ = null; render(); };
ACT.noticeClose = () => { S.notice = null; render(); };
ACT.demoDevice = () => { if (S.phase !== "rec" || S.session.mode === "face") return toast("会議の録音中に起きます。先に「● 会議を録音」を押してください"); S.devQ = { detected: "AirPods Pro", capturing: "MacBook Pro のスピーカー" }; render(); };

// ---- Advisor, manual only (16) ----
function advisorHTML() {
  if (S.phase !== "rec" && !S.advShown.length) return "";
  const ctl = S.advStopped ? `<span class="meta">停止しました</span>` : S.advOff ? `<span class="meta">この会議では出しません</span>` : `<button class="btn sm" data-act="advAsk">助言を求める<span data-advn></span></button><button class="btn sm ghost" data-act="advStop">停止</button>`;
  return `<div class="adv"><div class="bar-row"><span class="meta">アドバイザー（手動のみ）</span><span class="grow"></span>${ctl}</div>`
    + S.advShown.map((c) => `<div class="card adv-card"><div class="meta">${esc(c.kind)}</div><div>${esc(c.text)}</div><div class="bar-row">${c.ev.map((id) => `<span class="cite" data-act="jumpLive" data-id="${id}">根拠の発話</span>`).join(" ")}<span class="grow"></span><button class="btn sm ghost" data-act="advClose" data-id="${c.id}">閉じる</button><button class="btn sm ghost" data-act="advMute">この会議では出さない</button></div></div>`).join("") + `</div>`;
}
ACT.advAsk = () => { if (!S.advPending.length) return toast("いまの時点で伝えることはありません"); S.advShown.push(...S.advPending); S.advPending = []; render(); };
ACT.advClose = (el) => { S.advShown = S.advShown.filter((c) => c.id !== el.dataset.id); render(); };
ACT.advMute = () => { S.advOff = true; S.advShown = []; S.advPending = []; render(); toast("この会議ではアドバイザーを出しません"); };
ACT.advStop = () => { S.advStopped = true; S.advShown = []; S.advPending = []; render(); toast("アドバイザーを停止しました"); };
ACT.jumpLive = (el) => { if (ON.showLive) { ON.showLive(); render(); } const t = document.getElementById(el.dataset.id); if (t) { t.scrollIntoView({ block: "center" }); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); } };

// ---- Auto record (18) + menu bar status ----
ACT.autoToggle = () => { ST.autoRecord = !ST.autoRecord; S.autoState = "待機中"; S.autoNote = ""; S.autoManualStop = false; render(); };
ACT.autoDetect = () => {
  if (!ST.autoRecord) return toast("自動録音はオフです（設定でオンにできます）");
  if (S.autoManualStop) return toast("手動で停止したため、この会議では再開しません");
  if (S.phase !== "idle") return toast("すでに録音中です");
  startSession("meeting", { auto: true, title: "自動録音" });
};
ACT.autoEnd = () => {
  if (!S.session || !S.session.auto) return toast("自動録音の会議がありません");
  S.autoCount = 60; clearInterval(S.autoTimer);
  S.autoTimer = setInterval(() => { S.autoCount -= 1; $$("[data-autocount]").forEach((e) => (e.textContent = S.autoCount)); if (S.autoCount <= 0) { clearInterval(S.autoTimer); stopSession("auto"); } }, 100);
  render();
};
ACT.autoError = () => { if (S.session && S.session.auto) stopSession("auto"); S.autoState = "エラー"; S.autoNote = "システム音声を取得できません。画面とシステムオーディオ録音の許可を確認してください。"; render(); };
ACT.autoNext = () => { S.autoManualStop = false; S.autoState = "待機中"; S.autoNote = ""; render(); toast("次の会議を待っています"); };
function autoHTML() {
  const chip = S.autoState === "録音中" ? "rec" : S.autoState === "エラー" ? "" : "ok";
  return `<div class="bar-row">${tog("autoToggle", ST.autoRecord)}<span>自動録音</span>${ST.autoRecord ? `<span class="chip ${chip}" ${S.autoState === "エラー" ? 'style="color:var(--danger)"' : ""}>${S.autoState}</span>` : `<span class="meta">オフ（既定）</span>`}</div>`
    + `<div class="meta">カレンダーの会議が始まると録音し、会議が終わって 60 秒で自動停止します。手動で止めた会議は再開しません。</div>`
    + (S.autoCount > 0 ? `<div class="notice">会議が終わりました。<span data-autocount>${S.autoCount}</span> 秒後に自動停止します（デモは 10 倍速）</div>` : "")
    + (S.autoNote ? `<div class="meta ${S.autoState === "エラー" ? "err" : ""}">${esc(S.autoNote)}</div>` : "")
    + (ST.autoRecord ? `<div class="bar-row"><span class="meta">デモ:</span><button class="btn sm" data-act="autoDetect">会議が始まる</button><button class="btn sm" data-act="autoEnd">会議が終わる</button><button class="btn sm" data-act="autoError">エラー</button><button class="btn sm" data-act="autoNext">次の会議</button></div>` : "");
}
function menubarHTML() {
  let st = "Kikimimic: 待機中";
  if (S.phase === "rec") st = `● 録音中 ${S.session.auto ? "（自動）" : ""}`;
  else if (S.phase === "finishing") st = "翻訳を仕上げています…";

// Stats (12)
function statsOf(rec) {
  if (rec.stats) return rec.stats;
  const st = { headphones: false }, total = rec.utterances.reduce((n, u) => n + (u.end - u.start), 0) || 1;
  rec.lanes.forEach((l) => { const us = rec.utterances.filter((u) => u.lane === l), d = us.reduce((n, u) => n + (u.end - u.start), 0);
    st[l] = { share: d / total, longestMs: Math.max(0, ...us.map((u) => u.end - u.start)), cpm: Math.round(us.reduce((n, u) => n + u.text.length, 0) / Math.max(d / 60000, 0.01)), questions: us.filter((u) => /[?？]/.test(u.text)).length, overlaps: 0 }; });
  return st;
}
function statsHTML(rec) {
  const st = statsOf(rec);
  return rec.lanes.filter((l) => st[l]).map((l) => { const s = st[l]; return `<div class="stat"><div class="bar-row"><span class="spk" style="color:${laneColor(l)}">${l}</span><span class="num">${Math.round(s.share * 100)}%</span></div><div class="bar"><i style="width:${s.share * 100}%"></i></div>`
    + `<div class="meta num">最長の連続発話 ${(s.longestMs / 1000).toFixed(1)} 秒 · ${s.cpm} 文字/分 · 質問 ${s.questions} · 重なり ${st.headphones ? s.overlaps : "—"}</div></div>`; }).join("")
    + `<div class="meta">${st.headphones ? "重なった発話はヘッドホン使用時のみ数えます（この録音はヘッドホン）。" : "重なった発話はヘッドホン必須のため、この録音では数えていません。"}</div>`;
}

// Export (8, 9): uses saved names + subtitle cuts
const EX = { kind: "md", speakers: true, tr: true, minutes: false };
function srtTime(ms) { const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1000) % 60; return [h, m, s].map((n) => String(n).padStart(2, "0")).join(":") + "," + String(Math.round(ms) % 1000).padStart(3, "0"); }
function cuesOf(rec) {
  const out = [];
  rec.utterances.forEach((u) => { const ws = K.unitsWithTimes(u), cuts = [...cutsOf(u.id)].sort((a, b) => a - b); let a = 0;
    [...cuts, ws.length - 1].forEach((c) => { const part = ws.slice(a, c + 1); if (part.length) out.push({ u, start: part[0].start, end: part[part.length - 1].end, text: part.map((w) => w.w).join("").trim(), whole: a === 0 && c === ws.length - 1 }); a = c + 1; }); });
  return out;
}
function exportBuild(rec, kind = EX.kind, o = EX) {
  const name = (u) => (o.speakers ? K.speakerName(rec, u.spk) : null) || u.lane;
  if (kind === "words") return K.exportText(rec, "words");
  if (kind === "srt") return cuesOf(rec).map((c, i) => `${i + 1}\n${srtTime(c.start)} --> ${srtTime(c.end)}\n${o.speakers && K.speakerName(rec, c.u.spk) ? "[" + K.speakerName(rec, c.u.spk) + "] " : ""}${c.text}${o.tr && c.whole && c.u.tr ? "\n" + c.u.tr : ""}`).join("\n\n");
  let md = `# ${rec.title}\n\n${rec.date}\n`;
  if (o.minutes && rec.minutes) md += `\n## 議事録（版 ${rec.minutes.revision}）\n\n` + ["summary", "decisions", "actions", "open"].map((k, i) => `### ${["要約", "決定事項", "宿題", "未決事項"][i]}\n` + rec.minutes[k].map((x) => "- " + x.text).join("\n")).join("\n\n") + "\n\n## 文字起こし\n";
  return md + "\n" + rec.utterances.map((u) => `**${K.mmss(u.start)} ${name(u)}**: ${u.text}` + (o.tr && u.tr ? `\n> ${u.tr}` : "")).join("\n\n");
}
const exportExt = { md: ".md", srt: ".srt", words: ".words.srt" };
ACT.exportFile = (el) => { const rec = curRec(), kind = (el && el.dataset.kind) || EX.kind; closeSheet(); toast(`${rec.title}${exportExt[kind]} を書き出しました${S.dirty ? "（未保存の変更を含む）" : ""}`); };

function hl(text, q) { const t = esc(text); if (!q) return t; const i = t.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? t : t.slice(0, i) + "<b>" + t.slice(i, i + esc(q).length) + "</b>" + t.slice(i + esc(q).length); }
function searchResultsHTML(q) {

  if (!q.trim()) return `<div class="meta">録音（原文・訳文・タイトル・日付）と、追加したフォルダの Markdown / テキストを探します。</div>`;
  if (!res.length) return `<div class="muted empty">見つかりませんでした。</div>`;

// Import queue (10)
const Q = K.importQueue; let qSeq = 10;
const QSTATE = { done: "完了", running: "取り込み中", pending: "待機", failed: "失敗", skipped: "スキップ" };
function addImportFiles(files) {
  let bad = 0;
  files.forEach((f) => { const name = f.name || f, ext = name.split(".").pop().toLowerCase();
    if (!["wav", "m4a", "mp3"].includes(ext)) { bad++; return; }
    const dup = Q.find((x) => x.file === name && x.state === "done");
    Q.push({ id: "q" + qSeq++, file: name, size: f.size ? (f.size / 1e6).toFixed(1) + " MB" : "—", durMs: 0, state: dup ? "skipped" : "pending", progress: dup ? 1 : 0, note: dup ? "同じ入力・設定で完了済み" : "" }); });
  if (bad) toast(`${bad} 件は対応していない形式です（WAV / M4A / MP3）`);
  render(); runQueue();
}
const SAMPLE = ["retro.m4a", "board-part1.wav", "board-part2.wav", "all-hands.mp3", "slides.pdf"];
ACT.importSample = () => addImportFiles(SAMPLE);
ACT.importPick = () => { let i = $("#filePick"); if (!i) { i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = ".wav,.m4a,.mp3"; i.id = "filePick"; i.className = "hidden"; i.onchange = () => { addImportFiles([...i.files]); i.value = ""; }; document.body.appendChild(i); } i.click(); };
document.addEventListener("dragover", (e) => { const z = e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const z = e.target.closest("[data-drop]"); if (z) z.classList.remove("over"); });
document.addEventListener("drop", (e) => { const z = e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.remove("over"); addImportFiles([...e.dataTransfer.files]); } });
ACT.qRetry = (el) => { const q = Q.find((x) => x.id === el.dataset.id); q.state = "pending"; q.progress = 0; q.error = ""; q.retried = true; render(); runQueue(); };
ACT.qSel = (el) => { const q = Q.find((x) => x.id === el.dataset.id); q.sel = !q.sel; render(); };
ACT.qJoin = () => {
  const sel = Q.filter((q) => q.sel);
  if (sel.length < 2) return toast("結合する WAV を 2 つ以上選んでください");
  if (sel.some((q) => !/\.wav$/i.test(q.file))) return toast("結合できるのは WAV の分割ファイルだけです");
  if (sel.some((q) => q.state === "done" || q.state === "skipped")) return toast("取り込み済みのファイルは結合できません");
  const g = sel[0].file.replace(/[-_ ]?part\d+/i, "").replace(/\.wav$/i, ""); sel.forEach((q) => { q.joinGroup = g; q.sel = false; }); render(); toast(`${sel.length} ファイルを 1 つの会議「${g}」に結合します`);
};
ACT.qUnjoin = (el) => { Q.filter((q) => q.joinGroup === el.dataset.g).forEach((q) => delete q.joinGroup); render(); };
ACT.qOpen = (el) => { const q = Q.find((x) => x.id === el.dataset.id); openRec(ensureImportRec(q)); };
function ensureImportRec(q) {
  if (q.rec && K.recordings.some((r) => r.id === q.rec)) return q.rec;
  const id = "imp" + q.id, title = q.joinGroup ? `${q.joinGroup}（${Q.filter((x) => x.joinGroup === q.joinGroup).length} ファイルを結合）` : q.file.replace(/\.\w+$/, "");
  const mk = (i, s, text, tr) => ({ id: id + "_" + i, lane: "Imported", spk: null, start: s, end: s + 4200, text: text.replaceAll("|", ""), units: text.split("|"), tr, reviewed: false });
  K.recordings.push({ id, title, date: "2026-11-17 " + new Date().toTimeString().slice(0, 5), durationMs: q.durMs || 600000, source: "import", importedFrom: q.joinGroup ? Q.filter((x) => x.joinGroup === q.joinGroup).map((x) => x.file).join(" + ") : q.file, lanes: ["Imported"], speakers: {}, utterances: [mk(0, 1000, "Okay,| let's| get| started.", "では始めましょう。"), mk(1, 5600, "First,| a| quick| update| on| the| roadmap.", "まずロードマップの簡単な報告です。")], minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null });
  Q.filter((x) => x === q || (q.joinGroup && x.joinGroup === q.joinGroup)).forEach((x) => (x.rec = id));
  return id;
}
function runQueue() {
  if (S.qTimer) return;
  S.qTimer = setInterval(() => {
    let r = Q.find((q) => q.state === "running") || Q.find((q) => q.state === "pending");
    if (!r) { clearInterval(S.qTimer); S.qTimer = null; return render(); }
    r.state = "running"; r.progress = Math.min(1, r.progress + 0.06);
    if (/broken/.test(r.file) && !r.retried && r.progress > 0.3) { r.state = "failed"; r.error = "デコードに失敗しました (afconvert: 不明な形式)"; }
    else if (r.progress >= 1) { r.state = "done"; if (!r.joinGroup || Q.filter((x) => x.joinGroup === r.joinGroup).every((x) => x.state === "done")) { const id = ensureImportRec(r); if (ON.imported) ON.imported(id); } }
    if (ON.queueTick) ON.queueTick(); else render();
  }, 250);
}
function qStateHTML(q) {
  if (q.state === "running") return `<div class="bar-row"><div class="bar grow"><i style="width:${q.progress * 100}%"></i></div><span class="meta num">${Math.round(q.progress * 100)}%</span></div>`;
  if (q.state === "failed") return `<span class="err meta">${esc(q.error || "失敗しました")}</span>`;
  if (q.state === "skipped") return `<span class="meta">${esc(q.note || "完了済みのためスキップ")}</span>`;
  return `<span class="meta">${QSTATE[q.state]}</span>`;
}
function qActionHTML(q) {
  if (q.state === "failed") return `<button class="btn sm" data-act="qRetry" data-id="${q.id}">再試行</button>`;
  if (q.state === "done" && (!q.joinGroup || q.rec)) return `<button class="btn sm" data-act="qOpen" data-id="${q.id}">開く</button>`;
  return "";
}

  const body = V.sub === "tr" ? (rec.utterances.length ? transcriptToolsHTML(rec) : "") + `<div class="scroll grow" data-keep="tr-${rec.id}">${transcriptHTML(rec)}</div>`
    : `<div class="scroll grow" data-keep="sub-${V.sub}">${V.sub === "min" ? minutesHTML(rec) : V.sub === "stats" ? statsHTML(rec) : qaHTML(rec)}</div>`;
  return `<div class="detail"><div class="bar-row dtop"><h2>${esc(rec.title)}</h2><span class="meta num">${rec.date} · ${K.mmss(rec.durationMs)}</span><span class="grow"></span>${playerHTML()}<button class="btn sm" data-act="exportMenu" data-rec="${rec.id}">書き出し ▾</button></div>`
    + originHTML(rec) + pipelineHTML(rec) + `<div class="seg" style="align-self:flex-start">${subs.map(([k, l]) => `<button class="${V.sub === k ? "sel" : ""}" data-act="sub" data-k="${k}">${l}</button>`).join("")}</div>${body}</div>`;
}
function VIEW() {
  const rec = curRec();
  let html;
  if (V.view === "rec" && rec) html = headHTML(`<button class="btn sm ghost" data-act="lib">← ライブラリ</button>`) + liveBarHTML() + detailHTML(rec);
  else if (V.view === "live") html = headHTML(`<button class="btn sm ghost" data-act="lib">← ライブラリ</button><h2>ライブ</h2>`) + `<div class="pane">${sessionBar()}${devHTML()}<div class="scroll grow" data-live data-keep="live"></div>${advisorHTML()}</div>`;
  else html = headHTML(`<h1>ライブラリ</h1>`) + liveBarHTML() + intakeHTML() + libraryHTML();
  $("#app").innerHTML = html + aboutButton();
}
boot();
</script>
</body>
</html>
