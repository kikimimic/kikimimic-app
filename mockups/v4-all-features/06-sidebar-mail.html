<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>06 3ペイン（メール型） — Kikimimic</title>
<meta name="kkm-concept" content="メールアプリ型の3ペイン（ナビ / 録音リスト / 詳細）。録音を開いてもリストが消えず、J / K で次々に確認する">
<meta name="kkm-why" content="録音が数十〜数百（月 90 件）たまる人が、後日まとめて「どこまで処理したか」を見ながら 1 件ずつ仕上げられるように。ナビの絞り込みが受信箱、状態が既読に当たる">
<meta name="kkm-tradeoff" content="ライブ中の文字起こしは右ペインだけで狭い。モデル・取り込み・設定はナビ下の「ツール」で、開くとリストの位置を使う">
<link rel="stylesheet" href="shared/kit.css">
<style>
  .panes { flex: 1; min-height: 0; display: flex; }
  .nav { width: 188px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--bg-subtle); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .nav .row { display: flex; gap: 6px; align-items: center; padding: 4px 8px; }
  .nav .row .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav .row.sel { background: var(--bg); }
  .nav .lbl { font-size: 11px; color: var(--muted); padding: 10px 8px 2px; }
  .list { width: 320px; flex: 0 0 auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list .head { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .list .items { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 30px; }
  .list .item { display: grid; grid-template-columns: 40px 1fr auto; gap: 2px 6px; align-items: center; padding: 6px 8px; }
  .list .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 14px 18px 36px; overflow: hidden; }
  .detail.scrolls { overflow-y: auto; display: block; }
  .kkm-sess, .kkm-detail { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .about { position: absolute; right: 10px; bottom: 8px; z-index: 40; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 06 3ペイン（メール型）</div>
<div class="win">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="menubar" id="kkm-menubar"></div>
  <div class="panes">
    <nav class="nav" id="nav"></nav>
    <section class="list" id="list"></section>
    <section class="detail" id="detail"></section>
  </div>
  <button class="btn sm ghost about" onclick="aboutSheet()">この案について</button>
</div>
<script src="shared/data.js"></script>
<script>
/* ---- core: helpers, state, overlays ---- */
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NAV = { openRec() {}, refresh() {}, go() {} }; // each variant fills these in
const S = {
  phase: "idle", mode: null, lines: [], engine: null, t0: 0, tick: 0,
  device: null, notices: [], advisorPending: [], advisor: [], advisorOff: false, advisorStopped: false,
  saveFace: K.settings.saveFaceToFace,
  auto: { state: K.settings.autoRecord ? "waiting" : "off", manualStopped: false, countdown: 0, timer: 0, error: "" },
  cal: { signing: false, cutinShown: false },
  dirty: {}, sub: "tx", txMode: "read", player: null, rec: null, detailEl: null,
  qa: {}, dl: {}, modelSel: null, evalRun: null, evalMode: K.evaluation.mode, evalOverlap: K.evaluation.overlap, evalCollar: K.evaluation.collarMs,
  joinWav: true,
};
const rec = (id) => K.recordings.find((r) => r.id === id);
const fmtDur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + " 時間 " + (m % 60) + " 分" : m + " 分"; };
const srcLabel = (r) => ({ meeting: "会議", face: "対面", import: "取り込み" }[r.source] || r.source);
const laneColor = (l) => (l === "Me" ? "var(--lane-me)" : l === "Them" ? "var(--lane-them)" : "var(--muted-2)");

function toast(msg) {
  const w = $(".win"); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  w.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function openSheet(html) {
  closeSheet();
  const s = document.createElement("div"); s.className = "scrim"; s.id = "kkm-scrim";
  s.innerHTML = `<div class="sheet">${html}</div>`;
  s.addEventListener("click", (e) => { if (e.target === s) closeSheet(); });
  $(".win").appendChild(s);
}
function closeSheet() { $("#kkm-scrim")?.remove(); }
function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.id = "kkm-menu";
  const w = $(".win").getBoundingClientRect(), a = anchor.getBoundingClientRect();
  m.style.top = (a.bottom - w.top + 4) + "px"; m.style.left = Math.max(4, Math.min(a.left - w.left, w.width - 240)) + "px";
  items.forEach(([label, fn]) => {
    if (label === "-") { const d = document.createElement("div"); d.className = "sep"; m.appendChild(d); return; }
    const b = document.createElement("button"); b.innerHTML = label; if (!fn) b.disabled = true;
    b.onclick = (e) => { e.stopPropagation(); closeMenu(); fn && fn(); }; m.appendChild(b);
  });
  $(".win").appendChild(m);
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { $("#kkm-menu")?.remove(); }
function aboutSheet() {
  const m = (n) => esc(document.querySelector(`meta[name="${n}"]`)?.content || "");
  openSheet(`<h2>この案について</h2><div class="meta" style="margin-top:10px">コンセプト</div><div>${m("kkm-concept")}</div>
    <div class="meta" style="margin-top:10px">仮説と理由</div><div>${m("kkm-why")}</div>
    <div class="meta" style="margin-top:10px">捨てるもの</div><div>${m("kkm-tradeoff")}</div>
    <div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeSheet()">閉じる</button></div>`);
}

/* ---- menu bar status item (#18) ---- */
function autoLabel() {
  return { off: "自動録音: オフ", waiting: "自動録音: 待機中", recording: "自動録音: 録音中", error: "自動録音: エラー" }[S.auto.state];
}
function renderMenubar() {
  const el = $("#kkm-menubar"); if (!el) return;
  const live = S.phase === "live";
  el.innerHTML = `<span class="meta">${esc(autoLabel())}</span>
    <button class="btn ghost sm" id="kkm-mb-item">${live ? '<span class="dot-rec"></span> ' + K.mmss(Date.now() - S.t0) : "◎ Kikimimic"}</button>`;
  $("#kkm-mb-item").onclick = (e) => {
    e.stopPropagation();
    const items = [[`<span class="meta">${live ? "録音中 · " + (S.mode === "face" ? "対面" : "会議") : S.phase === "finishing" ? "翻訳を仕上げています…" : "待機中"}</span>`, null],
      [`<span class="meta">${esc(autoLabel())}${S.auto.countdown > 0 ? " · " + S.auto.countdown + " 秒後に停止" : ""}${S.auto.error ? " · " + esc(S.auto.error) : ""}</span>`, null], ["-"]];
    if (live) items.push(["■ 停止", () => stopSession(true)]);
    else items.push(["● 会議を録音", () => startSession("meeting")]);
    items.push([S.auto.state === "off" ? "自動録音をオンにする" : "自動録音をオフにする", () => setAuto(S.auto.state === "off")]);
    openMenu(e.currentTarget, items);
  };
}

/* ---- calendar cut-in (#7) ---- */
function showCutin(ev) {
  ev = ev || K.calendar.events.find((x) => x.inMin >= 0);
  $("#kkm-cutin")?.remove();
  const c = document.createElement("div"); c.className = "cutin"; c.id = "kkm-cutin";
  c.innerHTML = `<div class="meta">Google カレンダー · あと ${ev.inMin < 60 ? ev.inMin + " 分" : Math.floor(ev.inMin / 60) + ":" + String(ev.inMin % 60).padStart(2, "0")}</div>
    <div style="font-weight:600;margin:2px 0 10px">${esc(ev.title)}</div>
    <div style="display:flex;gap:6px">
      ${ev.url ? '<button class="btn primary" data-a="join">参加して録音</button>' : ""}
      <button class="btn" data-a="rec">録音を開始</button><span style="flex:1"></span>
      <button class="btn" data-a="close">閉じる</button></div>`;
  c.onclick = (e) => {
    const a = e.target.dataset.a; if (!a) return; c.remove();
    if (a === "join") { toast(ev.url.replace("https://", "") + " を開きました"); startSession("meeting"); }
    if (a === "rec") startSession("meeting");
  };
  $(".win").appendChild(c);
}
function scheduleCutin() {
  if (S.cal.cutinShown || !K.calendar.signedIn) return;
  S.cal.cutinShown = true; setTimeout(() => { if (S.phase === "idle" && K.calendar.signedIn) showCutin(); }, 2500);
}
function upcomingHtml() {
  if (!K.calendar.signedIn) return `<div class="meta">Google カレンダーにサインインすると、会議の直前にカードを出します（設定）。</div>`;
  const hm = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
  return K.calendar.events.map((ev) => `<div class="row" style="display:flex;gap:10px;align-items:center" onclick="${ev.inMin < 0 ? (ev.done ? `openDetail('${ev.done}')` : "") : `showCutin(K.calendar.events.find(x=>x.id==='${ev.id}'))`}">
    <span class="num meta" style="width:42px">${ev.start}</span><span style="flex:1" class="${ev.inMin < 0 ? "muted" : ""}">${esc(ev.title)}</span>
    ${ev.offline ? '<span class="chip">対面</span>' : ""}${ev.auto ? '<span class="chip">自動録音</span>' : ""}
    <span class="meta">${ev.inMin < 0 ? (ev.done ? "録音済み" : "終了") : "あと " + hm(ev.inMin)}</span></div>`).join("");
}
/* ---- live session (#1 #2 #3 #16 #17 #18) ---- */
let sessionEl = null, sessionOpts = {};
function startSession(mode, auto) {
  if (S.phase !== "idle") return;
  $("#kkm-cutin")?.remove();
  if (K.settings.clearOnStart) S.lines = [];
  S.phase = "live"; S.mode = mode; S.t0 = Date.now(); S.device = null; S.advisor = []; S.advisorPending = []; S.advisorOff = false; S.advisorStopped = false;
  if (auto) { S.auto.state = "recording"; S.auto.manualStopped = false; }
  const engMode = mode === "face" ? "face" : (K.settings.translateInto ? "meeting" : "noTranslate");
  S.engine = K.live(engMode, onLive);
  S.tick = setInterval(() => { const e = $("#kkm-elapsed"); if (e) e.textContent = K.mmss(Date.now() - S.t0); renderMenubar(); }, 1000);
  NAV.go("live"); refreshSession(); renderMenubar();
}
function onLive(ev) {
  const line = S.lines.find((l) => l.id === ev.id);
  if (ev.type === "line") S.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", tr: null, translating: false });
  else if (ev.type === "update" && line) { line.committed = ev.committed; line.volatile = ev.volatile; }
  else if (ev.type === "commit" && line) { line.committed = ev.text; line.volatile = ""; }
  else if (ev.type === "translating" && line) line.translating = true;
  else if (ev.type === "translate" && line) { line.translating = false; line.tr = ev.text; }
  else if (ev.type === "question") S.device = ev;
  else if (ev.type === "advisor") { if (!S.advisorOff && !S.advisorStopped) S.advisorPending.push(ev.card); }
  if (ev.type === "question" || ev.type === "advisor") refreshSession(); else renderLines();
}
function stopSession(manual) {
  if (S.phase !== "live") return;
  S.engine.stop(); clearInterval(S.tick); clearInterval(S.auto.timer); S.auto.countdown = 0;
  if (S.auto.state === "recording") { S.auto.state = "waiting"; if (manual) S.auto.manualStopped = true; }
  const dur = Date.now() - S.t0, mode = S.mode;
  S.phase = "finishing"; refreshSession(); renderMenubar();
  setTimeout(() => {
    S.phase = "idle";
    S.lines.forEach((l) => { if (!l.tr && l.translating) { l.tr = "（訳文）"; l.translating = false; } });
    if (mode === "face" && !S.saveFace) toast("対面の録音は保存しませんでした（設定: 保存しない）");
    else if (S.lines.length) {
      const now = new Date(), id = "n" + now.getTime();
      K.recordings.unshift({ id, title: mode === "face" ? "対面の会話" : "新しい会議", date: now.toISOString().slice(0, 16).replace("T", " "), durationMs: dur,
        source: mode === "face" ? "face" : "meeting", lanes: mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null,
        utterances: S.lines.map((l, i) => ({ id: id + "-" + i, lane: l.lane, spk: null, start: l.at, end: l.at + 3000, text: l.committed, units: l.committed.split(/(?<=\s)|(?<=[、。])/), tr: l.tr, reviewed: false })) });
      toast("録音一覧に保存しました");
    }
    refreshSession(); renderMenubar(); NAV.refresh();
  }, 1600);
}
function answerDevice(follow) {
  const d = S.device; S.device = null;
  S.notices.push(follow ? `出力を ${d.detected} に切り替えました。` : `${d.capturing} の録音を続けています（出力は ${d.detected}）。`);
  refreshSession();
}
function askAdvisor() {
  if (S.advisorStopped) return toast("アドバイザーは停止中です");
  if (!S.advisorPending.length) return toast("いまは伝えることがありません");
  S.advisor.push(...S.advisorPending); S.advisorPending = []; refreshSession();
}
function advisorAct(id, act) {
  S.advisor = S.advisor.filter((c) => c.id !== id);
  if (act === "mute") { S.advisorOff = true; S.advisorPending = []; toast("この会議ではアドバイザーを出しません"); }
  if (act === "stop") { S.advisorStopped = true; S.advisorPending = []; toast("アドバイザーを停止しました"); }
  refreshSession();
}
function toggleSaveFace() { S.saveFace = !S.saveFace; K.settings.saveFaceToFace = S.saveFace; refreshSession(); NAV.refresh(); }
function clearLines() { S.lines = []; renderLines(); }
function statusText() {
  if (S.phase === "live") return `<span class="chip rec"><span class="dot-rec"></span>聞き取り中 <span id="kkm-elapsed" class="num">${K.mmss(Date.now() - S.t0)}</span></span>`;
  if (S.phase === "finishing") return `<span class="chip warn">翻訳を仕上げています…</span>`;
  return `<span class="chip">待機中</span>`;
}
function faceSaveChip() {
  return `<span class="chip ${S.saveFace ? "ok" : ""}" style="cursor:pointer" onclick="toggleSaveFace()" title="クリックで切り替え">対面: ${S.saveFace ? "保存する" : "保存しない"}</span>`;
}
function sessionActions() {
  if (S.device) return { primary: ["切り替える", () => answerDevice(true), ""], more: [["そのまま", () => answerDevice(false)], ["■ 停止", () => stopSession(true)]] };
  if (S.phase === "live") return { primary: ["■ 停止", () => stopSession(true), ""],
    more: [["アドバイザーに確認", askAdvisor], ["画面をクリア", clearLines], ...(S.mode === "face" ? [[`対面を${S.saveFace ? "保存しない" : "保存する"}にする`, toggleSaveFace]] : [])] };
  if (S.phase === "finishing") return { primary: ["翻訳を仕上げています…", null, ""], more: [] };
  return { primary: ["● 会議を録音", () => startSession("meeting"), "rec"],
    more: [["対面（マイクのみ）で開始", () => startSession("face")], [`対面を${S.saveFace ? "保存しない" : "保存する"}にする`, toggleSaveFace], ["画面をクリア", clearLines]] };
}
function deviceHtml(bare) {
  let h = S.notices.map((n, i) => `<div class="notice"><span style="flex:1">${esc(n)}</span><span class="meta" style="cursor:pointer" onclick="S.notices.splice(${i},1);refreshSession()">×</span></div>`).join("");
  if (S.device && bare) h += `<div class="notice"><span style="flex:1">出力が ${esc(S.device.detected)} に変わりました（いまは ${esc(S.device.capturing)} を録音中）。切り替えますか？</span><span class="meta">右上で選択</span></div>`;
  else if (S.device) h += `<div class="notice"><span style="flex:1">出力が ${esc(S.device.detected)} に変わりました（いまは ${esc(S.device.capturing)} を録音中）。切り替えますか？</span>
    <button class="btn sm" onclick="answerDevice(true)">切り替える</button><button class="btn sm" onclick="answerDevice(false)">そのまま</button></div>`;
  return h;
}
function advisorHtml(bare) {
  const act = (id, a, label, cls = "") => bare ? `<span class="cite" onclick="advisorAct('${id}','${a}')">${label}</span>` : `<button class="btn sm ${cls}" onclick="advisorAct('${id}','${a}')">${label}</button>`;
  return S.advisor.map((c) => `<div class="card" style="display:flex;flex-direction:column;gap:6px">
    <div class="meta">アドバイザー · ${esc(c.kind)}</div><div>${esc(c.text)}</div>
    <div style="display:flex;gap:6px;align-items:center"><span class="cite" onclick="flashLine('${c.ev[0]}')">根拠を見る</span><span style="flex:1"></span>
      ${act(c.id, "close", "閉じる")}${act(c.id, "mute", "この会議では出さない")}${act(c.id, "stop", "停止", "danger")}</div></div>`).join("");
}
function flashLine(id) { const e = $(`[data-line="${id}"]`); if (e) { e.scrollIntoView({ block: "center" }); e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); } }
function linesHtml() {
  if (!S.lines.length) return `<div class="meta" style="padding:24px 0;text-align:center">${S.phase === "live" ? "話し始めると、ここに文字が出ます。" : "待機中"}</div>`;
  return S.lines.map((l) => `<div class="utt" data-line="${l.id}"><div class="head"><span class="spk" style="color:${laneColor(l.lane)}">${l.lane === "Me" ? "Me" : "Them"}</span><span class="num">${K.mmss(l.at)}</span></div>
    <div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`).join("");
}
function renderLines() { const e = $("#kkm-lines"); if (!e) return; const stick = e.scrollTop + e.clientHeight >= e.scrollHeight - 30; e.innerHTML = linesHtml(); if (stick) e.scrollTop = e.scrollHeight; }
function refreshSession() { if (sessionEl && sessionEl.isConnected) sessionRender(sessionEl, sessionOpts); NAV.refresh("session"); }
function sessionRender(el, o = {}) {
  sessionEl = el; sessionOpts = o;
  const btns = o.bare ? "" : S.phase === "idle"
    ? `<button class="btn rec" onclick="startSession('meeting')">● 会議を録音</button><button class="btn" onclick="startSession('face')">対面</button>`
    : `<button class="btn" ${S.phase === "live" ? "" : "disabled"} onclick="stopSession(true)">■ 停止</button>${S.phase === "live" ? `<button class="btn" onclick="askAdvisor()">アドバイザー${S.advisorPending.length ? " (1)" : ""}</button>` : ""}`;
  const lanes = S.phase === "live" ? (S.mode === "face" ? `<span class="meta">マイクのみ</span>${faceSaveChip()}` : `<span class="meta">Me = マイク · Them = システム音声</span>`) : (o.idleExtra ?? faceSaveChip());
  el.innerHTML = `<div class="kkm-sess">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${btns}${o.bare ? "" : statusText()}${lanes}
      ${S.auto.state !== "off" ? `<span class="chip ${S.auto.state === "error" ? "warn" : ""}">${esc(autoLabel())}</span>` : ""}</div>
    ${deviceHtml(o.bare)}${advisorHtml(o.bare)}
    <div id="kkm-lines" class="scroll" style="flex:1" oncontextmenu="event.preventDefault();openMenu(this,[['クリア',clearLines]])">${linesHtml()}</div></div>`;
  const e = $("#kkm-lines", el); e.scrollTop = e.scrollHeight
}

/* ---- auto record (#18) ---- */
function setAuto(on) {
  K.settings.autoRecord = on; S.auto.state = on ? "waiting" : "off"; S.auto.manualStopped = false; S.auto.error = "";
  renderMenubar(); NAV.refresh();
}
function autoSimStart() {
  if (S.auto.state !== "waiting") return toast("自動録音がオフか、すでに録音中です");
  if (S.auto.manualStopped) return toast("手動で停止した会議なので再開しません");
  startSession("meeting", true);
}
function autoSimEnd() {
  if (S.auto.state !== "recording") return toast("自動録音中ではありません");
  S.auto.countdown = K.settings.autoStopGraceSec;
  S.auto.timer = setInterval(() => { S.auto.countdown -= 5; renderMenubar(); NAV.refresh("auto"); if (S.auto.countdown <= 0) { clearInterval(S.auto.timer); stopSession(false); toast("会議が終わって 60 秒たったので停止しました"); } }, 250);
  toast("会議の終了を検出。60 秒後に自動停止します");
}
function autoSimError() { if (S.auto.state === "off") return; S.auto.state = "error"; S.auto.error = "システム音声を取得できません"; renderMenubar(); NAV.refresh(); }
/* ---- recordings: list, detail, transcript, player (#4 #8 #9 #12 #14 #15) ---- */
let detailOpts = {};
const diarizing = {};
function recMeta(r) { return `${r.date} · ${fmtDur(r.durationMs)} · ${r.utterances.length}行`; }
function recRowHtml(r, sel, onclick) {
  return `<div class="row ${sel ? "sel" : ""}" data-rec="${r.id}" onclick="${onclick}('${r.id}')">
    <div style="display:flex;gap:6px;align-items:center"><span style="flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</span>
      ${S.dirty[r.id] ? '<span class="chip warn">未保存</span>' : ""}${statusChip(r)}</div>

  openSheet(`<h2>検索するフォルダ</h2><div class="meta" style="margin:4px 0 8px">追加したフォルダの Markdown / テキストも検索します。</div>
    ${K.folders.map((f, i) => `<div style="display:flex;gap:8px;align-items:center;padding:3px 0"><span class="mono" style="flex:1">${esc(f.path)}</span><span class="meta">${f.files.length} ファイル</span><button class="btn sm" onclick="removeFolder(${i});folderSheet()">削除</button></div>`).join("")}
    <div style="display:flex;gap:6px;margin-top:8px"><input class="input mono" id="kkm-fp" style="flex:1" value="~/Documents/research"><button class="btn" onclick="addFolderOk();folderSheet()">追加</button></div>
    <div style="text-align:right;margin-top:10px"><button class="btn" onclick="closeSheet()">閉じる</button></div>`);
}
NAV.openRec = (id, at) => { V.recId = id; V.live = false; V.tool = null; renderAll(); focusAt(at); $(`.items [data-rec="${id}"]`)?.scrollIntoView({ block: "nearest" }); };
NAV.go = (w) => { if (w === "live") { V.live = true; V.tool = null; renderAll(); } if (w === "eval") setTool("eval"); };
NAV.refresh = (kind) => {
  if (kind === "import" || kind === "models" || kind === "eval" || kind === "search") return;
  $("#nav").innerHTML = navHtml();
  if (kind === "settings") return;
  if (kind === "session") return;
  if (kind === "detail") { renderList(); return; }
  renderList();
  if (kind === undefined && V.tool === "settings") renderDetail();
};
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, select") || V.tool || V.live) return;
  const list = filtered(V.box), i = list.findIndex((r) => r.id === V.recId);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); if (list[i + 1]) NAV.openRec(list[i + 1].id); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); if (i > 0) NAV.openRec(list[i - 1].id); }
});
V.recId = K.recordings[0].id;
renderAll(); renderMenubar(); scheduleCutin();
setInterval(() => { const e = $("#nav-el"); if (e && S.phase === "live") e.textContent = K.mmss(Date.now() - S.t0); }, 1000);
</script>
</body>
</html>
