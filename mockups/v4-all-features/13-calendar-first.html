<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>13 予定が主役 — Kikimimic</title>
<meta name="kkm-concept" content="予定一覧が起動画面。各予定に自動録音トグルと録音の状態があり、終わった予定はそのまま録音を開く">
<meta name="kkm-why" content="予定どおりに会議をする人が、会議の直前に。録音は予定に紐づくものなので、予定の行で「録る/録らない」を決めておけば録り忘れず、終わった会議も予定の行から振り返れる">
<meta name="kkm-tradeoff" content="予定外の会議（対面・飛び込み）は右上の「予定外で録音」に退き、予定外の録音は一覧の下にまとめて置かれる。予定を跨いだ横断的な閲覧は検索に頼る">
<link rel="stylesheet" href="shared/kit.css">
<style>
  .body { flex: 1; display: flex; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .agenda { width: 440px; flex: 0 0 auto; border-right: 1px solid var(--border); padding: 4px 10px 40px; }
  .day { margin: 14px 4px 4px; display: flex; align-items: baseline; gap: 8px; }
  .ev { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px; }
  .ev .time { font-variant-numeric: tabular-nums; color: var(--muted-2); }
  .ev .title { font-weight: 600; }
  .ev .state { display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .ev .autobox { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .ev.past .title { font-weight: 400; }
  .nowline { display: flex; align-items: center; gap: 6px; margin: 2px 4px; font-size: 11px; color: var(--danger); }
  .nowline::after { content: ""; flex: 1; height: 1px; background: var(--danger); }
  .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .phead { padding: 14px 18px 10px; border-bottom: 1px solid var(--border); }
  .pbody { flex: 1; padding: 10px 18px 40px; }
  .bar2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .about { position: absolute; right: 10px; bottom: 8px; z-index: 40; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 13 予定が主役</div>
<div class="win">
  <div class="menubar" id="menubar"></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic — 予定</span></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="body">
    <div class="agenda scroll" id="agenda"></div>
    <div class="panel" id="panel"></div>
  </div>
  <button class="btn sm ghost about" data-act="about">この案について</button>
</div>
<script src="shared/data.js"></script>
<script>
// ===== Core (shared by this file's screens): utilities, overlays, session, menubar, auto-record, cut-in =====
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WIN = () => $(".win");
const nowClock = () => "11:28"; // the mock's fixed "now" (matches the menu bar and calendar offsets)
// Hooks each screen layout fills in.
const V = { refresh() {}, openRec(recId, uttId) {}, liveUpdate: null };
// Click delegation: any element with data-act="name" calls ACT.name(el, event).
const ACT = {};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (el && ACT[el.dataset.act] && !el.disabled) ACT[el.dataset.act](el, e); });
document.addEventListener("change", (e) => { const el = e.target.closest("[data-chg]"); if (el && ACT[el.dataset.chg]) ACT[el.dataset.chg](el, e); });

function toast(msg) { $$(".toast").forEach((t) => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; WIN().appendChild(t); setTimeout(() => t.remove(), 2400); }
// Keep scroll positions (by id) across re-renders.
function keepScroll(fn) { const pos = $$("[id].scroll").map((e) => [e.id, e.scrollTop]); fn(); pos.forEach(([id, t]) => { const e = document.getElementById(id); if (e) e.scrollTop = t; }); }

// Sheets are re-renderable: sheetOpen(fn) stores fn, sheetRefresh() re-runs it.
let SHEET = null;
function sheetOpen(render, wide) {
  sheetClose(); SHEET = { render };
  const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet" id="sheetBody"${wide ? ' style="max-width:760px"' : ""}></div>`;
  s.addEventListener("mousedown", (e) => { if (e.target === s) sheetClose(); });
  WIN().appendChild(s); sheetRefresh();
}
function sheetRefresh() { const b = $("#sheetBody"); if (!b || !SHEET) return; const t = b.scrollTop; b.innerHTML = SHEET.render(); b.scrollTop = t; }
function sheetClose() { const s = $("#scrim"); if (s) s.remove(); SHEET = null; }
ACT.closeSheet = () => sheetClose();
const sheetHead = (title, extra = "") => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 style="flex:1">${title}</h2>${extra}<button class="btn sm ghost" data-act="closeSheet">閉じる</button></div>`;

// Small popup menu. items: [label, fn] | ["-"] | [label, null] (caption)
function menu(anchor, items) {
  closeMenu(); const m = document.createElement("div"); m.className = "menu"; m.id = "kmenu";
  const r = anchor.getBoundingClientRect(), w = WIN().getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(r.left - w.left, w.width - 230)) + "px"; m.style.top = (r.bottom - w.top + 4) + "px";
  for (const [label, fn] of items) {
    if (label === "-") { const d = document.createElement("div"); d.className = "sep"; d.style.margin = "4px 0"; m.appendChild(d); continue; }
    if (!fn) { const d = document.createElement("div"); d.className = "meta"; d.style.padding = "2px 10px"; d.textContent = label; m.appendChild(d); continue; }
    const b = document.createElement("button"); b.textContent = label; b.onclick = (e) => { e.stopPropagation(); closeMenu(); fn(); }; m.appendChild(b);
  }
  WIN().appendChild(m); setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { const m = $("#kmenu"); if (m) m.remove(); }

// ---------- Live session (#1, #2, #3, #16, #17) ----------
const SES = { state: "idle", mode: null, lines: [], ctrl: null, t0: 0, question: null, notice: null, pending: [], shown: [], advisorStopped: false, advisorMuted: false, advisorBusy: false, saveFace: K.settings.saveFaceToFace, auto: false, title: null, timer: null };
const elapsed = () => SES.state === "idle" ? "00:00" : K.mmss(Date.now() - SES.t0);
function startSession(mode, opts = {}) {
  if (SES.state !== "idle") { toast("すでに録音中です"); return; }
  if (K.settings.clearOnStart) SES.lines = [];
  Object.assign(SES, { state: "rec", mode, auto: !!opts.auto, title: opts.title || null, question: null, notice: null, pending: [], shown: [], advisorStopped: false, advisorMuted: false, advisorBusy: false, t0: Date.now() });
  SES.ctrl = K.live(mode, onLive);
  SES.timer = setInterval(() => { autoTick(); renderMenubar(); V.tick && V.tick(); }, 1000);
  if (opts.auto) AUTO.state = "recording";
  renderMenubar(); V.refresh();
}
function onLive(ev) {
  const L = SES.lines.find((l) => l.id === ev.id);
  if (!L && ev.type !== "line" && ["update", "commit", "translating", "translate"].includes(ev.type)) return; // line erased by クリア mid-session
  if (ev.type === "line") SES.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", tr: null, translating: false, done: false });
  else if (ev.type === "update") Object.assign(L, { committed: ev.committed, volatile: ev.volatile });
  else if (ev.type === "commit") Object.assign(L, { committed: ev.text, volatile: "", done: true });
  else if (ev.type === "translating") { if (K.settings.translateInto) L.translating = true; }
  else if (ev.type === "translate") { if (K.settings.translateInto) { L.translating = false; L.tr = ev.text; } }
  else if (ev.type === "advisor") { if (!SES.advisorStopped && !SES.advisorMuted && !SES.pending.some((c) => c.id === ev.card.id)) SES.pending.push(ev.card); }
  else if (ev.type === "question") SES.question = ev;
  V.liveUpdate ? V.liveUpdate() : V.refresh();
}
function stopSession(manual = true) {
  if (SES.state !== "rec") return;
  SES.ctrl.stop(); clearInterval(SES.timer); SES.state = "finishing";
  if (SES.auto) { AUTO.state = "waiting"; AUTO.endIn = null; if (manual) AUTO.noResume = true; }
  renderMenubar(); V.refresh();
  setTimeout(() => {
    SES.state = "idle";
    const keep = SES.mode === "meeting" || SES.saveFace;
    const rec = keep && SES.lines.some((l) => l.done) ? saveLive() : null;
    renderMenubar(); V.refresh();
    toast(rec ? `「${rec.title}」を保存しました` : SES.mode === "face" ? "対面: 保存しない設定のため、保存していません" : "停止しました");
    if (rec && V.onSaved) V.onSaved(rec);
  }, 1600);
}
let recSeq = 0;
function saveLive() {
  const id = "n" + (++recSeq);
  const utts = SES.lines.filter((l) => l.done).map((l, i) => {
    const units = l.committed.split(/(?<=\s)|(?<=[、。])/);
    return { id: id + "-" + i, lane: SES.mode === "face" ? "Me" : l.lane, spk: null, start: l.at, end: l.at + Math.max(1500, l.committed.length * 110), text: l.committed, units, tr: l.tr, reviewed: false };
  });
  const rec = { id, title: SES.title || (SES.mode === "face" ? "対面の会話" : "会議の録音"), date: "2026-11-17 " + nowClock(), durationMs: Math.max(...utts.map((u) => u.end)) + 1000,
    source: SES.mode === "face" ? "face" : "meeting", lanes: SES.mode === "face" ? ["Me"] : ["Me", "Them"], speakers: {}, utterances: utts, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };
  K.recordings.unshift(rec); return rec;
}
ACT.startMeeting = () => startSession("meeting");
ACT.startFace = () => startSession("face");
ACT.stop = () => stopSession(true);
ACT.toggleSaveFace = () => { SES.saveFace = !SES.saveFace; renderMenubar(); V.refresh(); toast(SES.saveFace ? "対面の会話を保存します" : "対面の会話は保存しません"); };
ACT.follow = () => { SES.notice = `${SES.question.detected} を録音しています`; SES.question = null; V.refresh(); };
ACT.stay = () => { SES.notice = `${SES.question.capturing} のまま録音を続けます`; SES.question = null; V.refresh(); };
ACT.dismissNotice = () => { SES.notice = null; V.refresh(); };
ACT.liveCite = (el) => { const e = document.getElementById("ll-" + el.dataset.id); if (e) { e.scrollIntoView({ block: "center" }); e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); } };
// Advisor in a live session: manual only. Cards wait until asked for.
ACT.liveAdvise = () => {
  if (SES.advisorStopped) { SES.advisorStopped = false; }
  SES.advisorBusy = true; V.refresh();
  SES.advTimer = setTimeout(() => { SES.advisorBusy = false; if (SES.pending.length) { SES.shown.push(...SES.pending); SES.pending = []; } else toast("いまはアドバイスはありません"); V.refresh(); }, 900);
};
ACT.liveAdvStop = () => { clearTimeout(SES.advTimer); SES.advisorBusy = false; SES.advisorStopped = true; SES.pending = []; V.refresh(); toast("アドバイザーを停止しました"); };
ACT.liveAdvClose = (el) => { SES.shown = SES.shown.filter((c) => c.id !== el.dataset.id); V.refresh(); };
ACT.liveAdvMute = () => { SES.advisorMuted = true; SES.shown = []; SES.pending = []; V.refresh(); toast("この会議ではアドバイスを出しません"); };

function laneColor(lane) { return lane === "Them" ? "var(--lane-them)" : "var(--lane-me)"; }
function liveLinesHtml() {
  if (!SES.lines.length) return `<div class="meta" style="padding:24px 0;text-align:center">${SES.state === "rec" ? "聞き取り中…" : "まだ発話はありません"}</div>`;
  return SES.lines.map((l) => `<div class="utt" id="ll-${l.id}"><div class="head"><span class="spk" style="color:${laneColor(l.lane)}">${SES.mode === "face" ? "対面" : l.lane}</span><span class="num">${K.mmss(l.at)}</span></div>
    <div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`).join("");
}
function liveNoticesHtml() {
  let s = "";
  if (SES.question) s += `<div class="notice">出力が ${esc(SES.question.detected)} に変わりました（いまは ${esc(SES.question.capturing)} を録音中）。切り替えますか？<span style="flex:1"></span><button class="btn sm" data-act="follow">切り替える</button><button class="btn sm" data-act="stay">そのまま</button></div>`;
  if (SES.notice) s += `<div class="notice">${esc(SES.notice)}<span style="flex:1"></span><button class="btn sm ghost" data-act="dismissNotice">閉じる</button></div>`;
  return s;
}
function liveAdvisorHtml() {
  if (SES.state !== "rec") return "";
  const head = SES.advisorMuted ? `<span class="meta">アドバイザー: この会議では出しません</span>`
    : SES.advisorBusy ? `<span class="meta">アドバイザーが確認しています…</span><button class="btn sm" data-act="liveAdvStop">停止</button>`
    : `<button class="btn sm" data-act="liveAdvise">アドバイスを求める</button><span class="meta">手動のときだけ動きます${SES.advisorStopped ? "（停止中）" : ""}</span>`;
  const cards = SES.shown.map((c) => `<div class="card" style="margin-top:6px"><div class="meta">${esc(c.kind)}</div><div>${esc(c.text)}</div>
    <div style="display:flex;gap:6px;margin-top:6px;align-items:center">${c.ev.map((id) => `<span class="cite" data-act="liveCite" data-id="${id}">根拠の発話</span>`).join(" ")}<span style="flex:1"></span>
    <button class="btn sm" data-act="liveAdvClose" data-id="${c.id}">閉じる</button><button class="btn sm" data-act="liveAdvMute">この会議では出さない</button></div></div>`).join("");
  return `<div style="display:flex;gap:8px;align-items:center">${head}</div>${cards}`;
}
// Session controls: start buttons + face-to-face save state (#17), or stop/finishing.
function sessionControlsHtml() {
  if (SES.state === "rec") return `<span class="chip rec"><span class="dot-rec"></span>${SES.mode === "face" ? "対面" : "会議"} ${elapsed()}</span>${SES.mode === "face" ? `<button class="chip ${SES.saveFace ? "ok" : ""}" style="cursor:pointer" data-act="toggleSaveFace">${SES.saveFace ? "保存する" : "保存しない"}</button>` : ""}<button class="btn" data-act="stop">■ 停止</button>`;
  if (SES.state === "finishing") return `<span class="meta">翻訳を仕上げています…</span><button class="btn" disabled>■ 停止</button>`;
  return `<button class="btn rec" data-act="startMeeting" title="Me = マイク / Them = システム音声">● 会議を録音</button><button class="btn" data-act="startFace" title="マイクのみ">対面</button><button class="chip ${SES.saveFace ? "ok" : ""}" style="cursor:pointer" data-act="toggleSaveFace" title="対面モードの保存（既定は保存しない）">対面: ${SES.saveFace ? "保存する" : "保存しない"}</button>`;
}
// ---------- Menu bar status item + auto-record (#18) ----------
const AUTO = { state: K.settings.autoRecord ? "waiting" : "off", noResume: false, endIn: null, error: null };
const autoLabel = () => ({ off: "自動録音: オフ", waiting: "自動録音: 待機中", recording: "自動録音: 録音中", error: "自動録音: エラー" })[AUTO.state];
function autoTick() {
  if (AUTO.endIn == null || SES.state !== "rec") return;
  AUTO.endIn--; if (AUTO.endIn <= 0) { AUTO.endIn = null; stopSession(false); toast("会議が終わって 60 秒たったため、自動で停止しました"); }
}
function setAutoRecord(on) { K.settings.autoRecord = on; AUTO.state = on ? "waiting" : "off"; AUTO.error = null; renderMenubar(); V.refresh(); sheetRefresh(); }
function autoStartFor(title) {
  if (AUTO.state === "off") { toast("自動録音はオフです"); return; }
  if (AUTO.noResume) { toast("手動で停止したため、この会議では再開しません"); return; }
  if (AUTO.state === "error") { toast("自動録音はエラーで止まっています"); return; }
  startSession("meeting", { auto: true, title });
}
function renderMenubar() {
  const mb = $("#menubar"); if (!mb) return;
  const st = SES.state === "rec" ? `<span class="dot-rec"></span> ${elapsed()}${AUTO.endIn != null ? ` · ${AUTO.endIn} 秒後に自動停止` : ""}` : SES.state === "finishing" ? "仕上げ中…" : AUTO.state === "error" ? `<span class="err">自動録音エラー</span>` : AUTO.state === "waiting" ? "自動録音 待機中" : "待機中";
  mb.innerHTML = `<span class="meta">Wi-Fi</span><span class="meta">11:28</span><button class="btn sm ghost" data-act="mbMenu" style="gap:6px">きき耳 · ${st}</button>`;
}
ACT.mbMenu = (el) => {
  const items = [[SES.state === "rec" ? `録音中 ${elapsed()}${SES.auto ? "（自動）" : ""}` : "待機中", null], [autoLabel(), null]];
  if (AUTO.error) items.push([AUTO.error, null]);
  if (AUTO.noResume) items.push(["手動停止のため、この会議では再開しません", null]);
  items.push(["-"]);
  if (SES.state === "rec") items.push(["■ 停止", () => stopSession(true)]);
  else items.push(["● 会議を録音", () => startSession("meeting")]);
  items.push([K.settings.autoRecord ? "自動録音をオフにする" : "自動録音をオンにする", () => setAutoRecord(!K.settings.autoRecord)]);
  if (AUTO.state === "error") items.push(["自動録音を再試行", () => { AUTO.state = "waiting"; AUTO.error = null; renderMenubar(); V.refresh(); }]);
  items.push(["-"], ["デモ操作", null]);
  if (SES.state !== "rec") items.push(["予定の会議が始まる（自動録音）", () => autoStartFor((K.calendar.events.find((e) => e.auto && e.inMin > 0) || {}).title)]);
  if (SES.state === "rec" && SES.auto && AUTO.endIn == null) items.push(["会議が終わる（60 秒後に停止）", () => { AUTO.endIn = 60; renderMenubar(); V.refresh(); }]);
  if (AUTO.state !== "off") items.push(["マイクが使えなくなる（エラー）", () => { if (SES.state === "rec" && SES.auto) stopSession(false); AUTO.state = "error"; AUTO.error = "マイク を使えません: 権限がありません"; renderMenubar(); V.refresh(); }]);
  items.push(["会議の直前（カットイン）", () => showCutin(nextEvent())]);
  menu(el, items);
};

// ---------- Google Calendar (#7) ----------
const CAL = { signedIn: K.calendar.signedIn, signingIn: false };
ACT.calSignIn = () => { CAL.signingIn = true; sheetRefresh(); V.refresh(); CAL.t = setTimeout(() => { CAL.signingIn = false; CAL.signedIn = K.calendar.signedIn; sheetRefresh(); V.refresh(); toast("Google カレンダーにサインインしました"); }, 1500); };
ACT.calCancel = () => { clearTimeout(CAL.t); CAL.signingIn = false; sheetRefresh(); V.refresh(); };
ACT.calSignOut = () => { CAL.signedIn = null; sheetRefresh(); V.refresh(); toast("サインアウトしました"); };
function calendarSettingsHtml() {
  if (CAL.signingIn) return `<div style="display:flex;gap:8px;align-items:center"><span class="meta">ブラウザでサインインを完了してください…</span><button class="btn sm" data-act="calCancel">キャンセル</button></div>`;
  if (CAL.signedIn) return `<div style="display:flex;gap:8px;align-items:center"><span>${esc(CAL.signedIn)} でサインイン中</span><span class="meta">最後に読んだ時刻 ${K.calendar.lastRead}</span><span style="flex:1"></span><button class="btn sm" data-act="calSignOut">サインアウト</button></div>`;
  return `<div style="display:flex;gap:8px;align-items:center"><span class="meta">カレンダーだけを読みます。音声と文字起こしは外に出ません。</span><span style="flex:1"></span><button class="btn sm" data-act="calSignIn">Google でサインイン</button></div>`;
}
const nextEvent = () => K.calendar.events.find((e) => e.inMin > 0);
function showCutin(ev) {
  if (!CAL.signedIn) { toast("Google カレンダーにサインインしていません"); return; }
  hideCutin(); const c = document.createElement("div"); c.className = "cutin"; c.id = "cutin";
  c.innerHTML = `<div class="meta">あと ${ev.inMin}:00 · ${esc(ev.start)} · Google カレンダー</div><div style="font-weight:600;margin:2px 0 10px">${esc(ev.title || "（タイトルなし）")}</div>
    <div style="display:flex;gap:6px">${ev.url ? `<button class="btn primary" data-act="cutJoin" data-e="${ev.id}">参加して録音</button>` : ""}<button class="btn" data-act="cutRec" data-e="${ev.id}">録音を開始</button><span style="flex:1"></span><button class="btn" data-act="cutClose">閉じる</button></div>`;
  WIN().appendChild(c);
}
function hideCutin() { const c = $("#cutin"); if (c) c.remove(); }
const evById = (id) => K.calendar.events.find((e) => e.id === id);
ACT.cutJoin = (el) => { const ev = evById(el.dataset.e); hideCutin(); toast(ev.url.replace("https://", "") + " を開きました"); startSession("meeting", { title: ev.title }); };
ACT.cutRec = (el) => { const ev = evById(el.dataset.e); hideCutin(); startSession("meeting", { title: ev.title }); };
ACT.cutClose = () => hideCutin();

// ---------- "この案について" ----------
const metaOf = (n) => (document.querySelector(`meta[name="${n}"]`) || {}).content || "";
ACT.about = () => sheetOpen(() => sheetHead("この案について") + [["コンセプト", "kkm-concept"], ["仮説と理由", "kkm-why"], ["捨てるもの", "kkm-tradeoff"]].map(([h, n]) => `<h3 style="margin-top:10px">${h}</h3><div>${esc(metaOf(n))}</div>`).join(""));
// ---------- Recording: player, transcript, review, speakers, cues, export (#4, #8, #9) ----------
const recById = (id) => K.recordings.find((r) => r.id === id);

function onPlayTick(pos, playing) {
  const rec = PL.rec; if (!rec) return;
  $$(`[data-ppos="${rec.id}"]`).forEach((e) => (e.textContent = `${K.mmss(pos)} / ${K.mmss(rec.durationMs)}`));
  $$(`[data-pbtn="${rec.id}"]`).forEach((e) => (e.textContent = playing ? "❚❚ 一時停止" : "▶ 再生"));
  let cur = null;
  for (const w of $$(`.w[data-r="${rec.id}"]`)) { if (+w.dataset.s <= pos && pos < +w.dataset.e) { cur = w; break; } }
  if (cur !== PL.nowEl) { if (PL.nowEl) PL.nowEl.classList.remove("now"); if (cur) cur.classList.add("now"); PL.nowEl = cur; }

// ---------- Post-processing pipeline (rec.status) and Obsidian notes ----------
const ORDER = ["recorded", "transcribed", "diarized", "minutes", "exported"];
const STEP_LABEL = { transcribed: "文字起こし", diarized: "話者", minutes: "議事録", exported: "Obsidian" };
const stageIdx = (rec) => ORDER.indexOf(rec.status || "transcribed");
function advance(rec, st) { if (ORDER.indexOf(st) > stageIdx(rec)) rec.status = st; }
const isTodo = (rec) => stageIdx(rec) < ORDER.indexOf("minutes") || !!(rec.note && rec.note.state === "stale");
const isStale = (rec) => !!(rec.note && rec.note.state === "stale");
function statusChip(rec) {
  const busy = PIPE.busy[rec.id];
  if (busy) return `<span class="chip info">${busy}…</span>`;
  if (isStale(rec)) return `<span class="chip warn">ノートが古い</span>`;
  if (rec.status === "exported") return `<span class="chip ok">${K.STATUS.exported}</span>`;
  if (rec.status === "recorded") return `<span class="chip warn">${K.STATUS.recorded}</span>`;
  return `<span class="chip">${K.STATUS[rec.status] || ""}</span>`;
}
// Transcribe a recording that only has audio (offline meeting / import).
function transcribe(rec) {
  if (!rec.utterances.length) {
    const face = rec.lanes[0] === "Me" && rec.lanes.length === 1;
    rec.utterances = [
      { id: rec.id + "t1", lane: rec.lanes[0], spk: null, start: 1000, end: 5200, text: "では、始めましょう。", units: ["では、", "始めましょう。"], tr: "Well, let's begin.", reviewed: false },
      { id: rec.id + "t2", lane: face ? rec.lanes[0] : rec.lanes[1] || rec.lanes[0], spk: null, start: 5800, end: 11000, text: "前回の宿題から確認します。", units: ["前回の", "宿題から", "確認します。"], tr: "Let's check last time's action items.", reviewed: false },
    ];
  }
  advance(rec, "transcribed");
}
const PIPE = { busy: {}, queue: [], running: false };
// Run the remaining steps up to minutes; Obsidian follows only when auto-export is on.
function runPipeline(rec, fast) {
  const steps = [];
  if (stageIdx(rec) < 1) steps.push(["文字起こし", () => transcribe(rec)]);
  if (stageIdx(rec) < 2) steps.push(["話者を判別", () => diarize(rec)]);
  if (stageIdx(rec) < 3) steps.push(["議事録を作成", () => buildMinutes(rec)]);
  if (!steps.length) { if (isStale(rec) || rec.status !== "exported") writeNote(rec); return Promise.resolve(); }
  return steps.reduce((p, [label, fn]) => p.then(() => new Promise((res) => { PIPE.busy[rec.id] = label; V.refresh(); setTimeout(() => { fn(); res(); }, fast ? 250 : 800); })), Promise.resolve())
    .then(() => { delete PIPE.busy[rec.id]; V.refresh(); });
}
ACT.process = (el) => { const rec = recById(el.dataset.r); runPipeline(rec).then(() => toast(`「${rec.title}」の後処理が終わりました`)); };
ACT.processAll = () => {
  const list = K.recordings.filter(isTodo);
  if (!list.length) { toast("未完了の録音はありません"); return; }
  toast(`${list.length} 件をまとめて処理します`);
  list.reduce((p, r) => p.then(() => runPipeline(r, true)), Promise.resolve()).then(() => toast(`${list.length} 件の後処理が終わりました`));
};
// Pipeline strip: where this recording stands, and one button to finish it.
function pipelineHtml(rec) {
  const i = stageIdx(rec), busy = PIPE.busy[rec.id];
  const steps = ["transcribed", "diarized", "minutes", "exported"].map((s) => {
    const done = ORDER.indexOf(s) <= i && !(s === "exported" && isStale(rec));
    return `<span class="${done ? "" : "meta"}">${done ? "✓" : "○"} ${STEP_LABEL[s]}${s === "exported" && isStale(rec) ? "（古い）" : ""}</span>`;
  }).join(`<span class="meta">→</span>`);
  const action = busy ? `<span class="meta">${busy}…</span>`
    : i < 3 ? `<button class="btn sm primary" data-act="process" data-r="${rec.id}">続きを処理</button>`
    : `<button class="btn sm${isStale(rec) || rec.status !== "exported" ? " primary" : ""}" data-act="obsidian" data-r="${rec.id}">${isStale(rec) ? "ノートを更新" : rec.status === "exported" ? "ノートを見る" : "Obsidian に書き出す"}</button>`;
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${steps}<span style="flex:1"></span>${action}</div>`;
}
const notePath = (rec) => { const ob = K.settings.obsidian; return ob.folder + "/" + ob.fileName.replace("{date}", rec.date.slice(0, 10)).replace("{title}", rec.title); };

function autoExport(rec) { if (K.settings.obsidian.autoExport === "minutes") writeNote(rec); }

// ---------- Lists at ~90 recordings: status filter + date groups ----------
const FILTERS = [["all", "すべて"], ["todo", "未完了"], ["recorded", "未処理"], ["stale", "ノートが古い"]];
function filterRecs(list, f) {
  if (f === "todo") return list.filter(isTodo);
  if (f === "recorded") return list.filter((r) => r.status === "recorded");
  if (f === "stale") return list.filter(isStale);
  return list;
}
function filterSegHtml(cur, act) {
  return `<div class="seg">${FILTERS.map(([k, l]) => { const n = k === "all" ? K.recordings.length : filterRecs(K.recordings, k).length; return `<button class="${cur === k ? "sel" : ""}" data-act="${act}" data-v="${k}">${l} <span class="${cur === k ? "" : "meta"} num">${n}</span></button>`; }).join("")}</div>`;
}
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function dayLabel(d) {
  const dt = new Date(d + "T00:00:00"), diff = Math.round((new Date("2026-11-17T00:00:00") - dt) / 864e5);
  const md = `${dt.getMonth() + 1}月${dt.getDate()}日（${WD[dt.getDay()]}）`;
  return diff === 0 ? "今日 · " + md : diff === 1 ? "昨日 · " + md : md;
}
function groupByDay(list) { const g = new Map(); for (const r of list) { const d = r.date.slice(0, 10); if (!g.has(d)) g.set(d, []); g.get(d).push(r); } return [...g.entries()].sort((a, b) => b[0].localeCompare(a[0])); }

// ===== 13 予定が主役: agenda on the left is the home; the right panel follows the selected row =====
const EVREC = {};                 // calendar event id -> recording id made from it
K.calendar.events.forEach((e) => { if (e.done) EVREC[e.id] = e.done; });
let PF = "all", SHOWDAYS = 4;      // past list: status filter, how many days are expanded
let SEL = { kind: "event", id: nextEvent().id };
let RECVIEW = "text";             // text | minutes | stats | ask
const TODAY = "2026-11-17";
const hm = (date) => date.slice(11, 16);
const isToday = (r) => r.date.startsWith(TODAY);
const fromCalendar = (r) => !!r.calendar || Object.values(EVREC).includes(r.id);
const md = (date) => { const [, m, d] = date.slice(0, 10).split("-"); return `${+m}月${+d}日`; };

// ---- agenda (left) ----
function eventState(e) {
  if (SES.state !== "idle" && SES.evId === e.id) return `<span class="chip rec"><span class="dot-rec"></span>${SES.state === "rec" ? "録音中 " + elapsed() : "仕上げ中"}</span>${SES.auto ? `<span class="meta">自動</span>` : ""}`;
  if (EVREC[e.id]) return `<span class="chip ok">録音済み</span>`;
  const soon = e.inMin <= 10 ? `<span class="chip warn">あと ${e.inMin} 分</span>` : "";
  if (e.auto) return soon + (AUTO.state === "off" ? `<span class="chip warn">自動録音がオフ</span>` : AUTO.state === "error" ? `<span class="chip rec">自動録音エラー</span>` : `<span class="chip">自動で録音</span>`);
  return soon + `<span class="meta">手動で開始</span>`;
}
function eventRow(e) {

  return `<div class="row ev${sel ? " sel" : ""}" data-act="selEvent" data-id="${e.id}">

function recRow(r) {

  return `<div class="row ev past${sel ? " sel" : ""}" data-act="selRec" data-id="${r.id}">
    <span class="time">${hm(r.date)}</span>

    <span class="meta">開く ›</span></div>`;
}
function liveRow() {
  if (SES.state === "idle" || SES.evId) return "";
  return `<div class="row ev${SEL.kind === "live" ? " sel" : ""}" data-act="selLive"><span class="time">${nowClock()}</span><div><div class="title">${esc(SES.title || (SES.mode === "face" ? "対面の会話" : "予定外の会議"))}</div><div class="state"><span class="chip rec"><span class="dot-rec"></span>${SES.state === "rec" ? "録音中 " + elapsed() : "仕上げ中"}</span><span class="chip">予定外</span></div></div><span></span></div>`;
}
function renderAgenda() {
  const todayRecs = K.recordings.filter(isToday).sort((a, b) => a.date.localeCompare(b.date));
  const past = K.recordings.filter((r) => !isToday(r)).sort((a, b) => b.date.localeCompare(a.date));
  let h = `<div class="day"><h2>今日</h2><span class="meta">${md(TODAY)}（火）</span></div>`;
  h += todayRecs.map(recRow).join("");
  h += `<div class="nowline">いま ${nowClock()}</div>` + liveRow();
  if (CAL.signedIn) h += K.calendar.events.filter((e) => !EVREC[e.id]).map(eventRow).join("") || `<div class="meta" style="padding:8px">今日の予定はもうありません</div>`;
  else h += `<div class="card" style="margin:8px 4px"><div class="meta" style="margin-bottom:6px">Google カレンダーにサインインすると、ここに今日の予定が並びます。</div><button class="btn sm" data-act="calSignIn">${CAL.signingIn ? "ブラウザでサインインを完了してください…" : "Google でサインイン"}</button></div>`;
  const todo = K.recordings.filter(isTodo).length;
  h += `<div class="day" style="margin-top:22px"><h2 style="flex:1">これまでの会議</h2>${todo ? `<button class="btn sm" data-act="processAll">未完了 ${todo} 件をまとめて処理</button>` : ""}</div>
    <div style="margin:4px">${filterSegHtml(PF, "pastFilter")}</div>`;
  const groups = groupByDay(filterRecs(past, PF));
  if (!groups.length) h += `<div class="meta" style="padding:8px">該当する録音はありません</div>`;
  groups.slice(0, SHOWDAYS).forEach(([d, list]) => { h += `<div class="day"><h3>${dayLabel(d)}</h3><span class="meta">${list.length} 件</span></div>` + list.map(recRow).join(""); });
  if (groups.length > SHOWDAYS) h += `<button class="btn sm ghost" style="margin:6px 4px" data-act="moreDays">さらに表示（残り ${groups.slice(SHOWDAYS).reduce((n, g) => n + g[1].length, 0)} 件）</button>`;
  $("#agenda").innerHTML = h;
}

// ---- wiring ----

    const l = $("#live"); const atEnd = !l || l.scrollHeight - l.scrollTop - l.clientHeight < 40;

  },
  tick() { keepScroll(() => { renderToolbar(); renderAgenda(); if (SEL.kind === "event") renderPanel(); }); },
  openRec(recId, uttId) { SEL = { kind: "rec", id: recId }; if (uttId) RECVIEW = "text"; render(); if (uttId) flashUtt(uttId); },
  onSaved(rec) { if (SES.lastEv) { EVREC[SES.lastEv] = rec.id; SES.lastEv = null; } if (SEL.kind === "live") { SEL = { kind: "rec", id: rec.id }; RECVIEW = "text"; } render(); },
});
// Tie a session to the calendar event it was started from.
const _start = startSession;
startSession = function (mode, opts = {}) {
  const ev = opts.title && K.calendar.events.find((e) => e.title === opts.title);
  _start(mode, opts); if (SES.state !== "rec") return;
  SES.evId = ev ? ev.id : null; SES.lastEv = SES.evId; SEL = { kind: "live" }; render();
};
ACT.selEvent = (el, e) => { if (e.target.closest(".toggle")) return; SEL = { kind: "event", id: el.dataset.id }; if (SES.state !== "idle" && SES.evId === el.dataset.id) SEL = { kind: "live" }; render(); };

ACT.selLive = () => { SEL = { kind: "live" }; render(); };
ACT.recView = (el) => { RECVIEW = el.dataset.v; render(); };
ACT.evAuto = (el) => {
  const e = evById(el.dataset.k); e.auto = !e.auto;
  if (e.auto && AUTO.state === "off") { setAutoRecord(true); toast("自動録音をオンにしました"); }
  render();
};

ACT.pastFilter = (el) => { PF = el.dataset.v; render(); };

ACT.evRec = (el) => startSession("meeting", { title: evById(el.dataset.id).title });
ACT.evJoin = (el) => { const e = evById(el.dataset.id); toast(e.url.replace("https://", "") + " を開きました"); startSession("meeting", { title: e.title }); };
ACT.evCutin = (el) => showCutin(evById(el.dataset.id));
ACT.askChip = (el) => askRec(SEL.id, el.dataset.q);
document.addEventListener("submit", (e) => { const f = e.target.closest("[data-form=ask]"); if (!f) return; e.preventDefault(); askRec(SEL.id, f.elements.q.value); });
document.addEventListener("contextmenu", (e) => { if (!e.target.closest("#live") || K.settings.clearOnStart) return; e.preventDefault(); menu(e.target, [["クリア", () => { SES.lines = []; render(); }]]); });
// Search sheet
let Q = "";
ACT.searchOpen = () => { sheetOpen(() => sheetHead("検索") + `<input class="input" id="q" style="width:100%" placeholder="原文・訳文・タイトル・日付、追加したフォルダのメモ" value="${esc(Q)}"><div id="qres" style="margin:8px 0">${searchResultsHtml(Q)}</div><div class="sep"></div>${foldersHtml()}`, true); const i = $("#q"); i.focus(); i.setSelectionRange(Q.length, Q.length); };
document.addEventListener("input", (e) => { if (e.target.id === "q") { Q = e.target.value; $("#qres").innerHTML = searchResultsHtml(Q); } });

renderMenubar(); render();
// The 11:30 review starts in 2 minutes: its cut-in card is already up.
setTimeout(() => showCutin(nextEvent()), 600);
</script>
