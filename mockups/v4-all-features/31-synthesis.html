<title>31 統合案 — Kikimimic</title>
<meta name="kkm-concept" content="30 案のフィードバックを統合。左に時系列の会議と取り込み、中央は幅を絞った本文、上に今の状態、下に録音の確かさ。書き出しは『書き出し先』に一般化し、質問はローカル LLM / Claude Code / Codex から選べる">
<meta name="kkm-why" content="月 90 件の会議を溜めずに流す主ユーザー向け。会議は日付で思い出す（08/17）、録れているかは常に見たい（20）、今どうなっているかは上で分かる（11）、会議中は字幕だけ（18）、終わったら上の再生と単語クリックで確かめて（03/24）、決めた形式で決めた場所へ置く（25 を一般化）。操作は全部ボタンで見え、⌘K は近道（10 の迷いを解消）。エージェントには会議中でも質問できる">
<meta name="kkm-tradeoff" content="上下に常設の帯があるぶん本文の縦が減る。サイドバーは時系列だけなので、機能別の入口は上の帯のボタンと ⌘K に頼る。Claude Code / Codex に質問すると、選んだ範囲の文字起こしがその提供元に送られる（送る前に毎回範囲を表示）">

  .tl .cue.sel { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); } .tl .cue.long { border-color: var(--warn); }
  .tl .ph { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--danger); z-index: 3; }
  /* export preview (25) */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ask drawer */
  .side { grid-column: 1; grid-row: 2; } .main { grid-column: 2; grid-row: 2; }

  .ask .a { font-size: 13.5px; } .ask .a .by { font-size: 11px; color: var(--muted); }

  .overlay .o1 { font-size: 12px; color: var(--dark-muted); } .overlay .o2 { font-size: 16px; }

  .set-row .lbl { flex: 1; } .set-row .lbl .meta { display: block; }

<script>
"use strict";
const K = window.KKM, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const recById = (id) => K.recordings.find((r) => r.id === id);
const ORDER = ["recorded", "transcribed", "diarized", "minutes", "exported"];
const STEP_LABEL = { transcribed: "文字起こし", diarized: "話者", minutes: "議事録", exported: "書き出し" };

/* ---------- state ---------- */
const S = {
  view: "rec", recId: "r1", sub: "text", q: "", filter: "all", showOlder: false,
  live: { status: "idle", mode: null, lines: [], handle: null, cards: [], advStopped: false, advMuted: false, deviceQ: null, notices: [], recId: null, lv: [0, 0] },
  auto: { state: "off", grace: 0, timer: null, manualStopped: false },
  player: null, pos: 0, playing: false, dirty: false, cuts: {}, selCue: null, proc: {},
  imports: K.importQueue.map((q) => ({ ...q })), joinWav: true,
  ask: { open: false, agent: "local", scope: "this", msgs: [], pendingCloud: null },
  overlay: true, overlayAt: null, setTab: "general", expDest: "obsidian", menu: null, cutinShown: false,
  agentLink: { mcp: true, claude: "接続済み", codex: "未設定" },
  evalMode: "der", evalSaved: false, webConsent: false,
};
K.settings.saveFaceToFace = false;

/* ---------- export destinations (generalized from "Obsidian") ---------- */
const DESTS = [
  { id: "obsidian", name: "Obsidian ノート", folder: "~/Obsidian/Work/Meetings", file: "{{date}} {{title}}.md", format: "template", when: "minutes", on: true,
    template: "---\ndate: {{date}} {{time}}\nattendees: [{{attendees_links}}]\nduration: {{duration}}\nsource: {{source}}\ntags: [meeting]\n---\n\n# {{title}}\n\n## 要約\n{{summary}}\n\n## 決定事項\n{{decisions}}\n\n## 宿題\n{{actions}}\n\n## 未決事項\n{{open}}\n\n## 文字起こし\n{{transcript}}\n" },
  { id: "subs", name: "字幕ファイル", folder: "~/Movies/subtitles", file: "{{date}}-{{title}}.srt", format: "srt", when: "manual", on: true, template: "" },
  { id: "archive", name: "アーカイブ（JSON）", folder: "~/Documents/kikimimic-archive", file: "{{date}}_{{id}}.json", format: "json", when: "stopped", on: false, template: "" },
];
const FORMATS = { template: "テンプレート（Markdown / テキスト）", srt: "SRT（話者名つき）", words: "words.srt（単語・推定）", json: "JSON（原文・訳文・時刻）" };
const WHEN = { manual: "手動のみ", minutes: "議事録ができたら", stopped: "録音・取り込みが終わったら" };
const VARS = ["date", "time", "title", "attendees", "attendees_links", "duration", "source", "summary", "decisions", "actions", "open", "transcript", "transcript_tr", "id"];
// Per recording: an edit counter and, per destination, which edit was written.
K.recordings.forEach((r) => { r._rev = 1; r._out = {}; if (r.note) r._out.obsidian = r.note.state === "fresh" ? 1 : 0; });
const bumpRev = (r) => { r._rev++; };
const outState = (r, d) => r._out[d.id] == null ? "none" : r._out[d.id] >= r._rev ? "fresh" : "stale";
function vars(r) {
  const names = Object.values(r.speakers || {}).map((s) => s.name).filter(Boolean), m = r.minutes;
  const list = (xs) => xs && xs.length ? xs.map((x) => `- ${x.text}${x.who ? `（${x.who}・${x.due}）` : ""}`).join("\n") : "- なし";
  const line = (u, tr) => `- ${K.mmss(u.start)} **${K.speakerName(r, u.spk) || u.lane}**: ${u.text}` + (tr && u.tr ? `\n  - ${u.tr}` : "");
  return { date: r.date.slice(0, 10), time: r.date.slice(11), title: r.title, id: r.id, attendees: names.join(", ") || "—", attendees_links: names.map((n) => `"[[${n}]]"`).join(", "),
    duration: K.mmss(r.durationMs), source: { meeting: "meeting", face: "face-to-face", import: "import" }[r.source], summary: m ? list(m.summary) : "（議事録はまだありません）",
    decisions: m ? list(m.decisions) : "- なし", actions: m ? list(m.actions) : "- なし", open: m ? list(m.open) : "- なし",
    transcript: r.utterances.map((u) => line(u)).join("\n") || "（文字起こしはまだありません）", transcript_tr: r.utterances.map((u) => line(u, true)).join("\n") };
}
const fill = (tpl, v) => tpl.replace(/\{\{(\w+)\}\}/g, (_, k) => (k in v ? v[k] : `{{${k}}}`));
function renderDest(r, d) {
  if (d.format === "template") return fill(d.template, vars(r));
  if (d.format === "srt") return cueSrt(r);
  if (d.format === "words") return K.exportText(r, "words");
  return JSON.stringify({ id: r.id, title: r.title, date: r.date, utterances: r.utterances.map((u) => ({ start: u.start, end: u.end, speaker: K.speakerName(r, u.spk) || u.lane, text: u.text, translation: u.tr || null })) }, null, 2);
}
const destPath = (r, d) => d.folder + "/" + fill(d.file, vars(r)).replace(/[\/:]/g, "-");
function writeDest(r, d, quiet) { r._out[d.id] = r._rev; if (d.id === "obsidian" || d.format === "template") { if (r.status === "minutes") r.status = "exported"; } if (!quiet) toast(`${d.name} に書き出しました: ${destPath(r, d)}`); }
function autoWrite(r, trigger) { DESTS.filter((d) => d.on && d.when === trigger).forEach((d) => writeDest(r, d, true)); }

/* ---------- subtitle cues: utterances split at word boundaries (23) ---------- */
function cuesOf(r) {
  const out = [];
  for (const u of r.utterances) {
    const ws = K.unitsWithTimes(u), cuts = [...(S.cuts[u.id] || [])].sort((a, b) => a - b); let from = 0;
    for (const c of [...cuts, ws.length]) { const part = ws.slice(from, c); if (part.length) out.push({ utt: u, key: u.id + ":" + from, from, to: c, start: part[0].start, end: part[part.length - 1].end, text: part.map((w) => w.w).join("").trim() }); from = c; }
  }
  return out;
}
function cueSrt(r) {
  const t = (ms) => { const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1000) % 60; return [h, m, s].map((n) => String(n).padStart(2, "0")).join(":") + "," + String(ms % 1000).padStart(3, "0"); };
  return cuesOf(r).map((c, i) => `${i + 1}\n${t(c.start)} --> ${t(c.end)}\n${K.speakerName(r, c.utt.spk) ? "[" + K.speakerName(r, c.utt.spk) + "] " : ""}${c.text}`).join("\n\n");
}

/* ---------- small UI helpers ---------- */
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; $("#win").append(t); setTimeout(() => t.remove(), 2600); }
function sheet(html, wide) { $("#layer").innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet" style="${wide ? "max-width:760px" : ""}">${html}</div></div>`; }
function closeSheet() { $("#layer").innerHTML = ""; }
const pipeHTML = (r) => { const i = ORDER.indexOf(r.status); return `<span class="pipe">${ORDER.slice(1).map((s, k) => `<span class="${k + 1 <= i ? "on" : k + 1 === i + 1 ? "cur" : ""}">${k + 1 <= i ? "✓ " : ""}${STEP_LABEL[s]}</span>`).join("<span>›</span>")}</span>`; };
const todo = (r) => r.status !== "exported" || DESTS.some((d) => d.on && d.when !== "manual" && outState(r, d) === "stale");
const statusText = (r) => S.proc[r.id] ? S.proc[r.id] + "中…" : r.id === S.live.recId ? "録音中" : r.status === "exported" ? (DESTS.some((d) => d.on && outState(r, d) === "stale") ? "書き出しが古い" : "") : K.STATUS[r.status];

/* ---------- sidebar: date-grouped list + drop-to-import (08/17) ---------- */
function dayLabel(d) { const today = "2026-11-17", y = "2026-11-16"; if (d === today) return "今日"; if (d === y) return "昨日"; const dt = new Date(d); return `${dt.getMonth() + 1}/${dt.getDate()}（${"日月火水木金土"[dt.getDay()]}）`; }
function renderSide() {
  const q = S.q.trim().toLowerCase();
  let recs = K.recordings.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (S.filter === "todo") recs = recs.filter(todo);
  if (q) recs = recs.filter((r) => r.title.toLowerCase().includes(q) || r.utterances.some((u) => u.text.toLowerCase().includes(q) || (u.tr || "").toLowerCase().includes(q)));
  const groups = []; for (const r of recs) { const d = r.date.slice(0, 10); (groups.at(-1)?.d === d ? groups.at(-1).rs : groups[groups.push({ d, rs: [] }) - 1].rs).push(r); }
  const shown = S.showOlder || q || S.filter === "todo" ? groups : groups.slice(0, 6), nTodo = K.recordings.filter(todo).length;
  const live = S.live.status !== "idle";
  $("#side").innerHTML = `<div class="head">
      <div class="rec-row">${live ? `<button class="btn rec" data-a="stop">■ 停止 <span class="num" data-clock></span></button>`
        : `<button class="btn" data-a="start" data-x="meeting" title="⌘R"><span class="err">●</span> 会議を録音</button><button class="btn" data-a="start" data-x="face" title="⇧⌘R">対面</button>`}</div>
      <input class="input" id="q" placeholder="会議と発言を検索（⌘F）" value="${esc(S.q)}">
      <div class="seg"><button class="${S.filter === "all" ? "sel" : ""}" data-a="filter" data-x="all">すべて ${K.recordings.length}</button><button class="${S.filter === "todo" ? "sel" : ""}" data-a="filter" data-x="todo">未完了 ${nTodo}</button></div>
    </div>
    <div class="list">${q ? searchHits(q) : ""}${shown.map((g) => `<div class="day"><span>${dayLabel(g.d)}</span><span>${g.rs.length}</span></div>` + g.rs.map((r) => {
      const st = statusText(r); return `<div class="item ${S.view === "rec" && S.recId === r.id ? "sel" : ""}" data-a="open" data-x="${r.id}"><span class="t">${r.date.slice(11)}</span><span class="n">${esc(r.title)}</span>${st ? `<span class="s ${r.id === S.live.recId ? "live" : "todo"}">${st}</span>` : ""}</div>`; }).join("")).join("")}
      ${shown.length < groups.length ? `<button class="btn sm ghost" style="width:100%" data-a="older">以前の会議を表示（${groups.length - shown.length} 日分）</button>` : ""}
      ${S.filter === "todo" && nTodo ? `<button class="btn sm" style="width:100%;margin-top:6px" data-a="finishAll">未完了 ${nTodo} 件をまとめて仕上げる</button>` : ""}</div>
    ${importHTML()}
    <div class="drop" id="drop" data-a="importSheet">音声をここにドロップして取り込む<br><span class="meta">WAV / M4A / MP3 · 複数可</span></div>`;
  const qi = $("#q"); qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; renderSide(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  const dz = $("#drop"); dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); }; dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("over"); addImports([...e.dataTransfer.files].map((f) => f.name)); };
  tickClock();
}
function searchHits(q) {
  const hits = K.search(q).filter((h) => h.type !== "meeting").slice(0, 8);

/* ---------- ask drawer: local LLM / Claude Code / Codex, live or after ---------- */
const AGENTS = { local: { name: "ローカル LLM", sub: "Qwen3 4B · この Mac の中で完結", cloud: false }, claude: { name: "Claude Code", sub: "claude -p · Anthropic に送信", cloud: true }, codex: { name: "Codex", sub: "codex exec · OpenAI に送信", cloud: true } };
const SCOPES = { this: "この会議", live: "録音中の会議", all: "すべての会議（検索で絞った抜粋）" };
function renderAsk() {
  const A = S.ask, el = $("#ask"); el.classList.toggle("hidden", !A.open); if (!A.open) return;
  const live = S.live.status === "rec";
  el.innerHTML = `<div class="hstack" style="padding:8px 12px;border-bottom:1px solid var(--border)"><b class="grow">質問</b><button class="btn sm ghost" data-a="toggleAsk">閉じる</button></div>
    <div class="msgs" id="msgs">${A.msgs.length ? A.msgs.map(msgHTML).join("") : `<div class="meta">会議の内容について聞けます。答えには根拠の発話と時刻が付き、根拠がなければ「確定できません」と答えます。<br><br>例:「SRT はどうなった？」「担当は決まった？」「いまの議題は？」</div>`}</div>
    <form id="askForm"><div class="hstack"><select class="input" data-ch="agent" style="flex:1">${Object.entries(AGENTS).map(([k, a]) => `<option value="${k}" ${A.agent === k ? "selected" : ""}>${a.name}</option>`).join("")}</select>
      <select class="input" data-ch="scope" style="flex:1">${Object.entries(SCOPES).filter(([k]) => k !== "live" || live).map(([k, l]) => `<option value="${k}" ${A.scope === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="meta">${AGENTS[A.agent].sub}${AGENTS[A.agent].cloud ? ` · <span class="warn">選んだ範囲の文字起こしが外部に送られます</span>` : ""}</div>
      <div class="hstack"><input class="input grow" name="q" placeholder="${live ? "いまの会議について質問…" : "この会議について質問…"}" autocomplete="off"><button class="btn primary">送る</button></div></form>`;
  $("#askForm").onsubmit = (e) => { e.preventDefault(); const q = new FormData(e.target).get("q").trim(); if (q) askQ(q); };
  const m = $("#msgs"); m.scrollTop = m.scrollHeight;
}
function msgHTML(m) {
  if (m.sys) return `<div class="meta" style="border-left:2px solid var(--border);padding-left:8px">${m.sys}</div>`;
  if (m.q) return `<div class="q">${esc(m.q)}</div>`;
  return `<div class="a"><div class="by">${esc(m.by)}</div><div class="${m.ok ? "" : "warn"}">${esc(m.text)}</div>${(m.cites || []).map((c) => `<div class="meta"><span class="cite" data-a="${c.live ? "liveCite" : "jump"}" data-x="${c.rec}|${c.id}">${K.mmss(c.at)}</span> 「${esc(c.quote)}」</div>`).join("")}
    ${m.ok ? "" : `<div class="hstack" style="margin-top:4px">${K.settings.webResearch ? `<button class="btn sm" data-a="web" data-x="${esc(m.forQ)}">Web で調べる…</button>` : `<span class="meta">Web 調べものはオフ（設定 › 連携）</span>`}</div>`}</div>`;
}
function askQ(q) {
  const A = S.ask, ag = AGENTS[A.agent];
  if (ag.cloud && !A.consented?.[A.agent]) { A.pendingCloud = q; return consentSheet(q); }
  A.msgs.push({ q }); renderAsk();
  setTimeout(() => { A.msgs.push(answer(q)); renderAsk(); }, ag.cloud ? 900 : 500);
}
function scopeText() {
  const A = S.ask; if (A.scope === "live") return { n: S.live.lines.length, what: "録音中の会議の文字起こし（いままでの " + S.live.lines.length + " 発話）" };
  if (A.scope === "all") return { n: 0, what: "検索で一致した発話の抜粋（最大 20 件）" };
  const r = recById(S.recId); return { n: r.utterances.length, what: `「${r.title}」の文字起こしと議事録（${r.utterances.length} 発話）` };
}
function consentSheet(q) {
  const A = S.ask, ag = AGENTS[A.agent], sc = scopeText();
  sheet(`<h2>${ag.name} に送ります</h2><div class="vstack" style="margin-top:8px">
    <div class="set-row"><span class="lbl">送るもの</span><span>${esc(sc.what)}、質問文</span></div>
    <div class="set-row"><span class="lbl">送らないもの</span><span>音声、ほかの会議、辞書、設定</span></div>
    <div class="set-row"><span class="lbl">送り先</span><span>${A.agent === "claude" ? "Claude Code（Anthropic）" : "Codex（OpenAI）"} · あなたのアカウント</span></div>
    <label class="check"><input type="checkbox" id="remember"> このアプリを閉じるまで、${ag.name} には確認しない</label>
    <div class="hstack"><span class="grow"></span><button class="btn" data-a="closeSheet">送らない</button><button class="btn primary" data-a="consentOk">送る</button></div></div>`);
}
function answer(q) {
  const A = S.ask, by = AGENTS[A.agent].name + { local: "（この Mac で回答）", claude: "（claude -p で回答）", codex: "（codex exec で回答）" }[A.agent];
  if (A.scope === "live") {
    const ls = S.live.lines.filter((l) => l.committed), hit = ls.filter((l) => /担当|decid|owner/i.test(l.committed + (l.tr || "")));
    if (/担当|owner|決ま/.test(q) && hit.length) return { by, ok: true, text: "担当はまだ決まっていません。来週までに決める流れです。", cites: hit.map((l) => ({ live: true, rec: "live", id: l.id, at: l.at, quote: l.committed })) };
    if (/議題|agenda|いま/.test(q) && ls.length) { const l = ls.find((x) => /item|議題/i.test(x.committed)) || ls.at(-1); return { by, ok: true, text: "いまの議題は取り込み機能のスケジュールです。", cites: [{ live: true, rec: "live", id: l.id, at: l.at, quote: l.committed }] }; }
    return { by, ok: false, forQ: q, text: "録音中の発言の中に根拠が見つからないため、答えを確定できません。" };
  }
  if (A.scope === "all") { const h = K.search(q.replace(/[？?。は].*$/, "")).filter((x) => x.type === "utterance").slice(0, 3);
    return h.length ? { by, ok: true, text: `${h.length} 件の会議に関連する発言があります。`, cites: h.map((x) => ({ rec: x.rec, id: x.utt, at: x.at, quote: x.excerpt })) } : { by, ok: false, forQ: q, text: "どの会議にも根拠が見つからないため、答えを確定できません。" }; }
  const a = K.ask(S.recId, q); return { by, ok: a.confirmed, forQ: q, text: a.answer, cites: a.cites.map((c) => ({ rec: S.recId, ...c })) };
}

function addImports(names) {
  if (!names.length) return;
  names.forEach((n, i) => S.imports.push({ id: "q" + Date.now() + i, file: n, size: "—", durMs: 1_800_000, state: "pending", progress: 0 }));
  toast(`${names.length} 件を取り込みに追加しました`); renderSide(); pumpImports();
}
function pumpImports() {
  if (S.impTimer) return;
  S.impTimer = setInterval(() => {
    let cur = S.imports.find((x) => x.state === "running") || S.imports.find((x) => x.state === "pending");
    if (!cur) { clearInterval(S.impTimer); S.impTimer = null; return; }
    cur.state = "running"; cur.progress = Math.min(1, cur.progress + 0.2);
    if (cur.progress >= 1) {
      cur.state = "done"; const grp = cur.joinGroup && S.joinWav ? S.imports.filter((x) => x.joinGroup === cur.joinGroup) : [cur];
      if (grp.every((x) => x.state === "done")) {
        const r = { id: "i" + Date.now(), title: grp.length > 1 ? cur.joinGroup + "（結合）" : cur.file.replace(/\.\w+$/, ""), date: "2026-11-17 11:35", durationMs: grp.reduce((n, x) => n + x.durMs, 0), source: "import", importedFrom: grp.map((x) => x.file).join(" + "),
          lanes: ["Imported"], speakers: {}, utterances: [], minutes: null, stats: null, advisor: [], diarized: false, status: "recorded", note: null, _rev: 1, _out: {} };
        K.recordings.push(r); runStep(r, () => autoWrite(r, "stopped")); toast(`「${r.title}」を取り込みました`);

}

  autoMenu: (x, el) => autoMenu(el), autoMenuMb: () => autoMenu($("#menubar .mi")), mbMenu: (x, el) => mbMenu(el),
  joinRecord: (x) => { const ev = K.calendar.events.find((e) => e.id === x); $("#cutin")?.remove(); if (ev.url) toast(`${ev.url} を開きました`); startLive("meeting", { title: ev.title }); },
  cutRecord: () => { const ev = nextEvent(); $("#cutin")?.remove(); startLive("meeting", { title: ev.title }); }, cutClose: () => $("#cutin")?.remove(),
  importSheet, addFiles: () => addImports(["meeting-memo.m4a", "offsite-part1.wav"]),
  retry: (x) => { const q = S.imports.find((y) => y.id === x); if (!q) return; Object.assign(q, { state: "pending", progress: 0, error: null }); renderSide(); pumpImports(); if ($(".sheet")) importSheet(); },
  tog: (x) => { if (x.startsWith("dest:")) { const d = DESTS.find((y) => y.id === x.slice(5)); d.on = !d.on; }
    else if (x === "overlay") S.overlay = !S.overlay; else if (x === "mcp") S.agentLink.mcp = !S.agentLink.mcp; else if (x === "mcpLive") S.agentLink.mcpLive = S.agentLink.mcpLive === false;
    else if (x === "autoRecord") return ACT.autoToggle(); else K.settings[x] = !K.settings[x]; renderAll(); },
  spoken: (x) => { const sp = K.settings.spoken; if (sp.includes(x)) { if (sp.length > 1) sp.splice(sp.indexOf(x), 1); } else { if (sp.length >= 2) sp.shift(); sp.push(x); } renderSettings(); },
  glDel: (x) => { K.settings.glossary.splice(+x, 1); renderSettings(); },
  signOut: () => { K.calendar.signedIn = null; renderAll(); }, signIn: () => { toast("ブラウザでサインインを完了してください…"); setTimeout(() => { K.calendar.signedIn = "you@example.com"; renderAll(); }, 1200); },
  folderDel: (x) => { K.settings.searchFolders.splice(+x, 1); renderSettings(); }, folderAdd: () => { K.settings.searchFolders.push("~/Documents/specs"); renderSettings(); },
  license: (x) => { const m = K.models.find((y) => y.id === x); sheet(`<h2>${esc(m.name)}</h2><div class="meta">${esc(m.size)} · ライセンス: ${esc(m.license)}</div><div class="card" style="margin:8px 0">このモデルは ${esc(m.license)} ライセンスで配布されています。条件を確認してから同意してください。モデルはこの Mac にだけ保存されます。</div><div class="hstack"><span class="grow"></span><button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="agree" data-x="${x}">ライセンスに同意してダウンロード</button></div>`); },
  agree: (x) => { closeSheet(); (S.dl ||= {})[x] = 0; const t = setInterval(() => { S.dl[x] += 20; if (S.dl[x] >= 100) { clearInterval(t); delete S.dl[x]; K.models.find((m) => m.id === x).state = "ready"; toast("ダウンロードしました。使用可能です"); } if (S.view === "settings") renderSettings(); }, 300); renderSettings(); },
  evalMode: (x) => { S.evalMode = x; renderSettings(); }, evalSave: () => { S.evalSaved = true; toast("eval-2026-11-17.json を保存しました（入力ハッシュ付き）"); renderSettings(); },
  evalPlay: (x) => { S.recId = K.evaluation.recording; S.sub = "text"; go("rec"); seek(+x); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "scrim" && e.target !== el) return; // clicks inside a sheet don't close it
  const f = ACT[el.dataset.a]; if (f) { e.preventDefault(); f(el.dataset.x, el); }
});
document.addEventListener("change", (e) => {
  const el = e.target, k = el.dataset.ch, x = el.dataset.x; if (!k) return;
  const d = DESTS.find((y) => y.id === x);
  ({
    spk: () => { K.findUtt(x).utt.spk = el.value; S.dirty = true; renderRec(); renderFoot(); },
    agent: () => { S.ask.agent = el.value; renderAsk(); renderFoot(); }, scope: () => { S.ask.scope = el.value; },
    into: () => { K.settings.translateInto = el.value || null; }, model: () => { K.settings[x] = el.value; K.models.filter((m) => m.kind === K.models.find((y) => y.id === el.value).kind).forEach((m) => (m.inUse = m.id === el.value)); },
    joinWav: () => { S.joinWav = el.checked; },
    dName: () => (d.name = el.value), dFolder: () => (d.folder = el.value), dFile: () => { d.file = el.value; renderSettings(); }, dFormat: () => { d.format = el.value; renderSettings(); }, dWhen: () => (d.when = el.value), dTpl: () => (d.template = el.value),
  })[k]?.();
});
document.addEventListener("submit", (e) => { if (e.target.id === "glForm") { e.preventDefault(); const f = new FormData(e.target); if (f.get("a") && f.get("b")) K.settings.glossary.push([f.get("a"), f.get("b")]); renderSettings(); } });
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey, typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (mod && e.key === "k") { e.preventDefault(); palette(); }
  else if (mod && e.key === "j") { e.preventDefault(); toggleAsk(); }
  else if (mod && e.key === "f") { e.preventDefault(); $("#q").focus(); }
  else if (mod && e.key === "s") { e.preventDefault(); if (S.dirty) ACT.save(); }
  else if (mod && e.key === "o") { e.preventDefault(); importSheet(); }
  else if (mod && e.key === ",") { e.preventDefault(); go("settings"); }
  else if (mod && e.key === "r") { e.preventDefault(); S.live.status === "rec" ? stopLive() : startLive(e.shiftKey ? "face" : "meeting"); }
  else if (e.key === "Escape") closeSheet();
  else if (e.key === " " && !typing && S.view === "rec" && S.player) { e.preventDefault(); S.player.p.toggle(); }
});

/* ---------- boot ---------- */
renderAll(); pumpImports();
setTimeout(showCutin, 1500);
</script>
