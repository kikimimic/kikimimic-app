<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>12 検索ホーム — Kikimimic v4</title>
<meta name="kkm-concept" content="起動画面の中央に大きな検索欄。下に最近の会議。結果から発話へ直接飛び、録音ボタンは右上に退く">
<meta name="kkm-why" content="過去の発言を探す人がアプリを開く理由の多くは「あのとき何と言ったか」。最初に検索欄があれば、打つ → 発話を聞く、までが最短になる。質問の形で打てば、引用つきの答えも同じ欄から出る">
<meta name="kkm-tradeoff" content="録音を始める操作が右上の小さなボタンに退く。会議の直前に使う人には一手遠く、モデル・取り込み・設定は右上の「…」の奥にある">
<link rel="stylesheet" href="shared/kit.css">
<style>
/* layout only — colors come from kit.css variables */
.stack { display: flex; flex-direction: column; gap: 8px; }
.hstack { display: flex; gap: 8px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.fill { flex: 1; min-height: 0; }
.mt { margin-top: 8px; }
.empty { padding: 32px 0; text-align: center; }
.live-body { display: flex; gap: 16px; flex: 1; min-height: 0; }
.live-side { width: 280px; flex: 0 0 auto; }
.tbar { position: sticky; top: 0; background: var(--bg); padding: 4px 0 8px; z-index: 1; }
.player { padding: 8px 0 0; border-top: 1px solid var(--border); }
.scrub { cursor: pointer; height: 8px; }
.mrow { padding: 8px 0; border-bottom: 1px solid var(--border); }
.mrow:last-child { border-bottom: 0; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl td, .tbl th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); font-weight: 500; }
.lane-l { width: 150px; font-size: 12px; }
.pre { white-space: pre-wrap; max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; margin: 0; background: var(--bg-subtle); }
.lic { max-height: 120px; font-size: 13px; }
.set-sec { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.set-row { padding: 2px 0; }
.ev-grid { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; align-items: center; }
.w80 { width: 80px; }
.menu-note { padding: 4px 10px; max-width: 280px; }
.utt .head .btn.sm { min-height: 20px; }
.about { position: absolute; right: 10px; bottom: 8px; z-index: 40; }
summary { cursor: pointer; }
.pipe { gap: 6px; }
.day-h { position: sticky; top: 0; background: var(--bg); padding: 10px 8px 4px; display: flex; gap: 8px; align-items: baseline; z-index: 1; }
.rline { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 10px; align-items: center; padding: 5px 8px; }

.top { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); min-height: 46px; }
main { flex: 1; min-height: 0; overflow-y: auto; }
.home { max-width: 680px; margin: 0 auto; padding: 0 20px 40px; display: flex; flex-direction: column; gap: 10px; }
.home.idle { padding-top: 110px; }
.home.typing { padding-top: 24px; }
.big { font-size: 18px; min-height: 46px; padding: 8px 14px; width: 100%; }
.page { max-width: 860px; margin: 0 auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 8px; height: 100%; }
.page.flow { height: auto; }
.mini { width: 300px; }
</style>
</head>
<body>
<div class="mock-nav"><a href="index.html">← 一覧</a> · 12 検索ホーム</div>
<div class="win">
  <div id="mb"></div>
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">Kikimimic</span></div>
  <div class="top" id="top"></div>
  <main id="main"></main>
  <button class="btn sm ghost about" data-a="about">この案について</button>
</div>
<script src="shared/data.js"></script>
<script>
/* ---- core: state, helpers, overlays (shared shape across this variant's screens) ---- */
"use strict";
const K = window.KKM;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const recById = (id) => K.recordings.find((r) => r.id === id);
const LANE = { Me: "Me（マイク）", Them: "Them（システム音声）", Imported: "取り込み" };
const KIND = { asr: "文字起こしモデル", mt: "翻訳モデル", diar: "話者分離モデル" };
const SRC = { meeting: "会議", face: "対面", import: "取り込み" };
const laneColor = (l) => (l === "Me" ? "var(--lane-me)" : l === "Them" ? "var(--lane-them)" : "var(--muted-2)");
let seq = 1;

const S = {
  status: "idle", mode: null, handle: null, clockTimer: 0, lines: [], deviceQ: null, notices: [], autoRun: false,
  adv: { cards: [], pending: [], busy: false, muted: false, timer: 0 },
  auto: { state: K.settings.autoRecord ? "waiting" : "off", note: "", countdown: 0, timer: 0, manualStopped: false },
  cal: { signedIn: K.calendar.signedIn, pending: 0, cutin: false },
  rec: null, tab: "transcript", tmode: "read", dirty: false, cuts: {}, diarizing: 0, qa: [], focusUtt: null,
  player: null, pos: 0, playing: false, dl: {}, importTimer: 0,
  ev: { rec: K.evaluation.recording, ref: K.evaluation.reference, mode: K.evaluation.mode, from: "00:00",
    to: K.mmss(K.evaluation.range[1]), collar: K.evaluation.collarMs, overlap: K.evaluation.overlap, done: false, running: false },
};

const ACT = {};   // data-a="name" data-x="arg"  ->  ACT.name(arg, el, event)
const FORM = {};  // <form data-form="name">     ->  FORM.name(FormData, form)

function toast(msg) {
  const win = $(".win"); const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; win.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function sheet(html) {
  closeSheet(); const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet stack">${html}</div>`;
  s.addEventListener("click", (e) => { if (e.target === s) closeSheet(); });
  $(".win").appendChild(s); const f = s.querySelector("input,textarea"); if (f) f.focus();
}
function closeSheet() { const s = $("#scrim"); if (s) s.remove(); }
function closeMenu() { $$(".menu").forEach((m) => m.remove()); }
function openMenu(anchor, items) {
  closeMenu(); const win = $(".win"), wr = win.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = items.map((it) => (it.sep ? `<div class="sep"></div>` : it.a
    ? `<button data-a="${it.a}" data-x="${esc(it.x ?? "")}">${esc(it.label)}</button>`
    : `<div class="meta menu-note">${esc(it.label)}</div>`)).join("");
  win.appendChild(m);
  const left = Math.min(ar.left - wr.left, wr.width - m.offsetWidth - 8);
  m.style.left = Math.max(8, left) + "px"; m.style.top = (ar.bottom - wr.top + 4) + "px";
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu")) closeMenu();
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  e.preventDefault(); if (el.closest(".menu")) closeMenu();
  fn(el.dataset.x, el, e);
});
document.addEventListener("submit", (e) => {
  const fn = FORM[e.target.dataset.form]; if (!fn) return;
  e.preventDefault(); fn(new FormData(e.target), e.target);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.set) setSetting(t.dataset.set, t.value, t);
  if (t.dataset.ev) { S.ev[t.dataset.ev] = t.value; S.ev.done = false; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); closeSheet(); } });
ACT.closeSheet = closeSheet;
/* Background jobs re-render often; keep <details> state and don't steal focus from a field being typed in. */
S.det = {};
function det(k, summary, body) { return `<details data-k="${k}" ${S.det[k] ? "open" : ""}><summary class="muted">${summary}</summary>${body}</details>`; }
document.addEventListener("toggle", (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) S.det[k] = e.target.open; }, true);
function softRender() { const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest(".sheet")) return; render(); }

/* ---- live session (#1 #2 #3 #16 #17 #18) ---- */
const elapsed = () => (S.handle ? S.handle.elapsed() : 0);
function startSession(mode, opts = {}) {
  if (S.status !== "idle") { toast("すでに録音中です"); return; }
  if (K.settings.clearOnStart) S.lines = [];
  Object.assign(S, { status: "rec", mode, deviceQ: null, autoRun: !!opts.auto });
  Object.assign(S.adv, { cards: [], pending: [], busy: false, muted: false });
  S.handle = K.live(mode, onLive);
  S.clockTimer = setInterval(() => $$("[data-clock]").forEach((el) => (el.textContent = K.mmss(elapsed()))), 1000);
  if (opts.auto) { S.auto.state = "recording"; S.auto.note = "会議の音声を検出して録音を始めました"; }
  if (typeof onSessionStart === "function") onSessionStart();
  render();
}
function onLive(ev) {
  const line = (id) => S.lines.find((l) => l.id === id);
  if (ev.type === "line") S.lines.push({ id: ev.id, lane: ev.lane, at: ev.at, committed: "", volatile: "", tr: null, translating: false, done: false });
  else if (ev.type === "update") Object.assign(line(ev.id) || {}, { committed: ev.committed, volatile: ev.volatile });
  else if (ev.type === "commit") Object.assign(line(ev.id) || {}, { committed: ev.text, volatile: "", done: true });
  else if (ev.type === "translating") { if (K.settings.translateInto === "none") return; Object.assign(line(ev.id) || {}, { translating: true }); }
  else if (ev.type === "translate") { if (K.settings.translateInto === "none") return; Object.assign(line(ev.id) || {}, { translating: false, tr: ev.text }); }
  else if (ev.type === "advisor") { S.adv.pending.push(ev.card); return; }
  else if (ev.type === "question") { if (S.mode === "meeting") { S.deviceQ = ev; render(); } return; }
  updateLive();
}
function updateLive() {
  const box = $("#live-lines"); if (box) { box.innerHTML = liveLinesHTML(); box.scrollTop = box.scrollHeight; }
  const last = $("[data-live-last]"); if (last) last.innerHTML = lastLineHTML();
}
function stopSession(manual = true) {
  if (S.status !== "rec") return;
  S.handle.stop(); clearInterval(S.clockTimer); clearInterval(S.auto.timer); clearTimeout(S.adv.timer);
  const dur = elapsed();
  Object.assign(S, { status: "finishing", deviceQ: null }); S.adv.busy = false; S.auto.timer = 0; S.auto.countdown = 0;
  if (S.autoRun) {
    if (manual) { S.auto.manualStopped = true; S.auto.note = "手動で停止したため、この会議では自動録音を再開しません"; }
    else S.auto.note = "会議が終わったので自動で停止しました";
    S.auto.state = K.settings.autoRecord ? "waiting" : "off";
  }
  S.autoRun = false; render();
  setTimeout(() => {
    S.status = "idle";
    const save = S.mode === "face" ? K.settings.saveFaceToFace : true;
    let msg = "保存する発話はありませんでした";
    if (save && S.lines.some((l) => l.done)) { const r = recFromLive(dur); K.recordings.unshift(r); S.lastSaved = r.id; msg = "録音を保存しました: " + r.title; }
    else if (!save) msg = "対面モードの内容は保存しませんでした";
    S.mode = null; render(); toast(msg);
  }, 1600);
}
function splitUnits(text) { return text.split(/(?<=\s)|(?<=[、。])/); }
function recFromLive(dur) {
  const now = new Date(), hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const utts = S.lines.filter((l) => l.done).map((l) => ({ id: "n" + seq++, lane: l.lane, spk: null, start: l.at, end: l.at + 2600,
    text: l.committed, units: splitUnits(l.committed), tr: l.tr, reviewed: false }));
  return { id: "n" + seq++, title: (S.mode === "face" ? "対面の会話 " : "会議 ") + hm, date: "2026-11-17 " + hm, durationMs: Math.max(dur, 4000),
    source: S.mode === "face" ? "face" : "meeting", lanes: S.mode === "face" ? ["Me"] : ["Me", "Them"],
    speakers: {}, utterances: utts, minutes: null, stats: null, advisor: [], diarized: false, status: "transcribed", note: null };
}
const statusText = () => ({ idle: "待機中", rec: "聞き取り中", finishing: "翻訳を仕上げています…" })[S.status];

function faceSaveChip() {
  const on = K.settings.saveFaceToFace, label = "対面: " + (on ? "保存する" : "保存しない");
  return S.status === "idle" ? `<button class="chip" data-a="tog" data-x="saveFaceToFace" title="対面モードの内容を保存するか">${label}</button>`
    : `<span class="chip ${on ? "ok" : ""}">${label}</span>`;
}
function liveControls() {
  if (S.status === "idle") return `<button class="btn rec" data-a="start" data-x="meeting">● 会議を録音</button>
    <button class="btn" data-a="start" data-x="face">対面</button>${faceSaveChip()}<span class="meta">${statusText()}</span>`;
  if (S.status === "finishing") return `<button class="btn" disabled>■ 停止</button><span class="meta">翻訳を仕上げています…</span>`;
  const lanes = S.mode === "face" ? `<span class="chip">Me（マイクのみ）</span>${faceSaveChip()}`
    : `<span class="chip" style="color:var(--lane-me)">Me マイク</span><span class="chip" style="color:var(--lane-them)">Them システム音声</span><span class="chip ok">保存する</span>`;
  return `<button class="btn" data-a="stop">■ 停止</button><span class="dot-rec"></span><span class="num" data-clock>${K.mmss(elapsed())}</span>
    <span class="meta">${S.mode === "face" ? "対面" : "会議"} · 聞き取り中</span>${lanes}${S.autoRun ? `<span class="chip">自動録音</span>` : ""}`;
}
function liveLinesHTML() {
  if (!S.lines.length) return `<div class="empty muted">${S.status === "idle" ? "待機中 — 「● 会議を録音」か「対面」で始めます" : "聞き取り中…"}</div>`;
  return S.lines.map((l) => `<div class="utt" id="live-${l.id}"><div class="head"><span class="num">${K.mmss(l.at)}</span>
    <span class="spk" style="color:${laneColor(l.lane)}">${l.lane}</span></div>
    <div>${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span></div>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}</div>`).join("");
}
function lastLineHTML() {
  const l = S.lines[S.lines.length - 1];
  if (!l) return `<span class="muted">聞き取り中…</span>`;
  return `<span class="spk" style="color:${laneColor(l.lane)}">${l.lane}</span> ${esc(l.committed)}<span class="vol">${esc(l.volatile)}</span>
    ${l.tr ? `<div class="tr">${esc(l.tr)}</div>` : l.translating ? `<div class="meta">訳しています…</div>` : ""}`;
}
function noticesHTML() {
  let h = "";
  if (S.deviceQ) h += `<div class="notice">出力が ${esc(S.deviceQ.detected)} に変わりました（いまは ${esc(S.deviceQ.capturing)} を録音中）。切り替えますか？
    <span class="grow"></span><button class="btn sm" data-a="devSwitch">切り替える</button><button class="btn sm" data-a="devKeep">そのまま</button></div>`;
  h += S.notices.map((n) => `<div class="notice ${n.kind || ""}">${esc(n.text)}<span class="grow"></span>
    <button class="btn sm ghost" data-a="dismissNotice" data-x="${n.id}">閉じる</button></div>`).join("");
  return h ? `<div class="stack">${h}</div>` : "";
}
function notice(text, kind = "") { S.notices.push({ id: "nt" + seq++, text, kind }); render(); }
function advisorHTML() {
  const a = S.adv; if (S.status === "idle" && !a.cards.length) return "";
  let h = `<div class="hstack"><h3>アドバイザー</h3><span class="meta">手動のみ</span><span class="grow"></span>`;
  if (a.muted) h += `<span class="meta">この会議では出しません</span>`;
  else if (a.busy) h += `<span class="meta">考えています…</span><button class="btn sm" data-a="advStop">停止</button>`;
  else h += `<button class="btn sm" data-a="advAsk" ${S.status !== "rec" ? "disabled" : ""}>アドバイスを求める</button>`;
  h += `</div>`;
  h += a.cards.map((c) => `<div class="card"><div class="meta">${esc(c.kind)}</div><div>${esc(c.text)}</div>
    <div class="hstack wrap mt">${c.ev.map((id) => `<span class="cite" data-a="liveCite" data-x="${id}">根拠 ${liveTime(id)}</span>`).join(" ")}
    <span class="grow"></span><button class="btn sm ghost" data-a="advClose" data-x="${c.id}">閉じる</button>
    <button class="btn sm ghost" data-a="advMute">この会議では出さない</button></div></div>`).join("");
  return `<div class="stack">${h}</div>`;
}
function liveTime(id) { const l = S.lines.find((x) => x.id === id); return l ? K.mmss(l.at) : "—"; }
function liveView() {
  const side = advisorHTML();
  return `<div class="live stack fill"><div class="hstack wrap">${liveControls()}</div>${noticesHTML()}
    <div class="live-body"><div id="live-lines" class="scroll grow">${liveLinesHTML()}</div>${side ? `<div class="live-side scroll">${side}</div>` : ""}</div></div>`;
}
Object.assign(ACT, {
  start: (m) => startSession(m),
  stop: () => stopSession(true),
  devSwitch: () => { const d = S.deviceQ; S.deviceQ = null; notice(`${d.detected} を録音しています`); },
  devKeep: () => { const d = S.deviceQ; S.deviceQ = null; notice(`${d.capturing} のまま録音を続けます`); },
  dismissNotice: (id) => { S.notices = S.notices.filter((n) => n.id !== id); render(); },
  advAsk: () => {
    S.adv.busy = true; render();
    S.adv.timer = setTimeout(() => {
      S.adv.busy = false;
      let card = S.adv.pending.shift();
      if (!card) {
        const q = [...S.lines].reverse().find((l) => l.done && /[?？]/.test(l.committed));
        if (q) card = { id: "ac" + seq++, kind: "未回答の質問", text: `「${q.committed}」にまだ答えが出ていません。`, ev: [q.id] };
      }
      if (card && !S.adv.muted) S.adv.cards.push(card); else toast("根拠になる発言がないため、アドバイスは出しませんでした");
      render();
    }, 1400);
  },
  advStop: () => { clearTimeout(S.adv.timer); S.adv.busy = false; render(); toast("アドバイスを停止しました"); },
  advClose: (id) => { S.adv.cards = S.adv.cards.filter((c) => c.id !== id); render(); },
  advMute: () => { S.adv.muted = true; S.adv.cards = []; render(); },
  liveCite: (id) => { const el = $("#live-" + id); if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } },
});

/* ---- auto-record + menubar (#18) and calendar cut-in (#7) ---- */
function autoText() {
  const a = S.auto;
  if (a.state === "off") return "自動録音: オフ";
  if (a.state === "error") return "自動録音: エラー";
  if (a.state === "recording") return a.countdown ? `自動録音: あと ${a.countdown} 秒で停止` : "自動録音: 録音中";
  return "自動録音: 待機中";
}
function menubarHTML() {
  let st;
  if (S.status === "rec") st = `<span class="dot-rec"></span> 録音中 <span class="num" data-clock>${K.mmss(elapsed())}</span>`;
  else if (S.status === "finishing") st = "仕上げ中…";
  else if (S.auto.state === "error") st = `<span class="err">自動録音エラー</span>`;
  else if (S.auto.state === "waiting") st = "自動録音 待機中";
  else st = "Kikimimic";
  return `<div class="menubar"><button class="btn ghost sm" data-a="mbMenu">${st}</button><span class="meta">11月17日(火) 11:28</span></div>`;
}
ACT.mbMenu = (x, el) => {
  const a = S.auto, items = [{ label: statusText() + " · " + autoText() }];
  if (a.note) items.push({ label: a.note });
  if (S.status === "rec") items.push({ label: "■ 停止", a: "stop" });
  if (S.status === "idle") items.push({ label: "● 会議を録音", a: "start", x: "meeting" });
  items.push({ sep: 1 }, { label: K.settings.autoRecord ? "自動録音をオフにする" : "自動録音をオンにする", a: "tog", x: "autoRecord" });
  if (a.state === "error") items.push({ label: "自動録音を再試行", a: "autoRetry" });
  items.push({ sep: 1 }, { label: "デモ: 会議の音声を検出", a: "autoDetect" }, { label: "デモ: 会議が終了", a: "autoEnd" },
    { label: "デモ: 自動録音のエラー", a: "autoErr" }, { label: "デモ: カレンダーのカットイン", a: "cutinShow" });
  openMenu(el, items);
};
Object.assign(ACT, {
  autoDetect: () => {
    if (!K.settings.autoRecord) return toast("自動録音はオフです（設定でオンにできます）");
    if (S.auto.state === "error") return toast("自動録音がエラーのため開始できません");
    if (S.auto.manualStopped) return toast("手動で停止した会議なので、自動録音は再開しません");
    if (S.status !== "idle") return toast("すでに録音中です");
    startSession("meeting", { auto: true });
  },
  autoEnd: () => {
    if (!S.autoRun) return toast("自動録音で録音中の会議はありません");

function statsOf(r) {

/* ---- post-processing pipeline (rec.status) and Obsidian notes — primary user: ~90 meetings/month ---- */
const ORDER = ["recorded", "transcribed", "diarized", "minutes", "exported"];

function bump(r, st) { if (ORDER.indexOf(st) > ORDER.indexOf(r.status)) r.status = st; }
function remaining(r) {

}
const isStuck = (r) => r.status !== "exported";
const isStale = (r) => !!(r.note && r.note.state === "stale");
function applyDiarize(r) {
  r.diarized = true; let alt = 0;
  r.utterances.forEach((u) => { if (!u.spk) u.spk = u.lane === "Me" ? "S1" : u.lane === "Them" ? "S2" : ["S1", "S2"][alt++ % 2]; });
  [...new Set(r.utterances.map((u) => u.spk))].forEach((k, i) => { r.speakers[k] ||= { name: "", auto: "SPEAKER_0" + i }; });
  bump(r, "diarized");
}
function makeMinutes(r) {
  const m = r.minutes, mt = K.models.find((x) => x.id === K.settings.mt);
  if (m) { m.revision++; m.generated = "2026-11-17 11:30"; }
  else {
    const us = r.utterances, q = us.find((u) => /[?？]/.test(u.text));
    r.minutes = { summary: us[0] ? [{ text: us[0].tr && /[ぁ-ん]/.test(us[0].tr) ? us[0].tr : us[0].text, ev: [us[0].id] }] : [], decisions: [], actions: [],
      open: q ? [{ text: q.text, ev: [q.id] }] : [], revision: 1, generated: "2026-11-17 11:30", model: mt ? mt.name : "—" };
  }

}

function exportObsidian(r) { r.note = { path: notePath(r), state: "fresh" }; bump(r, "exported"); }
function statusChip(r) {
  if (S.proc[r.id] || S.procQ.includes(r.id)) return `<span class="chip info">処理中</span>`;
  if (r.status === "exported") return isStale(r) ? `<span class="chip warn">Obsidian 要更新</span>` : `<span class="chip ok">${K.STATUS.exported}</span>`;
  return `<span class="chip ${r.status === "minutes" ? "info" : ""}">${K.STATUS[r.status]}</span>`;
}
function pipelineHTML(r) {
  const i = ORDER.indexOf(r.status), p = S.proc[r.id], rest = remaining(r);
  const steps = ORDER.map((s, k) => `<span class="${k <= i ? "" : "muted"}">${k <= i ? "✓ " : ""}${PIPE[s]}</span>`).join(`<span class="muted">›</span>`);
  let act = "";
  if (p) act = `<span class="meta num">${PIPE[p.step]} ${p.pct}%</span><div class="bar" style="width:80px"><i style="width:${p.pct}%"></i></div>`;
  else if (S.procQ.includes(r.id)) act = `<span class="meta">順番待ち</span>`;
  else if (rest.length) act = `<button class="btn sm primary" data-a="finish" data-x="${r.id}">残りを仕上げる（${rest.map((s) => PIPE[s]).join("→")}）</button>`;
  else if (isStale(r)) act = `<button class="btn sm" data-a="obExport" data-x="${r.id}">Obsidian のノートを更新</button>`;
  return `<div class="hstack wrap pipe meta">${steps}<span class="grow"></span>${act}</div>`;
}
function obButtonHTML(r) {
  if (isStale(r)) return `<button class="btn" data-a="obsidian" data-x="${r.id}">Obsidian を更新</button>`;
  return `<button class="btn" data-a="obsidian" data-x="${r.id}">${r.note ? "Obsidian ✓" : "Obsidian に書き出す"}</button>`;
}
function queueFinish(ids) {
  ids.forEach((id) => { if (!S.proc[id] && !S.procQ.includes(id) && remaining(recById(id)).length) S.procQ.push(id); });
  if (!Object.keys(S.proc).length) nextProc(); render();
}
function nextProc() {
  const id = S.procQ.shift(); if (!id) return;
  const r = recById(id); let rest = remaining(r);
  S.proc[id] = { step: rest[0], pct: 0 };
  const t = setInterval(() => {
    const p = S.proc[id]; p.pct += 25;
    if (p.pct >= 100) {
      if (p.step === "transcribed") {
        if (!r.utterances.length) r.utterances = [["では|始めます。", "Let's begin."], ["今日の|議題は|何ですか？", "What is today's agenda?"]].map(([t, tr], i) =>
          ({ id: r.id + "t" + i, lane: "Me", spk: null, start: 1000 + i * 5000, end: 4500 + i * 5000, text: t.replaceAll("|", ""), units: t.split("|"), tr, reviewed: false }));
        bump(r, "transcribed");
      } else if (p.step === "diarized") applyDiarize(r);
      else if (p.step === "minutes") { const auto = K.settings.obsidian.autoExport; K.settings.obsidian.autoExport = "off"; makeMinutes(r); K.settings.obsidian.autoExport = auto; }
      else if (p.step === "exported") exportObsidian(r);
      rest = remaining(r);
      if (rest.length) S.proc[id] = { step: rest[0], pct: 0 };
      else { clearInterval(t); delete S.proc[id]; toast(`「${r.title}」の後処理が終わりました`); nextProc(); }
      softRender(); // redraw per finished step only, so clicks elsewhere are not swallowed
    }
  }, 110);
}
function backlogHTML() {
  const stuck = K.recordings.filter(isStuck), stale = K.recordings.filter(isStale);
  if (!stuck.length && !stale.length) return `<span class="meta">後処理はすべて終わっています</span>`;
  return `<span class="meta">後処理待ち ${stuck.length} 件${stale.length ? ` · Obsidian 要更新 ${stale.length} 件` : ""}</span>
    <button class="btn sm" data-a="finishAll">まとめて仕上げる</button>`;
}
Object.assign(ACT, {
  finish: (id) => queueFinish([id]),
  finishAll: () => {
    const stale = K.recordings.filter(isStale); stale.forEach(exportObsidian);
    queueFinish(K.recordings.filter(isStuck).map((r) => r.id));
    if (stale.length) toast(`Obsidian のノートを ${stale.length} 件更新しました`);
  },
  obExport: (id) => { exportObsidian(recById(id)); closeSheet(); render(); toast("Obsidian に書き出しました: " + recById(id).note.path); },
  obsidian: (id) => {
    const r = recById(id), ob = K.settings.obsidian;
    sheet(`<h2>Obsidian に書き出す</h2><div class="meta mono">${esc(ob.vault)}/${esc(notePath(r))}</div>
      ${isStale(r) ? `<div class="notice">書き出したあとで録音が変わっています。上書きして更新します。</div>` : r.note ? `<div class="meta">書き出し済み · 上書きします</div>` : ""}
      ${r.minutes ? "" : `<div class="meta">議事録がまだないので、文字起こしだけを書き出します</div>`}
      <pre class="pre mono">${esc(K.exportText(r, "obsidian"))}</pre>
      <div class="hstack"><span class="meta grow">自動: ${ob.autoExport === "minutes" ? "議事録ができたら書き出す" : "オフ（手動のみ）"}</span>
      <button class="btn" data-a="closeSheet">キャンセル</button><button class="btn primary" data-a="obExport" data-x="${r.id}">${r.note ? "上書きして書き出す" : "書き出す"}</button></div>`);
  },
  obTog: (k) => { K.settings.obsidian[k] = !K.settings.obsidian[k]; render(); },
  filter: (f) => { S.filter = f; render(); },
  moreDay: (d) => { S.more[d] = true; render(); },
});
document.addEventListener("change", (e) => { const k = e.target.dataset.ob; if (k) { K.settings.obsidian[k] = e.target.value; render(); } });
function obsidianSettingsHTML() {
  const ob = K.settings.obsidian, tg = (k, l) => `<div class="hstack set-row"><span class="grow">${l}</span><button class="toggle ${ob[k] ? "on" : ""}" data-a="obTog" data-x="${k}" aria-label="${l}"></button></div>`;
  return `<div class="hstack set-row"><span class="grow">保管庫（Vault）</span><input class="input mono" data-ob="vault" value="${esc(ob.vault)}"></div>
    <div class="hstack set-row"><span class="grow">フォルダ</span><input class="input mono" data-ob="folder" value="${esc(ob.folder)}"></div>
    <div class="hstack set-row"><span class="grow">ファイル名</span><input class="input mono" data-ob="fileName" value="${esc(ob.fileName)}"></div>
    <div class="hstack set-row"><span class="grow">自動で書き出す</span><select class="input" data-ob="autoExport">
      <option value="minutes" ${ob.autoExport === "minutes" ? "selected" : ""}>議事録ができたら</option><option value="off" ${ob.autoExport !== "minutes" ? "selected" : ""}>しない（手動のみ）</option></select></div>
    ${tg("includeTranscript", "文字起こしを含める")}${tg("includeTranslation", "訳文を含める")}
    <div class="meta">frontmatter: ${ob.frontmatter.join(", ")} · タグ ${ob.tags.map((t) => "#" + t).join(" ")}</div>
    <div class="hstack">${backlogHTML()}</div>`;
}

/* ---- the month list: date groups + status filter ---- */
const FILTERS = [["all", "すべて", () => true], ["stuck", "後処理待ち", isStuck], ["stale", "Obsidian 要更新", isStale]];
function filterBarHTML() {
  return `<div class="seg">${FILTERS.map(([k, l, f]) => `<button class="${S.filter === k ? "sel" : ""}" data-a="filter" data-x="${k}">${l} <span class="num">${K.recordings.filter(f).length}</span></button>`).join("")}</div>`;
}
function dayLabel(d) {
  if (d === "2026-11-17") return "今日"; if (d === "2026-11-16") return "昨日";
  const dt = new Date(d + "T00:00"); return `${dt.getMonth() + 1}月${dt.getDate()}日（${DOW[dt.getDay()]}）`;
}
function recLineHTML(r) {
  return `<div class="row rline" data-a="open" data-x="${r.id}"><span class="num meta">${esc(r.date.slice(11))}</span><span class="grow">${esc(r.title)} <span class="meta">${SRC[r.source]}</span></span>
    <span class="meta num">${K.mmss(r.durationMs)}</span>${statusChip(r)}</div>`;
}
function groupedListHTML(list) {
  const f = (FILTERS.find((x) => x[0] === S.filter) || FILTERS[0])[2], days = new Map();
  [...list].filter(f).sort((a, b) => b.date.localeCompare(a.date)).forEach((r) => { const d = r.date.slice(0, 10); if (!days.has(d)) days.set(d, []); days.get(d).push(r); });
  if (!days.size) return `<div class="empty muted">該当する録音はありません</div>`;
  return [...days].map(([d, rs]) => `<div class="day-h"><h3>${dayLabel(d)}</h3><span class="meta">${rs.length} 件${rs.some(isStuck) ? ` · 後処理待ち ${rs.filter(isStuck).length}` : ""}</span></div>
    ${rs.map(recLineHTML).join("")}`).join("");
}
function resultGroupsHTML(q, keep = () => true) {
  const gs = searchGroups(q).filter(([t]) => keep(t));
  if (!gs.length) return `<div class="muted mt">一致するものはありません</div>`;
  return gs.map(([t, xs]) => { const all = S.more[t + q], shown = all ? xs : xs.slice(0, 8);
    return `<h3 class="mt">${t} <span class="meta">${xs.length}</span></h3>${shown.map((x) => hitHTML(x, q)).join("")}
      ${xs.length > shown.length ? `<button class="btn sm ghost" data-a="moreDay" data-x="${esc(t + q)}">ほか ${xs.length - shown.length} 件を表示</button>` : ""}`; }).join("");
}

/* ---- variant 12: the search box is home; recording is a corner action ---- */
let page = "home", q = "", scope = "all", answer = null;
const PAGES = { live: "ライブ", detail: "録音", all: "すべての録音", models: "モデル", import: "取り込み", settings: "設定", eval: "話者分離の評価" };
function go(p) { page = p; render(); $("#main").scrollTop = 0; }
function showDetail(id) { if (openRec(id)) go("detail"); }
function onSessionStart() { page = "live"; }
const looksLikeQuestion = (s) => /[?？]$|何|誰|いつ|どう|なぜ|who|what|when/i.test(s.trim());

function render() {
  $("#mb").innerHTML = menubarHTML();
  const left = page === "home" ? `<span class="muted">Kikimimic</span>`
    : `<button class="btn ghost" data-a="home">← 検索</button><form class="hstack" data-form="topSearch"><input class="input mini" name="q" value="${esc(q)}" placeholder="検索"></form>`;
  const rec = S.status === "rec" ? `<span class="dot-rec"></span><span class="num" data-clock>${K.mmss(elapsed())}</span>
      ${page !== "live" ? `<button class="btn" data-a="go" data-x="live">ライブ</button>` : ""}<button class="btn" data-a="stop">■ 停止</button>`
    : S.status === "finishing" ? `<span class="meta">翻訳を仕上げています…</span>`
    : `<button class="btn rec" data-a="start" data-x="meeting">● 会議を録音</button><button class="btn" data-a="start" data-x="face">対面</button>`;
  $("#top").innerHTML = `${left}<span class="grow"></span>${rec}<button class="btn ghost" data-a="more">…</button>`;
  const m = $("#main");
  if (page === "home") { m.innerHTML = homeHTML(); const i = $("#q"); if (i && document.activeElement !== i) { i.focus(); i.setSelectionRange(q.length, q.length); } }
  else if (page === "live") { m.innerHTML = `<div class="page">${liveView()}</div>`; const b = $("#live-lines"); b.scrollTop = b.scrollHeight; }
  else if (page === "detail") { m.innerHTML = detailPage(); onTick(S.pos, S.playing); }
  else if (page === "all") m.innerHTML = `<div class="page flow"><div class="hstack wrap">${filterBarHTML()}<span class="grow"></span>${backlogHTML()}</div>${groupedListHTML(K.recordings)}</div>`;
  else m.innerHTML = `<div class="page flow"><h1>${PAGES[page]}</h1>${{ models: modelsHTML, import: importHTML, settings: settingsHTML, eval: evalHTML }[page]()}</div>`;
}

/* ---- home: search box + recent meetings ---- */
function homeHTML() {
  return `<div class="home ${q ? "typing" : "idle"}">
    <input class="input big" id="q" value="${esc(q)}" placeholder="会議の発言・訳文・タイトル・日付・メモを検索" autocomplete="off">
    <div class="hstack"><div class="seg">${[["all", "すべて"], ["rec", "録音"], ["file", "フォルダのメモ"]].map(([k, l]) =>
      `<button class="${scope === k ? "sel" : ""}" data-a="scope" data-x="${k}">${l}</button>`).join("")}</div><span class="grow"></span>
      ${S.status === "rec" ? `<span class="chip rec">録音中</span>` : ""}${S.deviceQ || S.notices.length ? `<button class="btn sm" data-a="go" data-x="live">通知</button>` : ""}</div>
    <div id="res">${resultsHTML()}</div></div>`;
}
function resultsHTML() {
  if (!q.trim()) {
    const recent = [...K.recordings].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
    return `<div class="hstack mt"><h3 class="grow">最近の会議</h3><button class="btn sm ghost" data-a="go" data-x="all">すべて ${K.recordings.length} 件</button></div>
      ${recent.map(recLineHTML).join("")}<div class="hstack mt">${backlogHTML()}${K.recordings.some(isStuck) ? `<button class="btn sm ghost" data-a="allStuck">一覧で見る</button>` : ""}</div>`;
  }
  let h = "";
  if (looksLikeQuestion(q) && scope !== "file") {
    h += answer ? qaCardHTML(answer) : `<div class="row hstack" data-a="askHere"><span class="grow">「${esc(q.trim())}」に録音の発話から答える</span><span class="meta">${esc(recById("r1").title)} · 引用つき</span></div>`;
  }
  const keep = (t) => scope === "all" || (scope === "file" ? t === "フォルダのファイル" : t !== "フォルダのファイル");
  h += resultGroupsHTML(q.trim(), keep);
  if (scope === "file" || !searchGroups(q.trim()).some(([t]) => keep(t))) h += `<div class="mt">${det("folders", `検索するフォルダ（${K.folders.length}）`, `<div class="stack mt">${folderListHTML()}</div>`)}</div>`;
  return h;
}
function drawResults() { const r = $("#res"); if (r) r.innerHTML = resultsHTML(); const h = $(".home"); if (h) h.className = "home " + (q ? "typing" : "idle"); }
document.addEventListener("input", (e) => { if (e.target.id === "q") { q = e.target.value; answer = null; drawResults(); } });
document.addEventListener("keydown", (e) => {
  if (e.target.id === "q" && e.key === "Enter" && !e.isComposing) { const first = $("#res [data-a]"); if (first) first.click(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); if (page !== "home") go("home"); else $("#q").focus(); }
});

/* ---- detail: reached from a hit; keeps the query and steps through hits inside it ---- */
function hitsIn(r) { return q.trim() ? K.search(q.trim()).filter((x) => x.type === "utterance" && x.rec === r.id) : []; }
function detailPage() {
  const r = recById(S.rec); if (!r) return "";
  const hits = hitsIn(r), i = hits.findIndex((x) => x.utt === S.focusUtt);
  return `<div class="page"><div class="hstack"><div class="grow"><h1>${esc(r.title)}</h1><div class="meta">${detailMeta(r)}</div></div>
    ${saveHTML()}${diarBtnHTML(r)}${obButtonHTML(r)}<button class="btn" data-a="exportMenu">書き出し</button></div>${pipelineHTML(r)}
    <div class="hstack">${tabsHTML()}<span class="grow"></span>${hits.length ? `<span class="meta">「${esc(q.trim())}」 ${i + 1 || "–"}/${hits.length}</span>
      <button class="btn sm" data-a="hitStep" data-x="-1">前</button><button class="btn sm" data-a="hitStep" data-x="1">次</button>` : ""}</div>
    <div class="scroll fill" id="detail-body">${detailBody(r)}</div>${playerHTML(r)}</div>`;
}
FORM.topSearch = (fd) => { q = fd.get("q"); answer = null; go("home"); };
Object.assign(ACT, {
  home: () => go("home"),
  go: (p) => go(p),
  scope: (s) => { scope = s; render(); },
  askHere: () => { answer = { q: q.trim(), rec: "r1", a: K.ask("r1", q.trim()) }; drawResults(); },
  hitStep: (d) => {
    const r = recById(S.rec), hits = hitsIn(r), i = hits.findIndex((x) => x.utt === S.focusUtt);
    const nx = hits[(i + +d + hits.length) % hits.length]; jumpTo(r.id, nx.utt);
  },
  more: (x, el) => openMenu(el, [{ label: "すべての録音", a: "go", x: "all" }, { label: "取り込み", a: "go", x: "import" }, { label: "モデル", a: "go", x: "models" },
    { label: "設定", a: "go", x: "settings" }, { sep: 1 }, { label: "対面: " + (K.settings.saveFaceToFace ? "保存する" : "保存しない"), a: "tog", x: "saveFaceToFace" }]),
  openEval: () => go("eval"),
  allStuck: () => { S.filter = "stuck"; go("all"); },
});

render();
setTimeout(() => { if (S.cal.signedIn && S.status === "idle") cutinShow(); }, 2500);
</script>
</body>
</html>
