[workspace]
resolver = "2"
# app/ is its own workspace until the v2 Tauri app is deleted (plan.md Step 6):
# Tauri and GPUI cannot agree on one lockfile.
exclude = ["app"]
members = [
    "crates/kikimimic-core",
    "crates/kikimimic-mt-llama",
    "crates/kikimimic-mt-llama-dylib",
    "crates/kikimimic-asr-whisper",
    "crates/kikimimic-capture",
    "crates/spike",
    "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
