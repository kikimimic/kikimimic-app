[package]
name = "kikimimic"
version = "0.1.0"
description = "Realtime multilingual transcription and translation"
authors = ["staticWagomU"]
edition = "2021"

[lib]
name = "kikimimic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18.1"
dotenvy = "0.15"
hound = "3.5"
kikimimic-core = { path = "../crates/kikimimic-core" }
# The dlopen host side only. kikimimic-mt-llama-dylib is NOT a dependency: linking
# it would put llama's ggml next to whisper's (docs/step0-results.md).
kikimimic-mt-llama = { path = "../crates/kikimimic-mt-llama" }
kikimimic-asr-whisper = { path = "../crates/kikimimic-asr-whisper" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "rustls"] }
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tungstenite = { version = "0.28", features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
mach2 = "0.4"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
