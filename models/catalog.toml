# Every model Kikimimic can download: the one list the app, the core and the
# engine registry read (a test fails when they disagree). Models are never
# bundled; each entry states its license, and `requires_acceptance` makes the
# app ask before downloading.

[defaults]
asr = "whisper-large-v3-turbo-q8_0"
mt = "qwen3-4b-instruct-2507-q4_k_m"

[[model]]
id = "whisper-large-v3-turbo-q8_0"
kind = "asr"
engine = "whisper"
title = "Whisper large-v3-turbo (q8_0)"
license = { name = "MIT", url = "https://github.com/openai/whisper/blob/main/LICENSE" }
# q8_0, not q5_0: on Metal q5_0 decodes slower (docs/step0-results.md).
requires = ["silero-vad-v5.1.2"]
files = [{ name = "ggml-large-v3-turbo-q8_0.bin", url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin", sha256 = "317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1", bytes = 874188075 }]

[[model]]
