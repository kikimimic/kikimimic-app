[[model]]
id = "macos-speech"
kind = "asr"
engine = "apple-speech"
title = "macOS Speech Recognition"
# Part of macOS 26 and later (SpeechAnalyzer): nothing to download here, the
# OS fetches each language's assets on first use. Listens in the first spoken
# language only; the app hides it on older macOS.
license = { name = "Part of macOS", url = "https://www.apple.com/legal/sla/" }
files = []
