[package]
name = "kikimimic-mt-llama-dylib"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# cdylib: llama-cpp-2 must never be statically linked next to whisper-rs —
# their vendored ggml versions collide at runtime (docs/step0-results.md).
# As a dylib this crate carries its own private ggml copy.
[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
# Pinned to a git revision: the crates.io releases vendor a llama.cpp that
# predates the PLaMo 3 tokenizer ("plamo3"); this revision's llama.cpp
# (8642541, 2026-10-28) has it. Back to a crates.io version once one does.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", features = ["metal"] }
