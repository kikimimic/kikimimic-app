[package]
name = "kikimimic-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# No UI, device, GPU or network dependency may enter here (ADR-120001).
# tests/deny_list.rs enforces it.
[dependencies]
anyhow = "1"
hound = "3.5"
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
