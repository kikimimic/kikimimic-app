[package]
name = "kikimimic-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# OS audio sources for kikimimic-core. Backends only push samples and capture
# timestamps into the core's channel; all timing logic lives in the core.
[dependencies]
anyhow = "1"
cpal = "0.18.1"
kikimimic-core = { path = "../kikimimic-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
mach2 = "0.4"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
