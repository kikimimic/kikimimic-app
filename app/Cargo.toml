[package]
name = "kikimimic"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# GPUI comes from Zed's monorepo at a pinned release tag: crates.io stopped
# getting releases at 0.2.2 (ADR-120002). Bump the tag on purpose, one PR at a
# time. Never depend on Zed's GPL crates (`ui`, `theme`, ...).
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
futures = "0.3"
sys-locale = "0.3"
kikimimic-asr-speech = { path = "../crates/kikimimic-asr-speech" }
kikimimic-asr-apple = { path = "../crates/kikimimic-asr-apple" }
kikimimic-asr-whisper = { path = "../crates/kikimimic-asr-whisper" }
kikimimic-capture = { path = "../crates/kikimimic-capture" }
kikimimic-core = { path = "../crates/kikimimic-core" }
kikimimic-diarize-nemotron = { path = "../crates/kikimimic-diarize-nemotron" }
kikimimic-mt-llama = { path = "../crates/kikimimic-mt-llama" }
ureq = "3"
unicode-segmentation = "1"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0" }
# runtime_shaders: compile Metal shaders at launch instead of at build time, so
# building needs only the Command Line Tools, not the full Xcode metal compiler.
# ponytail: costs a little startup time; precompile in release bundles if it shows.
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0", features = ["font-kit", "runtime_shaders"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
getrandom = "0.3"
# Only the device output and hound WAV decoding; recordings are always WAV.
rodio = { version = "0.23", default-features = false, features = ["playback", "hound"] }

[dev-dependencies]
hound = "3.5"

gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0", features = ["test-support"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSButton", "NSColor", "NSControl", "NSImage", "NSMenu", "NSMenuItem",
    "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView",
    "NSWindow", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSString"] }
raw-window-handle = "0.6"
